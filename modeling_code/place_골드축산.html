<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>금호동2가 상가 블록 3D 모델링 (탕화쿵푸~골드축산 · 스카이뷰 비율 · 지하 1층)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #B8D7F2;
      font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', -apple-system, sans-serif;
      color: #f8fafc;
      user-select: none;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #B8D7F2;
      overflow: hidden;
      z-index: 1;
    }

    .hud-panel {
      position: fixed;
      background: rgba(15, 20, 28, 0.87);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.34);
      z-index: 10;
    }

    #info {
      top: 14px;
      left: 16px;
      padding: 12px 16px;
      max-width: min(580px, calc(100vw - 32px));
      pointer-events: none;
    }

    #info h1 {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 5px;
    }

    #info .badge {
      font-size: 10.5px;
      font-weight: 700;
      background: rgba(234, 88, 12, 0.30);
      color: #fed7aa;
      border: 1px solid rgba(251, 146, 60, 0.65);
      padding: 1px 8px;
      border-radius: 999px;
    }

    #info p {
      font-size: 11.4px;
      color: #cbd5e1;
      line-height: 1.5;
    }

    #info .compass {
      margin-top: 4px;
      font-size: 11px;
      color: #93c5fd;
      font-weight: 600;
    }

    #options-panel {
      top: 14px;
      right: 16px;
      padding: 11px 13px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      width: 286px;
      max-height: calc(100vh - 140px);
      overflow-y: auto;
    }

    .options-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2px;
    }

    .options-title {
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .collapse-btn {
      background: rgba(51, 65, 85, 0.72);
      color: #cbd5e1;
      border: 1px solid rgba(148, 163, 184, 0.28);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 10.5px;
      cursor: pointer;
      font-family: inherit;
    }

    .collapse-btn:hover {
      background: rgba(71, 85, 105, 0.92);
      color: #ffffff;
    }

    #options-body {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    #options-body.collapsed {
      display: none;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11.6px;
      color: #e2e8f0;
      cursor: pointer;
      padding: 2px 0;
    }

    .toggle-row input[type="checkbox"] {
      width: 14px;
      height: 14px;
      accent-color: #f59e0b;
      cursor: pointer;
      flex-shrink: 0;
    }

    .toggle-row .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .panel-divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.14);
      margin: 4px 0;
    }

    #mesh-stats {
      font-size: 11px;
      color: #cbd5e1;
      line-height: 1.55;
      font-variant-numeric: tabular-nums;
    }

    #mesh-stats strong {
      color: #fde68a;
      font-weight: 700;
    }

    #controls-ui {
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 10px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 5px;
      max-width: calc(100vw - 20px);
    }

    .cam-btn {
      background: rgba(51, 65, 85, 0.85);
      color: #f1f5f9;
      border: 1px solid rgba(148, 163, 184, 0.30);
      padding: 6px 9px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 11.2px;
      font-family: inherit;
      font-weight: 500;
      transition: all 0.16s ease;
      white-space: nowrap;
    }

    .cam-btn:hover {
      background: rgba(37, 99, 235, 0.88);
      border-color: rgba(147, 197, 253, 0.82);
      transform: translateY(-1px);
    }

    .cam-btn.active {
      background: #2563eb;
      border-color: #93c5fd;
      color: #ffffff;
      font-weight: 700;
      box-shadow: 0 2px 10px rgba(37, 99, 235, 0.50);
    }

    .tour-btn {
      background: rgba(16, 185, 129, 0.22);
      color: #a7f3d0;
      border: 1px solid rgba(52, 211, 153, 0.58);
      padding: 6px 11px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 11.3px;
      font-family: inherit;
      font-weight: 700;
      transition: all 0.16s ease;
      white-space: nowrap;
    }

    .tour-btn:hover {
      background: rgba(16, 185, 129, 0.42);
      color: #ffffff;
      transform: translateY(-1px);
    }

    .tour-btn.playing {
      background: #059669;
      border-color: #6ee7b7;
      color: #ffffff;
      box-shadow: 0 2px 12px rgba(5, 150, 105, 0.55);
    }

    .code-btn {
      background: rgba(99, 102, 241, 0.26);
      color: #c7d2fe;
      border: 1px solid rgba(129, 140, 248, 0.62);
      padding: 6px 11px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 11.3px;
      font-family: inherit;
      font-weight: 700;
      transition: all 0.16s ease;
      white-space: nowrap;
    }

    .code-btn:hover {
      background: rgba(79, 70, 229, 0.65);
      color: #ffffff;
      transform: translateY(-1px);
    }

    .bar-divider {
      width: 1px;
      height: 22px;
      background: rgba(255, 255, 255, 0.18);
      margin: 0 3px;
    }

    .export-btn {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #ffffff;
      border: 1px solid rgba(254, 240, 138, 0.84);
      padding: 6px 13px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 11.8px;
      font-family: inherit;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.16s ease;
      box-shadow: 0 3px 12px rgba(217, 119, 6, 0.48);
      white-space: nowrap;
    }

    .export-btn:hover {
      background: linear-gradient(135deg, #fbbf24, #ea580c);
      transform: translateY(-1px);
      box-shadow: 0 5px 16px rgba(245, 158, 11, 0.58);
    }

    .export-btn:disabled {
      opacity: 0.65;
      cursor: wait;
      transform: none;
    }

    #toast {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%) translateY(-14px);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(251, 191, 36, 0.65);
      color: #fef3c7;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 12.6px;
      font-weight: 600;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.42);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.24s ease, transform 0.24s ease;
      z-index: 30;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #error-banner {
      position: fixed;
      top: 68px;
      left: 50%;
      transform: translateX(-50%);
      max-width: min(640px, calc(100vw - 32px));
      background: rgba(127, 29, 29, 0.96);
      border: 1px solid rgba(248, 113, 113, 0.92);
      color: #fecaca;
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 12.6px;
      font-weight: 600;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.48);
      display: none;
      z-index: 40;
      word-break: break-word;
    }

    #error-banner.visible {
      display: block;
    }

    /* 분리된 코드 조회 모달 창 */
    #code-modal {
      position: fixed;
      inset: 0;
      background: rgba(8, 12, 20, 0.78);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 50;
      user-select: text;
    }

    #code-modal.open {
      display: flex;
    }

    .code-modal-card {
      width: min(980px, 100%);
      height: min(82vh, 760px);
      background: #0f172a;
      border: 1px solid rgba(148, 163, 184, 0.32);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
    }

    .code-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #1e293b;
      border-bottom: 1px solid rgba(148, 163, 184, 0.22);
      gap: 10px;
    }

    .code-modal-title {
      font-size: 13px;
      font-weight: 700;
      color: #f8fafc;
    }

    .code-modal-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-action-btn {
      background: #2563eb;
      color: #ffffff;
      border: 1px solid rgba(147, 197, 253, 0.6);
      padding: 5px 11px;
      border-radius: 7px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }

    .modal-action-btn:hover {
      background: #1d4ed8;
    }

    .modal-close-btn {
      background: rgba(71, 85, 105, 0.8);
      color: #e2e8f0;
      border: 1px solid rgba(148, 163, 184, 0.35);
      padding: 5px 11px;
      border-radius: 7px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }

    .modal-close-btn:hover {
      background: #dc2626;
      color: #ffffff;
    }

    #source-code-area {
      flex: 1;
      width: 100%;
      background: #0b1120;
      color: #e2e8f0;
      border: none;
      padding: 14px 16px;
      font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
      font-size: 12px;
      line-height: 1.55;
      resize: none;
      outline: none;
      tab-size: 2;
    }

    @media (max-width: 960px) {
      #info {
        top: 10px;
        left: 10px;
        padding: 8px 11px;
        max-width: calc(100vw - 220px);
      }
      #info h1 { font-size: 11.6px; }
      #info p, #info .compass { font-size: 10px; }
      #options-panel {
        top: 10px;
        right: 10px;
        width: 210px;
        padding: 8px 10px;
      }
      .toggle-row { font-size: 10.4px; }
      .bar-divider { display: none; }
      #controls-ui {
        bottom: 8px;
        padding: 6px 7px;
        gap: 4px;
      }
      .cam-btn, .tour-btn, .code-btn, .export-btn {
        padding: 5px 7px;
        font-size: 10px;
      }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- 좌상단 헤더 카드 -->
  <div id="info" class="hud-panel">
    <h1>
      금호동2가 상가 블록 3D 모델링 (탕화쿵푸 ~ 골드축산)
      <span class="badge">사다리꼴 비율 31.5m/49.8m×46.8m · B1</span>
    </h1>
    <p>북서(탕화쿵푸) → 서 → 남서(BBQ) → 남동(페리카나) → 동(운비·나영이네) → 동북(골드축산)</p>
    <div class="compass">1F Y=0.0m / B1 Y=-3.6m (동일 외벽) · 외곽 보도 제외 &nbsp;|&nbsp; 북:-Z · 남:+Z · 서:-X · 동:+X</div>
  </div>

  <!-- 우상단 접이식 표시 및 GLB 추출 설정 패널 -->
  <div id="options-panel" class="hud-panel">
    <div class="options-header">
      <div class="options-title">표시 및 추출 설정</div>
      <button class="collapse-btn" id="btn-collapse">접기</button>
    </div>
    <div id="options-body">
      <label class="toggle-row">
        <input type="checkbox" id="chk-wn" checked />
        <span class="dot" style="background:#991b1b;"></span>
        <span>북서: 탕화쿵푸 · 본죽</span>
      </label>
      <label class="toggle-row">
        <input type="checkbox" id="chk-wm" checked />
        <span class="dot" style="background:#243e7a;"></span>
        <span>서: 박공헤어 · 색연필 · 이디야</span>
      </label>
      <label class="toggle-row">
        <input type="checkbox" id="chk-ws" checked />
        <span class="dot" style="background:#eab308;"></span>
        <span>남서: 금호동순대국 · BBQ · 먹거리장터</span>
      </label>
      <label class="toggle-row">
        <input type="checkbox" id="chk-ct" checked />
        <span class="dot" style="background:#94a3b8;"></span>
        <span>중앙: 크리스호스텔 · 유아이뷰티</span>
      </label>
      <label class="toggle-row">
        <input type="checkbox" id="chk-es" checked />
        <span class="dot" style="background:#26a69a;"></span>
        <span>남동·동: 페리카나 · 세미나 · 운비족발</span>
      </label>
      <label class="toggle-row">
        <input type="checkbox" id="chk-en" checked />
        <span class="dot" style="background:#d93848;"></span>
        <span>동·동북: 영자네 · 나영이네 · 골드축산</span>
      </label>

      <div class="panel-divider"></div>

      <label class="toggle-row">
        <input type="checkbox" id="chk-outlines" />
        <span>건축 윤곽선 (Edges)</span>
      </label>

      <div class="panel-divider"></div>
      <div id="mesh-stats">메시 집계 중...</div>
    </div>
  </div>

  <!-- 상태 알림 토스트 & 적색 에러 배너 -->
  <div id="toast">알림</div>
  <div id="error-banner"></div>

  <!-- 코드 조회 모달 -->
  <div id="code-modal">
    <div class="code-modal-card">
      <div class="code-modal-header">
        <div class="code-modal-title" id="code-modal-title">전체 HTML / Three.js 소스코드 조회</div>
        <div class="code-modal-actions">
          <button class="modal-action-btn" id="btn-copy-code">전체 코드 복사</button>
          <button class="modal-close-btn" id="btn-close-code">닫기</button>
        </div>
      </div>
      <textarea id="source-code-area" readonly spellcheck="false"></textarea>
    </div>
  </div>

  <!-- 하단 순차 일주 카메라 프리셋 + 투어 + 코드 조회 + GLB 추출 버튼 바 -->
  <div id="controls-ui" class="hud-panel">
    <button class="cam-btn active" data-view="sky">0. 스카이뷰 (Top)</button>
    <button class="cam-btn" data-view="nw">1. 북서 (탕화쿵푸·본죽)</button>
    <button class="cam-btn" data-view="west">2. 서 (박공헤어·색연필·이디야)</button>
    <button class="cam-btn" data-view="sw">3. 남서 (금호동순대국·BBQ)</button>
    <button class="cam-btn" data-view="se">4. 남동 (네일고양이·페리카나)</button>
    <button class="cam-btn" data-view="east_south">5. 동 (세미나양품·운비족발)</button>
    <button class="cam-btn" data-view="east_mid">6. 동 (영자네곱창·나영이네)</button>
    <button class="cam-btn" data-view="ne">7. 동북 (골드축산·오브스터디)</button>
    <div class="bar-divider"></div>
    <button class="tour-btn" id="btn-tour">▶ 일주 투어</button>
    <button class="code-btn" id="btn-open-code">&lt;/&gt; 코드 조회</button>
    <button class="export-btn" id="btn-export-glb">
      <span>⬇</span> 3D 추출 (.glb)
    </button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
    import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

    // =========================================================================
    // 0. 알림 토스트, 적색 오류 배너 & 안전한 2D 라운드 사각형 헬퍼
    // =========================================================================
    let toastTimer = null;
    function showToast(msg, duration = 3200) {
      const el = document.getElementById('toast');
      if (!el) return;
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), duration);
    }

    function showErrorBanner(err) {
      const el = document.getElementById('error-banner');
      const msg = err && err.message ? err.message : String(err);
      console.error('3D 초기화/실행 오류:', err);
      if (el) {
        el.textContent = '3D 오류: ' + msg;
        el.classList.add('visible');
      }
    }

    function drawRoundRect(ctx, x, y, w, h, r) {
      const rad = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + rad, y);
      ctx.lineTo(x + w - rad, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + rad);
      ctx.lineTo(x + w, y + h - rad);
      ctx.quadraticCurveTo(x + w, y + h, x + w - rad, y + h);
      ctx.lineTo(x + rad, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - rad);
      ctx.lineTo(x, y + rad);
      ctx.quadraticCurveTo(x, y, x + rad, y);
      ctx.closePath();
    }

    try {
      // =======================================================================
      // 1. 씬, 카메라, 표준 렌더러 & 무그림자 5-Point 주간 건축 조명 설정
      // =======================================================================
      const container = document.getElementById('canvas-container');
      const initW = container.clientWidth || window.innerWidth || 1280;
      const initH = container.clientHeight || window.innerHeight || 720;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color('#B8D7F2');
      scene.fog = new THREE.Fog('#B8D7F2', 120, 340);

      const camera = new THREE.PerspectiveCamera(44, initW / initH, 0.2, 540);

      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        powerPreference: 'high-performance'
      });
      renderer.setSize(initW, initH);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.shadowMap.enabled = false;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.06;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      container.appendChild(renderer.domElement);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.068;
      // 지하 1층(Y = -3.60m ~ 0.00m) 외벽까지 아래에서 올려다볼 수 있도록 허용
      controls.maxPolarAngle = Math.PI * 0.85;
      controls.minDistance = 4.5;
      controls.maxDistance = 185;

      const hemiLight = new THREE.HemisphereLight(0xf3f9ff, 0x828992, 0.92);
      hemiLight.position.set(0, 80, 0);
      scene.add(hemiLight);

      scene.add(new THREE.AmbientLight(0xffffff, 0.46));

      const nwDirLight = new THREE.DirectionalLight(0xfffaf0, 0.96);
      nwDirLight.position.set(-48, 52, -48);
      scene.add(nwDirLight);

      const seDirLight = new THREE.DirectionalLight(0xf0f6ff, 0.94);
      seDirLight.position.set(52, 48, 46);
      scene.add(seDirLight);

      const topDirLight = new THREE.DirectionalLight(0xfef8ee, 0.54);
      topDirLight.position.set(0, 92, 6);
      scene.add(topDirLight);

      // =======================================================================
      // 2. 스카이뷰(17202.jpg) 사다리꼴 블록 실측 좌표계
      //    - Flat Ground Y = 0.00m, Basement 1F = Y = -3.60m ~ 0.00m
      //    - North (-Z = -23.40m): X = -15.75 ~ +15.75 (폭 31.50m)
      //    - South (+Z = +23.40m): X = -23.70 ~ +26.10 (폭 49.80m)
      //    - N-S Height = 46.80m -> Bounding Ratio = 49.80 / 46.80 = 1.064 : 1
      //    - West Edge Angle: -9.64° | East Edge Angle (무수막길): +12.46°
      // =======================================================================
      const BASEMENT_1F_H = 3.60;
      const Z_NORTH = -23.40;
      const Z_SOUTH =  23.40;
      const BLOCK_LEN_Z = Z_SOUTH - Z_NORTH; // 46.80m

      function westEdgeX(z) {
        const t = (z - Z_NORTH) / BLOCK_LEN_Z;
        return -15.75 + (-23.70 - (-15.75)) * t;
      }

      function eastEdgeX(z) {
        const t = (z - Z_NORTH) / BLOCK_LEN_Z;
        return 15.75 + (26.10 - 15.75) * t;
      }

      // =======================================================================
      // 3. 공용 유틸리티 (PRNG, 캔버스 텍스처, UV, 사다리꼴 프리즘, 입면그룹, 3D채널, GeometryBatcher)
      // =======================================================================
      function mulberry32(seed) {
        let a = seed >>> 0;
        return function () {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function makeCanvasTex(w, h, drawFn, rx = 1, ry = 1, isLinear = false) {
        const c = document.createElement('canvas');
        c.width = w;
        c.height = h;
        const ctx = c.getContext('2d');
        drawFn(ctx, w, h);
        const tex = new THREE.CanvasTexture(c);
        tex.colorSpace = isLinear ? THREE.NoColorSpace : THREE.SRGBColorSpace;
        tex.anisotropy = 8;
        if (rx !== 1 || ry !== 1) {
          tex.wrapS = THREE.RepeatWrapping;
          tex.wrapT = THREE.RepeatWrapping;
          tex.repeat.set(rx, ry);
        }
        return tex;
      }

      function applyWorldPlanarUVs(geometry, scaleU = 0.34, scaleV = 0.34) {
        geometry.computeVertexNormals();
        const pos = geometry.attributes.position;
        const norm = geometry.attributes.normal;
        const uv = geometry.attributes.uv;
        for (let i = 0; i < pos.count; i++) {
          const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
          const nx = Math.abs(norm.getX(i)), ny = Math.abs(norm.getY(i)), nz = Math.abs(norm.getZ(i));
          if (ny >= nx && ny >= nz) uv.setXY(i, x * scaleU, z * scaleV);
          else if (nx >= nz) uv.setXY(i, z * scaleU, y * scaleV);
          else uv.setXY(i, x * scaleU, y * scaleV);
        }
        uv.needsUpdate = true;
      }

      function addOutlineForMesh(mesh, parentGrp = null, color = 0x1e293b, threshold = 26, opacity = 0.42) {
        const edges = new THREE.EdgesGeometry(mesh.geometry, threshold);
        const line = new THREE.LineSegments(
          edges,
          new THREE.LineBasicMaterial({ color, transparent: opacity < 1, opacity })
        );
        mesh.updateMatrix();
        if (parentGrp) {
          parentGrp.updateMatrixWorld(true);
          const m4 = new THREE.Matrix4().multiplyMatrices(parentGrp.matrixWorld, mesh.matrix);
          line.applyMatrix4(m4);
        } else {
          line.applyMatrix4(mesh.matrix);
        }
        outlineGroup.add(line);
        return line;
      }

      /**
       * 사다리꼴 4각형 평면 프리즘 생성기 (z1..z2 구간에서 좌우 X 함수가 경사도로를 정확히 추종)
       * - ExtrudeGeometry + rotateX(-PI/2) => Shape(x, -z) -> World(x, y, z)
       */
      function addQuadPrism(parentGroup, {
        xL1, xR1, z1, xL2, xR2, z2,
        yStart, height, capMat, sideMat, name, uvScale = 0.34, withOutline = true
      }) {
        const shape = new THREE.Shape();
        shape.moveTo(xL1, -z1);
        shape.lineTo(xR1, -z1);
        shape.lineTo(xR2, -z2);
        shape.lineTo(xL2, -z2);
        shape.closePath();

        const geo = new THREE.ExtrudeGeometry(shape, { depth: height, bevelEnabled: false });
        geo.rotateX(-Math.PI / 2);
        geo.translate(0, yStart, 0);
        applyWorldPlanarUVs(geo, uvScale, uvScale);

        const mesh = new THREE.Mesh(geo, [capMat, sideMat]);
        mesh.name = name;
        parentGroup.add(mesh);
        if (withOutline) addOutlineForMesh(mesh, parentGroup);
        return mesh;
      }

      function createEdgeFacadeGroup(parentGroup, leftPt, rightPt, name) {
        const dx = rightPt.x - leftPt.x;
        const dz = rightPt.z - leftPt.z;
        const len = Math.hypot(dx, dz);
        const ux = dx / len;
        const uz = dz / len;
        const nx = -uz;
        const nz = ux;
        const rotY = Math.atan2(nx, nz);

        const grp = new THREE.Group();
        grp.name = name;
        grp.position.set(leftPt.x, 0, leftPt.z);
        grp.rotation.y = rotY;
        parentGroup.add(grp);

        return { group: grp, len, nx, nz, ux, uz, rotY };
      }

      function add3DChannelSign(parentGroup, opts) {
        const {
          x, y, zStart, depth, width, height,
          canvasW, canvasH, drawFrontFn, drawSideFn,
          layers = 4, emissiveColor = '#FFFFFF', emissiveIntensity = 0.14, name = 'ChannelSign'

        const sideTex = makeCanvasTex(canvasW, canvasH, drawSideFn, 1, 1, false);
        const frontTex = makeCanvasTex(canvasW, canvasH, drawFrontFn, 1, 1, false);

        const sideMat = new THREE.MeshStandardMaterial({
          map: sideTex, transparent: true, alphaTest: 0.20, roughness: 0.50, metalness: 0.16
        });

        for (let i = 0; i < layers; i++) {
          const zl = zStart + (i / layers) * depth;
          const m = new THREE.Mesh(new THREE.PlaneGeometry(width, height), sideMat);
          m.position.set(x, y, zl);
          parentGroup.add(m);
        }

        const frontMat = new THREE.MeshStandardMaterial({
          map: frontTex, transparent: true, alphaTest: 0.16,
          emissive: emissiveColor, emissiveMap: frontTex, emissiveIntensity,
          roughness: 0.26, metalness: 0.08

        const frontMesh = new THREE.Mesh(new THREE.PlaneGeometry(width, height), frontMat);
        frontMesh.name = name;
        frontMesh.position.set(x, y, zStart + depth + 0.006);
        parentGroup.add(frontMesh);
      }

      class GeometryBatcher {
        constructor() {
          this.buckets = new Map();
          this.baseBox = new THREE.BoxGeometry(1, 1, 1).toNonIndexed();
          this.baseCyl = new THREE.CylinderGeometry(0.5, 0.5, 1, 14).toNonIndexed();
          this.baseSphere = new THREE.SphereGeometry(0.5, 10, 8).toNonIndexed();
          this.baseDodec = new THREE.DodecahedronGeometry(0.5, 1).toNonIndexed();
          this._mat4 = new THREE.Matrix4();
          this._pos = new THREE.Vector3();
          this._quat = new THREE.Quaternion();
          this._euler = new THREE.Euler();
          this._scale = new THREE.Vector3();
        }

        _ensure(key, material) {
          if (!this.buckets.has(key)) {
            this.buckets.set(key, { material, geoms: [] });
          }
          return this.buckets.get(key);
        }

        _normalize(src) {
          const g = src.index ? src.toNonIndexed() : src.clone();
          if (!g.attributes.normal) g.computeVertexNormals();
          if (!g.attributes.uv) {
            const count = g.attributes.position.count;
            g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(count * 2), 2));
          }
          for (const attr of Object.keys(g.attributes)) {
            if (attr !== 'position' && attr !== 'normal' && attr !== 'uv') {
              g.deleteAttribute(attr);
            }
          }
          return g;
        }

        addGeometry(key, material, geometry, matrix = null) {
          const g = this._normalize(geometry);
          if (matrix) g.applyMatrix4(matrix);
          this._ensure(key, material).geoms.push(g);
        }

        addBox(key, material, x, y, z, sx, sy, sz, rx = 0, ry = 0, rz = 0, worldUV = 0) {
          const g = this.baseBox.clone();
          this._pos.set(x, y, z);
          this._euler.set(rx, ry, rz);
          this._quat.setFromEuler(this._euler);
          this._scale.set(sx, sy, sz);
          this._mat4.compose(this._pos, this._quat, this._scale);
          g.applyMatrix4(this._mat4);
          if (worldUV > 0) applyWorldPlanarUVs(g, worldUV, worldUV);
          this._ensure(key, material).geoms.push(g);
        }

        addCylinder(key, material, x, y, z, diameter, length, rx = 0, ry = 0, rz = 0) {
          const g = this.baseCyl.clone();
          this._pos.set(x, y, z);
          this._euler.set(rx, ry, rz);
          this._quat.setFromEuler(this._euler);
          this._scale.set(diameter, length, diameter);
          this._mat4.compose(this._pos, this._quat, this._scale);
          g.applyMatrix4(this._mat4);
          this._ensure(key, material).geoms.push(g);
        }

        addSphere(key, material, x, y, z, diameter) {
          const g = this.baseSphere.clone();
          this._pos.set(x, y, z);
          this._euler.set(0, 0, 0);
          this._quat.setFromEuler(this._euler);
          this._scale.set(diameter, diameter, diameter);
          this._mat4.compose(this._pos, this._quat, this._scale);
          g.applyMatrix4(this._mat4);
          this._ensure(key, material).geoms.push(g);
        }

        addDodecahedron(key, material, x, y, z, diameter) {
          const g = this.baseDodec.clone();
          this._pos.set(x, y, z);
          this._euler.set(0, 0, 0);
          this._quat.setFromEuler(this._euler);
          this._scale.set(diameter, diameter, diameter);
          this._mat4.compose(this._pos, this._quat, this._scale);
          g.applyMatrix4(this._mat4);
          this._ensure(key, material).geoms.push(g);
        }

        addRod(key, material, x1, y1, z1, x2, y2, z2, diameter) {
          const v1 = new THREE.Vector3(x1, y1, z1);
          const v2 = new THREE.Vector3(x2, y2, z2);
          const dir = new THREE.Vector3().subVectors(v2, v1);
          const len = dir.length();
          if (len < 0.001) return;
          const mid = new THREE.Vector3().addVectors(v1, v2).multiplyScalar(0.5);
          const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
          const g = this.baseCyl.clone();
          this._scale.set(diameter, len, diameter);
          this._mat4.compose(mid, q, this._scale);
          g.applyMatrix4(this._mat4);
          this._ensure(key, material).geoms.push(g);
        }

        buildAll(parentGroup) {
          const created = [];
          for (const [key, { material, geoms }] of this.buckets.entries()) {
            if (!geoms.length) continue;
            const merged = mergeGeometries(geoms, false);
            geoms.forEach((g) => g.dispose());
            geoms.length = 0;
            if (!merged) continue;
            const mesh = new THREE.Mesh(merged, material);
            mesh.name = `Merged_${key}`;
            parentGroup.add(mesh);
            created.push(mesh);
          }
          this.buckets.clear();
          return created;
        }

        disposeBases() {
          this.baseBox.dispose();
          this.baseCyl.dispose();
          this.baseSphere.dispose();
          this.baseDodec.dispose();
        }
      }

      // 4. 프로시저럴 고해상도 캔버스 텍스처 라이브러리
      // =======================================================================
      function createPanelGridTex(baseRgb, cols, rows, jointHex, variance = 10, seed = 100) {
        const rand = mulberry32(seed);
        return makeCanvasTex(512, 512, (ctx, w, h) => {
          ctx.fillStyle = jointHex; ctx.fillRect(0, 0, w, h);
          const tw = w / cols, th = h / rows;
          for (let r = 0; r < rows; r++) {
            for (let col = 0; col < cols; col++) {
              const d = (rand() - 0.5) * variance;
              ctx.fillStyle = `rgb(${Math.round(baseRgb[0] + d)},${Math.round(baseRgb[1] + d)},${Math.round(baseRgb[2] + d)})`;
              ctx.fillRect(col * tw + 2, r * th + 2, tw - 4, th - 4);
            }
          }
          for (let i = 0; i < 6500; i++) {
            ctx.fillStyle = rand() > 0.5 ? 'rgba(255,255,255,0.04)' : 'rgba(20,24,30,0.045)';
            ctx.fillRect(rand() * w, rand() * h, 2, 2);
          }
        }, 1, 1, false);
      }

      function createBrickTex(baseRgb, mortarHex, seed = 200) {
        const rand = mulberry32(seed);
        return makeCanvasTex(512, 512, (ctx, w, h) => {
          ctx.fillStyle = mortarHex; ctx.fillRect(0, 0, w, h);
          const rows = 20, cols = 6;
          const rh = h / rows, bw = w / cols;
          for (let r = 0; r < rows; r++) {
            const off = (r % 2) * (bw * 0.5);
            for (let col = -1; col <= cols; col++) {
              const d = (rand() - 0.5) * 24;
              const R = Math.min(230, Math.max(30, Math.round(baseRgb[0] + d)));
              const G = Math.min(200, Math.max(22, Math.round(baseRgb[1] + d * 0.8)));
              const B = Math.min(190, Math.max(20, Math.round(baseRgb[2] + d * 0.7)));
              ctx.fillStyle = `rgb(${R},${G},${B})`;
              ctx.fillRect(col * bw + off + 2.2, r * rh + 2.2, bw - 4.4, rh - 4.4);
            }
          }
        }, 1, 1, false);
      }

            ctx.beginPath(); ctx.arc(rand() * w, rand() * h, 14 + rand() * 32, 0, Math.PI * 2); ctx.fill();
          }
        }, 2, 2, false);
      }

          ctx.beginPath(); ctx.ellipse(w * 0.52, h * 0.48, 145, 195, 0.2, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = 'rgba(255,235,235,0.65)'; ctx.lineWidth = 6;
          for (let i = 0; i < 8; i++) {
            ctx.beginPath(); ctx.moveTo(80 + i * 28, 140); ctx.quadraticCurveTo(160, 260, 90 + i * 32, 380); ctx.stroke();
          }
        });
        const meatGraphic = new THREE.Mesh(new THREE.PlaneGeometry(1.75, 2.48), new THREE.MeshStandardMaterial({ map: meatGraphicTex, roughness: 0.40 }));
        meatGraphic.position.set(2.75, 1.32, 0.06);
        b10East.add(meatGraphic);

        b10eb.addBox('B10_GoldMeatBar', darkMetalMat, 6.85, 3.65, 0.12, 6.60, 0.62, 0.16);
        add3DChannelSign(b10East, {
          x: 6.85, y: 3.68, zStart: 0.205, depth: 0.08,
          width: 6.50, height: 1.05, canvasW: 1400, canvasH: 240,
          drawFrontFn: (ctx, w, h) => {
            ctx.clearRect(0, 0, w, h);
            const cy = h * 0.52;
            ctx.fillStyle = '#FFFFFF'; ctx.strokeStyle = '#334155'; ctx.lineWidth = 6;
            ctx.beginPath(); ctx.arc(118, cy, 48, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.arc(212, cy - 4, 56, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#1E293B';
            ctx.beginPath(); ctx.arc(106, cy - 8, 6, 0, Math.PI * 2); ctx.arc(130, cy - 8, 6, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(198, cy - 12, 6, 0, Math.PI * 2); ctx.arc(226, cy - 12, 6, 0, Math.PI * 2); ctx.fill();

            ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
            ctx.font = '900 148px "Malgun Gothic", sans-serif';
            ctx.lineWidth = 10; ctx.strokeStyle = '#1E242B';
            ctx.strokeText('골 드 축 산', 305, cy + 4);
            ctx.fillStyle = '#FFFFFF';
            ctx.fillText('골 드 축 산', 305, cy + 4);

            ctx.fillStyle = '#C81E27'; drawRoundRect(ctx, 1085, cy - 42, 285, 84, 10); ctx.fill();
            ctx.fillStyle = '#FFFFFF'; ctx.textAlign = 'center';
            ctx.font = '900 40px "Malgun Gothic", sans-serif'; ctx.fillText('생고기 도,소매', 1228, cy + 2);
          },
          drawSideFn: (ctx, w, h) => {
            ctx.clearRect(0, 0, w, h);
            const cy = h * 0.52;
            ctx.fillStyle = '#475569';
            ctx.beginPath(); ctx.arc(118, cy, 48, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(212, cy - 4, 56, 0, Math.PI * 2); ctx.fill();
            ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
            ctx.font = '900 148px "Malgun Gothic", sans-serif';
            ctx.fillText('골 드 축 산', 305, cy + 4);
          },
          layers: 4, emissiveColor: '#FFFFFF', emissiveIntensity: 0.16,
          name: 'B10_1F_GoldMeat_3DSign'
        });

        b10eb.addBox('B10_CrimsonAwning', goldMeatCrimsonMat, 7.05, 2.74, 0.56, 6.30, 0.08, 1.18, 0.24, 0, 0);

        const butcherFrontTex = makeCanvasTex(1280, 512, (ctx, w, h) => {
          ctx.fillStyle = '#2B2224'; ctx.fillRect(0, 0, w, h);
          ctx.fillStyle = '#9D174D'; ctx.fillRect(140, 125, 360, 175);
          ctx.fillStyle = '#F472B6'; ctx.fillRect(156, 155, 328, 95);
          [140, 775].forEach((bx) => {
            ctx.fillStyle = '#243054'; ctx.fillRect(bx, 315, 365, 178);
            ctx.strokeStyle = '#E2E8F0'; ctx.lineWidth = 4; ctx.strokeRect(bx + 8, 323, 349, 162);
            ctx.fillStyle = '#94A3B8';
            ctx.fillRect(bx + 48, 378, 130, 72);
            ctx.beginPath(); ctx.ellipse(bx + 265, 418, 52, 34, 0, 0, Math.PI * 2); ctx.fill();
          });
          ctx.fillStyle = '#F8FAFC'; ctx.fillRect(8, 16, 118, h - 32); ctx.fillRect(w - 126, 16, 118, h - 32);
          ctx.fillStyle = '#991B1B'; ctx.fillRect(8, h - 86, 118, 70); ctx.fillRect(w - 126, h - 86, 118, 70);
          ctx.fillStyle = '#1E293B'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.font = '900 34px "Malgun Gothic", sans-serif';
          ['우','리','돼','지','한','돈'].forEach((ch, i) => ctx.fillText(ch, 67, 62 + i * 56));
          ctx.fillStyle = '#B91C1C';
          ['100%','토','종','한','우','전문'].forEach((ch, i) => ctx.fillText(ch, w - 67, 62 + i * 56));
        });
        const butcherFront = new THREE.Mesh(new THREE.PlaneGeometry(6.25, 2.50), new THREE.MeshStandardMaterial({ map: butcherFrontTex, roughness: 0.24 }));
        butcherFront.position.set(7.05, 1.32, 0.08);
        b10East.add(butcherFront);

        const noraeTex = makeCanvasTex(440, 128, (ctx, w, h) => {
          ctx.clearRect(0, 0, w, h);
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.font = '900 62px "Malgun Gothic", sans-serif';
          ctx.lineWidth = 8; ctx.strokeStyle = '#1E293B';
          ctx.strokeText('인생', 92, h / 2 + 2); ctx.fillStyle = '#F97316'; ctx.fillText('인생', 92, h / 2 + 2);
          ctx.strokeText('노래연습장', 288, h / 2 + 2); ctx.fillStyle = '#38BDF8'; ctx.fillText('노래연습장', 288, h / 2 + 2);
        });
        const noraeSign = new THREE.Mesh(
          new THREE.PlaneGeometry(2.15, 0.60),
          new THREE.MeshStandardMaterial({ map: noraeTex, transparent: true, alphaTest: 0.14 })
        );
        noraeSign.position.set(11.55, 3.35, 0.08);
        b10East.add(noraeSign);
        b10eb.addBox('B10_NoraeLobby', darkMetalMat, 11.60, 1.35, 0.02, 1.70, 2.65, 0.16);

        b10eb.buildAll(b10East);
        b10eb.disposeBases();

        b.buildAll(eastNorthGroup);
        b.disposeBases();
      }

      // =======================================================================
      // 12. 전체 조립, 실시간 메시 통계, 일주 카메라 프리셋, 코드 조회 & GLB 추출
      // =======================================================================
      function buildAll() {
        buildZone1WestNorth();
        buildZone2WestMid();
        buildZone3WestSouth();
        buildZone4Center();
        buildZone5EastSouth();
        buildZone6EastNorth();
      }

      function updateStats() {
        let meshCount = 0;
        let triCount = 0;

        const tally = (grp) => {
          if (!grp.visible) return;
          grp.traverse((obj) => {
            if (obj.isMesh && obj.geometry) {
              meshCount++;
              const g = obj.geometry;
              if (g.index) triCount += g.index.count / 3;
              else if (g.attributes.position) triCount += g.attributes.position.count / 3;
            }
          });
        };

        [
          westNorthGroup, westMidGroup, westSouthGroup,
          centerGroup, eastSouthGroup, eastNorthGroup
        ].forEach(tally);

        document.getElementById('mesh-stats').innerHTML =
          `표시 병합 메시: <strong>${meshCount.toLocaleString()}</strong>개<br/>` +
          `총 삼각형 수: <strong>${Math.round(triCount).toLocaleString()}</strong> tris`;
      }

      const cameraPresets = {
        sky:        { pos: new THREE.Vector3(  0.6, 102.0,   0.8), target: new THREE.Vector3(  0.6,  3.5,   0.2) },
        nw:         { pos: new THREE.Vector3(-37.5,   7.2, -26.5), target: new THREE.Vector3(-15.5,  5.4, -15.5) },
        west:       { pos: new THREE.Vector3(-39.5,   5.8,   5.2), target: new THREE.Vector3(-19.5,  4.6,   4.8) },
        sw:         { pos: new THREE.Vector3(-39.5,   4.6,  27.5), target: new THREE.Vector3(-21.5,  3.2,  19.5) },
        se:         { pos: new THREE.Vector3( 42.5,   4.8,  25.5), target: new THREE.Vector3( 24.5,  3.4,  17.2) },
        east_south: { pos: new THREE.Vector3( 40.5,   4.8,   6.5), target: new THREE.Vector3( 22.0,  3.6,   6.2) },
        east_mid:   { pos: new THREE.Vector3( 37.5,   5.2,  -5.5), target: new THREE.Vector3( 19.5,  4.2,  -5.5) },
        ne:         { pos: new THREE.Vector3( 36.5,   6.8, -26.5), target: new THREE.Vector3( 16.5,  5.6, -17.5) }
      };

      const TOUR_SEQUENCE = ['nw', 'west', 'sw', 'se', 'east_south', 'east_mid', 'ne'];
      let tourPlaying = false;
      let tourIdx = 0;
      let tourHoldTimer = 0;
      let camAnim = null;

      const btnTour = document.getElementById('btn-tour');

      function stopTour() {
        if (!tourPlaying) return;
        tourPlaying = false;
        btnTour.classList.remove('playing');
        btnTour.textContent = '▶ 일주 투어';
      }

      function setView(viewKey, instant = false, fromTour = false) {
        if (!fromTour) stopTour();
        const preset = cameraPresets[viewKey];
        if (!preset) return;

        document.querySelectorAll('.cam-btn').forEach((btn) => {
          btn.classList.toggle('active', btn.dataset.view === viewKey);
        });

        if (instant) {
          camAnim = null;
          camera.position.copy(preset.pos);
          controls.target.copy(preset.target);
          controls.update();
          return;
        }

        camAnim = {
          startPos: camera.position.clone(),
          endPos: preset.pos.clone(),
          startTarget: controls.target.clone(),
          endTarget: preset.target.clone(),
          progress: 0,
          duration: fromTour ? 1.85 : 0.70
        };
      }

      document.querySelectorAll('.cam-btn').forEach((btn) => {
        btn.addEventListener('click', () => setView(btn.dataset.view, false, false));
      });

      btnTour.addEventListener('click', () => {
        if (tourPlaying) {
          stopTour();
          showToast('일주 투어를 정지했습니다.', 1800);
        } else {
          tourPlaying = true;
          tourIdx = 0;
          tourHoldTimer = 0;
          btnTour.classList.add('playing');
          btnTour.textContent = '■ 투어 정지';
          setView(TOUR_SEQUENCE[0], false, true);
          showToast('북서(탕화쿵푸) → 동북(골드축산) 일주 투어를 시작합니다.', 2400);
        }
      });

      controls.addEventListener('start', () => {
        camAnim = null;
        stopTour();
      });

      [
        ['chk-wn', westNorthGroup],
        ['chk-wm', westMidGroup],
        ['chk-ws', westSouthGroup],
        ['chk-ct', centerGroup],
        ['chk-es', eastSouthGroup],
        ['chk-en', eastNorthGroup]
      ].forEach(([id, grp]) => {
        document.getElementById(id).addEventListener('change', (e) => {
          grp.visible = e.target.checked;
          updateStats();
        });
      });

      document.getElementById('chk-outlines').addEventListener('change', (e) => {
        outlineGroup.visible = e.target.checked;
      });

      const btnCollapse = document.getElementById('btn-collapse');
      const optionsBody = document.getElementById('options-body');
      btnCollapse.addEventListener('click', () => {
        const collapsed = optionsBody.classList.toggle('collapsed');
        btnCollapse.textContent = collapsed ? '펼치기' : '접기';
      });

      // 분리된 소스코드 조회 모달 로직
      const codeModal = document.getElementById('code-modal');
      const sourceCodeArea = document.getElementById('source-code-area');
      const codeModalTitle = document.getElementById('code-modal-title');

      document.getElementById('btn-open-code').addEventListener('click', () => {
        const fullHtml = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
        sourceCodeArea.value = fullHtml;
        const lineCount = fullHtml.split('\n').length;
        codeModalTitle.textContent = `전체 HTML / Three.js 소스코드 조회 (총 ${lineCount.toLocaleString()}줄)`;
        codeModal.classList.add('open');
      });

      document.getElementById('btn-close-code').addEventListener('click', () => {
        codeModal.classList.remove('open');
      });

      codeModal.addEventListener('click', (e) => {
        if (e.target === codeModal) codeModal.classList.remove('open');
      });

      document.getElementById('btn-copy-code').addEventListener('click', () => {
        sourceCodeArea.select();
        try {
          document.execCommand('copy');
          showToast('전체 소스코드가 클립보드에 복사되었습니다.', 2400);
        } catch (err) {
          showToast('코드 선택 완료 (Ctrl+C로 복사해주세요).', 2400);
        }
      });

      const exportBtn = document.getElementById('btn-export-glb');

      function exportGLB() {
        const hasAnyBuilding =
          westNorthGroup.visible || westMidGroup.visible || westSouthGroup.visible ||
          centerGroup.visible || eastSouthGroup.visible || eastNorthGroup.visible;

        if (!hasAnyBuilding) {
          showToast('추출할 건물 구역을 1개 이상 선택해주세요.', 2800);
          return;
        }

        exportBtn.disabled = true;
        showToast('Geumho2ga_CommercialBlock_SkyRatio.glb 파일을 생성하고 있습니다...', 4800);

        try {
          const exporter = new GLTFExporter();
          exporter.parse(
            exportRoot,
            (result) => {
              const blob = new Blob([result], { type: 'model/gltf-binary' });
              const url = URL.createObjectURL(blob);
              const link = document.createElement('a');
              link.href = url;
              link.download = 'Geumho2ga_CommercialBlock_SkyRatio.glb';
              document.body.appendChild(link);
              link.click();
              document.body.removeChild(link);
              setTimeout(() => URL.revokeObjectURL(url), 1200);

              const sizeMB = (blob.size / (1024 * 1024)).toFixed(2);
              showToast(`추출 완료! Geumho2ga_CommercialBlock_SkyRatio.glb (${sizeMB} MB)`, 3800);
              exportBtn.disabled = false;
            },
            (err) => {
              showErrorBanner(err);
              exportBtn.disabled = false;
            },
            {
              binary: true,
              onlyVisible: true
            }
          );
        } catch (err) {
          showErrorBanner(err);
          exportBtn.disabled = false;
        }
      }

      exportBtn.addEventListener('click', exportGLB);

      window.addEventListener('resize', () => {
        const w = container.clientWidth || window.innerWidth || 1280;
        const h = container.clientHeight || window.innerHeight || 720;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
      });

      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), 0.1);

        if (camAnim) {
          camAnim.progress += dt / camAnim.duration;
          const t = Math.min(1, camAnim.progress);
          const ease = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
          camera.position.lerpVectors(camAnim.startPos, camAnim.endPos, ease);
          controls.target.lerpVectors(camAnim.startTarget, camAnim.endTarget, ease);
          if (t >= 1) {
            camAnim = null;
            if (tourPlaying) tourHoldTimer = 1.65;
          }
        } else if (tourPlaying) {
          tourHoldTimer -= dt;
          if (tourHoldTimer <= 0) {
            tourIdx = (tourIdx + 1) % TOUR_SEQUENCE.length;
            setView(TOUR_SEQUENCE[tourIdx], false, true);
          }
        }

        controls.update();
        renderer.render(scene, camera);
      }

      buildAll();
      updateStats();
      setView('sky', true, false);
      animate();
    } catch (err) {
      showErrorBanner(err);
    }
  </script>
</body>
</html>
