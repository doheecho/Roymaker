<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>금호파크힐스 109동 3D 모델링 (황토빛 측벽 · 북측 3단 돌출부 · 북측 중앙 문주 주출입구 반영)</title>
  <style>
    body { margin: 0; overflow: hidden; background: #2c2f33; }
    #info {
      position: absolute; top: 14px; left: 16px; color: #fff;
      font-family: 'Malgun Gothic', sans-serif; font-size: 13px;
      background: rgba(20, 22, 25, 0.85); padding: 10px 14px;
      border-radius: 8px; border: 1px solid rgba(255,255,255,0.18);
      pointer-events: none; line-height: 1.55;
    }
    #controls-ui {
      position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
      display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
      background: rgba(20, 22, 25, 0.88); padding: 10px 14px;
      border-radius: 10px; border: 1px solid rgba(255,255,255,0.18);
      max-width: 95vw;
    }
    button {
      background: #3b4048; color: #fff; border: 1px solid #555b65;
      padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px;
      font-family: 'Malgun Gothic', sans-serif; transition: 0.15s;
    }
    button:hover { background: #BF8F52; color: #fff; border-color: #e2b475; }
    button.highlight-btn {
      background: #1d4ed8; border-color: #60a5fa; font-weight: bold;
    }
    button.highlight-btn:hover { background: #2563eb; }
    button.export-btn {
      background: #2b6cb0; border-color: #4299e1; font-weight: bold;
    }
    button.export-btn:hover { background: #3182ce; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="info">
    <strong>금호파크힐스 109동 (실사 외관 · 골든 오커 측벽 · 북측 3단 돌출부 · 북측 중앙 문주 주출입구 반영)</strong><br/>
    마우스 좌클릭 드래그: 회전 | 우클릭 드래그: 이동 | 휠: 확대·축소
  </div>

  <div id="controls-ui">
    <button class="highlight-btn" onclick="setView('entrance_close')">주출입구 근접 (북측 중앙 돌출부)</button>
    <button onclick="setView('top')">하늘 배치도 (Top)</button>
    <button onclick="setView('sw')">남서측 (SW · 사진 1·3)</button>
    <button onclick="setView('w')">서측 (West · 사진 2)</button>
    <button onclick="setView('s')">남측 (South 정면)</button>
    <button onclick="setView('n')">북측 (North · 사진 4)</button>
    <button class="export-btn" onclick="exportGLB()">3D 파일 추출 (.glb)</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

    // 1. 기본 씬, 카메라, 렌더러 설정
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#34383D');

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.2, 1000);
    // 초기 시점: 남서측에서 109동 황토빛 측벽과 화이트/그레이 전면부가 함께 보이는 구도
    camera.position.set(-46, 22, 48);

    const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 22, 0);
    controls.enableDamping = true;
    controls.update();

    // 좌표계 기준: -Z = 북(N), +Z = 남(S), +X = 동(E), -X = 서(W)
    window.setView = (dir) => {
      if (dir === 'entrance_close') {
        // 북측 중앙 돌출부 주출입구 문주 근접 시점
        controls.target.set(0, 5.0, -11.5);
        camera.position.set(14, 11.5, -28);
      } else if (dir === 'top') {
        // 하늘 배치도 (image_4f371b.png 동일 구도: 북쪽이 위, 남쪽이 아래)
        controls.target.set(0, 20, -1);
        camera.position.set(0, 105, -0.99);
      } else if (dir === 'sw') {
        // 남서측 실사 구도 (image_4f3a9c.jpg / image_4f37d0.jpg)
        controls.target.set(-2, 24, 2);
        camera.position.set(-44, 18, 46);
      } else if (dir === 'w') {
        // 서측 측벽 실사 구도 (image_4f37d4.jpg)
        controls.target.set(-4, 24, -1);
        camera.position.set(-54, 16, -2);
      } else if (dir === 's') {
        // 남측 정면
        controls.target.set(0, 24, 4);
        camera.position.set(0, 22, 68);
      } else if (dir === 'n') {
        // 북측 후면 및 중앙 코어 구도 (image_4f3758.jpg)
        controls.target.set(0, 22, -6);
        camera.position.set(-6, 16, -62);
      }
      controls.update();
    };

    // 2. 조명 및 뷰포트 그리드
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.92);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.08);
    dirLight.position.set(-48, 110, 45);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(2048, 2048);
    scene.add(dirLight);

    const fillLight = new THREE.DirectionalLight(0xdce6f2, 0.50);
    fillLight.position.set(50, 52, -45);
    scene.add(fillLight);

    const gridHelper = new THREE.GridHelper(160, 40, 0x555555, 0x42464C);
    scene.add(gridHelper);

    // =========================================================
    // 텍스처 생성 유틸리티 (109동 실제 사진 디테일 반영)
    // =========================================================

    // A. 골든 오커/황토빛(#BF8F52) 측벽 + 좌우 화이트 수직 프레임 띠 + 상·하단 '109' 표기
    function createOchreSideWallTexture({
      numberAlign = 'left', // 서측(-X)면 기준: left = 북측(사진 2 좌측 상·하단), 동측(+X)면 기준: right = 북측
      showTopNumber = true,
      showBottomNumber = true
    } = {}) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');

      // 109동 고유 골든 오커 / 황토빛 외장 패널 바탕 (사진 1, 2, 3 색채)
      ctx.fillStyle = '#BF8F52';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 수평 + 수직 패널 줄눈 그리드 (사진 2 서측 측벽 메지 디테일)
      ctx.fillStyle = 'rgba(45, 28, 12, 0.22)';
      for (let y = 0; y < canvas.height; y += 16) {
        ctx.fillRect(0, y, canvas.width, 2);
      }
      ctx.fillStyle = 'rgba(45, 28, 12, 0.14)';
      for (let x = 64; x < canvas.width - 64; x += 76) {
        ctx.fillRect(x, 0, 2, canvas.height);
      }

      // 좌·우측 화이트/아이보리 수직 프레임 띠 (사진 1, 2 양 가장자리 밝은 수직 기둥)
      const leftTrimW = Math.floor(canvas.width * (numberAlign === 'left' ? 0.14 : 0.10));
      const rightTrimW = Math.floor(canvas.width * (numberAlign === 'left' ? 0.10 : 0.14));

      ctx.fillStyle = '#EAE8E1';
      ctx.fillRect(0, 0, leftTrimW, canvas.height);
      ctx.fillRect(canvas.width - rightTrimW, 0, rightTrimW, canvas.height);

      ctx.fillStyle = 'rgba(30, 32, 36, 0.25)';
      for (let y = 0; y < canvas.height; y += 16) {
        ctx.fillRect(0, y, leftTrimW, 2);
        ctx.fillRect(canvas.width - rightTrimW, y, rightTrimW, 2);
      }

      // 상단 '109' 표기 (사진 2 좌측 상단)
      if (showTopNumber) {
        const tx = numberAlign === 'left' ? (leftTrimW + 68) : (canvas.width - rightTrimW - 68);
        const ty = 112;
        ctx.fillStyle = '#241B10';
        ctx.font = 'bold 50px "Malgun Gothic", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('109', tx + 3, ty + 3);
        ctx.fillStyle = '#F8FAFC';
        ctx.fillText('109', tx, ty);
      }

      // 하단 '109' 표기 (사진 1, 2 좌측 하단 - 다크 석재 기단부 바로 위)
      if (showBottomNumber) {
        const bx = numberAlign === 'left' ? (leftTrimW + 84) : (canvas.width - rightTrimW - 84);
        const by = canvas.height - 34;
        ctx.fillStyle = '#241B10';
        ctx.font = 'bold 62px "Malgun Gothic", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('109', bx + 3, by + 3);
        ctx.fillStyle = '#F8FAFC';
        ctx.fillText('109', bx, by);
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // B. 남측(+Z) 단위 세대 입면 텍스처 (외곽 슬릿 그레이 띠 + 화이트·그레이 수직 교차 창호 - 사진 1, 3 디테일)
    function create109SouthUnitTexture(floors, isWestUnit = true) {
      const canvas = document.createElement('canvas');
      canvas.width = 640;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');

      // 컬럼 구성: 외곽 코너 슬릿 그레이 띠(12%) + 화이트 베이(34%) + 중앙 그레이 베이(20%) + 내측 화이트 베이(34%)
      const cols = isWestUnit
        ? [
            { w: 0.12, bg: '#9AA0A8', type: 'slit' },
            { w: 0.34, bg: '#EFECE6', type: 'wide' },
            { w: 0.20, bg: '#959BA3', type: 'mid'  },
            { w: 0.34, bg: '#EFECE6', type: 'wide' }
          ]
        : [
            { w: 0.34, bg: '#EFECE6', type: 'wide' },
            { w: 0.20, bg: '#959BA3', type: 'mid'  },
            { w: 0.34, bg: '#EFECE6', type: 'wide' },
            { w: 0.12, bg: '#9AA0A8', type: 'slit' }
          ];

      let curX = 0;
      cols.forEach(col => {
        const cw = canvas.width * col.w;
        ctx.fillStyle = col.bg;
        ctx.fillRect(curX, 0, cw, canvas.height);
        curX += cw;
      });

      const fh = canvas.height / floors;
      for (let f = 0; f < floors; f++) {
        const y = f * fh;
        // 층간 수평 줄눈
        ctx.fillStyle = 'rgba(30, 32, 36, 0.24)';
        ctx.fillRect(0, y, canvas.width, 2.5);

        let x = 0;
        cols.forEach(col => {
          const cw = canvas.width * col.w;
          if (col.type === 'slit') {
            // 코너 수직 환기 슬릿 창 (사진 1 좌측 흰색/회색 코너 기둥의 세로 창)
            const wx = x + cw * 0.22;
            const wy = y + fh * 0.24;
            const ww = cw * 0.56;
            const wh = fh * 0.52;
            ctx.fillStyle = '#26313B';
            ctx.fillRect(wx, wy, ww, wh);
            ctx.strokeStyle = '#DCDAD4';
            ctx.lineWidth = 2;
            ctx.strokeRect(wx, wy, ww, wh);
          } else if (col.type === 'mid') {
            // 중앙 그레이 열의 세로 창호
            const wx = x + cw * 0.20;
            const wy = y + fh * 0.20;
            const ww = cw * 0.60;
            const wh = fh * 0.60;
            ctx.fillStyle = '#252E38';
            ctx.fillRect(wx, wy, ww, wh);
            ctx.strokeStyle = '#D5D8DD';
            ctx.lineWidth = 2.2;
            ctx.strokeRect(wx, wy, ww, wh);
          } else {
            // 화이트 베이의 넓은 발코니 창 + 좁은 침실 창 2분할 구성 (사진 1 디테일)
            const pad = cw * 0.10;
            const gap = cw * 0.06;
            const narrowW = (cw - pad * 2 - gap) * 0.34;
            const wideW = (cw - pad * 2 - gap) * 0.66;
            const winY = y + fh * 0.18;
            const winH = fh * 0.65;

            const nX = isWestUnit ? (x + pad) : (x + pad + wideW + gap);
            const wX = isWestUnit ? (x + pad + narrowW + gap) : (x + pad);

            // 좁은 창
            ctx.fillStyle = '#26313B';
            ctx.fillRect(nX, winY, narrowW, winH);
            ctx.strokeStyle = '#DCDAD4';
            ctx.lineWidth = 2;
            ctx.strokeRect(nX, winY, narrowW, winH);

            // 넓은 발코니 창 + 난간
            ctx.fillStyle = '#222C36';
            ctx.fillRect(wX, winY, wideW, winH);
            ctx.strokeStyle = '#DCDAD4';
            ctx.lineWidth = 2.4;
            ctx.strokeRect(wX, winY, wideW, winH);

            ctx.beginPath();
            ctx.moveTo(wX + wideW / 2, winY);
            ctx.lineTo(wX + wideW / 2, winY + winH);
            ctx.stroke();

            // 발코니 철제 난간 살
            ctx.fillStyle = '#181B1F';
            ctx.fillRect(wX - 1, winY + winH * 0.56, wideW + 2, 2.5);
            for (let rx = wX; rx <= wX + wideW; rx += 8) {
              ctx.fillRect(rx, winY + winH * 0.56, 1.8, winH * 0.44);
            }
          }
          x += cw;
        });
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // C. 북측(-Z) 후면 입면 텍스처 (화이트/그레이 수직 열 + 계단실 유리 커튼월 + 최상부 루버 - 사진 4 디테일)
    function create109NorthWallTexture(floors, {
      mode = 'core' // 'core' (중앙 코어 샤프트), 'sideProtrusion' (좌우 보조 돌출부), 'recessed' (오목 구간)
    } = {}) {
      const canvas = document.createElement('canvas');
      canvas.width = 320;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');

      if (mode === 'core') {
        // 중앙 코어: 외곽 화이트 프레임 + 중앙 그레이 계단실 유리 열
        ctx.fillStyle = '#E6E8EC';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#7C838E';
        ctx.fillRect(canvas.width * 0.24, 0, canvas.width * 0.52, canvas.height);
      } else if (mode === 'sideProtrusion') {
        // 좌우 보조 돌출부: 화이트 + 그레이 2열
        ctx.fillStyle = '#EAECEB';
        ctx.fillRect(0, 0, canvas.width * 0.55, canvas.height);
        ctx.fillStyle = '#737984';
        ctx.fillRect(canvas.width * 0.55, 0, canvas.width * 0.45, canvas.height);
      } else {
        // 오목 구간: 다크 그레이 수평 줄눈 패널 + 창문 열
        ctx.fillStyle = '#606670';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      const fh = canvas.height / floors;
      for (let f = 0; f < floors; f++) {
        const y = f * fh;
        ctx.fillStyle = 'rgba(22, 24, 28, 0.28)';
        ctx.fillRect(0, y, canvas.width, 2.5);

        if (mode === 'core') {
          if (f === 0) {
            // 최상부 다크 루버 환기실 (사진 4 최상단)
            ctx.fillStyle = '#23272D';
            ctx.fillRect(canvas.width * 0.22, y + 4, canvas.width * 0.56, fh - 8);
            ctx.fillStyle = '#4B525C';
            for (let lx = canvas.width * 0.25; lx < canvas.width * 0.75; lx += 8) {
              ctx.fillRect(lx, y + 6, 3, fh - 12);
            }
          } else {
            // 계단실 세로 연속 창문
            const wx = canvas.width * 0.28;
            const ww = canvas.width * 0.44;
            ctx.fillStyle = '#28323C';
            ctx.fillRect(wx, y + fh * 0.14, ww, fh * 0.72);
            ctx.strokeStyle = '#CBD5E1';
            ctx.lineWidth = 2;
            ctx.strokeRect(wx, y + fh * 0.14, ww, fh * 0.72);
          }
        } else if (mode === 'sideProtrusion') {
          const wx = canvas.width * 0.62;
          const ww = canvas.width * 0.30;
          ctx.fillStyle = '#252E38';
          ctx.fillRect(wx, y + fh * 0.20, ww, fh * 0.60);
          ctx.strokeStyle = '#D1D5DB';
          ctx.lineWidth = 2;
          ctx.strokeRect(wx, y + fh * 0.20, ww, fh * 0.60);
        } else {
          // 오목 후면 세대 창호 + 난간
          const wx = canvas.width * 0.22;
          const ww = canvas.width * 0.56;
          ctx.fillStyle = '#202830';
          ctx.fillRect(wx, y + fh * 0.20, ww, fh * 0.60);
          ctx.strokeStyle = '#9CA3AF';
          ctx.lineWidth = 2;
          ctx.strokeRect(wx, y + fh * 0.20, ww, fh * 0.60);
        }
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // D. 저층부 다크 차콜 석재 기단부 + 밝은 수평 줄눈 띠 (사진 1, 2 하단부 디테일)
    function createDarkBaseWithBandsTexture(hasWindows = false) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#2B2E33';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#191B1F';
      ctx.lineWidth = 2;
      for (let y = 0; y < canvas.height; y += 32) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }
      for (let x = 0; x < canvas.width; x += 64) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }

      ctx.fillStyle = '#A8ACB2';
      ctx.fillRect(0, 62, canvas.width, 6);
      ctx.fillRect(0, 146, canvas.width, 6);
      ctx.fillRect(0, 224, canvas.width, 6);

      if (hasWindows) {
        for (let x = 42; x < canvas.width - 30; x += 120) {
          ctx.fillStyle = '#1C2228';
          ctx.fillRect(x, 18, 68, 36);
          ctx.strokeStyle = '#8C9096';
          ctx.lineWidth = 2;
          ctx.strokeRect(x, 18, 68, 36);
        }
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // E. 위성 평면도 기준 옥상 텍스처
    function createSatelliteRoofTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#B8BCC2';
      ctx.fillRect(0, 0, 512, 512);

      ctx.fillStyle = '#CDC5B4';
      ctx.fillRect(42, 42, 428, 428);

      ctx.strokeStyle = '#73777D';
      ctx.lineWidth = 6;
      ctx.strokeRect(42, 42, 428, 428);

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // F. 주출입구 문주 상단 정면 인방 텍스처 (실버 '109' 표기)
    function createPortalHeaderTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#2B2E33';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#1A1C1F';
      ctx.lineWidth = 2;
      ctx.strokeRect(2, 2, canvas.width - 4, canvas.height - 4);

      ctx.strokeStyle = '#4B5058';
      ctx.lineWidth = 3;
      ctx.strokeRect(92, 22, canvas.width - 184, canvas.height - 44);

      const cx = canvas.width / 2;
      ctx.fillStyle = '#CBD5E1';
      ctx.fillRect(cx - 64, 60, 14, 16);
      ctx.fillRect(cx + 50, 60, 14, 16);

      ctx.fillStyle = '#111315';
      ctx.font = 'bold 46px "Malgun Gothic", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('109', cx + 2, 82);

      ctx.fillStyle = '#F1F5F9';
      ctx.fillText('109', cx, 80);

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // G. 문주 측면 상부 수직 루버(Vertical Louver) 텍스처
    function createPortalVerticalLouverTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#2B2E33';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#1C1E22';
      ctx.fillRect(16, 12, canvas.width - 32, canvas.height - 24);

      for (let x = 22; x < canvas.width - 22; x += 8) {
        ctx.fillStyle = '#484D54';
        ctx.fillRect(x, 14, 4, canvas.height - 28);
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // H. 내부 브론즈 멀리언 통유리 로비 텍스처
    function createLobbyCurtainWallTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#181B1E';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      grad.addColorStop(0, 'rgba(65, 75, 65, 0.35)');
      grad.addColorStop(0.5, 'rgba(35, 42, 38, 0.2)');
      grad.addColorStop(1, 'rgba(85, 90, 75, 0.35)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#6E6349';
      for (let x = 0; x <= canvas.width; x += 64) {
        ctx.fillRect(x, 0, 6, canvas.height);
      }
      ctx.fillRect(0, 140, canvas.width, 6);
      ctx.fillRect(0, 320, canvas.width, 6);

      ctx.strokeStyle = '#8C7E5E';
      ctx.lineWidth = 6;
      ctx.strokeRect(192, 320, 128, 192);
      ctx.beginPath();
      ctx.moveTo(256, 320);
      ctx.lineTo(256, 512);
      ctx.stroke();

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function addOutlines(mesh) {
      const edges = new THREE.EdgesGeometry(mesh.geometry, 25);
      const line = new THREE.LineSegments(
        edges,
        new THREE.LineBasicMaterial({ color: 0x161616 })
      );
      mesh.add(line);
    }

    // 옥상 화이트/라이트 그레이 옥탑 파라펫 링
    function createRoofPenthouseRing(w, d, h = 2.4) {
      const ringGroup = new THREE.Group();
      const wallMat = new THREE.MeshStandardMaterial({ color: '#E5E7EB', roughness: 0.75 });
      const topMat = new THREE.MeshStandardMaterial({ color: '#D1D5DB', roughness: 0.8 });
      const t = 1.8;

      const segments = [
        { size: [w, h, t], pos: [0, h / 2, d / 2 - t / 2] },
        { size: [w, h, t], pos: [0, h / 2, -d / 2 + t / 2] },
        { size: [t, h, d - t * 2], pos: [w / 2 - t / 2, h / 2, 0] },
        { size: [t, h, d - t * 2], pos: [-w / 2 + t / 2, h / 2, 0] }
      ];

      segments.forEach(s => {
        const m = new THREE.Mesh(
          new THREE.BoxGeometry(...s.size),
          [wallMat, wallMat, topMat, wallMat, wallMat, wallMat]
        );
        m.position.set(...s.pos);
        m.castShadow = true;
        m.receiveShadow = true;
        addOutlines(m);
        ringGroup.add(m);
      });

      return ringGroup;
    }

    // =========================================================
    // 북측 중앙 돌출부 주출입구 문주 생성 함수 (ㄷ자 석재 문주 + 수직 루버 + 유리 로비)
    // =========================================================
    function createDong109MainEntrance(baseH) {
      const entranceGroup = new THREE.Group();
      entranceGroup.name = 'Dong109_NorthCenter_Entrance';

      const stoneMat = new THREE.MeshStandardMaterial({ color: '#2B2E33', roughness: 0.72 });
      const stoneDarkMat = new THREE.MeshStandardMaterial({ color: '#22252A', roughness: 0.78 });
      const headerFrontMat = new THREE.MeshStandardMaterial({ map: createPortalHeaderTexture(), roughness: 0.7 });
      const louverSideMat = new THREE.MeshStandardMaterial({ map: createPortalVerticalLouverTexture(), roughness: 0.72 });
      const glassLobbyMat = new THREE.MeshStandardMaterial({ map: createLobbyCurtainWallTexture(), roughness: 0.35, metalness: 0.25 });

      const portalW = 6.6;           // 문주 정면 폭 (하늘 배치도 image_4f371b.png 상단 중앙 돌출부 비율)
      const portalD = 5.0;           // 북측 중앙 돌출부에서 북쪽(-Z)으로 돌출된 깊이
      const portalH = baseH * 0.76;  // 문주 총 높이
      const pillarW = 1.05;          // 기둥 폭
      const pillarD = 1.15;          // 기둥 깊이
      const headerH = 1.65;          // 상단 인방(헤더) 높이

      // 1) 전면 좌측 석재 기둥
      const leftPillar = new THREE.Mesh(
        new THREE.BoxGeometry(pillarW, portalH - headerH, pillarD),
        stoneMat
      );
      leftPillar.position.set(-(portalW / 2 - pillarW / 2), (portalH - headerH) / 2, portalD - pillarD / 2);
      leftPillar.castShadow = true;
      leftPillar.receiveShadow = true;
      addOutlines(leftPillar);
      entranceGroup.add(leftPillar);

      // 2) 전면 우측 석재 기둥
      const rightPillar = new THREE.Mesh(
        new THREE.BoxGeometry(pillarW, portalH - headerH, pillarD),
        stoneMat
      );
      rightPillar.position.set(portalW / 2 - pillarW / 2, (portalH - headerH) / 2, portalD - pillarD / 2);
      rightPillar.castShadow = true;
      rightPillar.receiveShadow = true;
      addOutlines(rightPillar);
      entranceGroup.add(rightPillar);

      // 3) 문주 상단 캐노피 헤더 (정면 '109' 음각 인방 + 좌·우측 수직 루버 프리즈)
      const portalHeader = new THREE.Mesh(
        new THREE.BoxGeometry(portalW, headerH, portalD),
        [
          louverSideMat,  // +X
          louverSideMat,  // -X
          stoneDarkMat,   // +Y
          stoneDarkMat,   // -Y
          headerFrontMat, // +Z (로컬 정면 '109' 인방)
          stoneMat        // -Z
        ]
      );
      portalHeader.position.set(0, portalH - headerH / 2, portalD / 2);
      portalHeader.castShadow = true;
      portalHeader.receiveShadow = true;
      addOutlines(portalHeader);
      entranceGroup.add(portalHeader);

      // 4) 안쪽 브론즈 멀리언 통유리 로비 & 출입문 매스
      const lobbyDepth = 1.35;
      const lobbyGlassBox = new THREE.Mesh(
        new THREE.BoxGeometry(portalW - 0.3, portalH - headerH, lobbyDepth),
        [
          glassLobbyMat,
          glassLobbyMat,
          stoneDarkMat,
          stoneDarkMat,
          glassLobbyMat,
          stoneDarkMat
        ]
      );
      lobbyGlassBox.position.set(0, (portalH - headerH) / 2, lobbyDepth / 2);
      lobbyGlassBox.castShadow = true;
      lobbyGlassBox.receiveShadow = true;
      addOutlines(lobbyGlassBox);
      entranceGroup.add(lobbyGlassBox);

      // 5) 포치 측면 자전거 거치대 캐노피 (109동 골든 오커 측벽 톤)
      const bikeShelterGroup = new THREE.Group();
      const shelterW = 2.6;
      const shelterH = 2.35;
      const shelterD = 2.4;

      const shelterRoof = new THREE.Mesh(
        new THREE.BoxGeometry(shelterW, 0.16, shelterD),
        new THREE.MeshStandardMaterial({ color: '#272A2E', roughness: 0.6 })
      );
      shelterRoof.position.set(0, shelterH, 0);
      addOutlines(shelterRoof);
      bikeShelterGroup.add(shelterRoof);

      const shelterSideWall = new THREE.Mesh(
        new THREE.BoxGeometry(0.14, shelterH, shelterD - 0.1),
        new THREE.MeshStandardMaterial({ color: '#BF8F52', roughness: 0.75 })
      );
      shelterSideWall.position.set(-(shelterW / 2 - 0.1), shelterH / 2, 0);
      addOutlines(shelterSideWall);
      bikeShelterGroup.add(shelterSideWall);

      const shelterBackWall = new THREE.Mesh(
        new THREE.BoxGeometry(shelterW - 0.1, shelterH, 0.14),
        new THREE.MeshStandardMaterial({ color: '#9E733E', roughness: 0.75 })
      );
      shelterBackWall.position.set(0, shelterH / 2, -(shelterD / 2 - 0.1));
      addOutlines(shelterBackWall);
      bikeShelterGroup.add(shelterBackWall);

      bikeShelterGroup.position.set(-(portalW / 2 + shelterW / 2 - 0.1), 0, portalD * 0.52);
      entranceGroup.add(bikeShelterGroup);

      return entranceGroup;
    }

    // =========================================================
    // 금호파크힐스 109동 전체 조립 (하늘 배치도 + 4장 실사 사진 기반)
    // =========================================================
    export function createKumho109Dong() {
      const dong109 = new THREE.Group();
      dong109.name = 'KumhoParkHills_109';

      const floorH = 2.55;
      const totalFloors = 21;
      const baseFloors = 4;
      const upperFloors = totalFloors - baseFloors;
      const baseH = floorH * baseFloors;
      const upperH = floorH * upperFloors;

      // 하늘 배치도(image_4f371b.png) 기준 미세 시계방향 회전각 (~ -2.8도)
      const buildingAngle = -0.048;

      const baseSolidMat = new THREE.MeshStandardMaterial({
        map: createDarkBaseWithBandsTexture(false),
        roughness: 0.8
      });
      const baseWinMat = new THREE.MeshStandardMaterial({
        map: createDarkBaseWithBandsTexture(true),
        roughness: 0.8
      });
      const roofMat = new THREE.MeshStandardMaterial({
        map: createSatelliteRoofTexture(),
        roughness: 0.88
      });

      const bodyGroup = new THREE.Group();
      bodyGroup.rotation.y = buildingAngle;
      dong109.add(bodyGroup);

      // ---------------------------------------------------------
      // 1. 좌·우 2개 주동 날개 (판상형 2호 조합 · 21층)
      // ---------------------------------------------------------
      const unitW = 16.8;
      const unitD = 13.4;
      const centerGap = 2.4; // 두 세대 사이 중앙 수직 홈 폭

      // 서측(좌측) 1호 라인 & 동측(우측) 2호 라인
      [-1, 1].forEach(side => {
        const isWest = side === -1;
        const unitX = side * (centerGap / 2 + unitW / 2);

        // 저층 다크 석재 기단부 (4층)
        const uBase = new THREE.Mesh(
          new THREE.BoxGeometry(unitW + 0.2, baseH, unitD + 0.2),
          [baseSolidMat, baseSolidMat, baseSolidMat, baseSolidMat, baseWinMat, baseWinMat]
        );
        uBase.position.set(unitX, baseH / 2, 0.8);
        uBase.castShadow = true;
        uBase.receiveShadow = true;
        addOutlines(uBase);
        bodyGroup.add(uBase);

        // 상부 주거층 (5~21층)
        const eastMat = isWest
          ? new THREE.MeshStandardMaterial({ color: '#7A808A', roughness: 0.8 })
          : new THREE.MeshStandardMaterial({
              map: createOchreSideWallTexture({ numberAlign: 'right', showTopNumber: true, showBottomNumber: true })
            });

        const westMat = isWest
          ? new THREE.MeshStandardMaterial({
              map: createOchreSideWallTexture({ numberAlign: 'left', showTopNumber: true, showBottomNumber: true })
            })
          : new THREE.MeshStandardMaterial({ color: '#7A808A', roughness: 0.8 });

        const southMat = new THREE.MeshStandardMaterial({
          map: create109SouthUnitTexture(upperFloors, isWest)
        });

        const northMat = new THREE.MeshStandardMaterial({
          map: create109NorthWallTexture(upperFloors, { mode: 'recessed' })
        });

        const uUpper = new THREE.Mesh(
          new THREE.BoxGeometry(unitW, upperH, unitD),
          [eastMat, westMat, roofMat, baseSolidMat, southMat, northMat]
        );
        uUpper.position.set(unitX, baseH + upperH / 2, 0.8);
        uUpper.castShadow = true;
        uUpper.receiveShadow = true;
        addOutlines(uUpper);
        bodyGroup.add(uUpper);

        // 옥상 화이트 파라펫 링
        const roofRing = createRoofPenthouseRing(unitW - 3.6, unitD - 4.4, 2.2);
        roofRing.position.set(unitX, baseH + upperH, 0.8);
        bodyGroup.add(roofRing);

        // 남측(+Z) 최상부 황토빛 파라펫 크라운 (사진 1, 3 상단부 디테일)
        const southCrown = new THREE.Mesh(
          new THREE.BoxGeometry(unitW - 1.2, 2.1, 1.4),
          new THREE.MeshStandardMaterial({ color: '#BF8F52', roughness: 0.78 })
        );
        southCrown.position.set(unitX, baseH + upperH + 1.05, 0.8 + unitD / 2 - 1.4);
        southCrown.castShadow = true;
        addOutlines(southCrown);
        bodyGroup.add(southCrown);
      });

      // 두 세대 사이 중앙 연결 코어 브릿지 (남측 중앙 수직 음영 홈 형성)
      const midSpine = new THREE.Mesh(
        new THREE.BoxGeometry(centerGap + 0.4, baseH + upperH - 0.6, unitD - 1.4),
        [
          new THREE.MeshStandardMaterial({ color: '#787E88' }),
          new THREE.MeshStandardMaterial({ color: '#787E88' }),
          roofMat,
          baseSolidMat,
          new THREE.MeshStandardMaterial({
            map: create109NorthWallTexture(upperFloors, { mode: 'recessed' })
          }),
          new THREE.MeshStandardMaterial({ color: '#787E88' })
        ]
      );
      midSpine.position.set(0, (baseH + upperH - 0.6) / 2, 0.3);
      midSpine.castShadow = true;
      midSpine.receiveShadow = true;
      addOutlines(midSpine);
      bodyGroup.add(midSpine);

      // ---------------------------------------------------------
      // 2. 북측(-Z) 3단 돌출부 (하늘 배치도 image_4f371b.png & 북측 사진 4)
      // ---------------------------------------------------------
      const northBackZ = 0.8 - unitD / 2; // 메인 매스의 북측 경계선 (z = -5.9)

      // 2-1) 북측 중앙 코어 돌출부 (좌·우 2개 코어 샤프트 결합, 좌측이 약간 더 북쪽으로 돌출)
      const westCoreW = 4.6;
      const westCoreD = 4.8;
      const coreTotalH = baseH + upperH + 2.6; // 사진 4 최상단 루버 옥탑 높이 반영

      const westCoreBase = new THREE.Mesh(
        new THREE.BoxGeometry(westCoreW + 0.15, baseH, westCoreD + 0.15),
        baseSolidMat
      );
      westCoreBase.position.set(-westCoreW / 2 + 0.1, baseH / 2, northBackZ - westCoreD / 2 + 0.4);
      addOutlines(westCoreBase);
      bodyGroup.add(westCoreBase);

      const westCoreUpper = new THREE.Mesh(
        new THREE.BoxGeometry(westCoreW, coreTotalH - baseH, westCoreD),
        [
          new THREE.MeshStandardMaterial({ color: '#D5D8DD' }),
          new THREE.MeshStandardMaterial({ color: '#EAE8E1' }),
          roofMat,
          baseSolidMat,
          new THREE.MeshStandardMaterial({ color: '#D5D8DD' }),
          new THREE.MeshStandardMaterial({
            map: create109NorthWallTexture(totalFloors, { mode: 'core' })
          })
        ]
      );
      westCoreUpper.position.set(-westCoreW / 2 + 0.1, baseH + (coreTotalH - baseH) / 2, northBackZ - westCoreD / 2 + 0.4);
      westCoreUpper.castShadow = true;
      westCoreUpper.receiveShadow = true;
      addOutlines(westCoreUpper);
      bodyGroup.add(westCoreUpper);

      const eastCoreW = 4.6;
      const eastCoreD = 4.1; // 배치도(image_4f371b.png) 기준 우측 중앙 코어가 약간 덜 돌출됨
      const eastCoreBase = new THREE.Mesh(
        new THREE.BoxGeometry(eastCoreW + 0.15, baseH, eastCoreD + 0.15),
        baseSolidMat
      );
      eastCoreBase.position.set(eastCoreW / 2 - 0.1, baseH / 2, northBackZ - eastCoreD / 2 + 0.4);
      addOutlines(eastCoreBase);
      bodyGroup.add(eastCoreBase);

      const eastCoreUpper = new THREE.Mesh(
        new THREE.BoxGeometry(eastCoreW, coreTotalH - baseH - 0.6, eastCoreD),
        [
          new THREE.MeshStandardMaterial({ color: '#EAE8E1' }),
          new THREE.MeshStandardMaterial({ color: '#D5D8DD' }),
          roofMat,
          baseSolidMat,
          new THREE.MeshStandardMaterial({ color: '#D5D8DD' }),
          new THREE.MeshStandardMaterial({
            map: create109NorthWallTexture(totalFloors, { mode: 'core' })
          })
        ]
      );
      eastCoreUpper.position.set(eastCoreW / 2 - 0.1, baseH + (coreTotalH - baseH - 0.6) / 2, northBackZ - eastCoreD / 2 + 0.4);
      eastCoreUpper.castShadow = true;
      eastCoreUpper.receiveShadow = true;
      addOutlines(eastCoreUpper);
      bodyGroup.add(eastCoreUpper);

      // 2-2) 북측 좌·우 보조 돌출부 (서·동 양 날개 후면 돌출 코어)
      [-1, 1].forEach(side => {
        const subX = side * 11.4;
        const subW = 4.2;
        const subD = 2.4;
        const subH = baseH + upperH - 0.8;

        const subBase = new THREE.Mesh(
          new THREE.BoxGeometry(subW + 0.15, baseH, subD + 0.15),
          baseSolidMat
        );
        subBase.position.set(subX, baseH / 2, northBackZ - subD / 2 + 0.3);
        addOutlines(subBase);
        bodyGroup.add(subBase);

        const subUpper = new THREE.Mesh(
          new THREE.BoxGeometry(subW, subH - baseH, subD),
          [
            new THREE.MeshStandardMaterial({ color: '#EAE8E1' }),
            new THREE.MeshStandardMaterial({ color: '#EAE8E1' }),
            roofMat,
            baseSolidMat,
            new THREE.MeshStandardMaterial({ color: '#EAE8E1' }),
            new THREE.MeshStandardMaterial({
              map: create109NorthWallTexture(upperFloors, { mode: 'sideProtrusion' })
            })
          ]
        );
        subUpper.position.set(subX, baseH + (subH - baseH) / 2, northBackZ - subD / 2 + 0.3);
        subUpper.castShadow = true;
        subUpper.receiveShadow = true;
        addOutlines(subUpper);
        bodyGroup.add(subUpper);
      });

      // ---------------------------------------------------------
      // 3. ★ 북쪽 중앙 돌출부 주출입구 문주 (하늘 배치도 image_4f371b.png 상단 중앙 박스)
      // ---------------------------------------------------------
      const northMainEntrance = createDong109MainEntrance(baseH);
      northMainEntrance.rotation.y = Math.PI; // -Z (정북쪽) 바깥 방향을 정면으로 향함
      northMainEntrance.position.set(-0.2, 0, northBackZ - westCoreD + 0.45);
      bodyGroup.add(northMainEntrance);

      // ---------------------------------------------------------
      // 4. 남서/남동 전면 저층 석재 조경 테라스 데크 (사진 1, 2, 3 하단 전경)
      // ---------------------------------------------------------
      const frontTerraceGroup = new THREE.Group();
      const terraceW = 34.0;
      const terraceD = 4.6;
      const terraceH = 3.8;

      const terraceMesh = new THREE.Mesh(
        new THREE.BoxGeometry(terraceW, terraceH, terraceD),
        [baseSolidMat, baseSolidMat, new THREE.MeshStandardMaterial({ color: '#6E7278', roughness: 0.85 }), baseSolidMat, baseSolidMat, baseSolidMat]
      );
      terraceMesh.position.y = terraceH / 2;
      terraceMesh.castShadow = true;
      terraceMesh.receiveShadow = true;
      addOutlines(terraceMesh);
      frontTerraceGroup.add(terraceMesh);

      const terraceRail = new THREE.Mesh(
        new THREE.BoxGeometry(terraceW - 0.3, 1.0, terraceD - 0.3),
        new THREE.MeshStandardMaterial({ color: '#1F2429', transparent: true, opacity: 0.52, roughness: 0.3 })
      );
      terraceRail.position.y = terraceH + 0.5;
      addOutlines(terraceRail);
      frontTerraceGroup.add(terraceRail);

      frontTerraceGroup.position.set(0, 0, 0.8 + unitD / 2 + terraceD / 2 - 0.2);
      bodyGroup.add(frontTerraceGroup);

      return dong109;
    }

    // 씬에 109동 배치
    const apt109 = createKumho109Dong();
    scene.add(apt109);

    // =========================================================
    // 3D 모델링 파일(.glb) 추출 함수
    // =========================================================
    window.exportGLB = () => {
      const exporter = new GLTFExporter();
      exporter.parse(
        apt109,
        (result) => {
          const blob = new Blob([result], { type: 'model/gltf-binary' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = 'kumho_109dong.glb';
          link.click();
          URL.revokeObjectURL(url);
        },
        (error) => {
          console.error('GLB 추출 중 오류:', error);
        },
        { binary: true }
      );
    };

    // 애니메이션 루프
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
