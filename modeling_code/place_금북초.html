<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>서울금북초등학교 3D 모델링 (v6.0 실사 개선판)</title>
  <style>
    body { margin: 0; overflow: hidden; background: #89b2d9; }
    #info {
      position: absolute; top: 14px; left: 16px; color: #fff;
      font-family: 'Malgun Gothic', sans-serif; font-size: 12px;
      background: rgba(18, 22, 28, 0.84); padding: 10px 14px;
      border-radius: 8px; border: 1px solid rgba(255,255,255,0.18);
      pointer-events: none; line-height: 1.55; max-width: 720px;
      backdrop-filter: blur(4px);
    }
    #controls-ui {
      position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
      display: flex; flex-wrap: wrap; justify-content: center; gap: 6px;
      background: rgba(18, 22, 28, 0.88); padding: 10px 12px;
      border-radius: 10px; border: 1px solid rgba(255,255,255,0.18);
      max-width: 98vw; backdrop-filter: blur(4px);
    }
    button {
      background: #374151; color: #fff; border: 1px solid #4b5563;
      padding: 5px 9px; border-radius: 6px; cursor: pointer; font-size: 11.5px;
      font-family: 'Malgun Gothic', sans-serif; transition: 0.15s;
    }
    button:hover { background: #2563eb; border-color: #93c5fd; }
    button.sky-btn { background: #1e3a8a; border-color: #3b82f6; }
    button.ground-btn { background: #0f766e; border-color: #2dd4bf; }
    button.export-btn { background: #b45309; border-color: #f59e0b; font-weight: bold; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="info">
    <strong>서울금북초등학교 3D 모델링 (v6.0)</strong><br/>
    <span style="color:#cbd5e1;">외곽 대형 콘크리트 바닥 제거 · 울타리 내/진입도로/갈색 광장 유지 · 실사 톤 및 교정 디테일 보강</span>
  </div>

  <div id="controls-ui">
    <button class="ground-btn" onclick="setView('main_gate')">1. 정문</button>
    <button class="ground-btn" onclick="setView('west_corner')">2. 학교 중앙</button>
    <button class="ground-btn" onclick="setView('ground_front')">3. 본관 정면</button>
    <button class="sky-btn" onclick="setView('top_curve')">4. 연결통로</button>
    <button class="ground-btn" onclick="setView('ground_brown')">5. 동측 건물</button>
    <button class="sky-btn" onclick="setView('sky_se')">6. 스카이뷰 남동</button>
    <button class="sky-btn" onclick="setView('sky_ne')">7. 스카이뷰 북동</button>
    <button class="sky-btn" onclick="setView('sky_nw')">8. 스카이뷰 북서</button>
    <button class="sky-btn" onclick="setView('sky_sw')">9. 스카이뷰 남서</button>
    <button class="export-btn" onclick="exportGLB()">3D 추출 (.glb)</button>
  </div>

  <script>
    window.__pendingView = null;
    window.setView = function(viewName) {
      if (typeof window.__applyView === 'function') {
        window.__applyView(viewName);
      } else {
        window.__pendingView = viewName;
      }
    };
    window.exportGLB = function() {
      if (typeof window.__runExportGLB === 'function') {
        window.__runExportGLB();
      } else {
        alert('3D 엔진이 아직 로딩 중이거나 인터넷/복사 상태를 확인해주세요.');
      }
    };
    window.addEventListener('error', function(e) {
      const infoEl = document.getElementById('info');
      if (infoEl && e && e.message) {
        infoEl.innerHTML += '<br/><span style="color:#fca5a5;">[오류 감지] ' + e.message + '</span>';
      }
    });
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#9EC3E6');
    scene.fog = new THREE.Fog('#BBD6EE', 260, 760);

    const camera = new THREE.PerspectiveCamera(44, window.innerWidth / window.innerHeight, 0.5, 1600);
    camera.position.set(14, 7.6, 34);

    const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.03;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(-28, 7.2, -16);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI * 0.495;
    controls.update();

    // 스카이돔 (GLB 추출 대상 root 외부에 배치)
    (function addSkyDome() {
      const skyCanvas = document.createElement('canvas');
      skyCanvas.width = 64;
      skyCanvas.height = 512;
      const ctx = skyCanvas.getContext('2d');
      const grad = ctx.createLinearGradient(0, 0, 0, 512);
      grad.addColorStop(0.00, '#4A86C5');
      grad.addColorStop(0.32, '#7BB0DF');
      grad.addColorStop(0.52, '#C8E0F4');
      grad.addColorStop(0.62, '#DDE8F0');
      grad.addColorStop(1.00, '#C7D1DA');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 64, 512);

      const skyTex = new THREE.CanvasTexture(skyCanvas);
      skyTex.colorSpace = THREE.SRGBColorSpace;
      const skyGeo = new THREE.SphereGeometry(680, 32, 20);
      const skyMat = new THREE.MeshBasicMaterial({ map: skyTex, side: THREE.BackSide, fog: false });
      scene.add(new THREE.Mesh(skyGeo, skyMat));
    })();

    // 좌표계: -Z = 북(N), +Z = 남(S), -X = 서(W), +X = 동(E)
    window.__applyView = (viewName) => {
      const views = {
        main_gate:      { pos: [50, 6.2, 86],      target: [57, 4.2, 24] },
        west_corner:    { pos: [14, 7.6, 34],      target: [-28, 7.2, -16] },
        ground_front:   { pos: [4, 7.2, 34],       target: [2, 6.8, -24] },
        top_curve:      { pos: [-44, 48, -4],      target: [-46, 8, -24] },
        ground_brown:   { pos: [82, 5.2, 16],      target: [77, 6.8, -25] },
        sky_se:         { pos: [122, 98, 128],     target: [8, 6, 12] },
        sky_ne:         { pos: [122, 98, -124],    target: [8, 6, 12] },
        sky_nw:         { pos: [-118, 98, -124],   target: [8, 6, 12] },
        sky_sw:         { pos: [-118, 98, 128],    target: [8, 6, 12] }
      };
      const v = views[viewName];
      if (!v) return;
      camera.position.set(...v.pos);
      controls.target.set(...v.target);
      controls.update();
    };
    window.setView = window.__applyView;
    if (window.__pendingView) {
      window.__applyView(window.__pendingView);
      window.__pendingView = null;
    }

    // 자연 주간 조명 구성
    const hemiLight = new THREE.HemisphereLight(0xdceeff, 0xa89b8c, 0.78);
    hemiLight.position.set(0, 120, 0);
    scene.add(hemiLight);

    scene.add(new THREE.AmbientLight(0xffffff, 0.24));

    const sun = new THREE.DirectionalLight(0xfff7e8, 1.55);
    sun.position.set(85, 145, 78);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -135;
    sun.shadow.camera.right = 135;
    sun.shadow.camera.top = 135;
    sun.shadow.camera.bottom = -135;
    sun.shadow.camera.near = 20;
    sun.shadow.camera.far = 420;
    sun.shadow.bias = -0.0004;
    sun.shadow.normalBias = 0.03;
    scene.add(sun);

    const fill = new THREE.DirectionalLight(0xc7e0ff, 0.36);
    fill.position.set(-95, 75, -75);
    scene.add(fill);

    function makeTex(canvas) {
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      return tex;
    }

    // 실사 톤을 해치지 않는 미세 음영 엣지
    function addSubtleEdge(mesh, color = 0x334155, opacity = 0.12) {
      const edges = new THREE.EdgesGeometry(mesh.geometry, 32);
      mesh.add(new THREE.LineSegments(edges, new THREE.LineBasicMaterial({
        color,
        transparent: true,
        opacity
      })));
    }

    function addPerimeterParapet(group, width, depth, baseY, rimH, rimThick, material) {
      const halfW = width / 2;
      const halfD = depth / 2;
      const fbGeo = new THREE.BoxGeometry(width, rimH, rimThick);
      [-halfD + rimThick / 2, halfD - rimThick / 2].forEach(zPos => {
        const bar = new THREE.Mesh(fbGeo, material);
        bar.position.set(0, baseY + rimH / 2, zPos);
        bar.castShadow = true;
        bar.receiveShadow = true;
        group.add(bar);
      });

      const lrGeo = new THREE.BoxGeometry(rimThick, rimH, Math.max(0.1, depth - rimThick * 2));
      [-halfW + rimThick / 2, halfW - rimThick / 2].forEach(xPos => {
        const bar = new THREE.Mesh(lrGeo, material);
        bar.position.set(xPos, baseY + rimH / 2, 0);
        bar.castShadow = true;
        bar.receiveShadow = true;
        group.add(bar);
      });
    }

    // =========================================================
    // 0. 실사 건축 외장 / 옥상 / 목재 / 지면 프로시저럴 텍스처 유틸
    // =========================================================
    function createExteriorPanelTexture(baseHex, lineRgba = 'rgba(20,30,38,0.12)', cols = 4, rows = 8, grain = 7) {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = baseHex;
      ctx.fillRect(0, 0, 256, 256);

      for (let i = 0; i < 4200; i++) {
        const x = (i * 53) % 256;
        const y = (i * 97 + Math.floor(i / 256) * 17) % 256;
        const alpha = ((i * 13) % 10) / 160;
        ctx.fillStyle = (i % 2 === 0)
          ? `rgba(255,255,255,${alpha})`
          : `rgba(0,0,0,${alpha * (grain / 7)})`;
        ctx.fillRect(x, y, 2, 2);
      }

      ctx.strokeStyle = lineRgba;
      ctx.lineWidth = 1.5;
      for (let c = 0; c <= cols; c++) {
        const x = (256 / cols) * c;
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 256); ctx.stroke();
      }
      for (let r = 0; r <= rows; r++) {
        const y = (256 / rows) * r;
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(256, y); ctx.stroke();
      }

      const tex = makeTex(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      return tex;
    }

    function createRoofUrethaneTexture(baseHex = '#8894A0') {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = baseHex;
      ctx.fillRect(0, 0, 256, 256);

      for (let i = 0; i < 3600; i++) {
        const x = (i * 61) % 256;
        const y = (i * 113) % 256;
        ctx.fillStyle = (i % 2 === 0) ? 'rgba(255,255,255,0.045)' : 'rgba(0,0,0,0.05)';
        ctx.fillRect(x, y, 3, 3);
      }
      ctx.strokeStyle = 'rgba(0,0,0,0.08)';
      ctx.lineWidth = 1.5;
      for (let g = 0; g <= 256; g += 64) {
        ctx.beginPath(); ctx.moveTo(g, 0); ctx.lineTo(g, 256); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, g); ctx.lineTo(256, g); ctx.stroke();
      }

      const tex = makeTex(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(3, 1);
      return tex;
    }

    function createWoodPlankTexture(baseHex = '#845435') {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = baseHex;
      ctx.fillRect(0, 0, 256, 256);

      const planks = 8;
      const ph = 256 / planks;
      for (let p = 0; p < planks; p++) {
        const shade = ((p * 17) % 18) - 9;
        ctx.fillStyle = shade > 0
          ? `rgba(255,230,200,${shade * 0.008})`
          : `rgba(25,12,5,${-shade * 0.012})`;
        ctx.fillRect(0, p * ph, 256, ph);

        ctx.strokeStyle = 'rgba(35, 18, 8, 0.35)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, p * ph);
        ctx.lineTo(256, p * ph);
        ctx.stroke();

        for (let g = 0; g < 18; g++) {
          ctx.strokeStyle = 'rgba(40, 20, 8, 0.12)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          const gy = p * ph + 3 + ((g * 7) % (ph - 5));
          ctx.moveTo(0, gy);
          ctx.lineTo(256, gy);
          ctx.stroke();
        }
      }
      const tex = makeTex(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(6, 1);
      return tex;
    }

    function createCampusConcreteTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#C8C4BB';
      ctx.fillRect(0, 0, 512, 512);

      for (let i = 0; i < 11000; i++) {
        const x = (i * 71) % 512;
        const y = (i * 131 + Math.floor(i / 512) * 23) % 512;
        const v = 178 + ((i * 19) % 34);
        ctx.fillStyle = `rgba(${v}, ${v - 2}, ${v - 7}, 0.36)`;
        ctx.fillRect(x, y, 2, 2);
      }

      ctx.strokeStyle = 'rgba(95, 92, 86, 0.20)';
      ctx.lineWidth = 2;
      for (let g = 0; g <= 512; g += 128) {
        ctx.beginPath(); ctx.moveTo(g, 0); ctx.lineTo(g, 512); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, g); ctx.lineTo(512, g); ctx.stroke();
      }

      const tex = makeTex(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(0.08, 0.08);
      return tex;
    }

    function createPaverPlazaTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#9D8877';
      ctx.fillRect(0, 0, 512, 512);

      const rows = 16;
      const cols = 8;
      const rh = 512 / rows;
      const cw = 512 / cols;
      for (let r = 0; r < rows; r++) {
        const off = (r % 2) * (cw * 0.5);
        for (let c = -1; c <= cols; c++) {
          const delta = ((r * 11 + c * 17) % 7) * 3 - 9;
          ctx.fillStyle = `rgb(${184 + delta}, ${162 + Math.round(delta * 0.85)}, ${144 + Math.round(delta * 0.75)})`;
          ctx.fillRect(c * cw + off + 1.5, r * rh + 1.5, cw - 3, rh - 3);
        }
      }
      const tex = makeTex(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(0.11, 0.11);
      return tex;
    }

    function createStampedRoadTexture(baseHex, dotDarkHex, dotLightHex) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = baseHex;
      ctx.fillRect(0, 0, 512, 512);

      for (let i = 0; i < 9500; i++) {
        const x = (i * 83) % 512;
        const y = (i * 149) % 512;
        ctx.fillStyle = (i % 3 === 0) ? dotLightHex : dotDarkHex;
        ctx.fillRect(x, y, 2, 2);
      }

      const tex = makeTex(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(0.14, 0.14);
      return tex;
    }

    // =========================================================
    // 1. 실사 교실 창호 텍스처 (주간 하늘 반사 + 실내 블라인드 + 알루미늄 창틀)
    // =========================================================
    function createSkyBlueClassroomWindowTexture(panes = 4, showLouvers = true) {
      const canvas = document.createElement('canvas');
      canvas.width = panes * 128;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      const skyGrad = ctx.createLinearGradient(0, 0, 0, 256);
      skyGrad.addColorStop(0.00, '#4E728E');
      skyGrad.addColorStop(0.35, '#729BB8');
      skyGrad.addColorStop(0.70, '#5E85A1');
      skyGrad.addColorStop(1.00, '#3C586E');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, canvas.width, 256);

      const paneW = canvas.width / panes;
      for (let p = 0; p < panes; p++) {
        const blindDrop = 28 + ((p * 23) % 3) * 18;
        ctx.fillStyle = 'rgba(232, 236, 230, 0.28)';
        ctx.fillRect(p * paneW + 6, 8, paneW - 12, blindDrop);
        ctx.fillStyle = 'rgba(18, 28, 38, 0.24)';
        ctx.fillRect(p * paneW + 6, 92, paneW - 12, 150);
      }

      const gloss = ctx.createLinearGradient(0, 0, canvas.width, 256);
      gloss.addColorStop(0.00, 'rgba(255, 255, 255, 0.28)');
      gloss.addColorStop(0.35, 'rgba(255, 255, 255, 0.06)');
      gloss.addColorStop(0.65, 'rgba(224, 242, 254, 0.20)');
      gloss.addColorStop(1.00, 'rgba(255, 255, 255, 0.04)');
      ctx.fillStyle = gloss;
      ctx.fillRect(0, 0, canvas.width, 256);

      ctx.strokeStyle = '#DCE3EA';
      ctx.lineWidth = 10;
      ctx.strokeRect(5, 5, canvas.width - 10, 246);
      ctx.strokeStyle = '#64748B';
      ctx.lineWidth = 2;
      ctx.strokeRect(10, 10, canvas.width - 20, 236);

      const transY = 84;
      ctx.fillStyle = '#D5DEE6';
      ctx.fillRect(0, transY - 4, canvas.width, 8);
      ctx.fillStyle = '#64748B';
      ctx.fillRect(0, transY + 4, canvas.width, 2);

      for (let p = 1; p < panes; p++) {
        const px = (canvas.width * p) / panes;
        ctx.fillStyle = '#D5DEE6';
        ctx.fillRect(px - 4, 0, 8, 256);
        ctx.fillStyle = '#64748B';
        ctx.fillRect(px + 4, 0, 1.5, 256);
      }

      if (showLouvers) {
        const lh = 58;
        const ly = 256 - lh - 8;
        const indices = panes === 4 ? [0, 3] : (panes === 2 ? [1] : []);
        indices.forEach(idx => {
          const lx = idx * paneW + 10;
          const lw = paneW - 20;
          ctx.fillStyle = '#CBD5E1';
          ctx.fillRect(lx, ly, lw, lh);
          ctx.strokeStyle = '#475569';
          ctx.lineWidth = 2;
          ctx.strokeRect(lx, ly, lw, lh);
          for (let sy = ly + 7; sy < ly + lh - 4; sy += 6) {
            ctx.beginPath();
            ctx.moveTo(lx + 4, sy);
            ctx.lineTo(lx + lw - 4, sy);
            ctx.stroke();
          }
        });
      }

      return makeTex(canvas);
    }

    // 옥상 태양광 패널 어레이
    function createSolarArray(rows = 2, cols = 6) {
      const group = new THREE.Group();
      const panelCanvas = document.createElement('canvas');
      panelCanvas.width = 256;
      panelCanvas.height = 128;
      const ctx = panelCanvas.getContext('2d');
      ctx.fillStyle = '#172845';
      ctx.fillRect(0, 0, 256, 128);
      ctx.strokeStyle = '#6482AD';
      ctx.lineWidth = 2;
      for (let x = 0; x <= 256; x += 32) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 128); ctx.stroke();
      }
      for (let y = 0; y <= 128; y += 32) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(256, y); ctx.stroke();
      }
      const panelMat = new THREE.MeshStandardMaterial({
        map: makeTex(panelCanvas),
        roughness: 0.25,
        metalness: 0.45
      });
      const frameMat = new THREE.MeshStandardMaterial({ color: '#94A3B8', metalness: 0.65, roughness: 0.35 });

      const pw = 2.1;
      const pd = 1.15;
      const gapX = 0.25;
      const gapZ = 2.1;
      const totalW = cols * (pw + gapX) - gapX;
      const totalD = (rows - 1) * gapZ;

      for (let r = 0; r < rows; r++) {
        const rz = -totalD / 2 + r * gapZ;
        for (let c = 0; c < cols; c++) {
          const cx = -totalW / 2 + c * (pw + gapX) + pw / 2;
          const panel = new THREE.Mesh(new THREE.BoxGeometry(pw, 0.06, pd), panelMat);
          panel.position.set(cx, 0.58, rz);
          panel.rotation.x = 0.36;
          panel.castShadow = true;
          group.add(panel);

          [-0.7, 0.7].forEach(lx => {
            const leg = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.52, 0.06), frameMat);
            leg.position.set(cx + lx, 0.26, rz - 0.3);
            group.add(leg);
          });
        }
      }
      return group;
    }

    // =========================================================
    // 2. 옥색 4층 교실동 생성기 (실사 외장 + 창대석 + 간판·시계 + 옥상 설비)
    // =========================================================
    function createRecessedMintWing({ baysCount, bayWidth = 8.0, depth = 11.4, height = 14.2, includeSignBand = false }) {
      const group = new THREE.Group();
      const totalWidth = baysCount * bayWidth;
      const recess = 0.34;
      const innerDepth = depth - recess * 2;

      const mintTex  = createExteriorPanelTexture('#46ACA8', 'rgba(14,48,48,0.14)', 4, 8, 7);
      mintTex.repeat.set(Math.max(2, baysCount), 1);
      const whiteTex = createExteriorPanelTexture('#EFF2F4', 'rgba(40,55,70,0.10)', 4, 4, 5);
      whiteTex.repeat.set(Math.max(2, baysCount), 1);
      const baseTex  = createExteriorPanelTexture('#5B6775', 'rgba(15,23,42,0.22)', 6, 4, 9);
      baseTex.repeat.set(Math.max(2, baysCount), 1);

      const mintMat     = new THREE.MeshStandardMaterial({ map: mintTex, roughness: 0.68 });
      const mintFlatMat = new THREE.MeshStandardMaterial({ color: '#46ACA8', roughness: 0.68 });
      const whiteMat    = new THREE.MeshStandardMaterial({ map: whiteTex, roughness: 0.72 });
      const baseMat     = new THREE.MeshStandardMaterial({ map: baseTex, roughness: 0.82 });
      const sillMat     = new THREE.MeshStandardMaterial({ color: '#CFD8DF', roughness: 0.65 });
      const greyRoofMat = new THREE.MeshStandardMaterial({ map: createRoofUrethaneTexture('#8E9BA8'), roughness: 0.88 });
      const copingMat   = new THREE.MeshStandardMaterial({ color: '#C5CFD8', roughness: 0.62, metalness: 0.12 });
      const skyBlueWinMat = new THREE.MeshStandardMaterial({
        map: createSkyBlueClassroomWindowTexture(4, true),
        roughness: 0.22,
        metalness: 0.16
      });

      const copingH = 0.25;
      const signBandH = includeSignBand ? 1.55 : 0.85;
      const bodyTopY = height - copingH - signBandH;
      const floorH = bodyTopY / 4;
      const winH = floorH * 0.65;
      const spandrelH = floorH - winH;

      const coreBlock = new THREE.Mesh(
        new THREE.BoxGeometry(totalWidth - 0.12, bodyTopY - 0.05, innerDepth - 0.04),
        new THREE.MeshStandardMaterial({ color: '#39556B', roughness: 0.55 })
      );
      coreBlock.position.set(0, (bodyTopY - 0.05) / 2, 0);
      coreBlock.castShadow = true;
      coreBlock.receiveShadow = true;
      group.add(coreBlock);

      for (let f = 0; f < 4; f++) {
        const floorNum = 4 - f;
        const floorTopY = bodyTopY - f * floorH;
        const winCenterY = floorTopY - winH / 2;
        const sillY = floorTopY - winH + 0.02;

        for (let b = 0; b < baysCount; b++) {
          const bx = -totalWidth / 2 + (b + 0.5) * bayWidth;
          [1, -1].forEach(dir => {
            const winPane = new THREE.Mesh(
              new THREE.PlaneGeometry(bayWidth - 0.68, winH - 0.04),
              skyBlueWinMat
            );
            winPane.position.set(bx, winCenterY, dir * (innerDepth / 2));
            if (dir === -1) winPane.rotation.y = Math.PI;
            group.add(winPane);

            const sill = new THREE.Mesh(new THREE.BoxGeometry(bayWidth - 0.66, 0.08, 0.18), sillMat);
            sill.position.set(bx, sillY, dir * (innerDepth / 2 + 0.06));
            sill.castShadow = true;
            group.add(sill);
          });
        }

        const spMat = (floorNum === 4) ? mintMat : (floorNum === 3 || floorNum === 2) ? whiteMat : baseMat;
        const spCenterY = floorTopY - winH - spandrelH / 2;
        const spBand = new THREE.Mesh(new THREE.BoxGeometry(totalWidth, spandrelH, depth), spMat);
        spBand.position.set(0, spCenterY, 0);
        spBand.castShadow = true;
        spBand.receiveShadow = true;
        addSubtleEdge(spBand, 0x334155, 0.09);
        group.add(spBand);
      }

      for (let b = 0; b <= baysCount; b++) {
        const px = -totalWidth / 2 + b * bayWidth;
        const isCenter = includeSignBand && (b === Math.floor(baysCount / 2));
        const pw = isCenter ? 0.92 : 0.68;
        const pilaster = new THREE.Mesh(new THREE.BoxGeometry(pw, bodyTopY, depth + 0.08), mintFlatMat);
        pilaster.position.set(px, bodyTopY / 2, 0);
        pilaster.castShadow = true;
        pilaster.receiveShadow = true;
        addSubtleEdge(pilaster, 0x1e3a3a, 0.11);
        group.add(pilaster);
      }

      const signCanvas = document.createElement('canvas');
      signCanvas.width = includeSignBand ? 4096 : (baysCount * 256);
      signCanvas.height = 256;
      const sctx = signCanvas.getContext('2d');

      sctx.fillStyle = '#46ACA8';
      sctx.fillRect(0, 0, signCanvas.width, signCanvas.height);

      sctx.strokeStyle = 'rgba(15, 50, 55, 0.18)';
      sctx.lineWidth = 2;
      const gridStep = signCanvas.width / (baysCount * 2);
      for (let sx = 0; sx <= signCanvas.width; sx += gridStep) {
        sctx.beginPath(); sctx.moveTo(sx, 0); sctx.lineTo(sx, signCanvas.height); sctx.stroke();
      }
      const topShade = sctx.createLinearGradient(0, 0, 0, 256);
      topShade.addColorStop(0.00, 'rgba(0,0,0,0.12)');
      topShade.addColorStop(0.15, 'rgba(0,0,0,0.00)');
      topShade.addColorStop(0.88, 'rgba(0,0,0,0.00)');
      topShade.addColorStop(1.00, 'rgba(0,0,0,0.14)');
      sctx.fillStyle = topShade;
      sctx.fillRect(0, 0, signCanvas.width, signCanvas.height);

      if (includeSignBand && baysCount === 10) {
        const physAspect = totalWidth / signBandH;
        const texAspect = signCanvas.width / signCanvas.height;
        const xCompensate = texAspect / physAspect;

        const bayPx = signCanvas.width / 10;
        const midY = signCanvas.height * 0.53;
        sctx.font = 'bold 162px "Malgun Gothic", sans-serif';
        sctx.textAlign = 'center';
        sctx.textBaseline = 'middle';

        const leftChars = [
          { ch: '꿈', color: '#0F766E', stroke: '#E2FAF7' },
          { ch: '보', color: '#7E22CE', stroke: '#F3E8FF' },
          { ch: '람', color: '#7E22CE', stroke: '#F3E8FF' },
          { ch: '기', color: '#DB2777', stroke: '#FCE7F3' },
          { ch: '쁨', color: '#DB2777', stroke: '#FCE7F3' },
          { ch: '이', color: '#1F2937', stroke: '#E2E8F0' },
          { ch: '가', color: '#1F2937', stroke: '#E2E8F0' },
          { ch: '득', color: '#1F2937', stroke: '#E2E8F0' },
          { ch: '한', color: '#1F2937', stroke: '#E2E8F0' }
        ];
        const leftStart = 0.88, leftEnd = 4.50;
        const leftStep = (leftEnd - leftStart) / (leftChars.length - 1);

        leftChars.forEach((item, idx) => {
          const cx = (leftStart + idx * leftStep) * bayPx;
          sctx.save();
          sctx.translate(cx, midY);
          sctx.scale(xCompensate, 1);
          sctx.shadowColor = 'rgba(0, 0, 0, 0.35)';
          sctx.shadowBlur = 10;
          sctx.shadowOffsetX = 4;
          sctx.shadowOffsetY = 6;
          sctx.lineWidth = 10;
          sctx.strokeStyle = item.stroke;
          sctx.strokeText(item.ch, 0, 0);
          sctx.fillStyle = item.color;
          sctx.fillText(item.ch, 0, 0);
          sctx.restore();
        });

        const clockX = 5.00 * bayPx;
        sctx.save();
        sctx.translate(clockX, midY);
        sctx.scale(xCompensate, 1);

        sctx.shadowColor = 'rgba(0, 0, 0, 0.38)';
        sctx.shadowBlur = 12;
        sctx.shadowOffsetX = 4;
        sctx.shadowOffsetY = 6;
        sctx.beginPath();
        sctx.arc(0, 0, 98, 0, Math.PI * 2);
        sctx.fillStyle = '#334155';
        sctx.fill();
        sctx.shadowColor = 'transparent';

        sctx.beginPath();
        sctx.arc(0, 0, 88, 0, Math.PI * 2);
        sctx.fillStyle = '#94A3B8';
        sctx.fill();

        sctx.beginPath();
        sctx.arc(0, 0, 82, 0, Math.PI * 2);
        sctx.fillStyle = '#F8FAFC';
        sctx.fill();

        for (let h = 0; h < 12; h++) {
          const a = (Math.PI * 2 * h) / 12;
          const r1 = (h % 3 === 0) ? 62 : 68;
          const r2 = 77;
          sctx.strokeStyle = '#1E293B';
          sctx.lineWidth = (h % 3 === 0) ? 6 : 3;
          sctx.beginPath();
          sctx.moveTo(Math.cos(a) * r1, Math.sin(a) * r1);
          sctx.lineTo(Math.cos(a) * r2, Math.sin(a) * r2);
          sctx.stroke();
        }
        sctx.strokeStyle = '#0F172A';
        sctx.lineWidth = 8;
        sctx.lineCap = 'round';
        sctx.beginPath();
        sctx.moveTo(0, 0); sctx.lineTo(0, -52);
        sctx.moveTo(0, 0); sctx.lineTo(36, 16);
        sctx.stroke();

        sctx.strokeStyle = '#DC2626';
        sctx.lineWidth = 3;
        sctx.beginPath();
        sctx.moveTo(-12, 8); sctx.lineTo(48, -32);
        sctx.stroke();

        sctx.beginPath();
        sctx.arc(0, 0, 7, 0, Math.PI * 2);
        sctx.fillStyle = '#1E293B';
        sctx.fill();
        sctx.restore();

        const rightChars = ['서', '울', '금', '북', '초', '등', '학', '교'];
        const rightStart = 5.50, rightEnd = 9.08;
        const rightStep = (rightEnd - rightStart) / (rightChars.length - 1);

        rightChars.forEach((ch, idx) => {
          const cx = (rightStart + idx * rightStep) * bayPx;
          sctx.save();
          sctx.translate(cx, midY);
          sctx.scale(xCompensate, 1);
          sctx.shadowColor = 'rgba(0, 0, 0, 0.35)';
          sctx.shadowBlur = 10;
          sctx.shadowOffsetX = 4;
          sctx.shadowOffsetY = 6;
          sctx.lineWidth = 10;
          sctx.strokeStyle = '#1E293B';
          sctx.strokeText(ch, 0, 0);
          sctx.fillStyle = '#F97316';
          sctx.fillText(ch, 0, 0);
          sctx.restore();
        });
      }

      const signBandMat = new THREE.MeshStandardMaterial({ map: makeTex(signCanvas), roughness: 0.62 });
      const signBand = new THREE.Mesh(
        new THREE.BoxGeometry(totalWidth, signBandH, depth + 0.04),
        [mintFlatMat, mintFlatMat, greyRoofMat, mintFlatMat, signBandMat, mintFlatMat]
      );
      signBand.position.set(0, bodyTopY + signBandH / 2, 0);
      signBand.castShadow = true;
      signBand.receiveShadow = true;
      group.add(signBand);

      const roofY = bodyTopY + signBandH;
      addPerimeterParapet(group, totalWidth + 0.12, depth + 0.16, roofY, copingH, 0.36, copingMat);

      const ductMat = new THREE.MeshStandardMaterial({ color: '#B0BCC7', metalness: 0.45, roughness: 0.45 });
      if (includeSignBand) {
        const solar1 = createSolarArray(2, 6);
        solar1.position.set(-18, roofY, 0);
        group.add(solar1);

        const solar2 = createSolarArray(2, 6);
        solar2.position.set(18, roofY, 0);
        group.add(solar2);

        [-34, 0, 34].forEach(vx => {
          const vent = new THREE.Mesh(new THREE.BoxGeometry(1.8, 1.05, 1.4), ductMat);
          vent.position.set(vx, roofY + 0.525, -2.5);
          vent.castShadow = true;
          group.add(vent);
        });
      } else {
        [-14, 0, 14].forEach(vx => {
          const vent = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.9, 1.2), ductMat);
          vent.position.set(vx, roofY + 0.45, -1.8);
          vent.castShadow = true;
          group.add(vent);
        });
      }

      return group;
    }

    // =========================================================
    // 3. 노란 세모지붕 통창 코어 (교표 + 박공 두겁 + 현관 계단)
    // =========================================================
    function createYellowCurtainCore({ width = 9.6, depth = 11.4, height = 14.2, peakH = 2.5, hasCrest = false, canopyThickness = 0.96 }) {
      const group = new THREE.Group();

      const yellowTex = createExteriorPanelTexture('#E2BD48', 'rgba(85,62,12,0.14)', 4, 8, 7);
      const yellowMat = new THREE.MeshStandardMaterial({ map: yellowTex, roughness: 0.62 });
      const trimMat   = new THREE.MeshStandardMaterial({ color: '#D4A82C', roughness: 0.55 });
      const greyRoofMat = new THREE.MeshStandardMaterial({ map: createRoofUrethaneTexture('#8E9BA8'), roughness: 0.85 });
      const pillarW   = 1.15;
      const cwWidth   = width - pillarW * 2;
      const floorH    = height / 4;

      [-width / 2 + pillarW / 2, width / 2 - pillarW / 2].forEach(px => {
        const pillar = new THREE.Mesh(new THREE.BoxGeometry(pillarW, height, depth), yellowMat);
        pillar.position.set(px, height / 2, 0);
        pillar.castShadow = true;
        pillar.receiveShadow = true;
        addSubtleEdge(pillar, 0x6b5212, 0.12);
        group.add(pillar);
      });

      const topSlab = new THREE.Mesh(new THREE.BoxGeometry(cwWidth, 0.35, depth), greyRoofMat);
      topSlab.position.set(0, height - 0.235, 0);
      topSlab.castShadow = true;
      group.add(topSlab);

      const transparentGlassMat = new THREE.MeshPhysicalMaterial({
        color: '#6BA7B8',
        transparent: true,
        opacity: 0.34,
        roughness: 0.10,
        metalness: 0.16,
        side: THREE.DoubleSide,
        depthWrite: false
      });
      const mullionMat = new THREE.MeshStandardMaterial({ color: '#2C4E54', roughness: 0.42, metalness: 0.28 });
      const slabMat    = new THREE.MeshStandardMaterial({ color: '#D6DCE2', roughness: 0.80 });
      const railMat    = new THREE.MeshStandardMaterial({ color: '#94A3B8', metalness: 0.65, roughness: 0.3 });

      for (let fl = 1; fl <= 3; fl++) {
        const sy = fl * floorH;
        const innerSlab = new THREE.Mesh(new THREE.BoxGeometry(cwWidth - 0.1, 0.24, depth - 0.8), slabMat);
        innerSlab.position.set(0, sy, 0);
        group.add(innerSlab);

        const stair = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.2, 4.4), slabMat);
        stair.position.set(-1.2, sy + floorH * 0.5, 0);
        stair.rotation.x = 0.58;
        group.add(stair);

        const handRail = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.06, 4.4), railMat);
        handRail.position.set(-0.05, sy + floorH * 0.5 + 0.75, 0);
        handRail.rotation.x = 0.58;
        group.add(handRail);
      }

      const upperH = floorH * 3;
      const upperCenterY = floorH + upperH / 2;
      [depth / 2, -depth / 2].forEach(fz => {
        const glassPane = new THREE.Mesh(new THREE.PlaneGeometry(cwWidth, upperH), transparentGlassMat);
        glassPane.position.set(0, upperCenterY, fz);
        if (fz < 0) glassPane.rotation.y = Math.PI;
        group.add(glassPane);

        for (let c = 1; c < 4; c++) {
          const mx = -cwWidth / 2 + (cwWidth * c) / 4;
          const vBar = new THREE.Mesh(new THREE.BoxGeometry(0.10, upperH, 0.12), mullionMat);
          vBar.position.set(mx, upperCenterY, fz);
          group.add(vBar);
        }
        for (let r = 1; r < 6; r++) {
          const my = floorH + (upperH * r) / 6;
          const hBar = new THREE.Mesh(new THREE.BoxGeometry(cwWidth, (r % 2 === 0) ? 0.18 : 0.08, 0.12), mullionMat);
          hBar.position.set(0, my, fz);
          group.add(hBar);
        }
      });

      const doorFrameMat = new THREE.MeshStandardMaterial({ color: '#1E293B', roughness: 0.42, metalness: 0.35 });
      const handleMat    = new THREE.MeshStandardMaterial({ color: '#E2E8F0', metalness: 0.80, roughness: 0.22 });
      const doorGlassMat = new THREE.MeshPhysicalMaterial({
        color: '#8ED6E6',
        transparent: true,
        opacity: 0.42,
        roughness: 0.14,
        side: THREE.DoubleSide,
        depthWrite: false
      });

      [depth / 2 - 0.15, -depth / 2 + 0.15].forEach(dz => {
        const doorW = cwWidth / 4;
        for (let d = 0; d < 4; d++) {
          const dx = -cwWidth / 2 + (d + 0.5) * doorW;
          const leaf = new THREE.Mesh(new THREE.PlaneGeometry(doorW - 0.14, floorH - 0.35), doorGlassMat);
          leaf.position.set(dx, (floorH - 0.25) / 2, dz);
          group.add(leaf);

          const handle = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.52, 0.14), handleMat);
          handle.position.set(dx + (d % 2 === 0 ? 0.22 : -0.22), 1.15, dz);
          group.add(handle);
        }
        for (let d = 0; d <= 4; d++) {
          const fx = -cwWidth / 2 + d * doorW;
          const jamb = new THREE.Mesh(new THREE.BoxGeometry(0.12, floorH - 0.2, 0.16), doorFrameMat);
          jamb.position.set(fx, (floorH - 0.2) / 2, dz);
          group.add(jamb);
        }
      });

      // 1층 현관 화강석 계단
      const stepMat = new THREE.MeshStandardMaterial({ color: '#D1D5DB', roughness: 0.78 });
      for (let st = 0; st < 2; st++) {
        const step = new THREE.Mesh(new THREE.BoxGeometry(cwWidth + 0.6, 0.14 * (2 - st), 0.42), stepMat);
        step.position.set(0, 0.07 * (2 - st), depth / 2 + 0.22 + st * 0.42);
        step.receiveShadow = true;
        group.add(step);
      }

      const blueBar = new THREE.Mesh(
        new THREE.BoxGeometry(width + 0.3, canopyThickness, depth + 1.8),
        new THREE.MeshStandardMaterial({ color: '#1B6599', roughness: 0.48, metalness: 0.12 })
      );
      blueBar.position.set(0, floorH, 0);
      blueBar.castShadow = true;
      blueBar.receiveShadow = true;
      group.add(blueBar);

      const shape = new THREE.Shape();
      shape.moveTo(-width / 2, 0);
      shape.lineTo(width / 2, 0);
      shape.lineTo(0, peakH);
      shape.closePath();

      const gableGeo = new THREE.ExtrudeGeometry(shape, { depth: depth + 0.12, bevelEnabled: false });
      gableGeo.translate(0, 0, -(depth + 0.12) / 2);
      const gable = new THREE.Mesh(gableGeo, yellowMat);
      gable.position.y = height + 0.01;
      gable.castShadow = true;
      gable.receiveShadow = true;
      group.add(gable);

      const slopeLen = Math.hypot(width / 2, peakH) + 0.25;
      const slopeAng = Math.atan2(peakH, width / 2);
      [-1, 1].forEach(side => {
        const cap = new THREE.Mesh(new THREE.BoxGeometry(slopeLen, 0.18, depth + 0.46), trimMat);
        cap.position.set(side * (width / 4), height + peakH / 2 + 0.08, 0);
        cap.rotation.z = -side * slopeAng;
        cap.castShadow = true;
        group.add(cap);
      });

      const medCanvas = document.createElement('canvas');
      medCanvas.width = 256;
      medCanvas.height = 256;
      const mctx = medCanvas.getContext('2d');
      mctx.fillStyle = hasCrest ? '#1F6F3D' : '#F1F5F9';
      mctx.fillRect(0, 0, 256, 256);
      mctx.strokeStyle = hasCrest ? '#FACC15' : '#94A3B8';
      mctx.lineWidth = 14;
      mctx.beginPath();
      mctx.arc(128, 128, 108, 0, Math.PI * 2);
      mctx.stroke();
      if (hasCrest) {
        mctx.fillStyle = '#FEF08A';
        mctx.font = 'bold 78px "Malgun Gothic", sans-serif';
        mctx.textAlign = 'center';
        mctx.textBaseline = 'middle';
        mctx.fillText('금북', 128, 132);
      } else {
        mctx.strokeStyle = '#CBD5E1';
        mctx.lineWidth = 6;
        mctx.beginPath();
        mctx.arc(128, 128, 66, 0, Math.PI * 2);
        mctx.stroke();
      }
      const medFaceMat = new THREE.MeshStandardMaterial({ map: makeTex(medCanvas), roughness: 0.4 });
      const medSideMat = new THREE.MeshStandardMaterial({ color: hasCrest ? '#16532D' : '#CBD5E1', roughness: 0.45 });
      const medallion = new THREE.Mesh(
        new THREE.CylinderGeometry(0.82, 0.82, depth + 0.24, 28),
        [medSideMat, medFaceMat, medFaceMat]
      );
      medallion.rotation.x = Math.PI / 2;
      medallion.position.set(0, height + peakH * 0.44, 0);
      group.add(medallion);

      return group;
    }

    // =========================================================
    // 4. 3·4층 슬림 90° 초록 연결통로 (내부 바닥 + 모자이크 포인트)
    // =========================================================
    function createSlimCurvedUpperBridge({ centerX, centerZ, rIn, rOut, yBottom = 7.1, yTop = 14.0 }) {
      const group = new THREE.Group();
      const segs = 32;

      function buildArcBand(rInner, rOuter, bandH, yPos, mat) {
        const shape = new THREE.Shape();
        for (let i = 0; i <= segs; i++) {
          const a = Math.PI + (Math.PI / 2) * (i / segs);
          const x = Math.cos(a) * rOuter;
          const y = Math.sin(a) * rOuter;
          if (i === 0) shape.moveTo(x, y);
          else shape.lineTo(x, y);
        }
        for (let i = segs; i >= 0; i--) {
          const a = Math.PI + (Math.PI / 2) * (i / segs);
          const x = Math.cos(a) * rInner;
          const y = Math.sin(a) * rInner;
          shape.lineTo(x, y);
        }
        shape.closePath();

        const geo = new THREE.ExtrudeGeometry(shape, { depth: bandH, bevelEnabled: false });
        geo.rotateX(Math.PI / 2);
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(centerX, yPos + bandH, centerZ);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        return mesh;
      }

      const greenMat = new THREE.MeshStandardMaterial({
        map: createExteriorPanelTexture('#398B66', 'rgba(12,45,30,0.16)', 4, 4, 6),
        roughness: 0.60
      });
      const yellowFrameMat = new THREE.MeshStandardMaterial({ color: '#EAB308', roughness: 0.45, metalness: 0.15 });
      const copingMat = new THREE.MeshStandardMaterial({ color: '#CBD5E1', roughness: 0.60 });
      const deckMat = new THREE.MeshStandardMaterial({ color: '#D1D5DB', roughness: 0.82 });
      const clearGlassMat = new THREE.MeshPhysicalMaterial({
        color: '#93C5DF',
        transparent: true,
        opacity: 0.34,
        roughness: 0.10,
        metalness: 0.15,
        side: THREE.DoubleSide,
        depthWrite: false
      });

      const lowerGreen   = buildArcBand(rIn, rOut, 1.05, yBottom, greenMat);
      const upperGreen   = buildArcBand(rIn, rOut, 1.05, yTop - 1.05, greenMat);
      const topCoping    = buildArcBand(rIn - 0.06, rOut + 0.06, 0.16, yTop, copingMat);
      const midFloorDeck = buildArcBand(rIn + 0.12, rOut - 0.12, 0.22, (yBottom + yTop) / 2 - 0.11, deckMat);
      group.add(lowerGreen, upperGreen, topCoping, midFloorDeck);

      const winBottom = yBottom + 1.05;
      const winTop = yTop - 1.05;
      const winH = winTop - winBottom;

      const yellowBottomRim = buildArcBand(rIn, rOut, 0.22, winBottom, yellowFrameMat);
      const yellowTopRim    = buildArcBand(rIn, rOut, 0.22, winTop - 0.22, yellowFrameMat);
      const yellowMidRim    = buildArcBand(rIn, rOut, 0.18, winBottom + winH / 2 - 0.09, yellowFrameMat);
      group.add(yellowBottomRim, yellowTopRim, yellowMidRim);

      [rIn, rOut].forEach(rad => {
        const cylGeo = new THREE.CylinderGeometry(rad, rad, winH - 0.44, segs, 1, true, Math.PI, Math.PI / 2);
        const glassWall = new THREE.Mesh(cylGeo, clearGlassMat);
        glassWall.rotation.y = -Math.PI / 2;
        glassWall.position.set(centerX, winBottom + winH / 2, centerZ);
        group.add(glassWall);
      });

      const mosaicPalette = ['#EF4444', '#3B82F6', '#FACC15', '#38BDF8'];
      for (let i = 0; i <= 10; i++) {
        const a = Math.PI + (Math.PI / 2) * (i / 10);
        [rIn, rOut].forEach(rad => {
          const vx = centerX + Math.cos(a) * rad;
          const vz = centerZ + Math.sin(a) * rad;
          const vPost = new THREE.Mesh(new THREE.BoxGeometry(0.14, winH, 0.14), yellowFrameMat);
          vPost.position.set(vx, winBottom + winH / 2, vz);
          vPost.rotation.y = -a;
          group.add(vPost);
        });

        if (i >= 3 && i <= 6) {
          const aMid = Math.PI + (Math.PI / 2) * ((i + 0.5) / 10);
          const mx = centerX + Math.cos(aMid) * (rIn - 0.02);
          const mz = centerZ + Math.sin(aMid) * (rIn - 0.02);
          const tile = new THREE.Mesh(
            new THREE.BoxGeometry(0.06, 0.85, 0.85),
            new THREE.MeshStandardMaterial({ color: mosaicPalette[i % mosaicPalette.length], roughness: 0.35 })
          );
          tile.position.set(mx, winBottom + winH * 0.36, mz);
          tile.rotation.y = -aMid;
          group.add(tile);
        }
      }

      return group;
    }

    // =========================================================
    // 5. 동측 벽돌·베이지 건물 생성기
    // =========================================================
    function createBrickTileTexture(rBase = 198, gBase = 136, bBase = 102, groutHex = '#7F685C') {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = groutHex;
      ctx.fillRect(0, 0, 256, 256);
      const rows = 16, cols = 6, rh = 256 / rows, cw = 256 / cols;
      for (let r = 0; r < rows; r++) {
        const offset = (r % 2) * (cw * 0.5);
        for (let c = -1; c <= cols; c++) {
          const shade = ((r * 7 + c * 13) % 7) * 5 - 15;
          const rr = Math.min(255, Math.max(0, rBase + shade));
          const gg = Math.min(255, Math.max(0, gBase + Math.round(shade * 0.72)));
          const bb = Math.min(255, Math.max(0, bBase + Math.round(shade * 0.55)));
          ctx.fillStyle = `rgb(${rr}, ${gg}, ${bb})`;
          ctx.fillRect(c * cw + offset + 1.5, r * rh + 1.5, cw - 3, rh - 3);
        }
      }
      const tex = makeTex(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      return tex;
    }

    // =========================================================
    // 7. 완만한 원호 판넬(ExtrudeGeometry) 헬퍼
    // =========================================================
    function createCurvedRoofShell({ spanWidth, lengthZ, arcAngleRad, thickness = 0.08, material }) {
      const halfSpan = spanWidth / 2;
      const thetaHalf = arcAngleRad / 2;
      const R = halfSpan / Math.sin(thetaHalf);
      const yCenter = -R * Math.cos(thetaHalf);

      const shape = new THREE.Shape();
      const segs = 28;
      for (let i = 0; i <= segs; i++) {
        const th = -thetaHalf + arcAngleRad * (i / segs);
        const x = Math.sin(th) * (R + thickness);
        const y = yCenter + Math.cos(th) * (R + thickness);
        if (i === 0) shape.moveTo(x, y);
        else shape.lineTo(x, y);
      }
      for (let i = segs; i >= 0; i--) {
        const th = -thetaHalf + arcAngleRad * (i / segs);
        const x = Math.sin(th) * R;
        const y = yCenter + Math.cos(th) * R;
        shape.lineTo(x, y);
      }
      shape.closePath();

      const geo = new THREE.ExtrudeGeometry(shape, { depth: lengthZ, bevelEnabled: false });
      geo.translate(0, 0, -lengthZ / 2);
      const mesh = new THREE.Mesh(geo, material);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    // =========================================================
    // 8. 도로 아스팔트 텍스처 & 수평 지면 폴리곤 헬퍼
    // =========================================================
    function createAsphaltTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#4B525E';
      ctx.fillRect(0, 0, 512, 512);

      for (let i = 0; i < 10000; i++) {
        const rx = (i * 73) % 512;
        const ry = (i * 137 + Math.floor(i / 512) * 29) % 512;
        const v = 64 + ((i * 19) % 26);
        ctx.fillStyle = `rgb(${v}, ${v + 4}, ${v + 10})`;
        ctx.fillRect(rx, ry, 2, 2);
      }

      const tex = makeTex(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(0.16, 0.16);
      return tex;
    }

    function createGroundPolygon(pointsXZ, thickness, yBottom, material) {
      const shape = new THREE.Shape();
      pointsXZ.forEach(([x, z], idx) => {
        if (idx === 0) shape.moveTo(x, z);
        else shape.lineTo(x, z);
      });
      shape.closePath();

      const geo = new THREE.ExtrudeGeometry(shape, { depth: thickness, bevelEnabled: false });
      geo.rotateX(Math.PI / 2);
      const mesh = new THREE.Mesh(geo, material);
      mesh.position.y = yBottom + thickness;
      mesh.receiveShadow = true;
      return mesh;
    }

    // =========================================================
    // 9. 베이지색 계단효과 보행로 생성기 (솔리드 하부 받침 포함)
    // =========================================================
    function createBeigeStairWalkway(topLeftXZ, topRightXZ, botLeftXZ, botRightXZ, yHeight = 0.075) {
      const group = new THREE.Group();

      const baseSlab = createGroundPolygon(
        [topLeftXZ, topRightXZ, botRightXZ, botLeftXZ],
        0.42,
        -0.35,
        new THREE.MeshStandardMaterial({ color: '#B7A791', roughness: 0.86 })
      );
      group.add(baseSlab);

      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 2048;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#E4D5BE';
      ctx.fillRect(0, 0, 512, 2048);

      const steps = 96;
      const stepH = 2048 / steps;
      for (let s = 0; s < steps; s++) {
        const y0 = s * stepH;
        ctx.fillStyle = (s % 2 === 0) ? '#E8DAC4' : '#DDD0B9';
        ctx.fillRect(14, y0, 484, stepH);

        ctx.fillStyle = 'rgba(110, 96, 80, 0.12)';
        for (let k = 0; k < 28; k++) {
          ctx.fillRect(18 + ((s * 37 + k * 79) % 470), y0 + 5 + (k % 12), 3, 2);
        }

        ctx.fillStyle = '#7C6E5D';
        ctx.fillRect(12, y0, 488, 3.2);
        ctx.fillStyle = '#C4B39A';
        ctx.fillRect(12, y0 + 3.2, 488, 2.5);
      }

      ctx.fillStyle = '#B8A892';
      ctx.fillRect(0, 0, 14, 2048);
      ctx.fillRect(498, 0, 14, 2048);

      const tex = makeTex(canvas);

      const geo = new THREE.BufferGeometry();
      const vertices = new Float32Array([
        topLeftXZ[0],  yHeight, topLeftXZ[1],
        topRightXZ[0], yHeight, topRightXZ[1],
        botRightXZ[0], yHeight, botRightXZ[1],
        botLeftXZ[0],  yHeight, botLeftXZ[1]
      ]);
      const uvs = new Float32Array([
        0, 1,
        1, 1,
        1, 0,
        0, 0
      ]);
      geo.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
      geo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
      geo.setIndex([0, 3, 2, 0, 2, 1]);
      geo.computeVertexNormals();

      const mesh = new THREE.Mesh(
        geo,
        new THREE.MeshStandardMaterial({ map: tex, roughness: 0.80 })
      );
      mesh.receiveShadow = true;
      group.add(mesh);

      return group;
    }

    // =========================================================
    // 10. 교문 앞길 우측 외곽 금속 울타리 생성기
    // =========================================================
    function createRoadsideMetalFence(pointsXZ) {
      const group = new THREE.Group();
      const silverMat = new THREE.MeshStandardMaterial({
        color: '#D8E0E8',
        metalness: 0.68,
        roughness: 0.28
      });
      const goldAccentMat = new THREE.MeshStandardMaterial({
        color: '#D4AF37',
        metalness: 0.60,
        roughness: 0.30
      });
      const baseFootMat = new THREE.MeshStandardMaterial({
        color: '#64748B',
        roughness: 0.75
      });

      const fenceH = 1.42;
      const postPositions = [];
      const picketPositions = [];
      const loopPositions = [];

      for (let i = 0; i < pointsXZ.length - 1; i++) {
        const [x1, z1] = pointsXZ[i];
        const [x2, z2] = pointsXZ[i + 1];
        const dx = x2 - x1;
        const dz = z2 - z1;
        const segLen = Math.hypot(dx, dz);
        if (segLen < 0.1) continue;

        const angleY = -Math.atan2(dz, dx);
        const ux = dx / segLen;
        const uz = dz / segLen;
        const midX = (x1 + x2) / 2;
        const midZ = (z1 + z2) / 2;

        [1.38, 0.88, 0.20].forEach((ry, rIdx) => {
          const rThick = rIdx === 0 ? 0.065 : 0.048;
          const rail = new THREE.Mesh(new THREE.BoxGeometry(segLen, rThick, rThick), silverMat);
          rail.position.set(midX, ry, midZ);
          rail.rotation.y = angleY;
          rail.castShadow = true;
          group.add(rail);
        });

        const spans = Math.max(1, Math.round(segLen / 2.2));
        const spanLen = segLen / spans;
        const startIdx = (i === 0) ? 0 : 1;
        for (let s = startIdx; s <= spans; s++) {
          postPositions.push({
            x: x1 + ux * (s * spanLen),
            z: z1 + uz * (s * spanLen),
            rotY: angleY
          });
        }

        const step = 0.20;
        const count = Math.floor(segLen / step);
        for (let k = 1; k < count; k++) {
          const dist = k * step;
          const posObj = {
            x: x1 + ux * dist,
            z: z1 + uz * dist,
            rotY: angleY
          };
          picketPositions.push(posObj);
          if (k % 2 === 1) {
            loopPositions.push(posObj);
          }
        }
      }

      if (postPositions.length > 0) {
        const postGeo = new THREE.CylinderGeometry(0.042, 0.045, fenceH + 0.06, 10);
        const postInst = new THREE.InstancedMesh(postGeo, silverMat, postPositions.length);
        const footGeo = new THREE.CylinderGeometry(0.075, 0.085, 0.08, 10);
        const footInst = new THREE.InstancedMesh(footGeo, baseFootMat, postPositions.length);
        const dummy = new THREE.Object3D();

        postPositions.forEach((p, idx) => {
          dummy.position.set(p.x, (fenceH + 0.06) / 2, p.z);
          dummy.rotation.set(0, p.rotY, 0);
          dummy.updateMatrix();
          postInst.setMatrixAt(idx, dummy.matrix);

          dummy.position.set(p.x, 0.04, p.z);
          dummy.updateMatrix();
          footInst.setMatrixAt(idx, dummy.matrix);
        });
        postInst.instanceMatrix.needsUpdate = true;
        footInst.instanceMatrix.needsUpdate = true;
        group.add(postInst, footInst);
      }

      if (picketPositions.length > 0) {
        const picketH = 1.18;
        const picketGeo = new THREE.CylinderGeometry(0.015, 0.015, picketH, 8);
        const picketInst = new THREE.InstancedMesh(picketGeo, silverMat, picketPositions.length);
        const dummy = new THREE.Object3D();

        picketPositions.forEach((p, idx) => {
          dummy.position.set(p.x, 0.20 + picketH / 2, p.z);
          dummy.rotation.set(0, p.rotY, 0);
          dummy.updateMatrix();
          picketInst.setMatrixAt(idx, dummy.matrix);
        });
        picketInst.instanceMatrix.needsUpdate = true;
        group.add(picketInst);
      }

      if (loopPositions.length > 0) {
        const ringGeo = new THREE.TorusGeometry(0.075, 0.014, 8, 16);
        const ringInst = new THREE.InstancedMesh(ringGeo, goldAccentMat, loopPositions.length);
        const dummy = new THREE.Object3D();

        loopPositions.forEach((p, idx) => {
          dummy.position.set(p.x, 0.56, p.z);
          dummy.rotation.set(0, p.rotY, 0);
          dummy.updateMatrix();
          ringInst.setMatrixAt(idx, dummy.matrix);
        });
        ringInst.instanceMatrix.needsUpdate = true;
        group.add(ringInst);
      }

      return group;
    }

    // =========================================================
    // 11. 외곽 벽돌 + 상단 은색 창살 울타리 생성기
    // =========================================================
    function createBrickAndPicketFence(pointsXZ) {
      const fenceGroup = new THREE.Group();

      const fenceBrickTex = createBrickTileTexture(152, 86, 66, '#4A3832');
      fenceBrickTex.repeat.set(2, 1);
      const brickWallMat = new THREE.MeshStandardMaterial({ map: fenceBrickTex, roughness: 0.84 });
      const pillarBrickMat = new THREE.MeshStandardMaterial({ map: createBrickTileTexture(146, 80, 62, '#4A3832'), roughness: 0.84 });
      const capMat = new THREE.MeshStandardMaterial({ color: '#788492', roughness: 0.72 });
      const silverMetalMat = new THREE.MeshStandardMaterial({ color: '#CBD5E1', metalness: 0.75, roughness: 0.28 });

      const wallH = 1.15;
      const wallThick = 0.34;
      const pillarH = 2.38;
      const pillarSize = 0.58;
      const fenceTopY = 2.26;
      const picketPositions = [];

      for (let i = 0; i < pointsXZ.length - 1; i++) {
        const [x1, z1] = pointsXZ[i];
        const [x2, z2] = pointsXZ[i + 1];
        const dx = x2 - x1;
        const dz = z2 - z1;
        const segLen = Math.hypot(dx, dz);
        if (segLen < 0.2) continue;

        const angleY = -Math.atan2(dz, dx);
        const ux = dx / segLen;
        const uz = dz / segLen;
        const spans = Math.max(1, Math.round(segLen / 3.4));
        const spanLen = segLen / spans;

        const midX = (x1 + x2) / 2;
        const midZ = (z1 + z2) / 2;

        const lowWall = new THREE.Mesh(new THREE.BoxGeometry(segLen, wallH, wallThick), brickWallMat);
        lowWall.position.set(midX, wallH / 2, midZ);
        lowWall.rotation.y = angleY;
        lowWall.castShadow = true;
        lowWall.receiveShadow = true;
        fenceGroup.add(lowWall);

        const wallCap = new THREE.Mesh(new THREE.BoxGeometry(segLen, 0.08, wallThick + 0.08), capMat);
        wallCap.position.set(midX, wallH + 0.04, midZ);
        wallCap.rotation.y = angleY;
        fenceGroup.add(wallCap);

        [1.42, 2.04].forEach(railY => {
          const rail = new THREE.Mesh(new THREE.BoxGeometry(segLen, 0.06, 0.06), silverMetalMat);
          rail.position.set(midX, railY, midZ);
          rail.rotation.y = angleY;
          fenceGroup.add(rail);
        });

        const startPillarIdx = (i === 0) ? 0 : 1;
        for (let s = startPillarIdx; s <= spans; s++) {
          const px = x1 + ux * (s * spanLen);
          const pz = z1 + uz * (s * spanLen);

          const pillar = new THREE.Mesh(new THREE.BoxGeometry(pillarSize, pillarH, pillarSize), pillarBrickMat);
          pillar.position.set(px, pillarH / 2, pz);
          pillar.rotation.y = angleY;
          pillar.castShadow = true;
          pillar.receiveShadow = true;
          fenceGroup.add(pillar);

          const pCap = new THREE.Mesh(new THREE.BoxGeometry(pillarSize + 0.10, 0.12, pillarSize + 0.10), capMat);
          pCap.position.set(px, pillarH + 0.06, pz);
          pCap.rotation.y = angleY;
          fenceGroup.add(pCap);
        }

        const picketStep = 0.22;
        const count = Math.floor(segLen / picketStep);
        for (let k = 1; k < count; k++) {
          const dist = k * picketStep;
          const rem = dist % spanLen;
          if (rem < 0.34 || spanLen - rem < 0.34) continue;
          picketPositions.push({
            x: x1 + ux * dist,
            z: z1 + uz * dist,
            rotY: angleY
          });
        }
      }

      if (picketPositions.length > 0) {
        const picketH = fenceTopY - wallH;
        const picketGeo = new THREE.BoxGeometry(0.032, picketH, 0.032);
        const instMesh = new THREE.InstancedMesh(picketGeo, silverMetalMat, picketPositions.length);
        const dummy = new THREE.Object3D();
        picketPositions.forEach((p, idx) => {
          dummy.position.set(p.x, wallH + picketH / 2, p.z);
          dummy.rotation.set(0, p.rotY, 0);
          dummy.updateMatrix();
          instMesh.setMatrixAt(idx, dummy.matrix);
        });
        instMesh.instanceMatrix.needsUpdate = true;
        fenceGroup.add(instMesh);
      }

      return fenceGroup;
    }

    // =========================================================

        map: makeTex(plaqueCanvas),

      });

      const pillarW = 1.65;
      const pillarH = 3.55;
      const pillarD = 1.85;

      [
        { pos: leftPosXZ, isRight: false },
        { pos: rightPosXZ, isRight: true }

        const [px, pz] = pos;
        const pGroup = new THREE.Group();
        pGroup.position.set(px, 0, pz);

        const body = new THREE.Mesh(new THREE.BoxGeometry(pillarW, pillarH, pillarD), stoneMat);
        body.position.y = pillarH / 2;

        const plinth = new THREE.Mesh(new THREE.BoxGeometry(pillarW + 0.16, 0.28, pillarD + 0.16), stoneCapMat);
        plinth.position.y = 0.14;
        pGroup.add(plinth);

        const cap1 = new THREE.Mesh(new THREE.BoxGeometry(pillarW + 0.20, 0.18, pillarD + 0.20), stoneMat);
        cap1.position.y = pillarH + 0.09;
        pGroup.add(cap1);

        const cap2 = new THREE.Mesh(new THREE.BoxGeometry(pillarW + 0.32, 0.16, pillarD + 0.32), stoneCapMat);
        cap2.position.y = pillarH + 0.26;
        pGroup.add(cap2);

        if (isRight) {
          const plaque = new THREE.Mesh(new THREE.BoxGeometry(0.46, 1.95, 0.06), plaqueMat);
          plaque.position.set(0, 1.85, pillarD / 2 + 0.03);
          pGroup.add(plaque);
        }

        const leafW = 3.1;
        const leafH = 2.15;
        const leafGroup = new THREE.Group();
        const dir = isRight ? -1 : 1;
        leafGroup.position.set(dir * (pillarW / 2 + 0.05), 0, -pillarD / 2);

        const topBar = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.10, leafW), whiteIronMat);
        topBar.position.set(0, leafH, -leafW / 2);
        const botBar = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.12, leafW), whiteIronMat);
        botBar.position.set(0, 0.18, -leafW / 2);
        leafGroup.add(topBar, botBar);

        for (let b = 0; b <= 10; b++) {
          const bz = -(leafW * b) / 10;
          const bar = new THREE.Mesh(new THREE.BoxGeometry(0.05, leafH - 0.18, 0.05), whiteIronMat);
          bar.position.set(0, 0.18 + (leafH - 0.18) / 2, bz);
          leafGroup.add(bar);

          if (b % 2 === 1) {
            const ring = new THREE.Mesh(new THREE.TorusGeometry(0.14, 0.025, 8, 16), goldTrimMat);
            ring.rotation.y = Math.PI / 2;
            ring.position.set(0, 0.62, bz);
            leafGroup.add(ring);
          }
        }

        pGroup.add(leafGroup);
        gateGroup.add(pGroup);
      });

      return gateGroup;
    }

    function createCampusTrees(treeSpecs) {
      const treesGroup = new THREE.Group();
      const trunkMat = new THREE.MeshStandardMaterial({ color: '#5E422E', roughness: 0.92 });
      const soilMat  = new THREE.MeshStandardMaterial({ color: '#574636', roughness: 0.95 });

        new THREE.MeshStandardMaterial({ color: '#377A47', roughness: 0.84 }),

        new THREE.MeshStandardMaterial({ color: '#559958', roughness: 0.82 })
      ];

      const leafGeo = new THREE.IcosahedronGeometry(1.0, 2);

      treeSpecs.forEach(([tx, tz, scale], idx) => {
        const tree = new THREE.Group();
        tree.position.set(tx, 0, tz);

        const ring = new THREE.Mesh(new THREE.CylinderGeometry(0.72 * scale, 0.78 * scale, 0.14, 12), curbMat);
        ring.position.y = 0.07;
        ring.receiveShadow = true;

        const soil = new THREE.Mesh(new THREE.CylinderGeometry(0.62 * scale, 0.62 * scale, 0.15, 12), soilMat);
        soil.position.y = 0.075;
        tree.add(soil);

        const trunkH = 2.6 * scale;
        const trunk = new THREE.Mesh(
          new THREE.CylinderGeometry(0.14 * scale, 0.25 * scale, trunkH, 9),
          trunkMat
        );
        trunk.position.y = trunkH / 2;
        trunk.castShadow = true;
        trunk.receiveShadow = true;
        tree.add(trunk);

        const clusters = [
          [ 0.00, trunkH + 1.35 * scale,  0.00, 1.55, 0],
          [ 0.85, trunkH + 0.95 * scale,  0.50, 1.15, 1],
          [-0.82, trunkH + 1.05 * scale, -0.45, 1.18, 2],
          [ 0.35, trunkH + 1.85 * scale, -0.55, 1.05, 3],
          [-0.45, trunkH + 0.82 * scale,  0.72, 1.08, 1]
        ];
        clusters.forEach(([ox, oy, oz, r, mOff]) => {
          const crown = new THREE.Mesh(leafGeo, leafMats[(idx + mOff) % leafMats.length]);
          crown.scale.set(r * scale, r * 0.84 * scale, r * scale);

          crown.rotation.set(idx * 0.7, mOff * 1.1, 0);

    // 14. 곡선형 육상트랙 + 레인 라인 텍스처 생성기

    function createRoundedTrackTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 1474;
      const ctx = canvas.getContext('2d');

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      function roundedRectPath(x, y, w, h, r) {
        const rad = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + rad, y);
        ctx.lineTo(x + w - rad, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + rad);
        ctx.lineTo(x + w, y + h - rad);
        ctx.quadraticCurveTo(x + w, y + h, x + w - rad, y + h);
        ctx.lineTo(x + rad, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - rad);
        ctx.lineTo(x, y + rad);
        ctx.quadraticCurveTo(x, y, x + rad, y);
        ctx.closePath();
      }

      const margin = 12;
      const outerW = canvas.width - margin * 2;
      const outerH = canvas.height - margin * 2;
      const outerR = 235;

      roundedRectPath(margin, margin, outerW, outerH, outerR);
      ctx.fillStyle = '#A84A3E';
      ctx.fill();

      ctx.save();
      ctx.clip();
      for (let i = 0; i < 16000; i++) {
        const gx = (i * 97) % 1024;
        const gy = (i * 151) % 1474;
        ctx.fillStyle = (i % 2 === 0) ? 'rgba(255,220,200,0.06)' : 'rgba(60,15,10,0.08)';
        ctx.fillRect(gx, gy, 3, 3);
      }
      ctx.restore();

      ctx.lineWidth = 10;
      ctx.strokeStyle = '#E2E8F0';
      ctx.stroke();

      const lanes = 5;
      const trackBandW = 72;
      for (let l = 1; l <= lanes; l++) {
        const inset = margin + (trackBandW * l) / lanes;
        const w = canvas.width - inset * 2;
        const h = canvas.height - inset * 2;
        const r = Math.max(40, outerR - (inset - margin));
        roundedRectPath(inset, inset, w, h, r);
        ctx.lineWidth = (l === lanes) ? 5.5 : 3.2;
        ctx.strokeStyle = '#F8FAFC';
        ctx.stroke();
      }

      const innerInset = margin + trackBandW;
      ctx.strokeStyle = '#F8FAFC';
      ctx.lineWidth = 4.5;
      [canvas.height * 0.36, canvas.height * 0.50, canvas.height * 0.64].forEach(ly => {
        ctx.beginPath();
        ctx.moveTo(margin, ly);
        ctx.lineTo(innerInset, ly);
        ctx.moveTo(canvas.width - innerInset, ly);
        ctx.lineTo(canvas.width - margin, ly);
        ctx.stroke();
      });

      return makeTex(canvas);
    }

    // =========================================================
    // 15. 실물 축구골대 + 국기(태극기/교육청기/교기) + 배움터지킴이실
    // =========================================================
    function createSoccerGoal(goalWidth = 6.8, goalHeight = 2.25, goalDepth = 2.1) {
      const goalGroup = new THREE.Group();
      const postMat = new THREE.MeshStandardMaterial({
        color: '#F8FAFC',
        roughness: 0.32,
        metalness: 0.25
      });

      const netCanvas = document.createElement('canvas');
      netCanvas.width = 256;
      netCanvas.height = 256;
      const nctx = netCanvas.getContext('2d');
      nctx.clearRect(0, 0, 256, 256);
      nctx.strokeStyle = 'rgba(248, 250, 252, 0.92)';
      nctx.lineWidth = 3;
      const step = 16;
      for (let i = 0; i <= 256; i += step) {
        nctx.beginPath(); nctx.moveTo(i, 0); nctx.lineTo(i, 256); nctx.stroke();
        nctx.beginPath(); nctx.moveTo(0, i); nctx.lineTo(256, i); nctx.stroke();
      }
      const netTex = makeTex(netCanvas);
      netTex.wrapS = THREE.RepeatWrapping;
      netTex.wrapT = THREE.RepeatWrapping;
      netTex.repeat.set(6, 2);

      const netMat = new THREE.MeshStandardMaterial({
        map: netTex,
        alphaTest: 0.25,
        side: THREE.DoubleSide,
        roughness: 0.85
      });

      const rMain = 0.085;
      const rBack = 0.055;
      const topDepth = goalDepth * 0.48;

      [-goalWidth / 2, goalWidth / 2].forEach(px => {
        const post = new THREE.Mesh(new THREE.CylinderGeometry(rMain, rMain, goalHeight, 14), postMat);
        post.position.set(px, goalHeight / 2, 0);
        post.castShadow = true;
        goalGroup.add(post);

        const topRun = new THREE.Mesh(new THREE.CylinderGeometry(rBack, rBack, topDepth, 10), postMat);
        topRun.rotation.x = Math.PI / 2;
        topRun.position.set(px, goalHeight, -topDepth / 2);
        goalGroup.add(topRun);

        const botRun = new THREE.Mesh(new THREE.CylinderGeometry(rBack, rBack, goalDepth, 10), postMat);
        botRun.rotation.x = Math.PI / 2;
        botRun.position.set(px, rBack, -goalDepth / 2);
        goalGroup.add(botRun);

        const dy = goalHeight - rBack;
        const dz = goalDepth - topDepth;
        const slopeLen = Math.hypot(dy, dz);
        const slopeBar = new THREE.Mesh(new THREE.CylinderGeometry(rBack, rBack, slopeLen, 10), postMat);
        slopeBar.position.set(px, (goalHeight + rBack) / 2, -(topDepth + goalDepth) / 2);
        slopeBar.rotation.x = Math.atan2(dz, dy);
        goalGroup.add(slopeBar);
      });

      const crossbar = new THREE.Mesh(new THREE.CylinderGeometry(rMain, rMain, goalWidth + rMain * 2, 14), postMat);
      crossbar.rotation.z = Math.PI / 2;
      crossbar.position.set(0, goalHeight, 0);
      crossbar.castShadow = true;
      goalGroup.add(crossbar);

      const backTopBar = new THREE.Mesh(new THREE.CylinderGeometry(rBack, rBack, goalWidth, 10), postMat);
      backTopBar.rotation.z = Math.PI / 2;
      backTopBar.position.set(0, goalHeight, -topDepth);
      goalGroup.add(backTopBar);

      const backBotBar = new THREE.Mesh(new THREE.CylinderGeometry(rBack, rBack, goalWidth, 10), postMat);
      backBotBar.rotation.z = Math.PI / 2;
      backBotBar.position.set(0, rBack, -goalDepth);
      goalGroup.add(backBotBar);

      const topNet = new THREE.Mesh(new THREE.PlaneGeometry(goalWidth, topDepth), netMat);
      topNet.rotation.x = Math.PI / 2;
      topNet.position.set(0, goalHeight - 0.01, -topDepth / 2);
      goalGroup.add(topNet);

      const backSlopeLen = Math.hypot(goalHeight, goalDepth - topDepth);
      const backNet = new THREE.Mesh(new THREE.PlaneGeometry(goalWidth, backSlopeLen), netMat);
      backNet.position.set(0, goalHeight / 2, -(topDepth + goalDepth) / 2);
      backNet.rotation.x = Math.atan2(goalDepth - topDepth, goalHeight);
      goalGroup.add(backNet);

      const sideNetMat = netMat.clone();
      sideNetMat.map = netTex.clone();
      sideNetMat.map.repeat.set(2, 2);
      sideNetMat.map.needsUpdate = true;

      [-goalWidth / 2, goalWidth / 2].forEach(sx => {
        const sGeo = new THREE.BufferGeometry();
        const verts = new Float32Array([
          sx, 0, 0,
          sx, goalHeight, 0,
          sx, goalHeight, -topDepth,
          sx, 0, -goalDepth
        ]);
        const uvs = new Float32Array([
          0, 0,
          0, 1,
          0.5, 1,
          1, 0
        ]);
        sGeo.setAttribute('position', new THREE.BufferAttribute(verts, 3));
        sGeo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
        sGeo.setIndex([0, 1, 2, 0, 2, 3]);
        sGeo.computeVertexNormals();
        goalGroup.add(new THREE.Mesh(sGeo, sideNetMat));
      });

      return goalGroup;
    }

    function createWavingFlagMesh(texture, width = 1.65, height = 1.1) {
      const geo = new THREE.PlaneGeometry(width, height, 14, 6);
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const t = (x + width / 2) / width;
        pos.setZ(i, Math.sin(t * Math.PI * 2.2) * 0.10 * t);
      }
      geo.computeVertexNormals();
      const mesh = new THREE.Mesh(
        geo,
        new THREE.MeshStandardMaterial({ map: texture, side: THREE.DoubleSide, roughness: 0.72 })
      );
      mesh.castShadow = true;
      return mesh;
    }

    function createTaegeukgiTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 300;
      canvas.height = 200;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, 300, 200);

      const cx = 150, cy = 100, R = 48;
      const ang = Math.atan2(2, 3);
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(ang);

      ctx.beginPath();
      ctx.arc(0, 0, R, Math.PI, 0);
      ctx.fillStyle = '#CD2E3A';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(0, 0, R, 0, Math.PI);
      ctx.fillStyle = '#0047A0';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(-R / 2, 0, R / 2, 0, Math.PI * 2);
      ctx.fillStyle = '#CD2E3A';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(R / 2, 0, R / 2, 0, Math.PI * 2);
      ctx.fillStyle = '#0047A0';
      ctx.fill();
      ctx.restore();

      function drawTrigram(angleRad, bars) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(angleRad);
        ctx.fillStyle = '#111827';
        bars.forEach((broken, idx) => {
          const y = -(R + 22 + idx * 11);
          if (!broken) {
            ctx.fillRect(-22, y, 44, 6);
          } else {
            ctx.fillRect(-22, y, 19, 6);
            ctx.fillRect(3, y, 19, 6);
          }
        });
        ctx.restore();
      }
      drawTrigram(-Math.PI / 2 + ang, [false, false, false]);
      drawTrigram(Math.PI / 2 - ang,  [true, false, true]);
      drawTrigram(-Math.PI / 2 - ang, [false, true, false]);
      drawTrigram(Math.PI / 2 + ang,  [true, true, true]);

      return makeTex(canvas);
    }

    // ---------------------------------------------------------

      function traceLane(R, topExtendZ = 0, arcSteps = N_ARC) {
        const u = (R_GR - R) / (R_GR - R_IN); // 0(좌측 담장) ~ 1(우측 울타리)
        const pts = [];
        const gx = 51.8 + (63.5 - 51.8) * u;

        pts.push([gx, 48.0]);

          pts.push([Cx + R * Math.cos(a), Cz + R * Math.sin(a)]);
        }
        const [ex0, ez0] = pts[pts.length - 1];
        pts.push([ex0 + leadLen * etx, ez0 + leadLen * etz]);
        return pts;

          const dx = x2 - x1, dz = z2 - z1, segL = Math.hypot(dx, dz);
          if (segL < 1e-4) continue;
          const rotY = -Math.atan2(dz, dx);
          while (carry <= segL) {
            const t = carry / segL;
            placements.push({ x: x1 + dx * t, z: z1 + dz * t, rotY });
            carry += spacing;
          }
          carry -= segL;
        }
        // 마지막 합류부 끝 0.8m는 여백을 남김

      // 5) 우측 흰색 화강석 3D 계단 보행로 (하부 슬래브 + 양측 화강석 연석 + 99개 입체 계단 디딤판)
      (function addWhite3DStairway() {
        const stairGroup = new THREE.Group();

        // 화강석 디딤판 텍스처 (밝은 흰·미색 화강석 + 앞단 논슬립 홈)

        stairGroup.add(createGroundPolygon(makeStripPoly(R_IN + 0.24, R_IN + 0.02), 0.18, -0.04, curbMat));

        const stepW = (R_ST - R_IN) - 0.42; // 2.88m (연석 안쪽에 밀착)
        const stepH = 0.36;
        const stepTopY = 0.115;

        const straightStepGeo = new THREE.BoxGeometry(stepW, stepH, 0.56);

        const rectPlacements = [];
        const dummy = new THREE.Object3D();

        // 직선부: 교문(61.85, 48.0) -> 곡선 시작(56.96, 79.80)
        const stMidStart = [61.85, 48.0];
        const stMidEnd = [Cx + ((R_ST + R_IN) / 2) * Math.cos(aStart), Cz + ((R_ST + R_IN) / 2) * Math.sin(aStart)];
        const stDx = stMidEnd[0] - stMidStart[0], stDz = stMidEnd[1] - stMidStart[1];
        const stLen = Math.hypot(stDx, stDz);
        const stCount = Math.round(stLen / 0.50);
        // BoxGeometry의 +Z가 진행방향(내리막)을 향하도록 Y회전
        const stYaw = Math.atan2(stDx, stDz);
        for (let i = 0; i < stCount; i++) {
          const t = (i + 0.5) / stCount;
          rectPlacements.push({ x: stMidStart[0] + stDx * t, z: stMidStart[1] + stDz * t, yaw: stYaw });
        }

        // 합류부 직선: 곡선 끝 -> 보도 가장자리
        const Rmid = (R_ST + R_IN) / 2;
        const exStart = [Cx + Rmid * Math.cos(aEnd), Cz + Rmid * Math.sin(aEnd)];
        const exCount = Math.round(leadLen / 0.50);
        const exYaw = Math.atan2(etx, etz);
        for (let i = 0; i < exCount; i++) {
          const dist = ((i + 0.5) / exCount) * leadLen;
          rectPlacements.push({ x: exStart[0] + etx * dist, z: exStart[1] + etz * dist, yaw: exYaw });
        }

        const rectInst = new THREE.InstancedMesh(straightStepGeo, straightStepMats, rectPlacements.length);
        rectInst.castShadow = true;
        rectInst.receiveShadow = true;
        rectPlacements.forEach((p, idx) => {
          dummy.position.set(p.x, stepCenterY, p.z);
          dummy.rotation.set(0, p.yaw, 0);
          dummy.updateMatrix();
          rectInst.setMatrixAt(idx, dummy.matrix);
        });
        rectInst.instanceMatrix.needsUpdate = true;
        stairGroup.add(rectInst);

        // 둥근 곡선부 부채꼴(사다리꼴) 3D 계단 (InstancedMesh)
        const arcCount = 22;
        const dAng = Math.abs(aEnd - aStart) / arcCount;
        const rInner = R_IN + 0.21, rOuter = R_ST - 0.21;
        const halfIn = Math.max(0.22, rInner * dAng * 0.62);
        const halfOut = Math.max(0.32, rOuter * dAng * 0.60);
        const halfW = (rOuter - rInner) / 2;
        const trapShape = new THREE.Shape();
        // X = 반경방향(-halfW=안쪽, +halfW=바깥쪽), Y -> rotateX(PI/2) 후 Z = 접선방향(+Z가 내리막 앞단)
        trapShape.moveTo(-halfW, -halfIn);
        trapShape.lineTo( halfW, -halfOut);
        trapShape.lineTo( halfW,  halfOut);
        trapShape.lineTo(-halfW,  halfIn);
        trapShape.closePath();
        const trapGeo = new THREE.ExtrudeGeometry(trapShape, { depth: stepH, bevelEnabled: false });
        trapGeo.rotateX(Math.PI / 2); // 상면 y=0, 하면 y=-stepH
        trapGeo.translate(0, stepH / 2, 0); // 중심 y=0
        // 상면 UV를 [0,1]x[0,1]로 정규화 (앞단 논슬립 줄이 내리막 방향(+Z)에 정렬되도록)

          const lx = tPos.getX(i), lz = tPos.getZ(i);
          const u = (lx + halfW) / (2 * halfW);
          const spanZ = halfIn + (halfOut - halfIn) * Math.max(0, Math.min(1, u));
          // aStart(190deg)->aEnd(98deg)로 각도 감소 -> 내리막 접선은 -Z 방향!
          const v = (spanZ - lz) / (2 * spanZ);
          tUv.setXY(i, u, Math.max(0, Math.min(1, 1 - v)));

        const arcInst = new THREE.InstancedMesh(trapGeo, [stepTopMat, stepSideMat], arcCount);
        arcInst.castShadow = true;
        arcInst.receiveShadow = true;
        for (let i = 0; i < arcCount; i++) {

          const px = Cx + Rmid * Math.cos(a);
          const pz = Cz + Rmid * Math.sin(a);

          dummy.position.set(px, stepCenterY, pz);
          dummy.rotation.set(0, -a, 0);
          dummy.updateMatrix();
          arcInst.setMatrixAt(i, dummy.matrix);

    // ---------------------------------------------------------
    const parkingPoly = [

    });

    const lineMat    = new THREE.MeshStandardMaterial({ color: '#F1F5F9', roughness: 0.65 });
    const curbMat    = new THREE.MeshStandardMaterial({ color: '#CBD5E1', roughness: 0.78 });
    const stopperMat = new THREE.MeshStandardMaterial({ color: '#E2E8F0', roughness: 0.72 });

    for (let i = 0; i < parkingPoly.length; i++) {
      const [x1, z1] = parkingPoly[i];
      const [x2, z2] = parkingPoly[(i + 1) % parkingPoly.length];
      const dx = x2 - x1;
