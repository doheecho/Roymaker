<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>금호파크힐스 116동 3D 모델링 (8층 단독 남북 2세대 · 1~3F 검은 석재 / 4~8F 회색 테마)</title>
  <style>
    body { margin: 0; overflow: hidden; background: #2c2f33; }
    #info {
      position: absolute; top: 14px; left: 16px; color: #fff;
      font-family: 'Malgun Gothic', sans-serif; font-size: 13px;
      background: rgba(20, 22, 25, 0.86); padding: 10px 14px;
      border-radius: 8px; border: 1px solid rgba(255,255,255,0.18);
      pointer-events: none; line-height: 1.55;
    }
    #controls-ui {
      position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
      display: flex; flex-wrap: wrap; justify-content: center; gap: 7px;
      background: rgba(20, 22, 25, 0.88); padding: 10px 14px;
      border-radius: 10px; border: 1px solid rgba(255,255,255,0.18);
      max-width: 96vw;
    }
    button {
      background: #3b4048; color: #fff; border: 1px solid #555b65;
      padding: 6px 11px; border-radius: 6px; cursor: pointer; font-size: 12px;
      font-family: 'Malgun Gothic', sans-serif; transition: 0.15s;
    }
    button:hover { background: #6B7280; border-color: #d1d5db; }
    button.highlight-btn { background: #1d4ed8; border-color: #60a5fa; font-weight: bold; }
    button.highlight-btn:hover { background: #2563eb; }
    button.export-btn { background: #0f766e; border-color: #2dd4bf; font-weight: bold; }
    button.export-btn:hover { background: #0d9488; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="info">
    <strong>금호파크힐스 116동 (총 8층 · 1~3F 다크 석재 / 4~8F 회색 테마 · 85.8㎡×2 남북 배치 · 양측 상·하 116)</strong><br/>
    마우스 좌클릭 드래그: 회전 | 우클릭 드래그: 이동 | 휠: 확대·축소 (위: 북 -Z / 아래: 남 +Z / 우: 동 +X / 좌: 서 -X)
  </div>

  <div id="controls-ui">
    <button class="highlight-btn" onclick="setView('top')">스카이뷰 (첨부1)</button>
    <button onclick="setView('west')">서측 정면 (첨부2)</button>
    <button onclick="setView('ne')">북동측·116벽 (첨부3)</button>
    <button onclick="setView('east')">동측 2세대 정면</button>
    <button onclick="setView('se')">남동측·116벽</button>
    <button onclick="setView('ent')">서측 1-2호 출입구</button>
    <button class="export-btn" onclick="exportGLB()">3D 파일 추출 (.glb)</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

    // =========================================================
    // 1. 기본 씬 / 카메라 / 렌더러 / 조명
    // =========================================================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#2E3338');

    const FLOOR_H = 2.65;
    const BASE_FLOORS = 3;                  // 1~3층 다크 화강석 기단부
    const UPPER_FLOORS = 5;                 // 4~8층 회색 테마 상부층 (총 8층)
    const BASE_H = FLOOR_H * BASE_FLOORS;   // 7.95m
    const UPPER_H = FLOOR_H * UPPER_FLOORS; // 13.25m
    const TOTAL_H = BASE_H + UPPER_H;       // 21.20m

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.2, 1000);
    camera.position.set(-38, 14, 2);

    const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 11.5, 0);
    controls.enableDamping = true;
    controls.update();

    // 카메라 프리셋 (첨부 1~3 대조용)
    window.setView = (dir) => {
      if (dir === 'top') {
        // 첨부1 스카이뷰 (북=-Z, 남=+Z, 동=+X, 서=-X)
        controls.target.set(0, 10, 0);
        camera.position.set(0, 62, 0.01);
      } else if (dir === 'west') {
        // 첨부2 서측 정면 (좌: 북, 우: 남)
        controls.target.set(-2, 12.2, 0);
        camera.position.set(-42, 11.5, 0);
      } else if (dir === 'ne') {
        // 첨부3 북동측 (좌: 동측 2세대 입면, 우: 북측 회색 측벽 + 116)
        controls.target.set(2, 13.0, -2);
        camera.position.set(26, 13.5, -28);
      } else if (dir === 'east') {
        // 동측 85.8㎡×2 정면
        controls.target.set(2, 11.0, 0);
        camera.position.set(40, 11.0, 0);
      } else if (dir === 'se') {
        // 남동측 (남측 회색 측벽 + 상·하 116 + 동측 입면)
        controls.target.set(2, 12.0, 2);
        camera.position.set(26, 13.0, 28);
      } else if (dir === 'ent') {
        // 서측 1-2호 주출입구 문주 근접
        controls.target.set(-7.5, 3.2, -0.5);
        camera.position.set(-21.5, 4.8, -4.5);
      }
      controls.update();
    };

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.90);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xfffaf0, 1.15);
    sunLight.position.set(45, 95, -35);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(2048, 2048);
    sunLight.shadow.camera.near = 10;
    sunLight.shadow.camera.far = 200;
    sunLight.shadow.camera.left = -40;
    sunLight.shadow.camera.right = 40;
    sunLight.shadow.camera.top = 40;
    sunLight.shadow.camera.bottom = -40;
    sunLight.shadow.bias = -0.0005;
    scene.add(sunLight);

    const fillLight = new THREE.DirectionalLight(0xd8e6f5, 0.58);
    fillLight.position.set(-45, 40, 45);
    scene.add(fillLight);

    const gridHelper = new THREE.GridHelper(90, 30, 0x555b63, 0x3d4248);
    scene.add(gridHelper);

    // =========================================================
    // 2. 공통 색상 팔레트 (116동 1~3F 검은 석재 · 4~8F 회색 테마)
    // =========================================================
    const COLORS = {
      sideGray: '#9FA5AC',        // 북·남측 회색 측벽 (첨부3 북동)
      coreWideGray: '#B8BDC3',    // 서측 중앙 코어 넓은 가로줄 회색 벽 (첨부2 서)
      recessCenterGray: '#7E858E',// 동측 중앙 후퇴부 회색 벽 (첨부3 북동)
      cornerBandGray: '#7B828A',  // 동측 모서리 회색 띠
      darkSlotGray: '#5E646C',    // 서측 1/4창 후퇴 슬롯 진회색 벽 (첨부2 서)
      whiteWall: '#EFECE6',
      lightGray: '#C8CCD1',
      darkStone: '#2B2F35',
      roofDeck: '#CBC2B0'
    };

    // =========================================================
    // 3. 정밀 텍스처 생성기
    // =========================================================

    function drawDoublePaneWindow(ctx, x, y, w, h, hasRailing, isDarkBase = false) {
      const grad = ctx.createLinearGradient(x, y, x, y + h);
      grad.addColorStop(0, '#1D2934');
      grad.addColorStop(0.55, '#2A3B4A');
      grad.addColorStop(1, '#161F27');
      ctx.fillStyle = grad;
      ctx.fillRect(x, y, w, h);

      ctx.strokeStyle = isDarkBase ? '#9EA5AE' : '#DCDAD4';
      ctx.lineWidth = 2.4;
      ctx.strokeRect(x, y, w, h);
      ctx.beginPath();
      ctx.moveTo(x + w * 0.5, y);
      ctx.lineTo(x + w * 0.5, y + h);
      ctx.stroke();

      if (hasRailing) {
        const railY = y + h * 0.58;
        ctx.fillStyle = '#15181C';
        ctx.fillRect(x - 1, railY, w + 2, 2.5);
        const step = Math.max(5, w / 9);
        for (let rx = x + 2; rx < x + w - 1; rx += step) {
          ctx.fillRect(rx, railY, 1.4, y + h - railY);
        }
      }
    }

    function drawColumnElement(ctx, type, curX, fy, colW, floorPx, { isDarkBase = false } = {}) {
      if (type === 'living') {
        const padX = colW * 0.08;
        drawDoublePaneWindow(ctx, curX + padX, fy + floorPx * 0.14, colW - padX * 2, floorPx * 0.74, true, isDarkBase);
      } else if (type === 'small_full') {
        const padX = colW * 0.14;
        drawDoublePaneWindow(ctx, curX + padX, fy + floorPx * 0.15, colW - padX * 2, floorPx * 0.72, true, isDarkBase);
      } else if (type === 'small_half') {
        const padX = colW * 0.15;
        drawDoublePaneWindow(ctx, curX + padX, fy + floorPx * 0.16, colW - padX * 2, floorPx * 0.44, false, isDarkBase);
      } else if (type === 'quarter') {
        const padX = colW * 0.20;
        drawDoublePaneWindow(ctx, curX + padX, fy + floorPx * 0.24, colW - padX * 2, floorPx * 0.24, false, isDarkBase);
      } else if (type === 'ac') {
        const padX = colW * 0.14;
        const wx = curX + padX;
        const ww = colW - padX * 2;
        const wy = fy + floorPx * 0.12;
        const wh = floorPx * 0.76;
        ctx.fillStyle = '#202429';
        ctx.fillRect(wx, wy, ww, wh);
        ctx.strokeStyle = isDarkBase ? '#7C848E' : '#C8CCD2';
        ctx.lineWidth = 2;
        ctx.strokeRect(wx, wy, ww, wh);
        ctx.fillStyle = '#596068';
        for (let ly = wy + 4; ly < wy + wh - 3; ly += 4.5) {
          ctx.fillRect(wx + 2, ly, ww - 4, 2);
        }
      } else if (type === 'curtain_tall') {
        // 첨부2 서측 중앙 코어 1열 수직 통창 (두꺼운 화이트 좌·우 프레임 + 층간 화이트 띠 + 짙은 유리)
        const padX = colW * 0.15;
        const wx = curX + padX;
        const ww = colW - padX * 2;
        const bandH = floorPx * 0.18;
        ctx.fillStyle = isDarkBase ? '#2B2F35' : COLORS.whiteWall;
        ctx.fillRect(wx, fy, ww, bandH);
        const gy = fy + bandH;
        const gh = floorPx - bandH;
        const grad = ctx.createLinearGradient(wx, gy, wx, gy + gh);
        grad.addColorStop(0, '#1B232B');
        grad.addColorStop(0.55, '#273340');
        grad.addColorStop(1, '#141B22');
        ctx.fillStyle = grad;
        ctx.fillRect(wx, gy, ww, gh);
        ctx.strokeStyle = isDarkBase ? '#6B7280' : '#B5BCC4';
        ctx.lineWidth = 2.0;
        ctx.strokeRect(wx, gy, ww, gh);
        ctx.fillStyle = '#3B4450';
        ctx.fillRect(wx, gy + gh * 0.56, ww, 2.5);
      }
    }

    // (1) 1~3층 검은 다크 화강석 기단부 (층간 두꺼운 회색 띠 + 층당 얇은 줄눈 4줄 + 창호)
    function createStoneBaseTexture(widthMeters = 10, columns = null, {
      leftBorderW = 0,
      rightBorderW = 0,
      widthPx = null
    } = {}) {
      const pxPerMeter = 42;
      const cw = widthPx || Math.max(160, Math.round(widthMeters * pxPerMeter));
      const floorPx = 128;
      const ch = BASE_FLOORS * floorPx;
      const canvas = document.createElement('canvas');
      canvas.width = cw;
      canvas.height = ch;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#2B2F35';
      ctx.fillRect(0, 0, cw, ch);

      const colW = 54;
      const subRowH = floorPx / 5;

      for (let f = 0; f < BASE_FLOORS; f++) {
        const fy = f * floorPx;
        for (let r = 0; r < 5; r++) {
          const ry = fy + r * subRowH;
          for (let x = 0; x < cw; x += colW) {
            const shade = ((f * 7 + r * 3 + Math.floor(x / colW) * 5) % 5) - 2;
            ctx.fillStyle = `rgb(${43 + shade * 2}, ${47 + shade * 2}, ${53 + shade * 2})`;
            ctx.fillRect(x + 1, ry + 1, colW - 2, subRowH - 2);
          }
        }
      }

      ctx.fillStyle = 'rgba(130, 138, 148, 0.28)';
      for (let x = colW; x < cw; x += colW) ctx.fillRect(x, 0, 1.5, ch);

      for (let f = 0; f < BASE_FLOORS; f++) {
        const fy = f * floorPx;
        ctx.fillStyle = '#A4ABB4';
        ctx.fillRect(0, fy, cw, 5.5);
        ctx.fillStyle = '#181B1F';
        ctx.fillRect(0, fy + 5.5, cw, 1.5);

        for (let r = 1; r <= 4; r++) {
          const ry = fy + r * subRowH;
          ctx.fillStyle = '#606771';
          ctx.fillRect(0, ry, cw, 1.5);
          ctx.fillStyle = '#1A1D21';
          ctx.fillRect(0, ry + 1.5, cw, 1);
        }
      }

      ctx.fillStyle = '#1A1D21';
      ctx.fillRect(0, ch - 4, cw, 4);

      if (columns && columns.length > 0) {
        const leftPx = Math.round(cw * leftBorderW);
        const rightPx = Math.round(cw * rightBorderW);
        const usableW = cw - leftPx - rightPx;
        const totalWeight = columns.reduce((s, c) => s + c.w, 0);

        let curX = leftPx;
        columns.forEach(col => {
          const cW = (col.w / totalWeight) * usableW;
          for (let f = 0; f < BASE_FLOORS; f++) {
            const fy = f * floorPx;
            if (col.type !== 'solid') {
              drawColumnElement(ctx, col.type, curX, fy, cW, floorPx, { isDarkBase: true });
            }
          }
          curX += cW;
        });
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      return tex;
    }

    function makeStoneBaseMat(widthMeters, columns = null, opts = {}) {
      return new THREE.MeshStandardMaterial({
        map: createStoneBaseTexture(widthMeters, columns, opts),
        roughness: 0.70
      });
    }

    // (2) 회색 가로줄 패널 텍스처 (북·남 측벽 및 서측 중앙 코어 회색 벽 공용)
    function createGrayPanelTexture(floors, { baseColor = COLORS.sideGray, showVerticalSeams = false } = {}) {
      const cw = 512;
      const floorPx = 64;
      const ch = Math.max(256, Math.round(floors * floorPx));
      const canvas = document.createElement('canvas');
      canvas.width = cw;
      canvas.height = ch;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = baseColor;
      ctx.fillRect(0, 0, cw, ch);

      const count = Math.ceil(floors);
      const actualFloorPx = ch / floors;
      for (let f = 0; f < count; f++) {
        const fy = f * actualFloorPx;
        ctx.fillStyle = 'rgba(38, 42, 48, 0.34)';
        ctx.fillRect(0, fy, cw, 2.4);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.20)';
        ctx.fillRect(0, fy + 2.4, cw, 1.0);

        for (let r = 1; r <= 4; r++) {
          const ry = fy + (actualFloorPx / 5) * r;
          ctx.fillStyle = 'rgba(46, 50, 56, 0.20)';
          ctx.fillRect(0, ry, cw, 1.4);
        }
      }

      if (showVerticalSeams) {
        ctx.fillStyle = 'rgba(42, 48, 56, 0.18)';
        for (let x = cw * 0.25; x < cw; x += cw * 0.25) ctx.fillRect(x, 0, 1.6, ch);
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      return tex;
    }

    // (3) 범용 다중 컬럼 입면 생성기
    function createFacadeTexture(floors, columns, {
      defaultBg = COLORS.whiteWall,
      leftBorder = null,
      rightBorder = null,
      whiteSlabBands = false,
      widthPx = 512
    } = {}) {
      const cw = widthPx;
      const floorPx = 64;
      const ch = floors * floorPx;
      const canvas = document.createElement('canvas');
      canvas.width = cw;
      canvas.height = ch;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = defaultBg;
      ctx.fillRect(0, 0, cw, ch);

      const leftPx = leftBorder ? Math.round(cw * leftBorder.w) : 0;
      const rightPx = rightBorder ? Math.round(cw * rightBorder.w) : 0;
      const usableW = cw - leftPx - rightPx;
      const totalWeight = columns.reduce((s, c) => s + c.w, 0);

      let curX = leftPx;
      columns.forEach(col => {
        const colW = (col.w / totalWeight) * usableW;
        const baseBg = col.bg || defaultBg;

        for (let f = 0; f < floors; f++) {
          const fy = f * floorPx;
          ctx.fillStyle = baseBg;
          ctx.fillRect(curX, fy, colW + 0.5, floorPx + 0.5);

          if (col.grooved) {
            ctx.fillStyle = 'rgba(38, 42, 48, 0.24)';
            for (let r = 1; r <= 4; r++) {
              ctx.fillRect(curX, fy + (floorPx / 5) * r, colW, 1.4);
            }
          }

          if (col.stripedWhiteBand) {
            ctx.fillStyle = COLORS.whiteWall;
            ctx.fillRect(curX, fy + floorPx * 0.64, colW + 0.5, floorPx * 0.36);
          }

          if (whiteSlabBands) {
            ctx.fillStyle = COLORS.whiteWall;
            ctx.fillRect(curX, fy, colW + 0.5, floorPx * 0.16);
            ctx.fillRect(curX, fy + floorPx * 0.88, colW + 0.5, floorPx * 0.12);
          }

          ctx.fillStyle = 'rgba(30, 34, 40, 0.16)';
          ctx.fillRect(curX, fy, colW, 1.8);

          if (col.type !== 'solid') {
            drawColumnElement(ctx, col.type, curX, fy, colW, floorPx, { isDarkBase: false });
          }
        }
        curX += colW;
      });

      if (leftBorder) {
        ctx.fillStyle = leftBorder.color;
        ctx.fillRect(0, 0, leftPx, ch);
      }
      if (rightBorder) {
        ctx.fillStyle = rightBorder.color;
        ctx.fillRect(cw - rightPx, 0, rightPx, ch);
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      return tex;
    }

    function createPortalHeaderTexture(leftNum, dongNum, rightNum) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 160;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#2B2F35';
      ctx.fillRect(0, 0, 512, 160);

      ctx.fillStyle = '#1E2126';
      ctx.fillRect(58, 0, 396, 44);
      ctx.fillStyle = '#4B525C';
      for (let x = 66; x < 448; x += 9) ctx.fillRect(x, 4, 4, 36);

      ctx.strokeStyle = '#4A5058';
      ctx.lineWidth = 3;
      ctx.strokeRect(62, 54, 388, 86);

      const cy = 116;
      ctx.textAlign = 'center';
      ctx.fillStyle = '#121417';
      ctx.font = 'bold 54px "Malgun Gothic", sans-serif';
      ctx.fillText(dongNum, 258, cy + 2);
      ctx.font = 'bold 36px "Malgun Gothic", sans-serif';
      ctx.fillText(leftNum, 152, cy - 2);
      ctx.fillText(rightNum, 364, cy - 2);

      ctx.fillStyle = '#F1F5F9';
      ctx.font = 'bold 54px "Malgun Gothic", sans-serif';
      ctx.fillText(dongNum, 256, cy);
      ctx.font = 'bold 36px "Malgun Gothic", sans-serif';
      ctx.fillText(leftNum, 150, cy - 4);
      ctx.fillText(rightNum, 362, cy - 4);

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createPortalSideLouverTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 160;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#2B2F35';
      ctx.fillRect(0, 0, 512, 160);
      ctx.fillStyle = '#1B1E22';
      ctx.fillRect(14, 10, 484, 58);
      ctx.fillStyle = '#4E5560';
      for (let x = 22; x < 490; x += 10) ctx.fillRect(x, 14, 4.5, 50);

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // =========================================================
    // 4. 3D 건축 요소 헬퍼 ('116' 사인 · 다크 루버 옥탑 · 옥상 난간 · 문주)
    // =========================================================

    function createDigitOneShape() {
      const s = new THREE.Shape();
      s.moveTo(0.23, 0.0);
      s.lineTo(0.45, 0.0);
      s.lineTo(0.45, 1.0);
      s.lineTo(0.31, 1.0);
      s.lineTo(0.0, 0.88);
      s.lineTo(0.03, 0.72);
      s.lineTo(0.23, 0.79);
      s.closePath();
      return s;
    }

    function createDigitSixShape() {
      const s = new THREE.Shape();
      s.moveTo(0.36, 0.0);
      s.bezierCurveTo(0.56, 0.0, 0.68, 0.13, 0.68, 0.33);
      s.bezierCurveTo(0.68, 0.53, 0.55, 0.65, 0.38, 0.65);
      s.bezierCurveTo(0.29, 0.65, 0.23, 0.61, 0.19, 0.56);
      s.bezierCurveTo(0.20, 0.74, 0.27, 0.84, 0.40, 0.84);
      s.bezierCurveTo(0.47, 0.84, 0.53, 0.81, 0.58, 0.77);
      s.lineTo(0.62, 0.92);
      s.bezierCurveTo(0.55, 0.97, 0.47, 1.00, 0.37, 1.00);
      s.bezierCurveTo(0.14, 1.00, 0.02, 0.81, 0.02, 0.46);
      s.bezierCurveTo(0.02, 0.16, 0.15, 0.0, 0.36, 0.0);
      s.closePath();

      const hole = new THREE.Path();
      hole.absellipse(0.36, 0.32, 0.145, 0.175, 0, Math.PI * 2, true, 0);

    function createProtruding116Sign(scale = 1.0) {
      const group = new THREE.Group();
      const h = 1.32 * scale;
      const depth = 0.13 * scale;

      const frontMat = new THREE.MeshStandardMaterial({ color: '#F5F7FA', roughness: 0.32, metalness: 0.12 });
      const sideMat = new THREE.MeshStandardMaterial({ color: '#7D8590', roughness: 0.55 });

      const extrudeOpts = {
        depth: depth / h,
        bevelEnabled: true,
        bevelThickness: 0.014,
        bevelSize: 0.010,
        bevelSegments: 2,
        curveSegments: 24
      };

      const geo1 = new THREE.ExtrudeGeometry(createDigitOneShape(), extrudeOpts);
      const geo6 = new THREE.ExtrudeGeometry(createDigitSixShape(), extrudeOpts);

      [
        { geo: geo1, x: -0.90 },
        { geo: geo1, x: -0.36 },
        { geo: geo6, x: 0.22 }
      ].forEach(item => {
        const m = new THREE.Mesh(item.geo, [frontMat, sideMat]);
        m.scale.set(h, h, h);
        m.position.set(item.x * h, -0.5 * h, 0);
        m.castShadow = true;
        group.add(m);
      });

      return group;
    }

    function createWhiteRoofRailing(length, height = 1.05) {
      const group = new THREE.Group();
      const railMat = new THREE.MeshStandardMaterial({ color: '#F3F4F6', roughness: 0.5 });

      const topBar = new THREE.Mesh(new THREE.BoxGeometry(length, 0.085, 0.085), railMat);
      topBar.position.y = height;
      group.add(topBar);

      const midBar = new THREE.Mesh(new THREE.BoxGeometry(length, 0.06, 0.06), railMat);
      midBar.position.y = height * 0.52;
      group.add(midBar);

      const posts = Math.max(2, Math.round(length / 1.25));
      for (let i = 0; i <= posts; i++) {
        const px = -length / 2 + (length / posts) * i;
        const post = new THREE.Mesh(new THREE.BoxGeometry(0.07, height, 0.07), railMat);
        post.position.set(px, height / 2, 0);
        group.add(post);
      }
      return group;
    }

    // 서측(-X) 중앙 코어 1열 통창 위 어두운 수평 루버 옥탑 (첨부2 서측 실사진 일치)
    function createWestDarkLouverPenthouse(widthX, heightY, lengthZ) {
      const group = new THREE.Group();
      const frameMat = new THREE.MeshStandardMaterial({ color: '#D4D8DD', roughness: 0.78 });
      const topMat = new THREE.MeshStandardMaterial({ color: '#C6CBD2', roughness: 0.82 });
      const darkBackMat = new THREE.MeshStandardMaterial({ color: '#171B21', roughness: 0.65 });
      const darkSlatMat = new THREE.MeshStandardMaterial({ color: '#2B323D', roughness: 0.45, metalness: 0.35 });
      const darkMullionMat = new THREE.MeshStandardMaterial({ color: '#1F252E', roughness: 0.5, metalness: 0.3 });

      const frameT = 0.22;
      const innerH = heightY - frameT * 2;

      // 본체 박스 (서측 -X 0.34m 후퇴)
      const bodyW = widthX - 0.34;
      const mainBody = new THREE.Mesh(
        new THREE.BoxGeometry(bodyW, heightY, lengthZ),
        [frameMat, darkBackMat, topMat, frameMat, frameMat, frameMat]
      );
      mainBody.position.set(0.17, heightY / 2, 0);
      mainBody.castShadow = true;
      mainBody.receiveShadow = true;
      group.add(mainBody);

      const frontX = -widthX / 2 + 0.17;
      // 상·하·북(-Z) 프레임
      const topF = new THREE.Mesh(new THREE.BoxGeometry(0.34, frameT, lengthZ), [frameMat, frameMat, topMat, frameMat, frameMat, frameMat]);
      topF.position.set(frontX, heightY - frameT / 2, 0);
      group.add(topF);

      const botF = new THREE.Mesh(new THREE.BoxGeometry(0.34, frameT, lengthZ), frameMat);
      botF.position.set(frontX, frameT / 2, 0);
      group.add(botF);

      const northF = new THREE.Mesh(new THREE.BoxGeometry(0.34, innerH, frameT), frameMat);
      northF.position.set(frontX, heightY / 2, -lengthZ / 2 + frameT / 2);
      group.add(northF);

      // 서측(-X) 어두운 수평 루버 살 (남측 +Z 모서리까지 랩어라운드)
      const louverX = -widthX / 2 + 0.06;
      const slatCount = 8;
      const slatSpanZ = lengthZ - frameT;
      const slatCZ = frameT / 2;

      for (let i = 0; i < slatCount; i++) {
        const sy = frameT + (innerH / (slatCount + 0.5)) * (i + 0.75);
        const slat = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.11, slatSpanZ), darkSlatMat);
        slat.position.set(louverX, sy, slatCZ);
        slat.castShadow = true;
        group.add(slat);
      }

      [0, lengthZ / 2 - 0.06].forEach(mz => {
        const mullion = new THREE.Mesh(new THREE.BoxGeometry(0.18, innerH, 0.12), darkMullionMat);
        mullion.position.set(louverX + 0.02, heightY / 2, mz);
        group.add(mullion);
      });

      // 남측(+Z) 모서리 측면 어두운 루버 랩어라운드
      const sideWrapX = 0.85;
      const sideBack = new THREE.Mesh(new THREE.BoxGeometry(sideWrapX, innerH, 0.08), darkBackMat);
      sideBack.position.set(-widthX / 2 + sideWrapX / 2, heightY / 2, lengthZ / 2 + 0.02);
      group.add(sideBack);

      for (let i = 0; i < slatCount; i++) {
        const sy = frameT + (innerH / (slatCount + 0.5)) * (i + 0.75);
        const sideSlat = new THREE.Mesh(new THREE.BoxGeometry(sideWrapX, 0.11, 0.10), darkSlatMat);
        sideSlat.position.set(-widthX / 2 + sideWrapX / 2, sy, lengthZ / 2 + 0.04);
        group.add(sideSlat);
      }

      return group;
    }

    // 서측 주출입구 문주 ('1 116 2' + 금색 멀리언 + 은색 투명유리 자동문)
    function createEntrancePortal({ leftNum = '1', dongNum = '116', rightNum = '2', width = 5.2, depth = 3.8, height = 5.35 } = {}) {
      const group = new THREE.Group();
      const stoneMat = new THREE.MeshStandardMaterial({ color: '#2B2F35', roughness: 0.68 });
      const stoneDarkMat = new THREE.MeshStandardMaterial({ color: '#202429', roughness: 0.75 });
      const headerFrontMat = new THREE.MeshStandardMaterial({ map: createPortalHeaderTexture(leftNum, dongNum, rightNum), roughness: 0.65 });
      const louverSideMat = new THREE.MeshStandardMaterial({ map: createPortalSideLouverTexture(), roughness: 0.70 });

      const goldFrameMat = new THREE.MeshStandardMaterial({ color: '#A68E5C', roughness: 0.35, metalness: 0.62 });
      const silverFrameMat = new THREE.MeshStandardMaterial({ color: '#E2E8F0', roughness: 0.22, metalness: 0.85 });
      const tintedGlassMat = new THREE.MeshStandardMaterial({
        color: '#192228',
        roughness: 0.12,
        metalness: 0.30,
        transparent: true,
        opacity: 0.48,
        depthWrite: false
      });
      const clearDoorGlassMat = new THREE.MeshStandardMaterial({
        color: '#D8ECF8',
        roughness: 0.06,
        metalness: 0.15,
        transparent: true,
        opacity: 0.18,
        depthWrite: false
      });

      const pillarW = 0.84;
      const pillarD = 0.96;
      const headerH = 1.50;
      const clearH = height - headerH;

      [-1, 1].forEach(side => {
        const pillar = new THREE.Mesh(new THREE.BoxGeometry(pillarW, clearH, pillarD), stoneMat);
        pillar.position.set(side * (width / 2 - pillarW / 2), clearH / 2, depth - pillarD / 2);
        pillar.castShadow = true;
        pillar.receiveShadow = true;
        group.add(pillar);
      });

      const redSign = new THREE.Mesh(
        new THREE.BoxGeometry(0.24, 0.32, 0.04),
        new THREE.MeshStandardMaterial({ color: '#DC2626', roughness: 0.4 })
      );
      redSign.position.set(width / 2 - pillarW * 0.5, 2.2, depth + 0.02);
      group.add(redSign);

      const header = new THREE.Mesh(
        new THREE.BoxGeometry(width, headerH, depth),
        [louverSideMat, louverSideMat, stoneDarkMat, stoneDarkMat, headerFrontMat, stoneMat]
      );
      header.position.set(0, height - headerH / 2, depth / 2);
      header.castShadow = true;
      group.add(header);

      const lobbyW = width - 0.38;
      const lobbyD = 1.85;
      const frontZ = lobbyD;

      const lobbyFloor = new THREE.Mesh(
        new THREE.BoxGeometry(width - 0.16, 0.08, depth),
        new THREE.MeshStandardMaterial({ color: '#8A9098', roughness: 0.72 })
      );
      lobbyFloor.position.set(0, 0.04, depth / 2);
      lobbyFloor.receiveShadow = true;
      group.add(lobbyFloor);

      const lobbyBackWall = new THREE.Mesh(
        new THREE.BoxGeometry(lobbyW, clearH, 0.14),
        new THREE.MeshStandardMaterial({ color: '#C5BFB2', roughness: 0.75 })
      );
      lobbyBackWall.position.set(0, clearH / 2, 0.07);
      group.add(lobbyBackWall);

      const lobbyCeiling = new THREE.Mesh(
        new THREE.BoxGeometry(lobbyW, 0.08, lobbyD),
        new THREE.MeshStandardMaterial({ color: '#E5E7EB', emissive: '#FFF7E6', emissiveIntensity: 0.40 })
      );
      lobbyCeiling.position.set(0, clearH - 0.04, lobbyD / 2);
      group.add(lobbyCeiling);

      const mT = 0.06;
      const doorW = 2.02;
      const doorH = 2.34;
      const addGoldBar = (w, h, d, x, y, z) => {
        const bar = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), goldFrameMat);
        bar.position.set(x, y, z);
        group.add(bar);
      };

      [-1, 1].forEach(side => {
        const sx = side * (lobbyW / 2);
        const sideGlass = new THREE.Mesh(new THREE.BoxGeometry(0.03, clearH, lobbyD), tintedGlassMat);
        sideGlass.position.set(sx, clearH / 2, lobbyD / 2);
        group.add(sideGlass);
        for (let i = 0; i <= 2; i++) addGoldBar(mT, clearH, mT, sx, clearH / 2, (lobbyD / 2) * i);
        [0.05, doorH, clearH - 0.05].forEach(hy => addGoldBar(mT, mT, lobbyD, sx, hy, lobbyD / 2));
      });

      const sidePanelW = (lobbyW - doorW) / 2;
      [-1, 1].forEach(side => {
        const pGlass = new THREE.Mesh(new THREE.BoxGeometry(sidePanelW, doorH, 0.03), tintedGlassMat);
        pGlass.position.set(side * (doorW / 2 + sidePanelW / 2), doorH / 2, frontZ);
        group.add(pGlass);
      });

      const topGlassH = clearH - doorH;
      const topGlass = new THREE.Mesh(new THREE.BoxGeometry(lobbyW, topGlassH, 0.03), tintedGlassMat);
      topGlass.position.set(0, doorH + topGlassH / 2, frontZ);
      group.add(topGlass);

      [-lobbyW / 2, -(doorW / 2 + sidePanelW / 2), -doorW / 2, doorW / 2, (doorW / 2 + sidePanelW / 2), lobbyW / 2].forEach(mx => {
        addGoldBar(mT, clearH, mT, mx, clearH / 2, frontZ);
      });
      addGoldBar(lobbyW, mT, mT, 0, clearH - 0.05, frontZ);
      addGoldBar(lobbyW, mT, mT, 0, doorH, frontZ);

      const doorZ = frontZ + 0.045;
      const sT = 0.068;
      const leafT = 0.048;
      const addSilverBar = (w, h, d, x, y, z) => {
        const bar = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), silverFrameMat);
        bar.position.set(x, y, z);
        group.add(bar);
      };

      addSilverBar(doorW + sT * 0.8, 0.14, 0.09, 0, doorH - 0.07, doorZ);
      addSilverBar(sT, doorH, 0.09, -doorW / 2 + sT / 2, doorH / 2, doorZ);
      addSilverBar(sT, doorH, 0.09, doorW / 2 - sT / 2, doorH / 2, doorZ);

      const innerW = doorW - sT * 2;
      const leafW = innerW / 2 - 0.015;
      const leafH = doorH - 0.14;
      [-1, 1].forEach(side => {
        const lx = side * (leafW / 2 + 0.008);
        const doorGlass = new THREE.Mesh(new THREE.BoxGeometry(leafW - leafT, leafH - leafT * 2, 0.02), clearDoorGlassMat);
        doorGlass.position.set(lx, leafH / 2, doorZ);
        group.add(doorGlass);

        addSilverBar(leafW, leafT, 0.05, lx, leafH - leafT / 2, doorZ);
        addSilverBar(leafW, leafT * 1.6, 0.05, lx, leafT * 0.8, doorZ);
        addSilverBar(leafT, leafH, 0.05, lx - leafW / 2 + leafT / 2, leafH / 2, doorZ);
        addSilverBar(leafT, leafH, 0.05, lx + leafW / 2 - leafT / 2, leafH / 2, doorZ);
        addSilverBar(leafW - leafT, 0.045, 0.055, lx, leafH * 0.47, doorZ);
      });

      return group;
    }

    // 공통 재질
    const roofDeckMat = new THREE.MeshStandardMaterial({ color: COLORS.roofDeck, roughness: 0.88 });
    const whiteMat = new THREE.MeshStandardMaterial({ color: COLORS.whiteWall, roughness: 0.80 });
    const lightGrayMat = new THREE.MeshStandardMaterial({ color: COLORS.lightGray, roughness: 0.82 });
    const darkSlotMat = new THREE.MeshStandardMaterial({ color: COLORS.darkSlotGray, roughness: 0.84 });
    const darkStoneMat = new THREE.MeshStandardMaterial({ color: COLORS.darkStone, roughness: 0.72 });

    function addStoneBaseBox(parent, w, d, x, z, customMats = {}) {
      const defX = makeStoneBaseMat(d);
      const defZ = makeStoneBaseMat(w);
      const mats = [
        customMats.px || defX,
        customMats.nx || defX,
        darkStoneMat,
        darkStoneMat,
        customMats.pz || defZ,
        customMats.nz || defZ
      ];
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, BASE_H, d), mats);
      mesh.position.set(x, BASE_H / 2, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    // =========================================================
    // 5. 금호파크힐스 116동 전체 조립 (8층 · 남북 2세대 85.8㎡×2)
    // =========================================================
    function createKumho116Dong() {
      const dong116 = new THREE.Group();
      dong116.name = 'KumhoParkHills_116';

      const endWallMat = new THREE.MeshStandardMaterial({
        map: createGrayPanelTexture(UPPER_FLOORS, { baseColor: COLORS.sideGray, showVerticalSeams: true }),
        roughness: 0.78
      });

      // ---------------------------------------------------------
      // (1) 메인 본체 3분할 (북·남 무이음 회색 측벽 + 동측 2세대 & 중앙 회색 후퇴부)
      //     전체 N-S 길이: 20.6m (z: -10.3 ~ +10.3)
      //     북/남 세대: x = -4.6 ~ +5.6 (w = 10.2m, cx = +0.5), 길이 8.3m
      //     중앙 후퇴부: x = -4.6 ~ +4.6 (w = 9.2m, cx = 0), 길이 4.0m
      // ---------------------------------------------------------
      const unitD = 8.3;
      const centerD = 4.0;
      const unitW = 10.2;
      const centerW = 9.2;

      // 동측 북세대 (+X): 좌(+Z, 중앙)=큰 거실창 -> 1/1 작은창 -> 우(-Z, 북모서리)=회색띠 1/2 작은창 (첨부3 북동!)
      const eastNorthCols = [
        { w: 2.05, type: 'living', bg: COLORS.whiteWall },
        { w: 1.15, type: 'small_full', bg: COLORS.whiteWall },
        { w: 0.90, type: 'small_half', bg: COLORS.cornerBandGray, stripedWhiteBand: true }
      ];
      // 동측 남세대 (+X): 좌(+Z, 남모서리)=회색띠 1/2 작은창 -> 1/1 작은창 -> 우(-Z, 중앙)=큰 거실창
      const eastSouthCols = [
        { w: 0.90, type: 'small_half', bg: COLORS.cornerBandGray, stripedWhiteBand: true },
        { w: 1.15, type: 'small_full', bg: COLORS.whiteWall },
        { w: 2.05, type: 'living', bg: COLORS.whiteWall }
      ];
      // 동측 중앙 후퇴부 (+X): 진회색 가로줄 벽 + 1/2 작은창 2짝 (첨부3 북동!)
      const eastCenterCols = [
        { w: 1.0, type: 'small_half', bg: COLORS.recessCenterGray, grooved: true },
        { w: 1.0, type: 'small_half', bg: COLORS.recessCenterGray, grooved: true }
      ];

      // 북세대 본체 (z: -10.3 ~ -2.0, cz = -6.15)
      addStoneBaseBox(dong116, unitW, unitD, 0.5, -6.15, {
        px: makeStoneBaseMat(unitD, eastNorthCols, { leftBorderW: 0.06, rightBorderW: 0.04, widthPx: 512 })
      });
      const northBlock = new THREE.Mesh(
        new THREE.BoxGeometry(unitW, UPPER_H, unitD),
        [
          new THREE.MeshStandardMaterial({
            map: createFacadeTexture(UPPER_FLOORS, eastNorthCols, {
              defaultBg: COLORS.whiteWall,
              leftBorder: { w: 0.06, color: COLORS.whiteWall },
              rightBorder: { w: 0.04, color: COLORS.cornerBandGray },
              whiteSlabBands: true,
              widthPx: 512
            }),
            roughness: 0.78
          }),
          lightGrayMat,
          roofDeckMat,
          darkStoneMat,
          whiteMat,
          endWallMat
        ]
      );
      northBlock.position.set(0.5, BASE_H + UPPER_H / 2, -6.15);
      northBlock.castShadow = true;
      northBlock.receiveShadow = true;
      dong116.add(northBlock);

      // 중앙 후퇴 본체 (z: -2.0 ~ +2.0, cz = 0)
      addStoneBaseBox(dong116, centerW, centerD, 0, 0, {
        px: makeStoneBaseMat(centerD, eastCenterCols, { widthPx: 320 })
      });
      const centerBlock = new THREE.Mesh(
        new THREE.BoxGeometry(centerW, UPPER_H, centerD),
        [
          new THREE.MeshStandardMaterial({
            map: createFacadeTexture(UPPER_FLOORS, eastCenterCols, {
              defaultBg: COLORS.recessCenterGray,
              widthPx: 320
            }),
            roughness: 0.80
          }),
          lightGrayMat,
          roofDeckMat,
          darkStoneMat,
          lightGrayMat,
          lightGrayMat
        ]
      );
      centerBlock.position.set(0, BASE_H + UPPER_H / 2, 0);
      centerBlock.castShadow = true;
      centerBlock.receiveShadow = true;
      dong116.add(centerBlock);

      // 남세대 본체 (z: +2.0 ~ +10.3, cz = +6.15)
      addStoneBaseBox(dong116, unitW, unitD, 0.5, 6.15, {
        px: makeStoneBaseMat(unitD, eastSouthCols, { leftBorderW: 0.04, rightBorderW: 0.06, widthPx: 512 })
      });
      const southBlock = new THREE.Mesh(
        new THREE.BoxGeometry(unitW, UPPER_H, unitD),
        [
          new THREE.MeshStandardMaterial({
            map: createFacadeTexture(UPPER_FLOORS, eastSouthCols, {
              defaultBg: COLORS.whiteWall,
              leftBorder: { w: 0.04, color: COLORS.cornerBandGray },
              rightBorder: { w: 0.06, color: COLORS.whiteWall },
              whiteSlabBands: true,
              widthPx: 512
            }),
            roughness: 0.78
          }),
          lightGrayMat,
          roofDeckMat,
          darkStoneMat,
          endWallMat,
          whiteMat
        ]
      );
      southBlock.position.set(0.5, BASE_H + UPPER_H / 2, 6.15);
      southBlock.castShadow = true;
      southBlock.receiveShadow = true;
      dong116.add(southBlock);

      // ---------------------------------------------------------
      // (2) 서측(-X) 계단식 입면 (첨부2 서측 정면 1:1 반영)
      //     좌(북 -Z) -> 우(남 +Z):
      //     화이트 작은창(-10.3..-7.9) | AC(-7.9..-5.7) | 진회색 1/4창(-5.7..-3.75)
      //     | 넓은 가로줄 회색벽(-3.75..+0.40, 북쪽 숄더 단차 포함)
      //     | 1열 수직 통창 + 어두운 루버 옥탑(+0.40..+3.75)
      //     | 진회색 1/4창(+3.75..+5.7) | AC(+5.7..+7.9) | 화이트 작은창(+7.9..+10.3)
      // ---------------------------------------------------------
      const pentH = 2.85;
      const coreD = 2.6; // x: -4.6 ~ -7.2

      // ① 북·남 끝 화이트 작은창 (-10.3..-7.9 & +7.9..+10.3, 깊이 0.22m 프레임)
      const westWinCols = [{ w: 1, type: 'small_full', bg: COLORS.whiteWall }];

      [-9.1, 9.1].forEach(wz => {

          new THREE.BoxGeometry(0.22, BASE_H, 2.4),

        );
        wb.position.set(-4.6 - 0.11, BASE_H / 2, wz);
        dong116.add(wb);

        const wu = new THREE.Mesh(
          new THREE.BoxGeometry(0.22, UPPER_H, 2.4),
          [whiteMat, westWinUpperMat, roofDeckMat, darkStoneMat, wz > 0 ? endWallMat : whiteMat, wz < 0 ? endWallMat : whiteMat]
        );
        wu.position.set(-4.6 - 0.11, BASE_H + UPPER_H / 2, wz);
        wu.castShadow = true;
        dong116.add(wu);

      const plainWallMatCache = new Map();
      const getPlainBasementWallMat = (widthMeters) => {
        const key = Math.max(1, Math.round(widthMeters * 10));
        if (!plainWallMatCache.has(key)) {
          const pxPerMeter = 42;
          const cw = Math.max(160, Math.round(widthMeters * pxPerMeter));
          const ch = 384; // 지상 BASE_H(7.95m)와 동일한 세로 픽셀 밀도
          const canvas = document.createElement('canvas');
          canvas.width = cw;
          canvas.height = ch;
          const ctx = canvas.getContext('2d');

          ctx.fillStyle = '#2B2F35';
          ctx.fillRect(0, 0, cw, ch);

          const colW = 54;
          const floorPx = ch / BASEMENT_FLOORS;
          const subRowH = floorPx / SUB_ROWS_PER_FLOOR;

          // 석재 타일 미세 명암 패턴
          for (let f = 0; f < BASEMENT_FLOORS; f++) {
            const fy = f * floorPx;
            for (let r = 0; r < SUB_ROWS_PER_FLOOR; r++) {
              const ry = fy + r * subRowH;
              for (let x = 0; x < cw; x += colW) {
                const shade = ((f * 7 + r * 3 + Math.floor(x / colW) * 5) % 5) - 2;
                ctx.fillStyle = `rgb(${43 + shade * 2}, ${47 + shade * 2}, ${53 + shade * 2})`;
                ctx.fillRect(x + 1, ry + 1, colW - 2, subRowH - 2);
              }
            }
          }

          // 수직 줄눈
          ctx.fillStyle = 'rgba(120, 128, 138, 0.28)';
          for (let x = colW; x < cw; x += colW) {
            ctx.fillRect(x, 0, 1.5, ch);
          }

          // 층간 두꺼운 회색선(지하 1층·2층 경계) + 내부 얇은 줄눈
          for (let f = 0; f < BASEMENT_FLOORS; f++) {
            const fy = f * floorPx;
            ctx.fillStyle = '#9EA5AE';
            ctx.fillRect(0, fy, cw, 5);
            ctx.fillStyle = '#181B1F';
            ctx.fillRect(0, fy + 5, cw, 1.5);

            for (let r = 1; r < SUB_ROWS_PER_FLOOR; r++) {
              const ry = fy + r * subRowH;
              ctx.fillStyle = '#5D646E';
              ctx.fillRect(0, ry, cw, 1.5);
              ctx.fillStyle = '#1A1D21';
              ctx.fillRect(0, ry + 1.5, cw, 1);

          ctx.fillRect(0, ch - 4, cw, 4);

          bTex.colorSpace = THREE.SRGBColorSpace;
          bTex.anisotropy = 8;

          plainWallMatCache.set(
            key,
            new THREE.MeshStandardMaterial({ map: bTex, roughness: 0.72 })
          );

        // =========================================================

      // (1) 로드뷰 기준 회색 + 차콜 포인트 보도블록 텍스처 (4m × 4m 반복)
      const createWalkwayPaverTexture = () => {
        const size = 512;
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = '#B8BAB8';
        ctx.fillRect(0, 0, size, size);

        const cols = 16;
        const rows = 32;
        const bw = size / cols;
        const bh = size / rows;

        for (let r = 0; r < rows; r++) {
          const offset = (r % 2) * (bw * 0.5);
          for (let c = -1; c <= cols; c++) {
            const x = c * bw + offset;
            const y = r * bh;
            const hash = Math.abs(Math.sin(r * 12.9898 + c * 78.233) * 43758.5453) % 1;

            // 로드뷰의 가로 방향 어두운 차콜 포인트 블록 띠 패턴
            const inAccentBand = (r >= 6 && r <= 10) || (r >= 22 && r <= 25);
            const isDarkBlock = inAccentBand
              ? ((r + c) % 3 === 0 || hash > 0.62)
              : (hash > 0.94);

            if (isDarkBlock) {
              const v = 64 + Math.floor(hash * 18);
              ctx.fillStyle = `rgb(${v}, ${v + 3}, ${v + 7})`;
            } else {
              const v = 194 + Math.floor(hash * 18);
              ctx.fillStyle = `rgb(${v}, ${v + 1}, ${v - 2})`;
            }
            ctx.fillRect(x + 1, y + 1, bw - 2, bh - 2);
          }
        }

        // 미세 줄눈
        ctx.strokeStyle = 'rgba(48, 52, 58, 0.30)';
        ctx.lineWidth = 1;
        for (let r = 0; r <= rows; r++) {

          ctx.moveTo(0, r * bh);
          ctx.lineTo(size, r * bh);
          ctx.stroke();

        const tex = new THREE.CanvasTexture(canvas);

        tex.colorSpace = THREE.SRGBColorSpace;
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(1 / 4.0, 1 / Math.max(1, RETAINING_H));
        tex.anisotropy = 8;
        return tex;
      };

      const buildWalkwayShape = (inset = 0) => {
        const s = new THREE.Shape();
        // ExtrudeGeometry + rotateX(-PI/2) 기준: shape (x, y) -> 3D (x, 0, -y)
        s.moveTo(NW_WEST_X + inset, -NW_INNER_Z);
        s.lineTo(NW_WEST_X + inset, -(NW_OUTER_Z + inset));
        s.lineTo(NE_OUTER_X - inset, -(NW_OUTER_Z + inset));
        s.lineTo(NE_OUTER_X - inset, -WINGB_INNER_Z);
        s.lineTo(5.0, -WINGB_INNER_Z);
        s.lineTo(3.0, -12.0);
        s.lineTo(3.0, -NW_INNER_Z);
        s.closePath();
        return s;
      };

      const walkwayGroup = new THREE.Group();
      walkwayGroup.name = 'Walkway_1F_Front';

      const paverMat = new THREE.MeshStandardMaterial({
        map: createWalkwayPaverTexture(),
        roughness: 0.86
      });
      const curbMat = new THREE.MeshStandardMaterial({
        color: '#B5B9BF',
        roughness: 0.78
      });

      // 보도 상판 (상면 Y = 0.005m, 1층 출입구 바닥과 수평 일치)
      const slabGeo = new THREE.ExtrudeGeometry(buildWalkwayShape(0), {
        depth: WALKWAY_SLAB_H,
        bevelEnabled: false
      });
      slabGeo.rotateX(-Math.PI / 2);
      slabGeo.translate(0, -WALKWAY_SLAB_H + TOP_OFFSET_Y, 0);

      const slabMesh = new THREE.Mesh(slabGeo, [paverMat, curbMat]);
      slabMesh.name = 'Walkway_1F_Deck';
      slabMesh.receiveShadow = true;
      slabMesh.castShadow = true;
      walkwayGroup.add(slabMesh);

      // 노란색 외곽선 화강석 경계석 (3개 외곽 변)
      const curbW = 0.24;
      const curbH = WALKWAY_SLAB_H + 0.015;
      const curbCenterY = -WALKWAY_SLAB_H + curbH / 2;

      const curbDefs = [
        // 북서 보도 서측 끝단
        {
          size: [curbW, curbH, Math.abs(NW_INNER_Z - NW_OUTER_Z)],
          pos: [NW_WEST_X + curbW / 2, curbCenterY, (NW_INNER_Z + NW_OUTER_Z) / 2]
        },
        // 북서측 외곽선
        {
          size: [NE_OUTER_X - NW_WEST_X, curbH, curbW],
          pos: [(NW_WEST_X + NE_OUTER_X) / 2, curbCenterY, NW_OUTER_Z + curbW / 2]
        },
        // 북동측(놀이터 앞) 외곽선
        {
          size: [curbW, curbH, WINGB_INNER_Z - NW_OUTER_Z],
          pos: [NE_OUTER_X - curbW / 2, curbCenterY, (NW_OUTER_Z + WINGB_INNER_Z) / 2]
        }
      ];

      curbDefs.forEach((c, i) => {
        const curb = new THREE.Mesh(new THREE.BoxGeometry(...c.size), curbMat);
        curb.name = `Walkway_1F_Curb_${i}`;
        curb.position.set(...c.pos);
        curb.receiveShadow = true;
        curb.castShadow = true;
        walkwayGroup.add(curb);
      });

      // 보도 하부 석재 기단 (실제 지형이 Y < 0으로 꺼질 때 보도·출입구가 뜨지 않도록 마감)
      if (RETAINING_H > 0) {
        const retainingGeo = new THREE.ExtrudeGeometry(buildWalkwayShape(0.08), {
          depth: RETAINING_H,
          bevelEnabled: false
        });
        retainingGeo.rotateX(-Math.PI / 2);
        retainingGeo.translate(0, -BASE_H, 0);

        const retainingWallMat = new THREE.MeshStandardMaterial({
          map: createRetainingStoneTexture(),
          roughness: 0.74
        });
        const retainingMesh = new THREE.Mesh(retainingGeo, [darkStoneMat, retainingWallMat]);
        retainingMesh.name = 'Walkway_1F_RetainingBase';
        retainingMesh.receiveShadow = true;
        retainingMesh.castShadow = true;
        walkwayGroup.add(retainingMesh);
      }

      wingA.add(walkwayGroup);
    })();
       
    // =========================================================
    // 6. 3D 모델링 파일 (.glb) 추출
    // =========================================================
    window.exportGLB = () => {
      const exporter = new GLTFExporter();
      exporter.parse(
        apt116,
        (result) => {
          const blob = new Blob([result], { type: 'model/gltf-binary' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = 'kumho_116dong.glb';
          link.click();
          URL.revokeObjectURL(url);
        },
        (err) => console.error('GLB 추출 오류:', err),
        { binary: true }
      );
    };

    // =========================================================
    // 7. 렌더 루프 & 리사이즈
    // =========================================================
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
