<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이로이의 하루</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>이로이의 하루</h1>
    <p id="clock" class="clock">—</p>
  </header>

  <main>
    <section id="map-panel" class="panel panel-wide">
      <h2>지도</h2>
      <p class="muted">집·학교는 실제 지오코딩 위치, 동네 학원 4곳은 주소가 정해지지 않아 도보 10분 추정 위치에 가상으로 표시한다.</p>
      <div id="map"></div>
    </section>

    <section id="stats-panel" class="panel">
      <h2 id="char-name">—</h2>
      <div id="stats"></div>
      <div id="condition"></div>
    </section>

    <section id="academy-panel" class="panel">
      <h2>방과후 학원</h2>
      <ul id="academies"></ul>
    </section>
  </main>

  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=8d5cf5d494acc41a8002c036c0249f9a&libraries=services"></script>
  <script src="main.js"></script>
</body>
</html>
