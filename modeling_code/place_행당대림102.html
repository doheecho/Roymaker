<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>행당대림아파트 102동 3D 모델링 (15층 · ㄴ자 단차 복합동 · 평지 기준)</title>
  <style>
    body { margin: 0; overflow: hidden; background: #1e242b; }
    #info {
      position: absolute; top: 14px; left: 16px; color: #fff;
      font-family: 'Malgun Gothic', sans-serif; font-size: 13px;
      background: rgba(16, 20, 26, 0.88); padding: 10px 14px;
      border-radius: 8px; border: 1px solid rgba(255,255,255,0.18);
      pointer-events: none; line-height: 1.55;
    }
    #controls-ui {
      position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
      display: flex; flex-wrap: wrap; justify-content: center; gap: 5px;
      background: rgba(16, 20, 26, 0.92); padding: 9px 11px;
      border-radius: 10px; border: 1px solid rgba(255,255,255,0.18);
      max-width: 98vw;
    }
    button {
      background: #374151; color: #fff; border: 1px solid #4b5563;
      padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 12px;
      font-family: 'Malgun Gothic', sans-serif; transition: 0.15s;
    }
    button:hover { background: #2563eb; border-color: #60a5fa; }
    button.primary-btn { background: #1d4ed8; border-color: #3b82f6; font-weight: bold; }
    button.export-btn { background: #b45309; border-color: #f59e0b; font-weight: bold; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="info">
    <strong>행당대림아파트 102동 3D 모델링 (15층 · ㄴ자 단차형 판상형 복합동 · 평지 기준)</strong><br/>
    좌클릭 드래그: 회전 | 우클릭 드래그: 이동 | 휠: 확대·축소 (북쪽: -Z / 동쪽: +X)
  </div>

  <div id="controls-ui">
    <button onclick="setView('v1_sky')">1번: 스카이뷰</button>
    <button onclick="setView('v2_sw')">2번: 남서쪽</button>
    <button onclick="setView('v3_south')">3번: 남쪽(발코니)</button>
    <button onclick="setView('v4_ese')">4번: 동남쪽(단차벽)</button>
    <button onclick="setView('v5_east')">5번: 동쪽</button>
    <button onclick="setView('v6_ne')">6번: 북동쪽</button>
    <button onclick="setView('v7_nne')">7번: 북북동쪽</button>
    <button onclick="setView('v8_north')">8번: 북쪽</button>
    <button onclick="setView('v9_nw')">9번: 북서쪽(근접)</button>
    <button class="primary-btn" onclick="setView('v10_wnw')">10번: 서북서쪽(전체)</button>
    <button onclick="setView('v11_west')">11번: 서쪽</button>
    <button class="export-btn" onclick="exportGLB()">3D 추출 (.glb)</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

    // 1. 씬, 카메라, 렌더러 설정
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#9EC1E6');
    scene.fog = new THREE.Fog('#9EC1E6', 160, 420);

    const camera = new THREE.PerspectiveCamera(46, window.innerWidth / window.innerHeight, 0.1, 700);

    const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // 102동 전체 그룹 (실제 지도 방위 반영: 남서 -> 북동 방향, 약 +32도 회전)
    const ROT_DEG = 32;
    const ROT_RAD = THREE.MathUtils.degToRad(ROT_DEG);
    const APT_ORIGIN = new THREE.Vector3(0.0, 0.0, 0.0);

    const aptGroup = new THREE.Group();
    aptGroup.name = 'Haengdang_Daelim_102';
    aptGroup.position.copy(APT_ORIGIN);
    aptGroup.rotation.y = ROT_RAD;
    scene.add(aptGroup);

    function toWorld(lx, ly, lz) {
      return new THREE.Vector3(lx, ly, lz)
        .applyAxisAngle(new THREE.Vector3(0, 1, 0), ROT_RAD)
        .add(APT_ORIGIN);
    }

    // 11개 시점 프리셋 (스카이뷰 + 남쪽/북쪽 현장 뷰 구도 일치)
    window.setView = (mode) => {
      const presets = {
        // 1번: 스카이뷰 (13092.jpg)
        v1_sky:   { pos: toWorld(-2.0, 96.0, 2.0),    target: toWorld(-2.0, 10.0, -1.5) },
        // 2번: 남서쪽 (13052.jpg)
        v2_sw:    { pos: toWorld(-43.0, 4.2, 24.0),   target: toWorld(-14.0, 21.5, 4.0) },
        // 3번: 남쪽 발코니 입면 (13054_2.jpg)
        v3_south: { pos: toWorld(-13.5, 3.6, 26.5),   target: toWorld(-13.0, 22.5, 7.2) },
        // 4번: 동남쪽 단차벽 조망 (13056_2.jpg - 우측 NE wing 발코니 + 좌측 돌출 SW wing 무창 측면벽)
        v4_ese:   { pos: toWorld(31.0, 3.8, 22.0),    target: toWorld(8.0, 21.5, 2.0) },
        // 5번: 동쪽 (13058.jpg)
        v5_east:  { pos: toWorld(48.0, 4.2, -3.0),    target: toWorld(20.0, 22.0, -5.0) },
        // 6번: 북동쪽 (13060.jpg)
        v6_ne:    { pos: toWorld(42.0, 4.0, -26.0),   target: toWorld(10.0, 20.5, -8.5) },
        // 7번: 북북동쪽 (13064.jpg)
        v7_nne:   { pos: toWorld(20.0, 4.0, -31.0),   target: toWorld(2.0, 21.0, -9.0) },
        // 8번: 북쪽 (13068.jpg)
        v8_north: { pos: toWorld(4.0, 3.8, -29.0),    target: toWorld(4.0, 21.5, -8.5) },
        // 9번: 북서쪽 근접 (13070_2.jpg)
        v9_nw:    { pos: toWorld(-4.5, 3.5, -24.5),   target: toWorld(1.5, 22.5, -8.5) },
        // 10번: 서북서쪽 전체 (13074_3.jpg)
        v10_wnw:  { pos: toWorld(-13.5, 4.0, -34.5),  target: toWorld(-2.5, 21.5, -7.5) },
        // 11번: 서쪽 (13076.jpg)
        v11_west: { pos: toWorld(-26.0, 4.2, -37.0),  target: toWorld(-2.0, 20.5, -6.5) }
      };
      const v = presets[mode];
      if (!v) return;
      camera.position.copy(v.pos);
      controls.target.copy(v.target);
      controls.update();
    };

    setView('v10_wnw');

    // 2. 조명 설정
    scene.add(new THREE.AmbientLight(0xffffff, 0.95));

    const sunLight = new THREE.DirectionalLight(0xfffdf5, 1.32);
    sunLight.position.set(-40, 85, 45);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(2048, 2048);
    sunLight.shadow.camera.left = -60;
    sunLight.shadow.camera.right = 60;
    sunLight.shadow.camera.top = 65;
    sunLight.shadow.camera.bottom = -25;
    sunLight.shadow.bias = -0.0005;
    scene.add(sunLight);

    const fillLight = new THREE.DirectionalLight(0xf8fafc, 0.85);
    fillLight.position.set(45, 55, -50);
    scene.add(fillLight);

    // =========================================================
    // 프로시저럴 텍스처 유틸리티
    // =========================================================
    function makeTex(canvas, rx = 1, ry = 1, isLinear = false) {
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = isLinear ? THREE.NoColorSpace : THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      if (rx !== 1 || ry !== 1) {
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(rx, ry);
      }
      return tex;
    }

    function addOutline(mesh, color = 0x6b5b45) {
      const edges = new THREE.EdgesGeometry(mesh.geometry, 35);
      mesh.add(new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color })));
    }

    function createCementTexture(baseHex, rx = 4, ry = 8) {
      const c = document.createElement('canvas');
      c.width = 256; c.height = 256;
      const ctx = c.getContext('2d');
      ctx.fillStyle = baseHex;
      ctx.fillRect(0, 0, 256, 256);

      for (let i = 0; i < 1800; i++) {
        const x = (i * 73) % 256;
        const y = (i * 137) % 256;
        ctx.fillStyle = (i % 2 === 0) ? 'rgba(0,0,0,0.025)' : 'rgba(255,255,255,0.03)';
        ctx.fillRect(x, y, 2, 2);
      }
      return makeTex(c, rx, ry);
    }

    // 102동 측벽 컬러 텍스처 + 요철(Bump) 텍스처 생성
    function create102EndWallTextures(withBrandMark = false) {
      const W = 1024;
      const H = 3072;
      const totalFloors = 15;
      const floorPx = H / totalFloors;
      const lowerStartY = 12 * floorPx;  // 1~3층 황토 투톤 경계
      const sideBandW = 240;

      const c = document.createElement('canvas');
      c.width = W; c.height = H;
      const ctx = c.getContext('2d');

      const bc = document.createElement('canvas');
      bc.width = W; bc.height = H;
      const bctx = bc.getContext('2d');

      ctx.fillStyle = '#E6D9C6';
      ctx.fillRect(0, 0, W, lowerStartY);
      ctx.fillStyle = '#C59B63';
      ctx.fillRect(0, lowerStartY, W, H - lowerStartY);

      bctx.fillStyle = '#D8D8D8';
      bctx.fillRect(0, 0, W, H);

      ctx.fillStyle = '#F3EFE6';
      ctx.fillRect(sideBandW, 0, W - sideBandW * 2, lowerStartY);
      ctx.fillStyle = '#B88D54';
      ctx.fillRect(sideBandW, lowerStartY, W - sideBandW * 2, H - lowerStartY);

      const groovePitch = 8;
      for (let gx = sideBandW; gx < W - sideBandW; gx += groovePitch) {
        ctx.fillStyle = 'rgba(120, 95, 65, 0.11)';
        ctx.fillRect(gx, 0, 3, lowerStartY);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
        ctx.fillRect(gx + 3, 0, 2, lowerStartY);

        ctx.fillStyle = 'rgba(75, 50, 25, 0.16)';
        ctx.fillRect(gx, lowerStartY, 3, H - lowerStartY);
        ctx.fillStyle = 'rgba(255, 240, 210, 0.16)';
        ctx.fillRect(gx + 3, lowerStartY, 2, H - lowerStartY);

        bctx.fillStyle = '#3A3A3A';
        bctx.fillRect(gx, 0, 3, H);
        bctx.fillStyle = '#F2F2F2';
        bctx.fillRect(gx + 4, 0, groovePitch - 4, H);
      }

      for (let f = 1; f < totalFloors; f++) {
        const fy = Math.round(f * floorPx);
        const isLower = fy >= lowerStartY;

        ctx.fillStyle = isLower ? '#D4B07A' : '#F6F4EE';
        ctx.fillRect(0, fy - 6, sideBandW, 12);
        ctx.fillRect(W - sideBandW, fy - 6, sideBandW, 12);

        ctx.fillStyle = isLower ? 'rgba(85, 58, 28, 0.38)' : 'rgba(130, 118, 98, 0.34)';
        ctx.fillRect(sideBandW, fy - 2, W - sideBandW * 2, 4);

        bctx.fillStyle = '#202020';
        bctx.fillRect(0, fy - 3, W, 6);
      }

      ctx.save();
      if (withBrandMark) {
        ctx.globalAlpha = 0.48;
        ctx.fillStyle = '#D97757';
        ctx.beginPath();
        ctx.ellipse(W * 0.50, 215, 195, 56, -0.05, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#EFECE4';
        ctx.font = 'bold 46px "Malgun Gothic", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('e편한세상', W * 0.50, 230);
      }

      ctx.globalAlpha = 0.90;
      ctx.fillStyle = '#B88D54';
      ctx.font = '900 156px "Malgun Gothic", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('102', W * 0.50, 495);

      ctx.fillStyle = '#9E7640';
      ctx.font = '900 176px "Malgun Gothic", sans-serif';
      ctx.fillText('102', W * 0.50, 2240);
      ctx.restore();

      return {
        map: makeTex(c, 1, 1, false),
        bumpMap: makeTex(bc, 1, 1, true)
      };
    }

    // =========================================================
    // 3. 재질 정의
    // =========================================================
    const upperCreamMat = new THREE.MeshStandardMaterial({
      map: createCementTexture('#EFECE4', 6, 12),
      roughness: 0.72,
      metalness: 0.03
    });
    const peachCreamMat = new THREE.MeshStandardMaterial({
      map: createCementTexture('#E6D6C4', 4, 12),
      roughness: 0.72,
      metalness: 0.03
    });
    const lowerOchreMat = new THREE.MeshStandardMaterial({
      map: createCementTexture('#C59B63', 6, 3),
      roughness: 0.76,
      metalness: 0.04
    });
    const ochrePilasterMat = new THREE.MeshStandardMaterial({
      map: createCementTexture('#B3874E', 2, 3),
      roughness: 0.78
    });
    const darkRoofCapMat = new THREE.MeshStandardMaterial({
      color: '#3B3432',
      roughness: 0.55,
      metalness: 0.15
    });
    const brownRoofMat = new THREE.MeshStandardMaterial({
      color: '#635344',
      roughness: 0.85
    });
    const windowGlassMat = new THREE.MeshStandardMaterial({
      color: '#3B6482',
      roughness: 0.18,
      metalness: 0.50
    });
    const sashFrameMat = new THREE.MeshStandardMaterial({
      color: '#333A44',
      roughness: 0.45,
      metalness: 0.30
    });
    const silverRailingMat = new THREE.MeshStandardMaterial({
      color: '#E5E7EB',
      emissive: '#475569',
      emissiveIntensity: 0.18,
      roughness: 0.24,
      metalness: 0.78
    });
    const solarPanelMat = new THREE.MeshStandardMaterial({
      color: '#1E3A8A',
      roughness: 0.22,
      metalness: 0.65
    });
    const acUnitMat = new THREE.MeshStandardMaterial({
      color: '#E5E7EB',
      roughness: 0.48,
      metalness: 0.15
    });

    const endWallTexSW = create102EndWallTextures(false);
    const endWallMatSW = new THREE.MeshStandardMaterial({
      map: endWallTexSW.map,
      bumpMap: endWallTexSW.bumpMap,
      bumpScale: 0.045,
      roughness: 0.72
    });

    const endWallTexNE = create102EndWallTextures(true);
    const endWallMatNE = new THREE.MeshStandardMaterial({
      map: endWallTexNE.map,
      bumpMap: endWallTexNE.bumpMap,
      bumpScale: 0.045,
      roughness: 0.72
    });

    // =========================================================
    // 4. 행당대림아파트 102동 건축 조립
    //    (13092 스카이뷰 + 13074_3 북서측 + 13056_2 동남측 + 13054_2 남측 종합 반영)
    //    - 서쪽 날개 (SW Wing): x: -29.0 ~ +2.2m (31.2m), z: -4.8 ~ +7.2m (12.0m)
    //      * 남동측(z = +7.2m)이 동쪽 날개보다 약 4.6m 돌출 -> x = +2.2m(z: +2.6 ~ +7.2m)에 무창 돌출 측면벽 형성!
    //      * 중간(x: -17.0 ~ -13.8m)에 위로 2개 층(+5.7m) 더 솟은 코어 탑 + 북서면 2개 층 창문 추가 + 뾰족한 박공 지붕
    //    - 중앙 돌출 코어 타워 (Center Core Tower): x: -2.2 ~ +2.2m (4.4m)
    //      * 서측 매스: x: -2.2 ~ +0.4m, z: -10.2 ~ -4.8m
    //      * 동측 매스: x: +0.4 ~ +2.2m, z: -9.6 ~ -4.8m
    //      * 상부 뾰족한 2단 삼각 박공 지붕 + 3단 색채 분리
    //    - 동쪽 날개 (NE Wing): x: +2.2 ~ +23.0m (20.8m), 북서측(-Z)으로 1.4m씩 2회 ㄴ자 꺾임!
    //      * 1구간: x: +2.2 ~ +7.8m  (z: -8.2 ~ +2.6m) -> SE 발코니 라인 z = +2.6m
    //      * 2구간: x: +7.8 ~ +15.0m (z: -9.6 ~ +1.8m) -> 1차 ㄴ자 1.4m NW 돌출
    //      * 3구간: x: +15.0 ~ +23.0m (z: -11.0 ~ +1.0m) -> 2차 ㄴ자 1.4m NW 돌출
    // =========================================================
    const floors = 15;
    const floorH = 2.85;
    const lowerFloorsH = 3 * floorH;          // 1~3층 황토 외벽: 8.55m
    const upperFloorsH = 12 * floorH;         // 4~15층 크림 외벽: 34.20m
    const totalH = lowerFloorsH + upperFloorsH; // 기본 본동 높이: 42.75m
    const centerTowerH = totalH + 3.60;       // 중앙 코어 타워 처마 높이: 46.35m (+ 박공 피크 1.45m)
    const westCoreH = totalH + 2 * floorH;    // 서쪽동 중간 2층 돌출 탑 처마 높이: 48.45m (+ 박공 피크 1.25m)

    // 뾰족한 삼각 박공 지붕 생성 헬퍼
    function addPointedGableRoofZ(cx, baseY, zStart, depth, width, peakH, wallMat, capMat) {
      const shape = new THREE.Shape();
      shape.moveTo(-width / 2, 0);
      shape.lineTo(0, peakH);
      shape.lineTo(width / 2, 0);
      shape.closePath();

      const gableGeo = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false });
      const gableMesh = new THREE.Mesh(gableGeo, wallMat);
      gableMesh.position.set(cx, baseY, zStart);
      gableMesh.castShadow = true;
      addOutline(gableMesh, 0x8c7b65);
      aptGroup.add(gableMesh);

      const slopeLen = Math.hypot(width / 2 + 0.16, peakH);
      const slopeAng = Math.atan2(peakH, width / 2);

      const leftCap = new THREE.Mesh(
        new THREE.BoxGeometry(slopeLen, 0.22, depth + 0.24),
        capMat
      );
      leftCap.rotation.z = slopeAng;
      leftCap.position.set(cx - width / 4, baseY + peakH / 2 + 0.08, zStart + depth / 2);
      aptGroup.add(leftCap);

      const rightCap = new THREE.Mesh(
        new THREE.BoxGeometry(slopeLen, 0.22, depth + 0.24),
        capMat
      );
      rightCap.rotation.z = -slopeAng;
      rightCap.position.set(cx + width / 4, baseY + peakH / 2 + 0.08, zStart + depth / 2);
      aptGroup.add(rightCap);
    }

    // 1) 본체 매스 조립
    const bodyBlocks = [
      // 서쪽 날개 (SW Wing): x: -29.0 ~ +2.2m, z: -4.8 ~ +7.2m (깊이 12.0m)
      { x: -13.4, z: 1.2,  w: 31.2, d: 12.0 },
      // 동쪽 날개 1구간: x: +2.2 ~ +7.8m, z: -8.2 ~ +2.6m (깊이 10.8m -> SE쪽 4.6m 후퇴 단차!)
      { x: 5.0,   z: -2.8, w: 5.6,  d: 10.8 },
      // 동쪽 날개 2구간 (1차 ㄴ자 1.4m NW 돌출): x: +7.8 ~ +15.0m, z: -9.6 ~ +1.8m (깊이 11.4m)
      { x: 11.4,  z: -3.9, w: 7.2,  d: 11.4 },
      // 동쪽 날개 3구간 (2차 ㄴ자 1.4m NW 돌출): x: +15.0 ~ +23.0m, z: -11.0 ~ +1.0m (깊이 12.0m)
      { x: 19.0,  z: -5.0, w: 8.0,  d: 12.0 }
    ];

    bodyBlocks.forEach(b => {
      const lowerMesh = new THREE.Mesh(
        new THREE.BoxGeometry(b.w, lowerFloorsH, b.d),
        lowerOchreMat
      );
      lowerMesh.position.set(b.x, lowerFloorsH / 2, b.z);
      lowerMesh.castShadow = true;
      lowerMesh.receiveShadow = true;
      aptGroup.add(lowerMesh);

      const upperMesh = new THREE.Mesh(
        new THREE.BoxGeometry(b.w, upperFloorsH, b.d),
        upperCreamMat
      );
      upperMesh.position.set(b.x, lowerFloorsH + upperFloorsH / 2, b.z);
      upperMesh.castShadow = true;
      upperMesh.receiveShadow = true;
      aptGroup.add(upperMesh);
    });

    // 2) 서쪽 날개 중간의 2개 층 돌출 코어 탑 + 뾰족한 박공 지붕 (13074_3.jpg, 13054_2.jpg 반영)
    //    - 위치: x: -17.0 ~ -13.8m (폭 3.2m), z: -4.8 ~ +7.2m (깊이 12.0m)
    //    - 북서측 벽면(z = -4.8m) 및 남동측 벽면(z = +7.2m)과 수평 단차 없이 위로만 2개 층(+5.7m) 상승!
    const westCoreTop = new THREE.Mesh(
      new THREE.BoxGeometry(3.2, westCoreH - totalH, 12.0),
      upperCreamMat
    );
    westCoreTop.position.set(-15.4, totalH + (westCoreH - totalH) / 2, 1.2);
    westCoreTop.castShadow = true;
    westCoreTop.receiveShadow = true;
    addOutline(westCoreTop, 0x8c7b65);
    aptGroup.add(westCoreTop);

    addPointedGableRoofZ(
      -15.4,
      westCoreH,
      -4.8,
      12.0,
      3.2,
      1.25,
      upperCreamMat,
      darkRoofCapMat
    );

    // 3) 중앙 돌출 코어 타워 + 뾰족한 2단 삼각 박공 지붕 (13074_3.jpg 반영)
    const midBandH = 8 * floorH; // 4~11층: 22.80m
    const topBandH = centerTowerH - lowerFloorsH - midBandH; // 12층~처마: 15.00m

    const coreSubMasses = [
      { x: -0.9, z: -7.5, w: 2.6, d: 5.4, zFront: -10.2, peakH: 1.45 },
      { x: 1.3,  z: -7.2, w: 1.8, d: 4.8, zFront: -9.6,  peakH: 1.15 }
    ];

    coreSubMasses.forEach(cm => {
      const m1 = new THREE.Mesh(new THREE.BoxGeometry(cm.w, lowerFloorsH, cm.d), lowerOchreMat);
      m1.position.set(cm.x, lowerFloorsH / 2, cm.z);
      m1.castShadow = true;
      m1.receiveShadow = true;
      aptGroup.add(m1);

      const m2 = new THREE.Mesh(new THREE.BoxGeometry(cm.w, midBandH, cm.d), peachCreamMat);
      m2.position.set(cm.x, lowerFloorsH + midBandH / 2, cm.z);
      m2.castShadow = true;
      m2.receiveShadow = true;
      aptGroup.add(m2);

      const m3 = new THREE.Mesh(new THREE.BoxGeometry(cm.w, topBandH, cm.d), upperCreamMat);
      m3.position.set(cm.x, lowerFloorsH + midBandH + topBandH / 2, cm.z);
      m3.castShadow = true;
      m3.receiveShadow = true;
      addOutline(m3, 0x8c7b65);
      aptGroup.add(m3);

      addPointedGableRoofZ(
        cm.x,
        centerTowerH,
        cm.zFront,
        cm.d,
        cm.w,
        cm.peakH,
        upperCreamMat,
        darkRoofCapMat
      );
    });

    // 4) 옥상 방수 슬래브, 파라펫, 태양광 패널 및 통신 안테나 (13092.jpg 스카이뷰 반영)
    const roofSlabs = [
      { x: -13.4, z: 1.2,  w: 30.6, d: 11.4 },
      { x: 5.0,   z: -2.8, w: 5.2,  d: 10.2 },
      { x: 11.4,  z: -3.9, w: 6.8,  d: 10.8 },
      { x: 19.0,  z: -5.0, w: 7.4,  d: 11.4 }
    ];
    roofSlabs.forEach(r => {
      const rSlab = new THREE.Mesh(new THREE.BoxGeometry(r.w, 0.12, r.d), brownRoofMat);
      rSlab.position.set(r.x, totalH + 0.06, r.z);
      aptGroup.add(rSlab);
    });

    // 옥상 파라펫 테두리
    const parapets = [
      // 서쪽 날개 우측(서단~중간 코어 탑)
      { x: -23.0,  z: 7.04,   w: 12.0, d: 0.32 },
      { x: -23.0,  z: -4.64,  w: 12.0, d: 0.32 },
      { x: -28.84, z: 1.2,    w: 0.32, d: 12.0 },
      // 서쪽 날개 좌측(중간 코어 탑~SE 돌출 단차 벽)
      { x: -5.8,   z: 7.04,   w: 16.0, d: 0.32 },
      { x: -8.0,   z: -4.64,  w: 11.6, d: 0.32 },
      { x: 2.04,   z: 4.9,    w: 0.32, d: 4.6  }, // x = +2.2m 남동측 4.6m 단차 상단 파라펫
      // 동쪽 날개 1구간
      { x: 5.0,    z: 2.44,   w: 5.6,  d: 0.32 },
      { x: 5.0,    z: -8.04,  w: 5.6,  d: 0.32 },
      // 동쪽 날개 2구간 (1차 ㄴ자 단차 1.4m)
      { x: 11.4,   z: 1.64,   w: 7.2,  d: 0.32 },
      { x: 11.4,   z: -9.44,  w: 7.2,  d: 0.32 },
      { x: 7.96,   z: -8.90,  w: 0.32, d: 1.4  },
      // 동쪽 날개 3구간 (2차 ㄴ자 단차 1.4m)
      { x: 19.0,   z: 0.84,   w: 8.0,  d: 0.32 },
      { x: 19.0,   z: -10.84, w: 8.0,  d: 0.32 },
      { x: 15.16,  z: -10.30, w: 0.32, d: 1.4  },
      { x: 22.84,  z: -5.0,   w: 0.32, d: 12.0 }
    ];
    parapets.forEach(p => {
      const pm = new THREE.Mesh(new THREE.BoxGeometry(p.w, 0.78, p.d), upperCreamMat);
      pm.position.set(p.x, totalH + 0.39, p.z);
      aptGroup.add(pm);
    });

    // 동쪽 날개 북동 모서리 옥상 통신 안테나 클러스터 (13074_3.jpg 좌측 상단 반영)
    const antGroup = new THREE.Group();
    [[-0.3, 0], [0, 0.25], [0.3, -0.15], [0.1, 0.05]].forEach(([ax, az], i) => {
      const mast = new THREE.Mesh(
        new THREE.CylinderGeometry(0.05, 0.08, 1.8 + (i % 2) * 0.5, 8),
        sashFrameMat
      );
      mast.position.set(ax, 0.9, az);
      antGroup.add(mast);
    });
    antGroup.position.set(22.0, totalH + 0.78, -10.2);
    aptGroup.add(antGroup);

    // 옥상 태양광 패널 배열 (13092.jpg 스카이뷰 반영: 서쪽 날개 남동측 지붕면 2개 그룹)
    for (let sx = -12.5; sx <= 0.5; sx += 2.1) {
      const panel = new THREE.Mesh(new THREE.BoxGeometry(1.75, 0.08, 4.2), solarPanelMat);
      panel.position.set(sx, totalH + 0.55, 3.4);
      panel.rotation.x = 0.32;
      panel.castShadow = true;
      aptGroup.add(panel);
    }
    for (let sx = -26.5; sx <= -18.5; sx += 2.0) {
      const panel = new THREE.Mesh(new THREE.BoxGeometry(1.65, 0.08, 4.0), solarPanelMat);
      panel.position.set(sx, totalH + 0.55, 3.4);
      panel.rotation.x = 0.32;
      panel.castShadow = true;
      aptGroup.add(panel);
    }

    // 5) InstancedMesh 수집 배열
    const frameMatrices = [];
    const glassMatrices = [];
    const railMatrices  = [];
    const acMatrices    = [];
    const balcSolarMats = [];

    const dummy = new THREE.Object3D();
    function pushBox(arr, x, y, z, sx, sy, sz, rx = 0, ry = 0) {
      dummy.position.set(x, y, z);
      dummy.rotation.set(rx, ry, 0);
      dummy.scale.set(sx, sy, sz);
      dummy.updateMatrix();
      arr.push(dummy.matrix.clone());
    }

    function addWindowUnit(x, y, z, w, h, panes, normalDir, withHalfRail = false) {
      const t = 0.06;
      const m = 0.04;
      const d = 0.08;

      if (normalDir === '+Z' || normalDir === '-Z') {
        const s = normalDir === '+Z' ? 1 : -1;
        const zc = z + s * 0.01;
        pushBox(glassMatrices, x, y, zc + s * 0.005, w - t * 1.5, h - t * 1.5, 0.02);
        pushBox(frameMatrices, x, y + h / 2 - t / 2, zc, w, t, d);
        pushBox(frameMatrices, x, y - h / 2 + t / 2, zc, w, t, d);
        pushBox(frameMatrices, x - w / 2 + t / 2, y, zc, t, h, d);
        pushBox(frameMatrices, x + w / 2 - t / 2, y, zc, t, h, d);
        for (let p = 1; p < panes; p++) {
          const mx = x - w / 2 + (w / panes) * p;
          pushBox(frameMatrices, mx, y, zc, m, h - t, d);
        }

        if (withHalfRail) {
          const rz = z + s * 0.05;
          const fenceH = h * 0.50;
          const topY = y;
          const botY = y - fenceH + 0.03;
          const midY = (topY + botY) / 2;

          pushBox(railMatrices, x, topY, rz, w - 0.04, 0.045, 0.035);
          pushBox(railMatrices, x, botY, rz, w - 0.04, 0.045, 0.035);

          const bars = Math.max(8, Math.round(w / 0.22));
          const span = w - 0.12;
          for (let b = 0; b <= bars; b++) {
            const bx = x - span / 2 + (b / bars) * span;
            pushBox(railMatrices, bx, midY, rz, 0.022, fenceH - 0.03, 0.025);
          }
        }
      } else {
        const s = normalDir === '+X' ? 1 : -1;
        const xc = x + s * 0.01;
        pushBox(glassMatrices, xc + s * 0.005, y, z, 0.02, h - t * 1.5, w - t * 1.5);
        pushBox(frameMatrices, xc, y + h / 2 - t / 2, z, d, t, w);
        pushBox(frameMatrices, xc, y - h / 2 + t / 2, z, d, t, w);
        pushBox(frameMatrices, xc, y, z - w / 2 + t / 2, d, h, t);
        pushBox(frameMatrices, xc, y, z + w / 2 - t / 2, d, h, t);
        for (let p = 1; p < panes; p++) {
          const mz = z - w / 2 + (w / panes) * p;
          pushBox(frameMatrices, xc, y, mz, d, h - t, m);
        }

        if (withHalfRail) {
          const rx = x + s * 0.05;
          const fenceH = h * 0.50;
          const topY = y;
          const botY = y - fenceH + 0.03;
          const midY = (topY + botY) / 2;

          pushBox(railMatrices, rx, topY, z, 0.035, 0.045, w - 0.04);
          pushBox(railMatrices, rx, botY, z, 0.035, 0.045, w - 0.04);

          const bars = Math.max(8, Math.round(w / 0.22));
          const span = w - 0.12;
          for (let b = 0; b <= bars; b++) {
            const bz = z - span / 2 + (b / bars) * span;
            pushBox(railMatrices, rx, midY, bz, 0.025, fenceH - 0.03, 0.022);
          }
        }
      }
    }

    // ---------------------------------------------------------
    // A) 남동측 발코니 입면 (13054_2.jpg, 13056_2.jpg, 13092.jpg 반영)
    //    - 서쪽 날개 (z = +7.2m): 중간 수직 코어(x = -15.4m) 좌·우로 각각 3칸 발코니 배치
    //    - 동쪽 날개 (z = +2.6m / +1.8m / +1.0m): 4.6m 북서측으로 물러나 배치
    //    - x = +2.2m (z: +2.6 ~ +7.2m) 단차 측면벽은 창호 없는 매끈한 마감 벽체로 유지!
    // ---------------------------------------------------------
    const balcWinH = 1.66;
    const seBalcSpecs = [
      // 서쪽 날개 좌측 3열 (z = +7.2m, x: -29.0 ~ -17.0m)
      { x: -26.5, z: 7.2, w: 3.40, panes: 3, acOff: -1.1 },
      { x: -22.6, z: 7.2, w: 3.40, panes: 3, acOff: +1.1 },
      { x: -18.8, z: 7.2, w: 3.00, panes: 3, acOff: -0.9 },
      // x = -15.4 중간 수직 코어 스트립 (무창 벽체 -> 17층 뾰족 지붕까지 상승, 13054_2.jpg 중앙)
      // 서쪽 날개 우측 4열 (z = +7.2m, x: -13.8 ~ +2.2m)
      { x: -11.6, z: 7.2, w: 3.40, panes: 3, acOff: +1.1 },
      { x: -7.7,  z: 7.2, w: 3.40, panes: 3, acOff: -1.1 },
      { x: -3.8,  z: 7.2, w: 3.40, panes: 3, acOff: +1.1 },
      { x: +0.1,  z: 7.2, w: 3.20, panes: 3, acOff: -1.0 },
      // 동쪽 날개 (4.6m 후퇴하여 배치, 13056_2.jpg 우측 발코니 열)
      { x: +5.0,  z: 2.6, w: 4.20, panes: 4, acOff: -1.3 },
      { x: +11.4, z: 1.8, w: 5.40, panes: 4, acOff: +1.6 },
      { x: +19.0, z: 1.0, w: 6.20, panes: 4, acOff: -1.7 }
    ];

    seBalcSpecs.forEach((spec, idx) => {
      for (let f = 0; f < floors; f++) {
        const wy = f * floorH + 1.50;
        addWindowUnit(spec.x, wy, spec.z, spec.w, balcWinH, spec.panes, '+Z', true);

        if ((idx + f) % 2 === 0 && f >= 1) {
          pushBox(acMatrices, spec.x + spec.acOff, wy - 0.42, spec.z + 0.20, 0.68, 0.52, 0.32);
        }
        if ((idx * 3 + f) % 4 === 1 && f >= 2 && f <= 13) {
          pushBox(balcSolarMats, spec.x - spec.acOff * 0.4, wy - 0.34, spec.z + 0.22, 1.45, 0.72, 0.06);
        }
      }
    });

    // 남동측 외벽 하단 황토 기단부 수직 필라스터 기둥 돌출 (13054_2.jpg 하단 반영)
    [-28.5, -24.5, -20.7, -17.1, -13.7, -9.6, -5.7, -1.8, 1.9].forEach(px => {
      const pilaster = new THREE.Mesh(
        new THREE.BoxGeometry(0.55, lowerFloorsH + 0.4, 0.34),
        ochrePilasterMat
      );
      pilaster.position.set(px, (lowerFloorsH + 0.4) / 2, 7.2 + 0.17);
      pilaster.castShadow = true;
      aptGroup.add(pilaster);
    });

    // ---------------------------------------------------------
    // B) 북서측 복도식 연속 수평 창호 입면 (13074_3.jpg 반영)
    // ---------------------------------------------------------
    const corrWinH = 1.26;
    const corrModW = 1.72;

    // 1) 서쪽 날개 북서 복도면 (z = -4.8m): 1~15층 전 구간 일직선 연속 창호
    for (let f = 0; f < floors; f++) {
      const wy = f * floorH + 1.56;
      for (let cx = -27.8; cx <= -2.8; cx += corrModW) {
        addWindowUnit(cx, wy, -4.8, corrModW - 0.14, corrWinH, 2, '-Z', false);
        if (f < 3) {
          const panel = new THREE.Mesh(new THREE.BoxGeometry(corrModW - 0.34, 0.92, 0.05), ochrePilasterMat);
          panel.position.set(cx, f * floorH + 0.52, -4.81);
          aptGroup.add(panel);
        }
      }
    }

    // 서쪽 날개 중간 코어 탑 상부 2개 층(16·17층) 추가 창문 (13074_3.jpg 반영)
    for (let f = floors; f < floors + 2; f++) {
      const wy = f * floorH + 1.56;
      addWindowUnit(-15.4, wy, -4.8, 2.50, corrWinH, 3, '-Z', false);
    }

    // 2) 중앙 돌출 코어 타워 양 측면 수직 계단실 창호 열
    for (let f = 1; f < floors + 1; f++) {
      const sy = f * floorH + 1.48;
      // 우측면(서측면, x = -2.2m, -X향, z = -9.0m)
      addWindowUnit(-2.2, sy, -9.0, 1.35, 1.24, 2, '-X', false);
      // 좌측면(동측면, x = +2.2m, +X향, z = -8.9m)
      addWindowUnit(2.2, sy, -8.9, 0.92, 1.24, 1, '+X', false);
    }

    // 3) 동쪽 날개 (사진 왼쪽): 3단 계단식 돌출 + 2번 ㄴ자 창호 꺾임
    const eastSteps = [
      { xStart: 3.1,  xEnd: 7.0,  z: -8.2 },
      { xStart: 8.7,  xEnd: 14.2, z: -9.6 },
      { xStart: 15.9, xEnd: 22.1, z: -11.0 }
    ];

    eastSteps.forEach(st => {
      for (let f = 0; f < floors; f++) {
        const wy = f * floorH + 1.56;
        for (let cx = st.xStart; cx <= st.xEnd; cx += corrModW) {
          addWindowUnit(cx, wy, st.z, corrModW - 0.14, corrWinH, 2, '-Z', false);
          if (f < 3) {
            const panel = new THREE.Mesh(new THREE.BoxGeometry(corrModW - 0.34, 0.92, 0.05), ochrePilasterMat);
            panel.position.set(cx, f * floorH + 0.52, st.z - 0.01);
            aptGroup.add(panel);
          }
        }
      }
    });

    // 2번의 ㄴ자 꺾임 측면(-X향, 폭 1.4m) 복도 창호 열
    for (let f = 0; f < floors; f++) {
      const wy = f * floorH + 1.56;
      addWindowUnit(7.8,  wy, -8.9,  1.10, corrWinH, 1, '-X', false);
      addWindowUnit(15.0, wy, -10.3, 1.10, corrWinH, 1, '-X', false);
    }

    // ---------------------------------------------------------
    // C) 남서측(x = -29.0m) 및 북동측(x = +23.0m) 박공형 측벽 ('102')
    // ---------------------------------------------------------
    function buildEndWall(wallPos, rotationY, wallWidth, endMat) {
      const endGroup = new THREE.Group();
      endGroup.position.copy(wallPos);
      endGroup.rotation.y = rotationY;

      const plane = new THREE.Mesh(new THREE.PlaneGeometry(wallWidth, totalH), endMat);
      plane.position.set(0, totalH / 2, 0.01);
      plane.receiveShadow = true;
      endGroup.add(plane);

      const capShape = new THREE.Shape();
      capShape.moveTo(-wallWidth / 2, 0);
      capShape.lineTo(0, 1.05);
      capShape.lineTo(wallWidth / 2, 0);
      capShape.lineTo(-wallWidth / 2, 0);
      const capGeo = new THREE.ExtrudeGeometry(capShape, { depth: 0.35, bevelEnabled: false });
      const capMesh = new THREE.Mesh(capGeo, upperCreamMat);
      capMesh.position.set(0, totalH, -0.34);
      endGroup.add(capMesh);

      aptGroup.add(endGroup);
    }

    buildEndWall(new THREE.Vector3(-29.0, 0, 1.2), -Math.PI / 2, 12.0, endWallMatSW);
    buildEndWall(new THREE.Vector3(23.0, 0, -5.0), Math.PI / 2, 12.0, endWallMatNE);

    // ---------------------------------------------------------
    // D) InstancedMesh 일괄 렌더링
    // ---------------------------------------------------------
    function buildInstanced(matrices, geo, mat) {
      const mesh = new THREE.InstancedMesh(geo, mat, matrices.length);
      matrices.forEach((m, i) => mesh.setMatrixAt(i, m));
      mesh.instanceMatrix.needsUpdate = true;
      aptGroup.add(mesh);
      return mesh;
    }

    const unitBoxGeo = new THREE.BoxGeometry(1, 1, 1);
    buildInstanced(frameMatrices, unitBoxGeo, sashFrameMat);
    buildInstanced(glassMatrices, unitBoxGeo, windowGlassMat);
    buildInstanced(railMatrices,  unitBoxGeo, silverRailingMat);
    buildInstanced(acMatrices,    unitBoxGeo, acUnitMat);
    buildInstanced(balcSolarMats, unitBoxGeo, solarPanelMat);

    // ---------------------------------------------------------
    // E) 건물 외곽 조경수 배치 (주변 건물 및 도로 구조물 제외)
    // ---------------------------------------------------------
    function addTree(x, z, scale = 1.0, isPine = false) {
      const g = new THREE.Group();
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.14 * scale, 0.22 * scale, 2.3 * scale, 8),
        new THREE.MeshStandardMaterial({ color: '#4A3728', roughness: 0.9 })
      );
      trunk.position.y = 1.15 * scale;
      trunk.castShadow = true;
      g.add(trunk);

      const leafMat = new THREE.MeshStandardMaterial({
        color: isPine ? '#1E4620' : '#3B6E35',
        roughness: 0.85
      });
      const blobs = isPine
        ? [[0, 3.0, 0, 1.35], [-0.7, 2.4, 0.3, 0.95], [0.7, 2.6, -0.2, 1.0], [0, 3.8, 0, 0.9]]
        : [[0, 3.3, 0, 1.7], [-0.9, 2.8, 0.5, 1.25], [0.9, 2.9, -0.4, 1.3], [0.2, 4.2, 0.2, 1.2]];

      blobs.forEach(([bx, by, bz, r]) => {
        const crown = new THREE.Mesh(new THREE.DodecahedronGeometry(r * scale, 1), leafMat);
        crown.position.set(bx * scale, by * scale, bz * scale);
        crown.castShadow = true;
        g.add(crown);
      });

      g.position.set(x, 0.0, z);
      aptGroup.add(g);
    }

    [
      // 남동측 화단 수목 (13054_2.jpg, 13056_2.jpg 반영)
      [-26.5, 9.6], [-21.0, 9.6], [-15.5, 9.6], [-10.0, 9.6], [-4.5, 9.6], [0.5, 9.6],
      [5.5, 5.0], [11.5, 4.2], [19.0, 3.4],
      // 북서측 조경수 (13074_3.jpg 반영)
      [-22.0, -7.2], [-15.5, -7.2], [-8.5, -7.2],
      [4.8, -10.6], [11.2, -12.0], [19.0, -13.4]
    ].forEach(([tx, tz], i) => {
      addTree(tx, tz, 1.15 + (i % 3) * 0.15, i % 2 === 0);
    });

    // 5. GLB 3D 파일 추출 기능
    window.exportGLB = () => {
      const exporter = new GLTFExporter();
      exporter.parse(
        aptGroup,
        (result) => {
          const blob = new Blob([result], { type: 'model/gltf-binary' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = 'Haengdang_Daelim_102.glb';
          link.click();
          URL.revokeObjectURL(url);
        },
        (err) => console.error('GLB 추출 오류:', err),
        { binary: true }
      );
    };

    // 6. 렌더링 루프
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
