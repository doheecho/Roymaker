<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>서울금북초등학교 3D 모델링 (실사 외벽 질감 및 스카이뷰 정밀 반영)</title>
  <style>
    body { margin: 0; overflow: hidden; background: #262b33; }
    #info {
      position: absolute; top: 14px; left: 16px; color: #fff;
      font-family: 'Malgun Gothic', sans-serif; font-size: 12.5px;
      background: rgba(18, 22, 28, 0.88); padding: 10px 14px;
      border-radius: 8px; border: 1px solid rgba(255,255,255,0.18);
      pointer-events: none; line-height: 1.55; max-width: 600px;
    }
    #controls-ui {
      position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
      display: flex; flex-wrap: wrap; justify-content: center; gap: 6px;
      background: rgba(18, 22, 28, 0.90); padding: 10px 12px;
      border-radius: 10px; border: 1px solid rgba(255,255,255,0.18);
      max-width: 98vw;
    }
    button {
      background: #374151; color: #fff; border: 1px solid #4b5563;
      padding: 5px 9px; border-radius: 6px; cursor: pointer; font-size: 11.5px;
      font-family: 'Malgun Gothic', sans-serif; transition: 0.15s;
    }
    button:hover { background: #2563eb; border-color: #93c5fd; }
    button.sky-btn { background: #1e3a8a; border-color: #3b82f6; }
    button.ground-btn { background: #0f766e; border-color: #2dd4bf; }
    button.export-btn { background: #b45309; border-color: #f59e0b; font-weight: bold; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="info">
    <strong>서울금북초등학교 3D 모델링 — 실사 외벽 질감 &amp; 스카이뷰 배치 반영</strong><br/>
    · 서측 남→북 옥색 동(4F · 가로 6칸 · 1F 캐노피 통로) + 북단 노란 뾰족지붕 통창 코어 + 90° 곡선 색면 모자이크 통로<br/>
    · 중앙 서→동 옥색 주동(4F · 가로 10칸 · 옥색/백색 교차 스팬드럴 · 상단 표어/시계/교명) + 북측 후면동 연결 브릿지<br/>
    · 동측 노란 뾰족지붕 코어 + 갈색 벽돌·회색 콘크리트 복합 외벽 동(1F 벽돌 필로티 · 소창-대창3-소창)
  </div>

  <div id="controls-ui">
    <button class="sky-btn" onclick="setView('sky_se')">1. 스카이뷰 남동</button>
    <button class="sky-btn" onclick="setView('sky_e')">2. 스카이뷰 동</button>
    <button class="sky-btn" onclick="setView('sky_ne')">3. 스카이뷰 북동</button>
    <button class="sky-btn" onclick="setView('sky_n')">4. 스카이뷰 북</button>
    <button class="sky-btn" onclick="setView('sky_nw')">5. 스카이뷰 북서</button>
    <button class="sky-btn" onclick="setView('sky_w')">6. 스카이뷰 서</button>
    <button class="sky-btn" onclick="setView('sky_sw')">7. 스카이뷰 남서</button>
    <button class="sky-btn" onclick="setView('sky_s')">8. 스카이뷰 남</button>
    <button class="sky-btn" onclick="setView('top_map')">9. 탑뷰 (지도 구도)</button>
    <button class="ground-btn" onclick="setView('ground_front')">10. 본관 정면 (12571 구도)</button>
    <button class="ground-btn" onclick="setView('ground_west')">11. 서측동·운동장 (12572 구도)</button>
    <button class="ground-btn" onclick="setView('ground_brown')">12. 갈색 필로티동 (12576 구도)</button>
    <button class="export-btn" onclick="exportGLB()">3D 추출 (.glb)</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#8FB3D9');

    const camera = new THREE.PerspectiveCamera(44, window.innerWidth / window.innerHeight, 0.5, 1400);
    // 초기 시점: 본관 정면 & 좌측 곡선통로가 잘 보이는 구도 (12571_2.png)
    camera.position.set(6, 7.2, 54);

    const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(8, 8.2, -24);
    controls.enableDamping = true;
    controls.update();

    // 좌표계: -Z = 북(N), +Z = 남(S), -X = 서(W), +X = 동(E)
    window.setView = (viewName) => {
      const views = {
        sky_se:       { pos: [118, 92, 118],   target: [4, 6, -4] },
        sky_e:        { pos: [160, 92, -4],    target: [4, 6, -4] },
        sky_ne:       { pos: [118, 92, -124],  target: [4, 6, -4] },
        sky_n:        { pos: [4, 92, -162],    target: [4, 6, -4] },
        sky_nw:       { pos: [-114, 92, -124], target: [4, 6, -4] },
        sky_w:        { pos: [-156, 92, -4],   target: [4, 6, -4] },
        sky_sw:       { pos: [-114, 92, 118],  target: [4, 6, -4] },
        sky_s:        { pos: [4, 92, 160],     target: [4, 6, -4] },
        top_map:      { pos: [4, 185, -3.99],  target: [4, 4, -4] },
        ground_front: { pos: [6, 7.2, 54],     target: [8, 8.2, -24] },
        ground_west:  { pos: [12, 6.2, 46],    target: [-38, 7.5, 4] },
        ground_brown: { pos: [92, 4.6, 8],     target: [76, 6.8, -28] }
      };
      const v = views[viewName];
      if (!v) return;
      camera.position.set(...v.pos);
      controls.target.set(...v.target);
      controls.update();
    };

    scene.add(new THREE.AmbientLight(0xffffff, 0.88));

    const sun = new THREE.DirectionalLight(0xfffdf5, 1.15);
    sun.position.set(85, 145, 75);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -130;
    sun.shadow.camera.right = 130;
    sun.shadow.camera.top = 130;
    sun.shadow.camera.bottom = -130;
    scene.add(sun);

    const fill = new THREE.DirectionalLight(0xdbeafe, 0.48);
    fill.position.set(-95, 80, -75);
    scene.add(fill);

    function makeTex(canvas) {
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      return tex;
    }

    function addOutline(mesh, color = 0x1e293b) {
      const edges = new THREE.EdgesGeometry(mesh.geometry, 26);
      mesh.add(new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color })));
    }

    // =========================================================
    // 1. 옥색 교실동 실사 외벽 텍스처 (12571_2.png / 12572.jpg 정밀 반영)
    //    - 상단 옥색 파라펫 + "꿈 보람 기쁨이 가득한 [시계] 서울금북초등학교"
    //    - 4층 위/아래 스팬드럴 = 옥색(#45B2AF), 3층·2층 아래 스팬드럴 = 백색(#F3F6F8)
    //    - 4×2 분할 교실창 + 하부 백색 루버 패널 + 수직 돌출 옥색 필러
    // =========================================================
    function createMintWingTexture(baysCount, includeSchoolSign = false) {
      const floors = 4;
      const canvas = document.createElement('canvas');
      canvas.width = baysCount * 256;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');

      const copingH = 18;
      const signBandH = includeSchoolSign ? 114 : 62;
      const bodyTop = copingH + signBandH;
      const bodyH = canvas.height - bodyTop;
      const floorH = bodyH / floors;
      const bayW = canvas.width / baysCount;

      // 최상단 밝은 회백색 파라펫 갓돌
      ctx.fillStyle = '#E2E8F0';
      ctx.fillRect(0, 0, canvas.width, copingH);

      // 상단 옥색 표어 밴드
      ctx.fillStyle = '#45B2AF';
      ctx.fillRect(0, copingH, canvas.width, signBandH);

      // 판넬 세로 줄눈
      ctx.strokeStyle = 'rgba(20, 60, 65, 0.25)';
      ctx.lineWidth = 2;
      for (let sx = 0; sx < canvas.width; sx += bayW / 2) {
        ctx.beginPath();
        ctx.moveTo(sx, copingH);
        ctx.lineTo(sx, copingH + signBandH);
        ctx.stroke();
      }

      if (includeSchoolSign) {
        const midY = copingH + signBandH * 0.54;
        ctx.font = 'bold 40px "Malgun Gothic", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        // 입체 글자 그림자 + 청록/금빛 글자 ("꿈 보람 기쁨이 가득한")
        const leftText = '꿈  보 람  기 쁨 이  가 득 한';
        ctx.fillStyle = '#134E4A';
        ctx.fillText(leftText, canvas.width * 0.28 + 2, midY + 2);
        ctx.fillStyle = '#1E3A3A';
        ctx.fillText(leftText, canvas.width * 0.28, midY);

        // 중앙 원형 아날로그 시계 (5칸과 6칸 경계)
        const cx = canvas.width * 0.50;
        ctx.beginPath();
        ctx.arc(cx, midY, 27, 0, Math.PI * 2);
        ctx.fillStyle = '#475569';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(cx, midY, 22, 0, Math.PI * 2);
        ctx.fillStyle = '#F8FAFC';
        ctx.fill();
        ctx.strokeStyle = '#1E293B';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(cx, midY);
        ctx.lineTo(cx, midY - 13);
        ctx.moveTo(cx, midY);
        ctx.lineTo(cx + 10, midY + 4);
        ctx.stroke();

        // 우측 교명 ("서울금북초등학교")
        const rightText = '서 울 금 북 초 등 학 교';
        ctx.fillStyle = '#78350F';
        ctx.fillText(rightText, canvas.width * 0.72 + 2, midY + 2);
        ctx.fillStyle = '#FDE047';
        ctx.fillText(rightText, canvas.width * 0.72, midY);
      }

      // 4개 층 입면 그리기 (위에서부터 4F, 3F, 2F, 1F)
      for (let f = 0; f < floors; f++) {
        const floorNum = 4 - f; // 4, 3, 2, 1
        const y = bodyTop + f * floorH;
        const winH = floorH * 0.66;
        const spandrelH = floorH - winH;

        // 창호 영역 배경 (옥색 기둥 사이)
        ctx.fillStyle = '#45B2AF';
        ctx.fillRect(0, y, canvas.width, winH);

        for (let b = 0; b < baysCount; b++) {
          const bx = b * bayW;
          const pillarW = 24;
          const winX = bx + pillarW * 0.5;
          const winW = bayW - pillarW;
          const winY = y + 4;
          const innerWinH = winH - 8;

          // 창문 유리 그라데이션 (실사 청회색 반사 유리)
          const grad = ctx.createLinearGradient(winX, winY, winX, winY + innerWinH);
          grad.addColorStop(0, '#293B42');
          grad.addColorStop(0.55, '#3E555E');
          grad.addColorStop(1, '#223036');
          ctx.fillStyle = grad;
          ctx.fillRect(winX, winY, winW, innerWinH);

          // 알루미늄 창틀 (세로 4칸 × 가로 상부고정창/하부미닫이창)
          ctx.strokeStyle = '#CBD5E1';
          ctx.lineWidth = 3;
          ctx.strokeRect(winX, winY, winW, innerWinH);

          const transY = winY + innerWinH * 0.34;
          ctx.beginPath();
          ctx.moveTo(winX, transY);
          ctx.lineTo(winX + winW, transY);
          ctx.stroke();

          for (let p = 1; p < 4; p++) {
            const px = winX + (winW * p) / 4;
            ctx.beginPath();
            ctx.moveTo(px, winY);
            ctx.lineTo(px, winY + innerWinH);
            ctx.stroke();
          }

          // 일부 창문 하단 백색 환기 루버/에어컨 실외기 디테일 (12571_2.png)
          if (floorNum >= 2) {
            const paneW = winW / 4;
            const louverH = (innerWinH - innerWinH * 0.34) * 0.42;
            const louverY = winY + innerWinH - louverH - 3;
            [0, 3].forEach(idx => {
              if ((b + floorNum + idx) % 2 === 0) {
                ctx.fillStyle = '#E2E8F0';
                ctx.fillRect(winX + idx * paneW + 4, louverY, paneW - 8, louverH);
                ctx.strokeStyle = '#64748B';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(winX + idx * paneW + 4, louverY, paneW - 8, louverH);
              }
            });
          }
        }

        // 창호 아래 수평 스팬드럴 띠 (4층 아래=옥색, 3층·2층 아래=백색, 1층 아래=기단 회색)
        const sy = y + winH;
        if (floorNum === 4) {
          ctx.fillStyle = '#45B2AF';
        } else if (floorNum === 3 || floorNum === 2) {
          ctx.fillStyle = '#F3F6F8';
        } else {
          ctx.fillStyle = '#64748B';
        }
        ctx.fillRect(0, sy, canvas.width, spandrelH);

        // 스팬드럴 상·하 몰딩 라인
        ctx.fillStyle = 'rgba(15, 23, 42, 0.22)';
        ctx.fillRect(0, sy, canvas.width, 3);
        ctx.fillRect(0, sy + spandrelH - 3, canvas.width, 3);
      }

      // 전 층을 관통하는 옥색 수직 기둥 (Pilasters) — 스팬드럴 위를 지나가도록 마지막에 그림!
      for (let b = 0; b <= baysCount; b++) {
        const isCenterPier = includeSchoolSign && b === Math.floor(baysCount / 2);
        const pw = isCenterPier ? 34 : 24;
        const px = Math.max(0, Math.min(canvas.width - pw, b * bayW - pw / 2));

        ctx.fillStyle = '#45B2AF';
        ctx.fillRect(px, bodyTop, pw, bodyH);

        // 기둥 입체 음영 테두리
        ctx.fillStyle = '#67D1CE';
        ctx.fillRect(px, bodyTop, 3, bodyH);
        ctx.fillStyle = '#2C8A87';
        ctx.fillRect(px + pw - 3, bodyTop, 3, bodyH);
      }

      return makeTex(canvas);
    }

    // 옥색 건물 단부 측벽 텍스처 (12572.jpg 좌측 단부: 옥색 기둥 + 백색 띠 + 환기창)
    function createMintSideWallTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#45B2AF';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#E2E8F0';
      ctx.fillRect(0, 0, canvas.width, 18);

      const bodyTop = 80;
      const floorH = (canvas.height - bodyTop) / 4;
      for (let f = 0; f < 4; f++) {
        const floorNum = 4 - f;
        const y = bodyTop + f * floorH;
        const winH = floorH * 0.66;
        if (floorNum === 3 || floorNum === 2) {
          ctx.fillStyle = '#F3F6F8';
          ctx.fillRect(36, y + winH, canvas.width - 72, floorH - winH);
        }
        // 중앙 소형 계단실/복도 창
        ctx.fillStyle = '#273840';
        ctx.fillRect(canvas.width * 0.42, y + winH * 0.25, canvas.width * 0.16, winH * 0.5);
        ctx.strokeStyle = '#E2E8F0';
        ctx.lineWidth = 3;
        ctx.strokeRect(canvas.width * 0.42, y + winH * 0.25, canvas.width * 0.16, winH * 0.5);
      }
      return makeTex(canvas);
    }

    // =========================================================
    // 2. 노란 뾰족지붕 통창 코어 (12570.jpg / 12571_2.png / 12594_2.jpg 정밀 반영)
    // =========================================================
    function createYellowCurtainCore(width, depth, height = 14.2, peakH = 2.5, hasCrest = false) {
      const group = new THREE.Group();

      const yellowMat = new THREE.MeshStandardMaterial({ color: '#E8C547', roughness: 0.58 });
      const yellowDarkMat = new THREE.MeshStandardMaterial({ color: '#C9A42C', roughness: 0.65 });

      // 2~4층 암녹색 커튼월 통창 텍스처 + 1층 출입구 영역
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');

      // 좌우 노란 기둥 프레임
      ctx.fillStyle = '#E8C547';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const frameMargin = 58;
      const cwW = canvas.width - frameMargin * 2;
      const cwTop = 24;
      const cwH = canvas.height * 0.74;

      // 커튼월 유리 바탕
      const grad = ctx.createLinearGradient(frameMargin, cwTop, frameMargin + cwW, cwTop + cwH);
      grad.addColorStop(0, '#23444A');
      grad.addColorStop(0.5, '#356068');
      grad.addColorStop(1, '#1C363B');
      ctx.fillStyle = grad;
      ctx.fillRect(frameMargin, cwTop, cwW, cwH);

      // 커튼월 세로·가로 멀리언 그리드 (3개 층 × 4열)
      ctx.strokeStyle = '#4B777A';
      ctx.lineWidth = 5;
      for (let c = 0; c <= 4; c++) {
        const gx = frameMargin + (cwW * c) / 4;
        ctx.beginPath(); ctx.moveTo(gx, cwTop); ctx.lineTo(gx, cwTop + cwH); ctx.stroke();
      }
      for (let r = 0; r <= 6; r++) {
        const gy = cwTop + (cwH * r) / 6;
        ctx.lineWidth = (r % 2 === 0) ? 8 : 3;
        ctx.beginPath(); ctx.moveTo(frameMargin, gy); ctx.lineTo(frameMargin + cwW, gy); ctx.stroke();
      }

      // 1층 현관 유리문 영역
      const doorTop = cwTop + cwH + 28;
      const doorH = canvas.height - doorTop - 16;
      ctx.fillStyle = '#1E293B';
      ctx.fillRect(frameMargin + 12, doorTop, cwW - 24, doorH);
      ctx.strokeStyle = '#94A3B8';
      ctx.lineWidth = 4;
      ctx.strokeRect(frameMargin + 12, doorTop, cwW - 24, doorH);

      const curtainMat = new THREE.MeshStandardMaterial({
        map: makeTex(canvas),
        roughness: 0.28,
        metalness: 0.30
      });

      const body = new THREE.Mesh(
        new THREE.BoxGeometry(width, height, depth),
        [yellowMat, yellowMat, new THREE.MeshStandardMaterial({ color: '#4ADE80', roughness: 0.8 }), yellowMat, curtainMat, curtainMat]
      );
      body.position.y = height / 2;
      body.castShadow = true;
      body.receiveShadow = true;
      addOutline(body);
      group.add(body);

      // 지붕이 뾰족한 삼각 박공 파라펫
      const shape = new THREE.Shape();
      shape.moveTo(-width / 2, 0);
      shape.lineTo(width / 2, 0);
      shape.lineTo(0, peakH);
      shape.closePath();

      const gableGeo = new THREE.ExtrudeGeometry(shape, { depth: depth + 0.16, bevelEnabled: false });
      gableGeo.translate(0, 0, -(depth + 0.16) / 2);
      const gable = new THREE.Mesh(gableGeo, yellowMat);
      gable.position.y = height;
      gable.castShadow = true;
      addOutline(gable);
      group.add(gable);

      // 박공 중앙 원형 시계/교표 메달리온 (12571_2.png / 12594_2.jpg)
      const medallion = new THREE.Mesh(
        new THREE.CylinderGeometry(0.75, 0.75, depth + 0.26, 24),
        new THREE.MeshStandardMaterial({ color: hasCrest ? '#2E7D32' : '#F8FAFC', roughness: 0.4 })
      );
      medallion.rotation.x = Math.PI / 2;
      medallion.position.set(0, height + peakH * 0.44, 0);
      group.add(medallion);

      // 1층 출입구 옥색 돌출 캐노피 처마 (12570.jpg / 12571_2.png)
      const canopy = new THREE.Mesh(
        new THREE.BoxGeometry(width + 0.4, 0.42, depth + 1.8),
        new THREE.MeshStandardMaterial({ color: '#2B9398', roughness: 0.5 })
      );
      canopy.position.set(0, 3.3, 0);
      canopy.castShadow = true;
      addOutline(canopy);
      group.add(canopy);

      return group;
    }

    // =========================================================
    // 3. 90도 둥근 연결통로 생성기 (12570.jpg / 12571_2.png / 12597.jpg)
    //    - 연녹색 격자 창문 + 중앙 알록달록 색면 모자이크 + 1F 석재 기단
    // =========================================================
    function createCurvedConnectorBridge(centerX, centerZ, radius, width, height = 13.8) {
      const group = new THREE.Group();

      // 색면 모자이크가 포함된 연녹색 격자 커튼월 텍스처
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      // 1층 하부 다크 옹벽/기단
      ctx.fillStyle = '#3F4447';
      ctx.fillRect(0, canvas.height * 0.72, canvas.width, canvas.height * 0.28);

      // 2~4층 연녹색 창호 배경
      ctx.fillStyle = '#538678';
      ctx.fillRect(0, 24, canvas.width, canvas.height * 0.70);

      // 상부 녹색 파라펫 띠
      ctx.fillStyle = '#4A8B71';
      ctx.fillRect(0, 0, canvas.width, 28);

      // 중앙 알록달록 색면 모자이크 패널 (12571_2.png 좌측 곡선통로 디테일)
      const mosaicColors = ['#EF4444', '#3B82F6', '#FACC15', '#38BDF8', '#22C55E', '#F97316'];
      const startMx = canvas.width * 0.34;
      const startMy = canvas.height * 0.36;
      const cellW = 42;
      const cellH = 38;
      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 7; c++) {
          ctx.fillStyle = mosaicColors[(r * 3 + c) % mosaicColors.length];
          ctx.fillRect(startMx + c * cellW, startMy + r * cellH, cellW - 3, cellH - 3);
        }
      }

      // 노란빛/연녹색 격자 창틀 프레임
      ctx.strokeStyle = '#C8D678';
      ctx.lineWidth = 4;
      for (let gx = 0; gx <= canvas.width; gx += 42) {
        ctx.beginPath(); ctx.moveTo(gx, 24); ctx.lineTo(gx, canvas.height * 0.72); ctx.stroke();
      }
      for (let gy = 24; gy <= canvas.height * 0.72; gy += 38) {
        ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(canvas.width, gy); ctx.stroke();
      }

      const curvedWallMat = new THREE.MeshStandardMaterial({
        map: makeTex(canvas),
        roughness: 0.45,
        side: THREE.DoubleSide
      });
      const roofMat = new THREE.MeshStandardMaterial({ color: '#58A868', roughness: 0.8 });

      // 90도 부채꼴 호(Arc) 압출 지오메트리 (내경 rIn ~ 외경 rOut)
      const rIn = radius - width / 2;
      const rOut = radius + width / 2;
      const arcShape = new THREE.Shape();
      // 각도: PI (서쪽 -X) -> 1.5*PI (북쪽 -Z)
      const segs = 28;
      for (let i = 0; i <= segs; i++) {
        const a = Math.PI + (Math.PI / 2) * (i / segs);
        const x = Math.cos(a) * rOut;
        const y = Math.sin(a) * rOut;
        if (i === 0) arcShape.moveTo(x, y);
        else arcShape.lineTo(x, y);
      }
      for (let i = segs; i >= 0; i--) {
        const a = Math.PI + (Math.PI / 2) * (i / segs);
        const x = Math.cos(a) * rIn;
        const y = Math.sin(a) * rIn;
        arcShape.lineTo(x, y);
      }
      arcShape.closePath();

      const extrudeGeo = new THREE.ExtrudeGeometry(arcShape, { depth: height, bevelEnabled: false });
      extrudeGeo.rotateX(Math.PI / 2);

      const bridgeMesh = new THREE.Mesh(extrudeGeo, [roofMat, curvedWallMat]);
      bridgeMesh.position.set(centerX, height, centerZ);
      bridgeMesh.castShadow = true;
      bridgeMesh.receiveShadow = true;
      addOutline(bridgeMesh);
      group.add(bridgeMesh);

      return group;
    }

    // =========================================================
    // 4. 우측 갈색 벽돌 & 회색 콘크리트 필로티 동 생성기 (12576.jpg 실사 질감)
    //    - 5칸 구성: [소창(절반)] + [교실창 3칸] + [소창(절반)] (열 폭은 모두 동일)
    //    - 수직 기둥 & 처마 = 적갈색/황토빛 벽돌 타일, 창 하부 수평띠 = 밝은 회색 콘크리트
    //    - 1층 = 벽돌 기둥이 받치는 개방형 필로티 구조
    // =========================================================
    function createBrickTileTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#A87452';
      ctx.fillRect(0, 0, 256, 256);

      const rows = 16;
      const cols = 6;
      const rh = 256 / rows;
      const cw = 256 / cols;

      for (let r = 0; r < rows; r++) {
        const offset = (r % 2) * (cw * 0.5);
        for (let c = -1; c <= cols; c++) {
          const shade = ((r * 7 + c * 13) % 5) * 4 - 8;
          ctx.fillStyle = `rgb(${168 + shade}, ${116 + Math.round(shade * 0.7)}, ${82 + Math.round(shade * 0.5)})`;
          ctx.fillRect(c * cw + offset + 1, r * rh + 1, cw - 2, rh - 2);
        }
      }
      return makeTex(canvas);
    }

    function createBrownPilotiWing(bayWidth, depth = 11.4, floorH = 3.45) {
      const group = new THREE.Group();
      const bayTypes = ['half', 'full', 'full', 'full', 'half']; // 5칸
      const totalWidth = bayWidth * bayTypes.length;
      const upperFloors = 3; // 2~4층
      const upperH = upperFloors * floorH;

      const brickTex = createBrickTileTexture();
      const brickMat = new THREE.MeshStandardMaterial({ map: brickTex, roughness: 0.78 });

      // 1) 1층 필로티 적갈색 벽돌 사각 기둥 (전면·후면 각 6개)
      const colCount = bayTypes.length + 1;
      for (let i = 0; i < colCount; i++) {
        const cx = -totalWidth / 2 + i * bayWidth;
        [-depth / 2 + 0.48, depth / 2 - 0.48].forEach(cz => {
          const col = new THREE.Mesh(new THREE.BoxGeometry(0.76, floorH, 0.76), brickMat);
          col.position.set(cx, floorH / 2, cz);
          col.castShadow = true;
          col.receiveShadow = true;
          addOutline(col);
          group.add(col);
        });
      }

      // 1층 내부 후퇴된 적갈색 벽돌 코어벽 (필로티 안쪽 실사 구조)
      const innerCore = new THREE.Mesh(
        new THREE.BoxGeometry(totalWidth - 2.2, floorH - 0.1, depth - 3.6),
        brickMat
      );
      innerCore.position.set(0, floorH / 2, -0.4);
      innerCore.castShadow = true;
      innerCore.receiveShadow = true;
      addOutline(innerCore);
      group.add(innerCore);

      // 2) 2~4층 적갈색 벽돌 수직 기둥 + 밝은 회색 콘크리트 수평 스팬드럴 텍스처 (12576.jpg)
      const canvas = document.createElement('canvas');
      canvas.width = bayTypes.length * 256;
      canvas.height = 768;
      const ctx = canvas.getContext('2d');
      const fh = canvas.height / upperFloors;
      const bw = canvas.width / bayTypes.length;

      // 상부 처마 적갈색 벽돌 띠
      ctx.fillStyle = '#A67250';
      ctx.fillRect(0, 0, canvas.width, 32);

      for (let f = 0; f < upperFloors; f++) {
        const y = 32 + f * ((canvas.height - 32) / upperFloors);
        const curFh = (canvas.height - 32) / upperFloors;
        const winH = curFh * 0.62;
        const spandrelH = curFh - winH;

        // 창호 영역 배경
        ctx.fillStyle = '#A67250';
        ctx.fillRect(0, y, canvas.width, winH);

        // 창문 아래 밝은 회색 노출 콘크리트 수평 띠벽 (12576.jpg 실사 질감)
        const sy = y + winH;
        const concGrad = ctx.createLinearGradient(0, sy, 0, sy + spandrelH);
        concGrad.addColorStop(0, '#A8A8A3');
        concGrad.addColorStop(0.25, '#C2C2BD');
        concGrad.addColorStop(1, '#B2B2AD');
        ctx.fillStyle = concGrad;
        ctx.fillRect(0, sy, canvas.width, spandrelH);

        // 콘크리트 띠벽 상하 줄눈 & 미세 웨더링
        ctx.fillStyle = 'rgba(40, 40, 38, 0.28)';
        ctx.fillRect(0, sy, canvas.width, 3);
        ctx.fillRect(0, sy + spandrelH - 3, canvas.width, 3);

        bayTypes.forEach((bType, idx) => {
          const bx = idx * bw;
          // 열 폭(bw)은 모두 동일, 창문만 교실창(full) 또는 절반 너비 소창(half)
          const winRatio = bType === 'half' ? 0.38 : 0.78;
          const panes = bType === 'half' ? 2 : 4;
          const winW = bw * winRatio;
          const winX = bx + (bw - winW) / 2;
          const winY = y + 6;
          const innerWinH = winH - 12;

          ctx.fillStyle = '#29353B';
          ctx.fillRect(winX, winY, winW, innerWinH);
          ctx.strokeStyle = '#CBD5E1';
          ctx.lineWidth = 3;
          ctx.strokeRect(winX, winY, winW, innerWinH);

          // 상부 고정창 가로 바
          const transY = winY + innerWinH * 0.34;
          ctx.beginPath();
          ctx.moveTo(winX, transY);
          ctx.lineTo(winX + winW, transY);
          ctx.stroke();

          // 세로 창살
          for (let p = 1; p < panes; p++) {
            const px = winX + (winW * p) / panes;
            ctx.beginPath();
            ctx.moveTo(px, winY);
            ctx.lineTo(px, winY + innerWinH);
            ctx.stroke();
          }

          // 하부 백색 환기 루버 패널 (12576.jpg)
          if (bType === 'full') {
            const paneW = winW / 4;
            const lh = (innerWinH - innerWinH * 0.34) * 0.42;
            const ly = winY + innerWinH - lh - 3;
            [0, 3].forEach(pIdx => {
              ctx.fillStyle = '#E2E8F0';
              ctx.fillRect(winX + pIdx * paneW + 4, ly, paneW - 8, lh);
            });
          } else {
            const paneW = winW / 2;
            const lh = (innerWinH - innerWinH * 0.34) * 0.42;
            const ly = winY + innerWinH - lh - 3;
            ctx.fillStyle = '#E2E8F0';
            ctx.fillRect(winX + paneW + 4, ly, paneW - 8, lh);
          }
        });
      }

      // 전 층을 관통하는 적갈색 벽돌 수직 기둥 (12576.jpg)
      for (let i = 0; i <= bayTypes.length; i++) {
        const pw = 36;
        const px = Math.max(0, Math.min(canvas.width - pw, i * bw - pw / 2));
        ctx.fillStyle = '#A4704E';
        ctx.fillRect(px, 0, pw, canvas.height);

        // 벽돌 수평 줄눈 디테일
        ctx.fillStyle = 'rgba(75, 45, 28, 0.32)';
        for (let by = 0; by < canvas.height; by += 12) {
          ctx.fillRect(px, by, pw, 2);
        }
      }

      // 동측 단부 벽돌 측벽 텍스처 (12576.jpg 우측면 2~4층 2칸 창호)
      const sideCanvas = document.createElement('canvas');
      sideCanvas.width = 512;
      sideCanvas.height = 768;
      const sctx = sideCanvas.getContext('2d');
      sctx.fillStyle = '#A4704E';
      sctx.fillRect(0, 0, 512, 768);
      sctx.fillStyle = 'rgba(75, 45, 28, 0.25)';
      for (let by = 0; by < 768; by += 12) {
        sctx.fillRect(0, by, 512, 2);
      }
      for (let f = 0; f < upperFloors; f++) {
        const wy = 48 + f * 240;
        sctx.fillStyle = '#29353B';
        sctx.fillRect(190, wy, 132, 136);
        sctx.strokeStyle = '#CBD5E1';
        sctx.lineWidth = 4;
        sctx.strokeRect(190, wy, 132, 136);
        sctx.beginPath();
        sctx.moveTo(256, wy);
        sctx.lineTo(256, wy + 136);
        sctx.moveTo(190, wy + 46);
        sctx.lineTo(322, wy + 46);
        sctx.stroke();
      }

      const upperFrontMat = new THREE.MeshStandardMaterial({ map: makeTex(canvas), roughness: 0.72 });
      const sideWallMat   = new THREE.MeshStandardMaterial({ map: makeTex(sideCanvas), roughness: 0.78 });
      const roofMat       = new THREE.MeshStandardMaterial({ color: '#CBD5E1', roughness: 0.85 });

      const upperBody = new THREE.Mesh(
        new THREE.BoxGeometry(totalWidth, upperH, depth),
        [sideWallMat, sideWallMat, roofMat, brickMat, upperFrontMat, upperFrontMat]
      );
      upperBody.position.set(0, floorH + upperH / 2, 0);
      upperBody.castShadow = true;
      upperBody.receiveShadow = true;
      addOutline(upperBody);
      group.add(upperBody);

      return group;
    }

    // =========================================================
    // 5. 북측 후면 교사동 생성기 (스카이뷰 12578~12592 & 12597 반영)
    // =========================================================
    function createNorthRearWing(width = 96, depth = 11.4, height = 14.0) {
      const group = new THREE.Group();

      const canvas = document.createElement('canvas');
      canvas.width = 2048;
      canvas.height = 768;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#E5D3B3';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const floors = 4;
      const bays = 12;
      const fh = canvas.height / floors;
      const bw = canvas.width / bays;

      for (let f = 0; f < floors; f++) {
        const y = f * fh;
        ctx.fillStyle = '#F3EAD8';
        ctx.fillRect(0, y, canvas.width, fh * 0.24);
        for (let b = 0; b < bays; b++) {
          const bx = b * bw;
          ctx.fillStyle = '#2B3B45';
          ctx.fillRect(bx + bw * 0.14, y + fh * 0.30, bw * 0.72, fh * 0.54);
          ctx.strokeStyle = '#F8FAFC';
          ctx.lineWidth = 3;
          ctx.strokeRect(bx + bw * 0.14, y + fh * 0.30, bw * 0.72, fh * 0.54);
        }
      }

      const wallMat = new THREE.MeshStandardMaterial({ map: makeTex(canvas), roughness: 0.72 });
      const sideMat = new THREE.MeshStandardMaterial({ color: '#DFC9A6', roughness: 0.75 });
      const roofMat = new THREE.MeshStandardMaterial({ color: '#DCE3EC', roughness: 0.85 });

      const body = new THREE.Mesh(
        new THREE.BoxGeometry(width, height, depth),
        [sideMat, sideMat, roofMat, sideMat, wallMat, wallMat]
      );
      body.position.y = height / 2;
      body.castShadow = true;
      body.receiveShadow = true;
      addOutline(body);
      group.add(body);

      // 옥상 설비 및 태양광 프레임 (스카이뷰 상단 배열)

        group.add(roofUnit);

      // 북동쪽 파란 계단실 타워 (스카이뷰 12578~12586)

      );
      blueTower.position.set(width / 2 - 4, (height + 2.4) / 2, -depth / 2 - 1.5);
      blueTower.castShadow = true;
      addOutline(blueTower);
      group.add(blueTower);

      return group;
    }

    addOutline(nsWing);
    root.add(nsWing);

    // 서측 동 1층 전면 캐노피 통로 (12570.jpg / 12572.jpg)
    const westCanopy = new THREE.Mesh(
      new THREE.BoxGeometry(3.4, 0.25, nsLength),
      new THREE.MeshStandardMaterial({ color: '#38BDF8', transparent: true, opacity: 0.82 })
    );
    westCanopy.position.set(-40.6, 3.2, 13);
    westCanopy.castShadow = true;
    addOutline(westCanopy);
    root.add(westCanopy);

    // E) 서측 동 북단 노란 뾰족지붕 통창 건물 (12570.jpg / 12571_2.png)
    const nsYellowCore = createYellowCurtainCore(WING_DEPTH, 9.6, WING_HEIGHT, 2.4, false);
    nsYellowCore.position.set(-48, 0, -15.8);
    root.add(nsYellowCore);

    // F) 90도 둥근 연결통로 (연녹색 격자 + 색면 모자이크 · 12571_2.png / 12597.jpg)
    //    호 중심 (-32.4, -20.6), 반경 15.6m로 서측 노란타워(-48, -20.6)와 본관 서측 노란타워(-32.4, -36.2)를 정확히 90° 연결
    const curvedBridge = createCurvedConnectorBridge(-32.4, -20.6, 15.6, WING_DEPTH, WING_HEIGHT - 0.4);
    root.add(curvedBridge);

    // 무지개 줄무늬 소형 창고 (12570.jpg / 12571_2.png 내측 모서리)
    const shedCanvas = document.createElement('canvas');
    shedCanvas.width = 128; shedCanvas.height = 128;
    const shCtx = shedCanvas.getContext('2d');
    ['#3B82F6', '#F8FAFC', '#FACC15', '#FB923C', '#E2E8F0'].forEach((c, idx) => {
      shCtx.fillStyle = c;
      shCtx.fillRect(0, idx * 25.6, 128, 25.6);
    });
    const stripedShed = new THREE.Mesh(
      new THREE.BoxGeometry(4.2, 3.6, 3.2),
      new THREE.MeshStandardMaterial({ map: makeTex(shedCanvas), roughness: 0.7 })
    );
    stripedShed.position.set(-39.5, 1.8, -26.5);
    stripedShed.castShadow = true;
    addOutline(stripedShed);
    root.add(stripedShed);

    // G) 본관 서측 노란 뾰족지붕 통창 건물 (12571_2.png)
    const ewLeftYellowCore = createYellowCurtainCore(9.6, WING_DEPTH, WING_HEIGHT, 2.4, false);
    ewLeftYellowCore.position.set(-27.6, 0, -36.2);
    root.add(ewLeftYellowCore);

    // H) 서→동 방향 옥색 4층 주동 (가로 10칸 · 표어/시계/교명 포함 · 12571_2.png)
    const ewWidth = CLASS_BAY_W * 10; // 80m
    const ewMintMat = new THREE.MeshStandardMaterial({ map: createMintWingTexture(10, true), roughness: 0.58 });
    const ewWing = new THREE.Mesh(
      new THREE.BoxGeometry(ewWidth, WING_HEIGHT, WING_DEPTH),
      [nsSideMat, nsSideMat, mintRoofMat, nsSideMat, ewMintMat, ewMintMat]
    );
    ewWing.position.set(17.2, WING_HEIGHT / 2, -36.2);
    ewWing.castShadow = true;
    ewWing.receiveShadow = true;
    addOutline(ewWing);
    root.add(ewWing);

    // 본관 옥상 환기 블록 배열 (12597.jpg)
    for (let rx = -18; rx <= 52; rx += 10) {
      const vent = new THREE.Mesh(
        new THREE.BoxGeometry(1.8, 0.9, 1.8),
        new THREE.MeshStandardMaterial({ color: '#E2E8F0', roughness: 0.7 })
      );
      vent.position.set(rx, WING_HEIGHT + 0.45, -36.2);
      root.add(vent);
    }

    // I) 옥색 주동 동측 노란 뾰족지붕 통창 건물 (12571_2.png / 12594_2.jpg)
    const ewRightYellowCore = createYellowCurtainCore(9.6, WING_DEPTH, WING_HEIGHT, 2.4, true);
    ewRightYellowCore.position.set(62.0, 0, -36.2);
    root.add(ewRightYellowCore);

    // J) 우측 갈색 벽돌·회색 콘크리트 필로티 동 (5칸: 소창-대창3-소창 · 12576.jpg / 12594_2.jpg)
    const brownWing = createBrownPilotiWing(CLASS_BAY_W, WING_DEPTH, 3.55);
    brownWing.position.set(66.8 + CLASS_BAY_W * 2.5, 0, -36.2);
    root.add(brownWing);

    // K) 북측 후면 교사동 & 본관 중앙 2층 연결 브릿지 (12597.jpg / 12578~12586)
    const northRearWing = createNorthRearWing(104, 11.4, 14.2);
    northRearWing.position.set(32, 0, -59);
    root.add(northRearWing);

    const skyBridge = new THREE.Mesh(
      new THREE.BoxGeometry(7.2, 7.6, 12.0),
      new THREE.MeshStandardMaterial({ color: '#45B2AF', roughness: 0.55 })
    );
    skyBridge.position.set(22, 9.2, -47.6);
    skyBridge.castShadow = true;
    addOutline(skyBridge);
    root.add(skyBridge);

    // L) 본관 전면 부대시설 (아치형 조회대 무대 · 국기게양대 · 동측 파란 아치형 쉼터 · 화분 열)
    // 1) 본관 앞 아치형 조회대 무대 (12571_2.png)
    const stageDeck = new THREE.Mesh(
      new THREE.BoxGeometry(9.5, 0.85, 4.4),
      new THREE.MeshStandardMaterial({ color: '#8C6239', roughness: 0.85 })
    );
    stageDeck.position.set(3.5, 0.425, -27.5);
    stageDeck.castShadow = true;
    addOutline(stageDeck);
    root.add(stageDeck);

    const stageCanopy = new THREE.Mesh(
      new THREE.CylinderGeometry(4.8, 4.8, 4.6, 18, 1, true, 0, Math.PI),
      new THREE.MeshStandardMaterial({ color: '#CBD5E1', transparent: true, opacity: 0.65, side: THREE.DoubleSide })
    );
    stageCanopy.rotation.z = Math.PI / 2;
    stageCanopy.rotation.y = Math.PI / 2;
    stageCanopy.position.set(3.5, 2.2, -27.5);
    root.add(stageCanopy);

    // 2) 중앙 시계 아래 국기게양대 3기 (12571_2.png)
    const poleMat = new THREE.MeshStandardMaterial({ color: '#F1F5F9', metalness: 0.7, roughness: 0.3 });
    [15.6, 17.2, 18.8].forEach(px => {
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, 10.5, 10), poleMat);
      pole.position.set(px, 5.25, -29.2);
      root.add(pole);
    });

    // 3) 동측 광장 파란 아치형 자전거/휴게 쉼터 & 모래놀이터 (12575_2.jpg)
    const blueShelter = new THREE.Mesh(
      new THREE.CylinderGeometry(2.6, 2.6, 7.2, 16, 1, true, 0, Math.PI),
      new THREE.MeshStandardMaterial({ color: '#1D4ED8', roughness: 0.4, side: THREE.DoubleSide })
    );
    blueShelter.rotation.z = Math.PI / 2;
    blueShelter.position.set(62.5, 1.8, -18.5);
    root.add(blueShelter);

    const sandbox = new THREE.Mesh(
      new THREE.BoxGeometry(16, 0.14, 14),
      new THREE.MeshStandardMaterial({ color: '#E2C799', roughness: 0.95 })
    );
    sandbox.position.set(22, 0.07, 44);
    sandbox.receiveShadow = true;
    addOutline(sandbox, 0x0284c7);
    root.add(sandbox);

    // 4) 광장 연석 위 갈색 사각 화분 열 (12571_2.png / 12572.jpg)
    const planterMat = new THREE.MeshStandardMaterial({ color: '#8B5A3C', roughness: 0.85 });
    const bushMat    = new THREE.MeshStandardMaterial({ color: '#3F6212', roughness: 0.9 });
    for (let pz = -14; pz <= 36; pz += 3.2) {
      const box = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.65, 2.2), planterMat);
      box.position.set(14.5, 0.325, pz);
      box.castShadow = true;
      addOutline(box);
      root.add(box);

      const shrub = new THREE.Mesh(new THREE.ConeGeometry(0.65, 1.4, 8), bushMat);
      shrub.position.set(14.5, 1.25, pz);
      shrub.castShadow = true;
      root.add(shrub);
    }

    // GLB 내보내기
    window.exportGLB = () => {
      const exporter = new GLTFExporter();
      exporter.parse(
        root,
        (result) => {
          const blob = new Blob([result], { type: 'model/gltf-binary' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = 'seoul_geumbuk_elementary_detailed.glb';
          link.click();
          URL.revokeObjectURL(url);
        },
        (err) => console.error('GLB 추출 오류:', err),
        { binary: true }
      );
    };

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
