<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>금호파크힐스 105동 & 북측 상가동(이마트24·서울행복신협) 3D 모델링</title>
  <style>
    body { margin: 0; overflow: hidden; background: #2c2f33; }
    #info {
      position: absolute; top: 14px; left: 16px; color: #fff;
      font-family: 'Malgun Gothic', sans-serif; font-size: 13px;
      background: rgba(20, 22, 25, 0.85); padding: 10px 14px;
      border-radius: 8px; border: 1px solid rgba(255,255,255,0.18);
      pointer-events: none; line-height: 1.55;
    }
    #controls-ui {
      position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
      display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
      background: rgba(20, 22, 25, 0.88); padding: 10px 14px;
      border-radius: 10px; border: 1px solid rgba(255,255,255,0.18);
      max-width: 95vw;
    }
    button {
      background: #3b4048; color: #fff; border: 1px solid #555b65;
      padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px;
      font-family: 'Malgun Gothic', sans-serif; transition: 0.15s;
    }
    button:hover { background: #A95C3D; color: #fff; border-color: #d67a54; }
    button.highlight-btn {
      background: #1d4ed8; border-color: #60a5fa; font-weight: bold;
    }
    button.highlight-btn:hover { background: #2563eb; }
    button.export-btn {
      background: #2b6cb0; border-color: #4299e1; font-weight: bold;
    }
    button.export-btn:hover { background: #3182ce; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="info">
    <strong>금호파크힐스 105동 & 북측 2층 상가동 (좌우 대칭 Y자 배치 · 북측 정중앙 주출입구 문주 · 이마트24·신협 반영)</strong><br/>
    마우스 좌클릭 드래그: 회전 | 우클릭 드래그: 이동 | 휠: 확대·축소
  </div>

  <div id="controls-ui">
    <button class="highlight-btn" onclick="setView('n_entrance')">북측 주출입구 (정중앙 문주)</button>
    <button class="highlight-btn" onclick="setView('e_store')">동측 상가 (이마트24·신협)</button>
    <button onclick="setView('top')">상공 배치도 (Top)</button>
    <button onclick="setView('se')">남동측 (SE)</button>
    <button onclick="setView('ne')">북동측 (NE)</button>
    <button onclick="setView('nw')">북서측 (NW)</button>
    <button onclick="setView('s')">남측 (86.9㎡ 전면)</button>
    <button class="export-btn" onclick="exportGLB()">3D 파일 추출 (.glb)</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

    // 1. 기본 씬, 카메라, 렌더러 설정
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#34383D');

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.2, 1000);
    // 초기 시점: 북동측 상공에서 105동 좌우 대칭 Y자 구조와 북측 정중앙 주출입구, 이마트24 상가동이 모두 보이는 구도
    camera.position.set(44, 34, -56);

    const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 18, -6);
    controls.enableDamping = true;
    controls.update();

    // 좌표계 기준: -Z = 북(N), +Z = 남(S), +X = 동(E), -X = 서(W)
    window.setView = (dir) => {
      if (dir === 'n_entrance') {
        // 북측 도로변에서 정중앙 주출입구 문주와 양 날개 V자 협곡을 올려다보는 시점
        controls.target.set(0, 16, -8);
        camera.position.set(-4, 13, -54);
      } else if (dir === 'e_store') {
        // 동측에서 본 서울행복신협 · 이마트24 상가 입면 및 105동 배경
        controls.target.set(22, 6, -23.5);
        camera.position.set(48, 8.5, -23.5);
      } else if (dir === 'top') {
        // 하늘에서 본 좌우 대칭 배치도
        controls.target.set(0, 10, -5);
        camera.position.set(0, 125, -4.99);
      } else if (dir === 'se') {
        // 남동측 시점 (상가동 우측 + 105동 21층/16층 단차)
        controls.target.set(2, 20, -4);
        camera.position.set(56, 22, 42);
      } else if (dir === 'ne') {
        // 북동측 도로변 시점
        controls.target.set(0, 20, -8);
        camera.position.set(50, 18, -52);
      } else if (dir === 'nw') {
        // 북서측 시점 (북서 날개 테라코타 측벽 및 상/하단 105 표기)
        controls.target.set(-2, 20, -6);
        camera.position.set(-54, 18, -48);
      } else if (dir === 's') {
        // 남측 86.9㎡ 16층 날개 정면
        controls.target.set(0, 20, 4);
        camera.position.set(0, 22, 68);
      }
      controls.update();
    };

    // 2. 조명 및 뷰포트 그리드
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.94);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.06);
    dirLight.position.set(60, 115, -45);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(2048, 2048);
    scene.add(dirLight);

    const fillLight = new THREE.DirectionalLight(0xdce6f2, 0.50);
    fillLight.position.set(-55, 48, 50);
    scene.add(fillLight);

    const gridHelper = new THREE.GridHelper(180, 45, 0x555555, 0x42464C);
    scene.add(gridHelper);

    // =========================================================
    // 텍스처 생성 유틸리티 (최신 규격: 테라코타 주황 외장 + '105' 표기 + 상가동 입면)
    // =========================================================

    // A. 테라코타 주황 측벽 + 좌우 화이트 수직 프레임 띠 + '105' 표기 / 중앙 슬릿 창문
    function createTerracottaWithTrimTexture({
      showTopNumber = false,
      showBottomNumber = false,
      topAlign = 'right',
      bottomAlign = 'right',
      hasCenterSlitWindows = false
    }) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');

      // 테라코타 주황/브라운 바탕
      ctx.fillStyle = '#B87654';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 수평 패널 줄눈 패턴
      ctx.fillStyle = 'rgba(35, 18, 10, 0.22)';
      for (let y = 0; y < canvas.height; y += 16) {
        ctx.fillRect(0, y, canvas.width, 2);
      }

      // 좌·우측 화이트/아이보리 수직 프레임 띠
      const trimW = Math.floor(canvas.width * 0.11);
      ctx.fillStyle = '#EAE8E1';
      ctx.fillRect(0, 0, trimW, canvas.height);
      ctx.fillRect(canvas.width - trimW, 0, trimW, canvas.height);

      ctx.fillStyle = 'rgba(30, 32, 36, 0.25)';
      for (let y = 0; y < canvas.height; y += 16) {
        ctx.fillRect(0, y, trimW, 2);
        ctx.fillRect(canvas.width - trimW, y, trimW, 2);
      }

      // 측벽 세로 슬릿 환기창열
      if (hasCenterSlitWindows) {
        for (let y = 52; y < canvas.height - 45; y += 54) {
          ctx.fillStyle = '#252A30';
          ctx.fillRect(canvas.width * 0.5 - 24, y, 48, 20);
          ctx.strokeStyle = '#EAE8E1';
          ctx.lineWidth = 3;
          ctx.strokeRect(canvas.width * 0.5 - 24, y, 48, 20);
        }
      }

      // 상단 '105' 표기
      if (showTopNumber) {
        const tx = topAlign === 'left' ? (trimW + 76) : (canvas.width - trimW - 76);
        const ty = 128;
        ctx.fillStyle = '#1E1A18';
        ctx.font = 'bold 54px "Malgun Gothic", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('105', tx + 3, ty + 3);
        ctx.fillStyle = '#F8FAFC';
        ctx.fillText('105', tx, ty);
      }

      // 하단 '105' 표기
      if (showBottomNumber) {
        const bx = bottomAlign === 'left' ? (trimW + 76) : (canvas.width - trimW - 76);
        const by = canvas.height - 42;
        ctx.fillStyle = '#1E1A18';
        ctx.font = 'bold 62px "Malgun Gothic", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('105', bx + 3, by + 3);
        ctx.fillStyle = '#F8FAFC';
        ctx.fillText('105', bx, by);
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // B. 아이보리(#EFECE6) + 다크/라이트 그레이(#787D85) 수직 교차 창호 입면 (테라코타 주황 엣지 옵션)
    function create105WindowWallTexture(floors, cols = 3, {
      alternateGrayCol = true,
      terracottaEdges = false,
      grayColor = '#787D85'
    } = {}) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');

      const fh = canvas.height / floors;
      const cw = canvas.width / cols;

      for (let c = 0; c < cols; c++) {
        const isGrayColumn = alternateGrayCol && (c % 2 === 1);
        ctx.fillStyle = isGrayColumn ? grayColor : '#EFECE6';
        ctx.fillRect(c * cw, 0, cw, canvas.height);
      }

      // 외곽 테라코타 수직 띠
      if (terracottaEdges) {
        ctx.fillStyle = '#B87654';
        ctx.fillRect(0, 0, 26, canvas.height);
        ctx.fillRect(canvas.width - 26, 0, 26, canvas.height);
      }

      for (let f = 0; f < floors; f++) {
        const y = f * fh;
        ctx.fillStyle = 'rgba(30, 32, 36, 0.22)';
        ctx.fillRect(0, y, canvas.width, 2.5);

        for (let c = 0; c < cols; c++) {
          const x = c * cw;
          const winX = x + cw * 0.15;
          const winY = y + fh * 0.18;
          const winW = cw * 0.70;
          const winH = fh * 0.65;

          ctx.fillStyle = '#26313B';
          ctx.fillRect(winX, winY, winW, winH);

          ctx.strokeStyle = '#DCDAD4';
          ctx.lineWidth = 2.5;
          ctx.strokeRect(winX, winY, winW, winH);

          ctx.beginPath();
          ctx.moveTo(winX + winW / 2, winY);
          ctx.lineTo(winX + winW / 2, winY + winH);
          ctx.stroke();

          // 발코니 난간 살
          ctx.fillStyle = '#181B1F';
          ctx.fillRect(winX - 1, winY + winH * 0.56, winW + 2, 2.5);
          for (let rx = winX; rx <= winX + winW; rx += 9) {
            ctx.fillRect(rx, winY + winH * 0.56, 1.8, winH * 0.44);
          }
        }
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // C. 북측 정중앙 협곡 내측 수직 코어 텍스처 (다크/미디엄 그레이 수평 줄눈 패널 + 최상부 루버)
    function create105CenterCoreShaftTexture(floors = 21) {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#686E78';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const fh = canvas.height / floors;
      for (let f = 0; f < floors; f++) {
        const y = f * fh;
        ctx.fillStyle = 'rgba(20, 22, 26, 0.32)';
        ctx.fillRect(0, y, canvas.width, 3);

        // 수평 루버/줄눈 디테일
        ctx.fillStyle = 'rgba(220, 225, 232, 0.18)';
        ctx.fillRect(18, y + fh * 0.35, canvas.width - 36, 3);
        ctx.fillRect(18, y + fh * 0.65, canvas.width - 36, 3);
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // D. 저층부 다크 차콜 석재 기단부 + 밝은 수평 줄눈 띠
    function createDarkBaseWithBandsTexture(hasWindows = false) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#2B2E33';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#191B1F';
      ctx.lineWidth = 2;
      for (let y = 0; y < canvas.height; y += 32) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }
      for (let x = 0; x < canvas.width; x += 64) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }

      ctx.fillStyle = '#A8ACB2';
      ctx.fillRect(0, 62, canvas.width, 6);
      ctx.fillRect(0, 146, canvas.width, 6);
      ctx.fillRect(0, 224, canvas.width, 6);

      if (hasWindows) {
        for (let x = 42; x < canvas.width - 30; x += 120) {
          ctx.fillStyle = '#1C2228';
          ctx.fillRect(x, 18, 68, 36);
          ctx.strokeStyle = '#8C9096';
          ctx.lineWidth = 2;
          ctx.strokeRect(x, 18, 68, 36);
        }
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // E. 위성 평면도 기준 옥상 텍스처
    function createSatelliteRoofTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#B8BCC2';
      ctx.fillRect(0, 0, 512, 512);

      ctx.fillStyle = '#CDC5B4';
      ctx.fillRect(42, 42, 428, 428);

      ctx.strokeStyle = '#73777D';
      ctx.lineWidth = 6;
      ctx.strokeRect(42, 42, 428, 428);

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // F. 주출입구 문주 상단 정면 인방 텍스처 (실버 '105' 표기)
    function createPortalHeaderTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#2B2E33';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#1A1C1F';
      ctx.lineWidth = 2;
      ctx.strokeRect(2, 2, canvas.width - 4, canvas.height - 4);

      ctx.strokeStyle = '#4B5058';
      ctx.lineWidth = 3;
      ctx.strokeRect(92, 22, canvas.width - 184, canvas.height - 44);

      const cx = canvas.width / 2;
      ctx.fillStyle = '#CBD5E1';
      ctx.fillRect(cx - 64, 60, 14, 16);
      ctx.fillRect(cx + 50, 60, 14, 16);

      ctx.fillStyle = '#111315';
      ctx.font = 'bold 46px "Malgun Gothic", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('105', cx + 2, 82);

      ctx.fillStyle = '#F1F5F9';
      ctx.fillText('105', cx, 80);

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // G. 문주 측면 상부 수직 루버(Vertical Louver) 텍스처
    function createPortalVerticalLouverTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#2B2E33';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#1C1E22';
      ctx.fillRect(16, 12, canvas.width - 32, canvas.height - 24);

      for (let x = 22; x < canvas.width - 22; x += 8) {
        ctx.fillStyle = '#484D54';
        ctx.fillRect(x, 14, 4, canvas.height - 28);
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // H. 내부 브론즈 멀리언 통유리 로비 텍스처
    function createLobbyCurtainWallTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#181B1E';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      grad.addColorStop(0, 'rgba(65, 75, 65, 0.35)');
      grad.addColorStop(0.5, 'rgba(35, 42, 38, 0.2)');
      grad.addColorStop(1, 'rgba(85, 90, 75, 0.35)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#6E6349';
      for (let x = 0; x <= canvas.width; x += 64) {
        ctx.fillRect(x, 0, 6, canvas.height);
      }
      ctx.fillRect(0, 140, canvas.width, 6);
      ctx.fillRect(0, 320, canvas.width, 6);

      ctx.strokeStyle = '#8C7E5E';
      ctx.lineWidth = 6;
      ctx.strokeRect(192, 320, 128, 192);
      ctx.beginPath();
      ctx.moveTo(256, 320);
      ctx.lineTo(256, 512);
      ctx.stroke();

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // I. 북측 상가동 동측(+X) 입면 텍스처: 서울행복신협 + emart24
    function createCommercialEastFacadeTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1400;
      canvas.height = 760;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#2F353D';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#1B1F25';
      ctx.lineWidth = 2;
      for (let y = 0; y < canvas.height; y += 38) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }
      for (let x = 0; x < canvas.width; x += 70) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }

      // 2층 서울행복신협 3개 대형 창호 및 하단 파란 시트지 배열
      const bayY = 95;
      const bayW = 395;
      const bayH = 235;
      const bayXs = [55, 495, 935];

      bayXs.forEach((bx, idx) => {
        ctx.fillStyle = '#B8BEC6';
        ctx.fillRect(bx, bayY, bayW, bayH);

        const glassGrad = ctx.createLinearGradient(bx, bayY, bx, bayY + bayH);
        glassGrad.addColorStop(0, '#DCE6EE');
        glassGrad.addColorStop(0.55, '#B8C6D2');
        glassGrad.addColorStop(1, '#96A6B4');
        ctx.fillStyle = glassGrad;
        ctx.fillRect(bx + 6, bayY + 6, bayW - 12, bayH - 12);

        ctx.strokeStyle = '#64748B';
        ctx.lineWidth = 4;
        const paneW = (bayW - 12) / 5;
        for (let p = 1; p < 5; p++) {
          const px = bx + 6 + paneW * p;
          ctx.beginPath();
          ctx.moveTo(px, bayY + 6);
          ctx.lineTo(px, bayY + bayH - 6);
          ctx.stroke();
        }
        ctx.beginPath();
        ctx.moveTo(bx + 6, bayY + bayH - 64);
        ctx.lineTo(bx + bayW - 6, bayY + bayH - 64);
        ctx.stroke();

        const sheetY = bayY + bayH - 58;
        const sheetH = 50;

        if (idx === 0) {
          const cells = [
            { text: '함께\n해요', small: true },
            { text: '♥', pink: true },
            { text: '♣', logo: true },
            { text: '서' },
            { text: '울' },
            { text: '행' },
            { text: '복' }
          ];
          const cw = (bayW - 16) / 7;
          cells.forEach((c, ci) => {
            const cx = bx + 8 + ci * cw;
            ctx.fillStyle = '#1D4ED8';
            ctx.fillRect(cx + 2, sheetY, cw - 4, sheetH);
            ctx.fillStyle = c.pink ? '#F9A8D4' : '#FFFFFF';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            if (c.small) {
              ctx.font = 'bold 14px "Malgun Gothic", sans-serif';
              ctx.fillText('함 께', cx + cw / 2, sheetY + 16);
              ctx.fillText('해 요', cx + cw / 2, sheetY + 35);
            } else {
              ctx.font = 'bold 28px "Malgun Gothic", sans-serif';

    function addOutlines(mesh) {
      const edges = new THREE.EdgesGeometry(mesh.geometry, 25);

    // 옥상 화이트/라이트 그레이 옥탑 파라펫 링
    function createRoofPenthouseRing(w, d, h = 2.4) {
      const ringGroup = new THREE.Group();
      const wallMat = new THREE.MeshStandardMaterial({ color: '#E5E7EB', roughness: 0.75 });
      const topMat = new THREE.MeshStandardMaterial({ color: '#D1D5DB', roughness: 0.8 });
      const t = 2.0;

      const segments = [
        { size: [w, h, t], pos: [0, h / 2, d / 2 - t / 2] },
        { size: [w, h, t], pos: [0, h / 2, -d / 2 + t / 2] },
        { size: [t, h, d - t * 2], pos: [w / 2 - t / 2, h / 2, 0] },
        { size: [t, h, d - t * 2], pos: [-w / 2 + t / 2, h / 2, 0] }
      ];

      segments.forEach(s => {
        const m = new THREE.Mesh(
          new THREE.BoxGeometry(...s.size),
          [wallMat, wallMat, topMat, wallMat, wallMat, wallMat]
        );
        m.position.set(...s.pos);
        m.castShadow = true;
        m.receiveShadow = true;
        addOutlines(m);
        ringGroup.add(m);
      });

      return ringGroup;
    }

    // 상가동 및 연결 브릿지용 강화유리 난간
    function createGlassRailing(w, d, h = 1.15) {
      const railGroup = new THREE.Group();
      const railMat = new THREE.MeshStandardMaterial({ color: '#1B1D1F', roughness: 0.5 });
      const glassMat = new THREE.MeshStandardMaterial({
        color: '#A5F3FC',
        transparent: true,
        opacity: 0.25,
        roughness: 0.15
      });

      const topBars = [
        { size: [w, 0.1, 0.1], pos: [0, h, d / 2] },
        { size: [w, 0.1, 0.1], pos: [0, h, -d / 2] },
        { size: [0.1, 0.1, d], pos: [w / 2, h, 0] },
        { size: [0.1, 0.1, d], pos: [-w / 2, h, 0] }
      ];
      topBars.forEach(b => {
        const m = new THREE.Mesh(new THREE.BoxGeometry(...b.size), railMat);
        m.position.set(...b.pos);
        railGroup.add(m);
      });

      const glassPanels = [
        { size: [w, h * 0.9, 0.05], pos: [0, h * 0.45, d / 2] },
        { size: [w, h * 0.9, 0.05], pos: [0, h * 0.45, -d / 2] },
        { size: [0.05, h * 0.9, d], pos: [w / 2, h * 0.45, 0] },
        { size: [0.05, h * 0.9, d], pos: [-w / 2, h * 0.45, 0] }
      ];
      glassPanels.forEach(g => {
        const m = new THREE.Mesh(new THREE.BoxGeometry(...g.size), glassMat);

      });

    // =========================================================
    function createDong105MainEntrance(portalTotalH = 7.4) {
      const entranceGroup = new THREE.Group();
      entranceGroup.name = 'Dong105_NorthCenter_Entrance';

      const stoneMat = new THREE.MeshStandardMaterial({ color: '#2B2E33', roughness: 0.72 });
      const stoneDarkMat = new THREE.MeshStandardMaterial({ color: '#22252A', roughness: 0.78 });
      const headerFrontMat = new THREE.MeshStandardMaterial({ map: createPortalHeaderTexture(), roughness: 0.7 });
      const louverSideMat = new THREE.MeshStandardMaterial({ map: createPortalVerticalLouverTexture(), roughness: 0.72 });
      const glassLobbyMat = new THREE.MeshStandardMaterial({ map: createLobbyCurtainWallTexture(), roughness: 0.35, metalness: 0.25 });

      const portalW = 6.2;
      const portalD = 4.2;
      const portalH = portalTotalH;
      const pillarW = 1.0;
      const pillarD = 1.1;
      const headerH = 1.55;

      // 1) 전면 좌측 석재 기둥
      const leftPillar = new THREE.Mesh(
        new THREE.BoxGeometry(pillarW, portalH - headerH, pillarD),
        stoneMat
      );
      leftPillar.position.set(-(portalW / 2 - pillarW / 2), (portalH - headerH) / 2, portalD - pillarD / 2);
      leftPillar.castShadow = true;
      leftPillar.receiveShadow = true;
      addOutlines(leftPillar);
      entranceGroup.add(leftPillar);

      // 2) 전면 우측 석재 기둥
      const rightPillar = new THREE.Mesh(
        new THREE.BoxGeometry(pillarW, portalH - headerH, pillarD),
        stoneMat
      );
      rightPillar.position.set(portalW / 2 - pillarW / 2, (portalH - headerH) / 2, portalD - pillarD / 2);
      rightPillar.castShadow = true;
      rightPillar.receiveShadow = true;
      addOutlines(rightPillar);
      entranceGroup.add(rightPillar);

      // 3) 문주 상단 캐노피 헤더 (정면 '105' 음각 인방 + 좌·우측 수직 루버 프리즈)
      const portalHeader = new THREE.Mesh(
        new THREE.BoxGeometry(portalW, headerH, portalD),
        [
          louverSideMat,
          louverSideMat,
          stoneDarkMat,
          stoneDarkMat,
          headerFrontMat,
          stoneMat
        ]
      );
      portalHeader.position.set(0, portalH - headerH / 2, portalD / 2);
      portalHeader.castShadow = true;
      portalHeader.receiveShadow = true;
      addOutlines(portalHeader);
      entranceGroup.add(portalHeader);

      // 4) 안쪽 브론즈 멀리언 통유리 로비 & 출입문 매스
      const lobbyDepth = 1.25;
      const lobbyGlassBox = new THREE.Mesh(
        new THREE.BoxGeometry(portalW - 0.3, portalH - headerH, lobbyDepth),
        [
          glassLobbyMat,
          glassLobbyMat,
          stoneDarkMat,
          stoneDarkMat,
          glassLobbyMat,
          stoneDarkMat
        ]
      );
      lobbyGlassBox.position.set(0, (portalH - headerH) / 2, lobbyDepth / 2);
      lobbyGlassBox.castShadow = true;
      lobbyGlassBox.receiveShadow = true;
      addOutlines(lobbyGlassBox);
      entranceGroup.add(lobbyGlassBox);

      // 5) 포치 측면 자전거 거치대 캐노피
      const bikeShelterGroup = new THREE.Group();
      const shelterW = 2.4;
      const shelterH = 2.25;
      const shelterD = 2.2;

      const shelterRoof = new THREE.Mesh(
        new THREE.BoxGeometry(shelterW, 0.16, shelterD),
        new THREE.MeshStandardMaterial({ color: '#272A2E', roughness: 0.6 })
      );
      shelterRoof.position.set(0, shelterH, 0);
      addOutlines(shelterRoof);
      bikeShelterGroup.add(shelterRoof);

      const shelterSideWall = new THREE.Mesh(
        new THREE.BoxGeometry(0.14, shelterH, shelterD - 0.1),
        new THREE.MeshStandardMaterial({ color: '#9E5B3C', roughness: 0.75 })
      );
      shelterSideWall.position.set(-(shelterW / 2 - 0.1), shelterH / 2, 0);
      addOutlines(shelterSideWall);
      bikeShelterGroup.add(shelterSideWall);

      const shelterBackWall = new THREE.Mesh(
        new THREE.BoxGeometry(shelterW - 0.1, shelterH, 0.14),
        new THREE.MeshStandardMaterial({ color: '#7D452C', roughness: 0.75 })
      );
      shelterBackWall.position.set(0, shelterH / 2, -(shelterD / 2 - 0.1));
      addOutlines(shelterBackWall);
      bikeShelterGroup.add(shelterBackWall);

      bikeShelterGroup.position.set(-(portalW / 2 + shelterW / 2 - 0.1), 0, portalD * 0.52);
      entranceGroup.add(bikeShelterGroup);

      return entranceGroup;
    }

        [
          new THREE.MeshStandardMaterial({
            map: create105WindowWallTexture(wing21Floors - baseFloors, 1, { alternateGrayCol: false, terracottaEdges: false })
          }),
          new THREE.MeshStandardMaterial({ color: '#EAE8E1' }),
          roofMat,
          baseSolidMat,
          new THREE.MeshStandardMaterial({ color: '#B87654' }),
          new THREE.MeshStandardMaterial({
            map: createTerracottaWithTrimTexture({ showTopNumber: false })
          })
        ]
      );
      nwShoulderUpper.position.set(wing21W / 2 + 1.5, wing21BaseH + wing21UpperH / 2, 2.2);
      nwShoulderUpper.castShadow = true;
      nwShoulderUpper.receiveShadow = true;
      addOutlines(nwShoulderUpper);
      nwWing.add(nwShoulderUpper);

      // 옥상 화이트 파라펫 링
      const nwPenthouseRing = createRoofPenthouseRing(8.8, 15.2, 2.4);
      nwPenthouseRing.position.set(0, wing21BaseH + wing21UpperH, -0.4);
      nwWing.add(nwPenthouseRing);

      nwWing.position.set(-12.4, 0, -6.2);
      nwWing.rotation.y = nwAngle;
      root.add(nwWing);

      // ---------------------------------------------------------
      // 2. 북동측 고층 날개 (118.7㎡ · 21층) - 북서 날개와 좌우 완전 대칭
      // ---------------------------------------------------------
      const neWing = new THREE.Group();
      neWing.name = 'Wing_118_7_NE';

      const neBase = new THREE.Mesh(
        new THREE.BoxGeometry(wing21W + 0.3, wing21BaseH, wing21D + 0.3),
        [baseWinMat, baseWinMat, baseSolidMat, baseSolidMat, baseSolidMat, baseSolidMat]
      );
      neBase.position.y = wing21BaseH / 2;
      addOutlines(neBase);
      neWing.add(neBase);

      const neUpper = new THREE.Mesh(
        new THREE.BoxGeometry(wing21W, wing21UpperH, wing21D),
        [
          // +X (남동측 외곽 창호면)
          new THREE.MeshStandardMaterial({
            map: create105WindowWallTexture(wing21Floors - baseFloors, 3, { alternateGrayCol: true, terracottaEdges: true })
          }),
          // -X (북서측 내측 V협곡 창호면)
          new THREE.MeshStandardMaterial({
            map: create105WindowWallTexture(wing21Floors - baseFloors, 3, { alternateGrayCol: true, terracottaEdges: true })
          }),
          roofMat,
          baseSolidMat,
          // +Z (중앙 코어 연결부)
          new THREE.MeshStandardMaterial({ color: '#B87654' }),
          // -Z (북동단 테라코타 주황 측벽 + 상단 '105' 표기)
          new THREE.MeshStandardMaterial({
            map: createTerracottaWithTrimTexture({ showTopNumber: true, showBottomNumber: false, topAlign: 'left' })
          })
        ]
      );
      neUpper.position.y = wing21BaseH + wing21UpperH / 2;
      neUpper.castShadow = true;
      neUpper.receiveShadow = true;
      addOutlines(neUpper);
      neWing.add(neUpper);

      // 북동 날개 내측(-X) 계단형 어깨 돌출 베이 (좌우 대칭)
      const neShoulderBase = new THREE.Mesh(
        new THREE.BoxGeometry(3.2, wing21BaseH, 9.6),
        [baseSolidMat, baseWinMat, baseSolidMat, baseSolidMat, baseSolidMat, baseSolidMat]
      );
      neShoulderBase.position.set(-(wing21W / 2 + 1.55), wing21BaseH / 2, 2.2);
      addOutlines(neShoulderBase);
      neWing.add(neShoulderBase);

      const neShoulderUpper = new THREE.Mesh(
        new THREE.BoxGeometry(3.1, wing21UpperH, 9.4),
        [
          new THREE.MeshStandardMaterial({ color: '#EAE8E1' }),
          new THREE.MeshStandardMaterial({
            map: create105WindowWallTexture(wing21Floors - baseFloors, 1, { alternateGrayCol: false, terracottaEdges: false })
          }),
          roofMat,
          baseSolidMat,
          new THREE.MeshStandardMaterial({ color: '#B87654' }),
          new THREE.MeshStandardMaterial({
            map: createTerracottaWithTrimTexture({ showTopNumber: false })
          })
        ]
      );
      neShoulderUpper.position.set(-(wing21W / 2 + 1.5), wing21BaseH + wing21UpperH / 2, 2.2);
      neShoulderUpper.castShadow = true;
      neShoulderUpper.receiveShadow = true;
      addOutlines(neShoulderUpper);
      neWing.add(neShoulderUpper);

      // 옥상 화이트 파라펫 링
      const nePenthouseRing = createRoofPenthouseRing(8.8, 15.2, 2.4);
      nePenthouseRing.position.set(0, wing21BaseH + wing21UpperH, -0.4);
      neWing.add(nePenthouseRing);

      neWing.position.set(12.4, 0, -6.2);
      neWing.rotation.y = neAngle;
      root.add(neWing);

      // ---------------------------------------------------------
      // 3. 남측 중층 날개 (86.9㎡ · 16층) + 좌·우 2단 계단형 셋백 + T자형 옥탑 브릿지
      // ---------------------------------------------------------
      const swFloors = 16;
      const swBaseH = floorH * baseFloors;
      const swUpperH = floorH * (swFloors - baseFloors);
      const swW = 18.4;
      const swD = 13.6;

      const swWing = new THREE.Group();
      swWing.name = 'Wing_86_9_South';

      const swBase = new THREE.Mesh(
        new THREE.BoxGeometry(swW + 0.3, swBaseH, swD + 0.3),
        [baseSolidMat, baseSolidMat, baseSolidMat, baseSolidMat, baseWinMat, baseWinMat]
      );
      swBase.position.y = swBaseH / 2;
      addOutlines(swBase);
      swWing.add(swBase);

      const swUpper = new THREE.Mesh(
        new THREE.BoxGeometry(swW, swUpperH, swD),
        [
          // +X (동측 테라코타 주황 측벽 + 세로 슬릿 창문열)
          new THREE.MeshStandardMaterial({
            map: createTerracottaWithTrimTexture({ hasCenterSlitWindows: true })
          }),
          // -X (서측 테라코타 주황 측벽 + 하단 '105' 표기)
          new THREE.MeshStandardMaterial({
            map: createTerracottaWithTrimTexture({ showBottomNumber: true })
          }),
          roofMat,
          baseSolidMat,
          // +Z (남측 창호 입면 - 4열 좌우 대칭 86.9㎡ 전면)
          new THREE.MeshStandardMaterial({
            map: create105WindowWallTexture(swFloors - baseFloors, 4, { alternateGrayCol: true, terracottaEdges: true })
          }),
          // -Z (북측 연결부)
          new THREE.MeshStandardMaterial({ color: '#B87654' })
        ]
      );
      swUpper.position.y = swBaseH + swUpperH / 2;
      swUpper.castShadow = true;
      swUpper.receiveShadow = true;
      addOutlines(swUpper);
      swWing.add(swUpper);

      // 남측 날개 서·동측 좌우 대칭 2단 계단형 돌출 베이 (배치도 image_4f51bb.png 하단 좌우 돌출부)
      [-1, 1].forEach(side => {
        const step1Base = new THREE.Mesh(new THREE.BoxGeometry(1.6, swBaseH, 9.2), baseSolidMat);
        step1Base.position.set(side * (swW / 2 + 0.75), swBaseH / 2, 0.2);
        addOutlines(step1Base);
        swWing.add(step1Base);

        const step1Upper = new THREE.Mesh(
          new THREE.BoxGeometry(1.5, swUpperH, 9.0),
          new THREE.MeshStandardMaterial({
            map: createTerracottaWithTrimTexture({ hasCenterSlitWindows: side === 1, showBottomNumber: side === -1 })
          })
        );
        step1Upper.position.set(side * (swW / 2 + 0.75), swBaseH + swUpperH / 2, 0.2);
        step1Upper.castShadow = true;
        step1Upper.receiveShadow = true;
        addOutlines(step1Upper);
        swWing.add(step1Upper);

        const step2Base = new THREE.Mesh(new THREE.BoxGeometry(1.3, swBaseH, 5.4), baseSolidMat);
        step2Base.position.set(side * (swW / 2 + 1.5 + 0.6), swBaseH / 2, 0.8);
        addOutlines(step2Base);
        swWing.add(step2Base);

        const step2Upper = new THREE.Mesh(
          new THREE.BoxGeometry(1.2, swUpperH, 5.2),
          new THREE.MeshStandardMaterial({ color: '#EAE8E1', roughness: 0.78 })
        );
        step2Upper.position.set(side * (swW / 2 + 1.5 + 0.6), swBaseH + swUpperH / 2, 0.8);
        step2Upper.castShadow = true;
        step2Upper.receiveShadow = true;
        addOutlines(step2Upper);
        swWing.add(step2Upper);
      });

      // 남측 옥상 화이트 파라펫 링 + T자형 옥탑 브릿지
      const swPenthouseRing = createRoofPenthouseRing(14.8, 8.2, 2.4);
      swPenthouseRing.position.set(0, swBaseH + swUpperH, 0.4);
      swWing.add(swPenthouseRing);

      const tBridgeMat = new THREE.MeshStandardMaterial({ color: '#E5E7EB', roughness: 0.75 });
      const tTopBar = new THREE.Mesh(new THREE.BoxGeometry(5.6, 2.6, 2.6), tBridgeMat);
      tTopBar.position.set(0, swBaseH + swUpperH + 1.3, -4.6);
      addOutlines(tTopBar);
      swWing.add(tTopBar);

      const tStem = new THREE.Mesh(new THREE.BoxGeometry(2.5, 2.6, 6.2), tBridgeMat);
      tStem.position.set(0, swBaseH + swUpperH + 1.3, -1.2);
      addOutlines(tStem);
      swWing.add(tStem);

      swWing.position.set(0, 0, 9.6);
      swWing.rotation.y = swAngle;
      root.add(swWing);

      // ---------------------------------------------------------
      // 4. 중앙 오각 방사형 연결 코어 & 북쪽 정중앙 주출입구 문주
      // ---------------------------------------------------------
      const coreH = wing21BaseH + wing21UpperH - 1.2;
      const coreShape = new THREE.Shape();
      coreShape.moveTo(-2.8, 3.6);
      coreShape.lineTo(2.8, 3.6);
      coreShape.lineTo(7.8, -1.4);
      coreShape.lineTo(6.6, -4.8);
      coreShape.lineTo(-6.6, -4.8);
      coreShape.lineTo(-7.8, -1.4);
      coreShape.closePath();

      const coreGeo = new THREE.ExtrudeGeometry(coreShape, {
        depth: coreH,
        bevelEnabled: false
      });
      coreGeo.rotateX(-Math.PI / 2);

      const centerCore = new THREE.Mesh(
        coreGeo,
        [
          roofMat,
          new THREE.MeshStandardMaterial({ color: '#C8CCD1', roughness: 0.85 })
        ]
      );
      centerCore.castShadow = true;
      centerCore.receiveShadow = true;
      addOutlines(centerCore);
      root.add(centerCore);

      // 북쪽 정중앙 V자 협곡 내측 수직 코어 샤프트 (image_4f4d9b.jpg 중앙 다크 그레이 수직 벽체)
      const northCoreWall = new THREE.Mesh(
        new THREE.BoxGeometry(5.6, coreH, 4.4),
        [
          new THREE.MeshStandardMaterial({ color: '#686E78' }),
          new THREE.MeshStandardMaterial({ color: '#686E78' }),
          roofMat,
          baseSolidMat,
          new THREE.MeshStandardMaterial({ color: '#686E78' }),
          new THREE.MeshStandardMaterial({ map: create105CenterCoreShaftTexture(wing21Floors) }) // -Z 북측 정면
        ]
      );
      northCoreWall.position.set(0, coreH / 2, -4.8);
      northCoreWall.castShadow = true;
      northCoreWall.receiveShadow = true;
      addOutlines(northCoreWall);
      root.add(northCoreWall);

      // ★ 북쪽 방향 정중앙 주출입구 문주 (x = 0, 상가동 옥상 데크 레벨 y = commH, 정북 -Z 방향을 향함)
      const entrancePodium = new THREE.Mesh(
        new THREE.BoxGeometry(7.2, commH, 5.2),
        baseSolidMat
      );
      entrancePodium.position.set(0, commH / 2, -6.8);
      entrancePodium.castShadow = true;
      entrancePodium.receiveShadow = true;
      addOutlines(entrancePodium);
      root.add(entrancePodium);

      const northMainEntrance = createDong105MainEntrance(7.2);
      northMainEntrance.rotation.y = Math.PI; // -Z (정북쪽) 방향을 정면으로 향함
      northMainEntrance.position.set(0, commH, -7.2);
      root.add(northMainEntrance);

      // ---------------------------------------------------------
      // 5. 북쪽(-Z) 2층 별도 상가동 (서울행복신협 · 이마트24 · S-hair) + 중앙 연결 브릿지
      // ---------------------------------------------------------
      const commercialGroup = new THREE.Group();
      commercialGroup.name = 'North_Commercial_Building_Emart24';

      const commW = 48.0;
      const commD = 14.8;
      const commX = 2.0;
      const commZ = -23.5;

      const eastStoreMat = new THREE.MeshStandardMaterial({
        map: createCommercialEastFacadeTexture(),
        roughness: 0.75
      });
      const northStreetMat = new THREE.MeshStandardMaterial({
        map: createCommercialNorthFacadeTexture(),
        roughness: 0.78
      });

      const commBuilding = new THREE.Mesh(
        new THREE.BoxGeometry(commW, commH, commD),
        [
          eastStoreMat,                                                       // +X (동쪽 끝면: 서울행복신협 · 이마트24)
          baseSolidMat,                                                       // -X (서쪽 면)
          new THREE.MeshStandardMaterial({ color: '#7D828A', roughness: 0.9 }), // +Y (옥상 데크)
          baseSolidMat,                                                       // -Y
          baseSolidMat,                                                       // +Z (남측 면)
          northStreetMat                                                      // -Z (북쪽 도로변 상가열)
        ]
      );
      commBuilding.position.set(commX, commH / 2, commZ);
      commBuilding.castShadow = true;
      commBuilding.receiveShadow = true;
      addOutlines(commBuilding);
      commercialGroup.add(commBuilding);

      // 5-1. 상가동 동쪽 끝면(+X) 돌출 어닝 4개 (2층 신협 파란 어닝 3개 + 1층 이마트24 회색 어닝 1개)
      const eastFaceX = commX + commW / 2;
      const blueAwningMat = new THREE.MeshStandardMaterial({ color: '#0A369D', roughness: 0.55 });
      const awningY = commH * (1 - 95 / 760) - 0.15;

      const bayCentersZ = [
        commZ + commD * (0.5 - (55 + 395 / 2) / 1400),
        commZ + commD * (0.5 - (495 + 395 / 2) / 1400),
        commZ + commD * (0.5 - (935 + 395 / 2) / 1400)
      ];
      const awningDepth = commD * (395 / 1400);

      bayCentersZ.forEach((bz) => {
        const bAwning = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.56, awningDepth), blueAwningMat);
        bAwning.position.set(eastFaceX + 0.45, awningY, bz);
        bAwning.rotation.z = -0.25;
        bAwning.castShadow = true;
        addOutlines(bAwning);
        commercialGroup.add(bAwning);
      });

      const emartCenterZ = commZ + commD * (0.5 - (635 + 705 / 2) / 1400);
      const emartAwningDepth = commD * (725 / 1400);
      const emartAwningMat = new THREE.MeshStandardMaterial({ color: '#D6D3CB', roughness: 0.65 });

      const emartAwning = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.22, emartAwningDepth), emartAwningMat);
      emartAwning.position.set(eastFaceX + 0.68, 3.25, emartCenterZ);
      emartAwning.rotation.z = -0.22;
      emartAwning.castShadow = true;
      addOutlines(emartAwning);
      commercialGroup.add(emartAwning);

      const awningValance = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.24, emartAwningDepth), emartAwningMat);
      awningValance.position.set(eastFaceX + 1.36, 3.02, emartCenterZ);
      commercialGroup.add(awningValance);

      // 5-2. 105동 북측 정중앙 주출입구 문주 <-> 북측 상가동 옥상 보행 연결 브릿지
      const bridgeLen = 5.6;
      const bridgeCenterZ = -13.6;
      const bridge = new THREE.Mesh(
        new THREE.BoxGeometry(6.2, 1.4, bridgeLen),
        new THREE.MeshStandardMaterial({ color: '#4A5058', roughness: 0.85 })
      );
      bridge.position.set(0, commH - 0.7, bridgeCenterZ);
      bridge.castShadow = true;
      bridge.receiveShadow = true;
      addOutlines(bridge);
      commercialGroup.add(bridge);

      const bridgeRail = createGlassRailing(6.0, bridgeLen - 0.2, 1.1);
      bridgeRail.position.set(0, commH, bridgeCenterZ);
      commercialGroup.add(bridgeRail);

      // 5-3. 상가동 옥상 강화유리 난간 & 소나무 조경
      const commRail = createGlassRailing(commW - 0.3, commD - 0.3, 1.15);
      commRail.position.set(commX, commH, commZ);
      commercialGroup.add(commRail);

      const trunkMat = new THREE.MeshStandardMaterial({ color: '#4A3525', roughness: 0.9 });
      const leafMat = new THREE.MeshStandardMaterial({ color: '#275E37', roughness: 0.82 });
      const pineCoords = [
        [22.5, commZ + 5.0, 1.15],
        [23.2, commZ + 2.0, 1.25],
        [22.8, commZ - 1.2, 1.3],
        [22.5, commZ - 4.4, 1.05],
        [14.0, commZ - 4.5, 1.35],
        [-14.0, commZ - 4.2, 1.3]
      ];
      pineCoords.forEach(([px, pz, sc]) => {
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.18 * sc, 0.25 * sc, 2.2 * sc, 8), trunkMat);
        trunk.position.set(px, commH + 1.1 * sc, pz);
        const c1 = new THREE.Mesh(new THREE.DodecahedronGeometry(1.45 * sc, 1), leafMat);
        c1.position.set(px, commH + 2.8 * sc, pz);
        const c2 = new THREE.Mesh(new THREE.DodecahedronGeometry(1.1 * sc, 1), leafMat);
        c2.position.set(px + 0.25 * sc, commH + 3.9 * sc, pz - 0.2 * sc);
        commercialGroup.add(trunk, c1, c2);
      });

      root.add(commercialGroup);

      return root;
    }

    // 씬에 105동 & 상가동 배치
    const complex105 = createKumho105WithCommercial();
    scene.add(complex105);

    // =========================================================
    // 3D 모델링 파일(.glb) 추출 함수
    // =========================================================
    window.exportGLB = () => {
      const exporter = new GLTFExporter();
      exporter.parse(
        complex105,
        (result) => {
          const blob = new Blob([result], { type: 'model/gltf-binary' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = 'kumho_105dong_with_commercial.glb';
          link.click();
          URL.revokeObjectURL(url);
        },
        (error) => {
          console.error('GLB 추출 중 오류:', error);
        },
        { binary: true }
      );
    };

    // 애니메이션 루프
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
