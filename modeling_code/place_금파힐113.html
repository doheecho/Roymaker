<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>금호파크힐스 113동 3D 모델링 v4 (옥상 주황 캐노피 · 21F 연결벽 · 최상단 어두운 루버 · 113 폰트)</title>
  <style>
    body { margin: 0; overflow: hidden; background: #2c2f33; }
    #info {
      position: absolute; top: 14px; left: 16px; color: #fff;
      font-family: 'Malgun Gothic', sans-serif; font-size: 13px;
      background: rgba(20, 22, 25, 0.86); padding: 10px 14px;
      border-radius: 8px; border: 1px solid rgba(255,255,255,0.18);
      pointer-events: none; line-height: 1.55;
    }
    #controls-ui {
      position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
      display: flex; flex-wrap: wrap; justify-content: center; gap: 7px;
      background: rgba(20, 22, 25, 0.88); padding: 10px 14px;
      border-radius: 10px; border: 1px solid rgba(255,255,255,0.18);
      max-width: 96vw;
    }
    button {
      background: #3b4048; color: #fff; border: 1px solid #555b65;
      padding: 6px 11px; border-radius: 6px; cursor: pointer; font-size: 12px;
      font-family: 'Malgun Gothic', sans-serif; transition: 0.15s;
    }
    button:hover { background: #B86B46; border-color: #e08a60; }
    button.highlight-btn { background: #1d4ed8; border-color: #60a5fa; font-weight: bold; }
    button.highlight-btn:hover { background: #2563eb; }
    button.export-btn { background: #0f766e; border-color: #2dd4bf; font-weight: bold; }
    button.export-btn:hover { background: #0d9488; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="info">
    <strong>금호파크힐스 113동 v4 (옥상 ∏형 주황 구조물 · 3-5호 상부 21F/주황벽 · 1-2호 최상단 다크 루버 · 고딕 113)</strong><br/>
    마우스 좌클릭 드래그: 회전 | 우클릭 드래그: 이동 | 휠: 확대·축소 (위: 북 -Z / 아래: 남 +Z / 우: 동 +X / 좌: 서 -X)
  </div>

  <div id="controls-ui">
    <button class="highlight-btn" onclick="setView('top')">스카이뷰 (Top)</button>
    <button onclick="setView('wsw_roof')">서서남 옥상 (첨부1)</button>
    <button onclick="setView('att6')">21F·주황벽·루버 (첨부2·3)</button>
    <button onclick="setView('att3')">동동북·남동 (113)</button>
    <button onclick="setView('att4')">남남서·서측</button>
    <button onclick="setView('att5')">북북서 113벽 (첨부4)</button>
    <button onclick="setView('ent12')">1-2호 출입구</button>
    <button onclick="setView('ent345')">3-5호 출입구</button>
    <button class="export-btn" onclick="exportGLB()">3D 파일 추출 (.glb)</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

    // =========================================================
    // 1. 기본 씬 / 카메라 / 렌더러 / 조명
    // =========================================================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#2E3338');

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.2, 1000);
    camera.position.set(52, 34, -36);

    const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 22, 4);
    controls.enableDamping = true;
    controls.update();

    window.setView = (dir) => {
      if (dir === 'top') {
        controls.target.set(1.0, 15, 2.0);
        camera.position.set(1.0, 125, 2.01);
      } else if (dir === 'wsw_roof') {
        // 첨부1 검증용: Wing A 서서남 옥상 ∏형 주황 구조물
        controls.target.set(-6.0, 50.0, -9.0);
        camera.position.set(-44, 48, 2);
      } else if (dir === 'att3') {
        controls.target.set(8.0, 22, 10.0);
        camera.position.set(62, 26, 38);
      } else if (dir === 'att4') {
        controls.target.set(-4.0, 24, 6.0);
        camera.position.set(-62, 20, 44);
      } else if (dir === 'att5') {
        controls.target.set(-9.5, 26, -22.0);
        camera.position.set(-22, 24, -62);
      } else if (dir === 'att6') {
        // 첨부2·3 검증용: 3-5호 상부 21F 연결벽 + 주황 외벽 + 1-2호 최상단 다크 루버
        controls.target.set(3.5, 32, -2.5);
        camera.position.set(56, 30, -34);
      } else if (dir === 'ent12') {
        controls.target.set(2.5, 3.6, -13.0);
        camera.position.set(17.5, 6.0, -18.5);
      } else if (dir === 'ent345') {
        controls.target.set(6.8, 3.6, 1.5);
        camera.position.set(18.5, 6.2, -9.5);
      }
      controls.update();
    };

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.90);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xfffaf0, 1.15);
    sunLight.position.set(65, 115, 40);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(2048, 2048);
    sunLight.shadow.camera.near = 10;
    sunLight.shadow.camera.far = 260;
    sunLight.shadow.camera.left = -60;
    sunLight.shadow.camera.right = 60;
    sunLight.shadow.camera.top = 60;
    sunLight.shadow.camera.bottom = -60;
    sunLight.shadow.bias = -0.0005;
    scene.add(sunLight);

    const fillLight = new THREE.DirectionalLight(0xd8e6f5, 0.55);
    fillLight.position.set(-60, 50, -55);
    scene.add(fillLight);

    const gridHelper = new THREE.GridHelper(160, 40, 0x555b63, 0x3d4248);
    scene.add(gridHelper);

    // =========================================================
    // 2. 공통 색상 팔레트 & 치수 상수
    // =========================================================
    const COLORS = {
      terracotta: '#C0744D',
      terracottaShade: '#8E5032',
      whiteWall: '#EFECE6',
      ivoryBeige: '#E4DFD4',
      lightGray: '#BFC4CA',
      midGray: '#8A8F96',
      cementGray: '#A8ADB4',
      darkStone: '#2D3137',
      roofDeck: '#CBC2B0'
    };

    const FLOOR_H = 2.65;
    const BASE_FLOORS = 3;
    const BASE_H = FLOOR_H * BASE_FLOORS; // 7.95m

    // =========================================================
    // 3. 정밀 텍스처 생성기
    // =========================================================

    function drawColumnElement(ctx, type, curX, fy, colW, floorPx, { isDarkBase = false } = {}) {
      if (type === 'living') {
        const padX = colW * 0.09;
        drawDoublePaneWindow(ctx, curX + padX, fy + floorPx * 0.12, colW - padX * 2, floorPx * 0.78, true, isDarkBase);
      } else if (type === 'small_full') {
        const padX = colW * 0.15;
        drawDoublePaneWindow(ctx, curX + padX, fy + floorPx * 0.14, colW - padX * 2, floorPx * 0.74, true, isDarkBase);
      } else if (type === 'small_half') {
        const padX = colW * 0.16;
        drawDoublePaneWindow(ctx, curX + padX, fy + floorPx * 0.15, colW - padX * 2, floorPx * 0.42, false, isDarkBase);
      } else if (type === 'quarter') {
        const padX = colW * 0.24;
        drawDoublePaneWindow(ctx, curX + padX, fy + floorPx * 0.20, colW - padX * 2, floorPx * 0.30, false, isDarkBase);
      } else if (type === 'ac') {
        const padX = colW * 0.14;
        const wx = curX + padX;
        const ww = colW - padX * 2;
        const wy = fy + floorPx * 0.12;
        const wh = floorPx * 0.76;
        ctx.fillStyle = '#202429';
        ctx.fillRect(wx, wy, ww, wh);
        ctx.strokeStyle = isDarkBase ? '#7C848E' : '#C8CCD2';
        ctx.lineWidth = 2;
        ctx.strokeRect(wx, wy, ww, wh);
        ctx.fillStyle = '#596068';
        for (let ly = wy + 4; ly < wy + wh - 3; ly += 4.5) {
          ctx.fillRect(wx + 2, ly, ww - 4, 2);
        }
      } else if (type === 'curtain') {
        const padX = colW * 0.08;
        const wx = curX + padX;
        const ww = colW - padX * 2;
        ctx.fillStyle = '#1E2832';
        ctx.fillRect(wx, fy, ww, floorPx);
        ctx.fillStyle = 'rgba(130, 165, 195, 0.16)';
        ctx.fillRect(wx + ww * 0.15, fy + 2, ww * 0.25, floorPx - 4);
        ctx.fillStyle = '#8F969E';
        ctx.fillRect(wx, fy, ww, 4);
        ctx.fillStyle = '#D5D8DC';
        ctx.fillRect(wx, fy, 2.5, floorPx);
        ctx.fillRect(wx + ww - 2.5, fy, 2.5, floorPx);
      }
    }

    function drawDoublePaneWindow(ctx, x, y, w, h, hasRailing, isDarkBase = false) {
      const grad = ctx.createLinearGradient(x, y, x, y + h);
      grad.addColorStop(0, '#1D2934');
      grad.addColorStop(0.55, '#2A3B4A');
      grad.addColorStop(1, '#161F27');
      ctx.fillStyle = grad;
      ctx.fillRect(x, y, w, h);

      ctx.strokeStyle = isDarkBase ? '#9EA5AE' : '#DCDAD4';
      ctx.lineWidth = 2.4;
      ctx.strokeRect(x, y, w, h);
      ctx.beginPath();
      ctx.moveTo(x + w * 0.5, y);
      ctx.lineTo(x + w * 0.5, y + h);
      ctx.stroke();

      if (hasRailing) {
        const railY = y + h * 0.58;
        ctx.fillStyle = '#15181C';
        ctx.fillRect(x - 1, railY, w + 2, 2.5);
        const step = Math.max(5, w / 9);
        for (let rx = x + 2; rx < x + w - 1; rx += step) {
          ctx.fillRect(rx, railY, 1.4, y + h - railY);
        }
      }
    }

    // (1) 1~3층 석재 기단부 (층간 두꺼운 회색선 + 사이 얇은 선 4줄 + 창호)
    function createStoneBaseTexture(widthMeters = 10, columns = null, {
      leftBorderW = 0,
      rightBorderW = 0,
      widthPx = null
    } = {}) {
      const pxPerMeter = 42;
      const cw = widthPx || Math.max(160, Math.round(widthMeters * pxPerMeter));
      const ch = 384;
      const canvas = document.createElement('canvas');
      canvas.width = cw;
      canvas.height = ch;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#2B2F35';
      ctx.fillRect(0, 0, cw, ch);

      const colW = 54;
      const floorPx = ch / BASE_FLOORS;
      const subRowH = floorPx / 5;

      for (let f = 0; f < BASE_FLOORS; f++) {
        const fy = f * floorPx;
        for (let r = 0; r < 5; r++) {
          const ry = fy + r * subRowH;
          for (let x = 0; x < cw; x += colW) {
            const shade = ((f * 7 + r * 3 + Math.floor(x / colW) * 5) % 5) - 2;
            ctx.fillStyle = `rgb(${43 + shade * 2}, ${47 + shade * 2}, ${53 + shade * 2})`;
            ctx.fillRect(x + 1, ry + 1, colW - 2, subRowH - 2);
          }
        }
      }

      ctx.fillStyle = 'rgba(120, 128, 138, 0.28)';
      for (let x = colW; x < cw; x += colW) {
        ctx.fillRect(x, 0, 1.5, ch);
      }

      for (let f = 0; f < BASE_FLOORS; f++) {
        const fy = f * floorPx;
        ctx.fillStyle = '#9EA5AE';
        ctx.fillRect(0, fy, cw, 5);
        ctx.fillStyle = '#181B1F';
        ctx.fillRect(0, fy + 5, cw, 1.5);

        for (let r = 1; r <= 4; r++) {
          const ry = fy + r * subRowH;
          ctx.fillStyle = '#5D646E';
          ctx.fillRect(0, ry, cw, 1.5);
          ctx.fillStyle = '#1A1D21';
          ctx.fillRect(0, ry + 1.5, cw, 1);
        }
      }

      ctx.fillStyle = '#1A1D21';
      ctx.fillRect(0, ch - 4, cw, 4);

      if (columns && columns.length > 0) {
        const leftPx = Math.round(cw * leftBorderW);
        const rightPx = Math.round(cw * rightBorderW);
        const usableW = cw - leftPx - rightPx;
        const totalWeight = columns.reduce((s, c) => s + c.w, 0);

        let curX = leftPx;
        columns.forEach(col => {
          const cW = (col.w / totalWeight) * usableW;
          for (let f = 0; f < BASE_FLOORS; f++) {
            const fy = f * floorPx;
            if (col.type !== 'solid' && col.type !== 'solid_striped') {
              drawColumnElement(ctx, col.type, curX, fy, cW, floorPx, { isDarkBase: true });
            }
          }
          curX += cW;
        });
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      return tex;
    }

    function makeStoneBaseMat(widthMeters, columns = null, opts = {}) {
      return new THREE.MeshStandardMaterial({
        map: createStoneBaseTexture(widthMeters, columns, opts),
        roughness: 0.72
      });
    }

    // (2) 테라코타 주황 수평 패널 측벽
    function createTerracottaWallTexture(floors, { leftGrayStripRatio = 0 } = {}) {
      const cw = 512;
      const ch = Math.max(256, Math.round(floors * 56));
      const canvas = document.createElement('canvas');
      canvas.width = cw;
      canvas.height = ch;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = COLORS.terracotta;
      ctx.fillRect(0, 0, cw, ch);

      const floorPx = ch / floors;
      const count = Math.ceil(floors);
      for (let f = 0; f < count; f++) {
        const fy = f * floorPx;
        ctx.fillStyle = 'rgba(55, 25, 10, 0.26)';
        ctx.fillRect(0, fy, cw, 2);
        ctx.fillStyle = 'rgba(65, 30, 12, 0.14)';
        for (let r = 1; r <= 4; r++) {
          ctx.fillRect(0, fy + (floorPx / 5) * r, cw, 1.2);
        }
      }

      if (leftGrayStripRatio > 0) {
        const gw = Math.round(cw * leftGrayStripRatio);
        ctx.fillStyle = COLORS.midGray;
        ctx.fillRect(0, 0, gw, ch);
        ctx.fillStyle = 'rgba(30, 34, 38, 0.22)';
        for (let f = 0; f < count; f++) {
          ctx.fillRect(0, f * floorPx, gw, 2);
        }
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      return tex;
    }

    // (3) 출입구 상부 회색벽 가로줄 텍스처
    function createHorizontalStripedGrayBoxTexture(floors, baseColor = '#A8ADB4', subLines = 4) {
      const cw = 256;
      const floorPx = 56;
      const ch = Math.max(256, Math.round(floors * floorPx));
      const canvas = document.createElement('canvas');
      canvas.width = cw;
      canvas.height = ch;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = baseColor;
      ctx.fillRect(0, 0, cw, ch);

      const count = Math.ceil(floors);
      const actualFloorPx = ch / floors;
      for (let f = 0; f < count; f++) {
        const fy = f * actualFloorPx;
        ctx.fillStyle = 'rgba(42, 46, 52, 0.45)';
        ctx.fillRect(0, fy, cw, 2.4);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.22)';
        ctx.fillRect(0, fy + 2.4, cw, 1.0);

        for (let r = 1; r <= subLines; r++) {
          const ry = fy + (actualFloorPx / (subLines + 1)) * r;
          ctx.fillStyle = 'rgba(48, 52, 58, 0.28)';
          ctx.fillRect(0, ry, cw, 1.5);
        }
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      return tex;
    }

    // (4) 중앙 코어 반복 가로줄 텍스처
    function createHorizontalStripedGrayTileTexture(baseColor = '#B4B9C0') {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = baseColor;
      ctx.fillRect(0, 0, 256, 128);

      ctx.fillStyle = 'rgba(40, 44, 50, 0.45)';
      ctx.fillRect(0, 0, 256, 5);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.20)';
      ctx.fillRect(0, 5, 256, 2);

      const subH = 128 / 5;
      for (let r = 1; r <= 4; r++) {
        ctx.fillStyle = 'rgba(45, 50, 56, 0.28)';
        ctx.fillRect(0, r * subH, 256, 2.5);
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(0.25, 1 / FLOOR_H);
      tex.anisotropy = 8;
      return tex;
    }

    // (5) 범용 상부층 입면 텍스처 생성기
    function createFacadeTexture(floors, columns, {
      defaultBg = COLORS.whiteWall,
      leftBorder = null,
      rightBorder = null,
      widthPx = 512
    } = {}) {
      const cw = widthPx;
      const floorPx = 56;
      const ch = floors * floorPx;
      const canvas = document.createElement('canvas');
      canvas.width = cw;
      canvas.height = ch;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = defaultBg;
      ctx.fillRect(0, 0, cw, ch);

      const leftPx = leftBorder ? Math.round(cw * leftBorder.w) : 0;
      const rightPx = rightBorder ? Math.round(cw * rightBorder.w) : 0;
      const usableW = cw - leftPx - rightPx;
      const totalWeight = columns.reduce((s, c) => s + c.w, 0);

      let curX = leftPx;
      columns.forEach(col => {
        const colW = (col.w / totalWeight) * usableW;
        const baseBg = col.bg || defaultBg;

        for (let f = 0; f < floors; f++) {
          const fy = f * floorPx;
          const floorFromBottom = floors - f;
          const isLowerGray = col.lowerGrayCount && floorFromBottom <= col.lowerGrayCount;
          ctx.fillStyle = isLowerGray ? '#90959C' : baseBg;
          ctx.fillRect(curX, fy, colW + 0.5, floorPx + 0.5);

          ctx.fillStyle = 'rgba(30, 34, 40, 0.16)';
          ctx.fillRect(curX, fy, colW, 1.8);

          if (col.type === 'solid_striped') {
            ctx.fillStyle = 'rgba(42, 46, 52, 0.40)';
            ctx.fillRect(curX, fy, colW, 2.2);
            for (let r = 1; r <= 4; r++) {
              ctx.fillStyle = 'rgba(50, 54, 60, 0.28)';
              ctx.fillRect(curX, fy + (floorPx / 5) * r, colW, 1.5);
            }
          } else if (col.type === 'solid') {
            if (baseBg === COLORS.terracotta) {
              ctx.fillStyle = 'rgba(65, 30, 12, 0.14)';
              for (let r = 1; r <= 4; r++) {
                ctx.fillRect(curX, fy + (floorPx / 5) * r, colW, 1.2);
              }
            }
          } else {
            drawColumnElement(ctx, col.type, curX, fy, colW, floorPx, { isDarkBase: false });
          }
        }
        curX += colW;
      });

      if (leftBorder) {
        ctx.fillStyle = leftBorder.color;
        ctx.fillRect(0, 0, leftPx, ch);
      }
      if (rightBorder) {
        ctx.fillStyle = rightBorder.color;
        ctx.fillRect(cw - rightPx, 0, rightPx, ch);
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      return tex;
    }

    // (6) 문주 정면 헤더 텍스처
    function createPortalHeaderTexture(leftNum, dongNum, rightNum) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 160;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#2B2F35';
      ctx.fillRect(0, 0, 512, 160);

      ctx.fillStyle = '#1E2126';
      ctx.fillRect(58, 0, 396, 44);
      ctx.fillStyle = '#4B525C';
      for (let x = 66; x < 448; x += 9) {
        ctx.fillRect(x, 4, 4, 36);
      }

      ctx.strokeStyle = '#4A5058';
      ctx.lineWidth = 3;
      ctx.strokeRect(62, 54, 388, 86);

      const cy = 116;
      ctx.textAlign = 'center';
      ctx.fillStyle = '#121417';
      ctx.font = 'bold 54px "Malgun Gothic", sans-serif';
      ctx.fillText(dongNum, 258, cy + 2);
      ctx.font = 'bold 36px "Malgun Gothic", sans-serif';
      ctx.fillText(leftNum, 152, cy - 2);
      ctx.fillText(rightNum, 364, cy - 2);

      ctx.fillStyle = '#F1F5F9';
      ctx.font = 'bold 54px "Malgun Gothic", sans-serif';
      ctx.fillText(dongNum, 256, cy);
      ctx.font = 'bold 36px "Malgun Gothic", sans-serif';
      ctx.fillText(leftNum, 150, cy - 4);
      ctx.fillText(rightNum, 362, cy - 4);

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createPortalSideLouverTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 160;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#2B2F35';
      ctx.fillRect(0, 0, 512, 160);
      ctx.fillStyle = '#1B1E22';
      ctx.fillRect(14, 10, 484, 58);
      ctx.fillStyle = '#4E5560';
      for (let x = 22; x < 490; x += 10) {
        ctx.fillRect(x, 14, 4.5, 50);
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // =========================================================
    // 4. 3D 건축 요소 헬퍼
    // =========================================================

    // ★ (A) 첨부4 실사진 폰트와 동일한 3D 입체 돌출 '113' 사인 (부드러운 벡터 베지어 ExtrudeGeometry)
    function createDigitOneShape() {
      const s = new THREE.Shape();
      // 하단 평탄 베이스 + 굵은 수직 획 + 좌상단 사선 플래그 (첨부4 실사진 비율)
      s.moveTo(0.23, 0.0);
      s.lineTo(0.45, 0.0);
      s.lineTo(0.45, 1.0);
      s.lineTo(0.31, 1.0);
      s.lineTo(0.0, 0.88);
      s.lineTo(0.03, 0.72);
      s.lineTo(0.23, 0.79);
      s.closePath();
      return s;
    }

    function createDigitThreeShape() {
      const s = new THREE.Shape();
      // 첨부4 실사진의 둥글고 볼드한 고딕 '3' 곡선 윤곽 (CCW)
      s.moveTo(0.03, 0.05);
      // 하단 외곽 곡선 & 약간 넓은 아래쪽 둥근 볼
      s.bezierCurveTo(0.18, -0.02, 0.38, -0.02, 0.52, 0.04);
      s.bezierCurveTo(0.64, 0.10, 0.68, 0.20, 0.68, 0.30);
      s.bezierCurveTo(0.68, 0.41, 0.61, 0.49, 0.49, 0.52);
      // 위쪽 둥근 볼 & 상단 외곽 곡선
      s.bezierCurveTo(0.59, 0.56, 0.64, 0.64, 0.64, 0.74);
      s.bezierCurveTo(0.64, 0.87, 0.55, 0.96, 0.42, 0.99);
      s.bezierCurveTo(0.28, 1.02, 0.14, 1.00, 0.05, 0.95);
      // 상단 좌측 끝단 절단면
      s.lineTo(0.05, 0.79);
      // 상단 내곽 곡선 -> 중앙 가로 바
      s.bezierCurveTo(0.15, 0.84, 0.27, 0.85, 0.35, 0.83);
      s.bezierCurveTo(0.42, 0.81, 0.45, 0.77, 0.45, 0.72);
      s.bezierCurveTo(0.45, 0.65, 0.40, 0.60, 0.30, 0.60);
      s.lineTo(0.20, 0.60);
      s.lineTo(0.20, 0.44);
      s.lineTo(0.32, 0.44);
      // 하단 내곽 곡선 -> 하단 좌측 끝단
      s.bezierCurveTo(0.43, 0.44, 0.48, 0.38, 0.48, 0.30);
      s.bezierCurveTo(0.48, 0.21, 0.42, 0.15, 0.31, 0.14);
      s.bezierCurveTo(0.21, 0.13, 0.11, 0.16, 0.03, 0.20);
      s.closePath();
      return s;
    }

    function createProtruding113Sign(scale = 1.0) {
      const group = new THREE.Group();
      const h = 1.38 * scale; // 실제 글자 높이 (m)
      const depth = 0.13 * scale;

      const frontMat = new THREE.MeshStandardMaterial({ color: '#F5F7FA', roughness: 0.32, metalness: 0.12 });
      const sideMat = new THREE.MeshStandardMaterial({ color: '#7D8590', roughness: 0.55 });

      const extrudeOpts = {
        depth: depth / h,
        bevelEnabled: true,
        bevelThickness: 0.014,
        bevelSize: 0.010,
        bevelSegments: 2,
        curveSegments: 24
      };

      const shape1 = createDigitOneShape();
      const shape3 = createDigitThreeShape();
      const geo1 = new THREE.ExtrudeGeometry(shape1, extrudeOpts);
      const geo3 = new THREE.ExtrudeGeometry(shape3, extrudeOpts);

      // '1' '1' '3' 배치 (첨부4 실사진의 촘촘하고 균형 잡힌 자간)
      const items = [
        { geo: geo1, x: -0.92 },
        { geo: geo1, x: -0.38 },
        { geo: geo3, x: 0.20 }
      ];

      items.forEach(item => {
        const m = new THREE.Mesh(item.geo, [frontMat, sideMat]);
        m.scale.set(h, h, h);
        m.position.set(item.x * h, -0.5 * h, 0);
        m.castShadow = true;
        group.add(m);
      });

      return group;
    }

    // (B) 옥상 하얀 울타리
    function createWhiteRoofRailing(length, height = 1.05) {
      const group = new THREE.Group();
      const railMat = new THREE.MeshStandardMaterial({ color: '#F3F4F6', roughness: 0.5 });

      const topBar = new THREE.Mesh(new THREE.BoxGeometry(length, 0.10, 0.10), railMat);
      topBar.position.y = height;
      group.add(topBar);

      const midBar = new THREE.Mesh(new THREE.BoxGeometry(length, 0.07, 0.07), railMat);
      midBar.position.y = height * 0.52;
      group.add(midBar);

      const posts = Math.max(2, Math.round(length / 1.3));
      for (let i = 0; i <= posts; i++) {
        const px = -length / 2 + (length / posts) * i;
        const post = new THREE.Mesh(new THREE.BoxGeometry(0.08, height, 0.08), railMat);
        post.position.set(px, height / 2, 0);
        group.add(post);
      }
      return group;
    }

    // ★ (C) 첨부1 좌측 실사진 형태: 서서남 옥상 ∏자형 주황 캐노피 구조물
    function createWswOrangeCanopy(spanZ = 16.4, depthX = 2.4, totalH = 2.85) {
      const group = new THREE.Group();
      const pierW = 1.45;
      const beamH = 0.68;
      const clearH = totalH - beamH;

      const orangeSidingMat = new THREE.MeshStandardMaterial({
        map: createTerracottaWallTexture(2),
        roughness: 0.76
      });
      const orangeSolidMat = new THREE.MeshStandardMaterial({ color: COLORS.terracotta, roughness: 0.78 });
      const soffitMat = new THREE.MeshStandardMaterial({ color: COLORS.terracottaShade, roughness: 0.85 });
      const innerPostMat = new THREE.MeshStandardMaterial({ color: '#2F343A', roughness: 0.65 });

      // 좌·우측 주황 수직 기둥/벽체
      [-1, 1].forEach(side => {
        const pier = new THREE.Mesh(
          new THREE.BoxGeometry(depthX, clearH, pierW),
          [orangeSidingMat, orangeSidingMat, orangeSolidMat, orangeSolidMat, orangeSidingMat, orangeSidingMat]
        );
        pier.position.set(0, clearH / 2, side * (spanZ / 2 - pierW / 2));
        pier.castShadow = true;
        pier.receiveShadow = true;
        group.add(pier);
      });

      // 상단 가로 주황 캐노피 빔 (하부 천장은 그림자진 짙은 테라코타)
      const topBeam = new THREE.Mesh(
        new THREE.BoxGeometry(depthX, beamH, spanZ),
        [orangeSolidMat, orangeSolidMat, orangeSolidMat, soffitMat, orangeSidingMat, orangeSidingMat]
      );
      topBeam.position.set(0, totalH - beamH / 2, 0);
      topBeam.castShadow = true;
      topBeam.receiveShadow = true;
      group.add(topBeam);

      // 하부 개방 공간 안쪽 지지 기둥 2개 (첨부1 좌측 사진 속 어두운 내부 기둥)
      [-2.8, 2.8].forEach(pz => {
        const post = new THREE.Mesh(
          new THREE.BoxGeometry(0.26, clearH, 0.26),
          innerPostMat
        );
        post.position.set(depthX * 0.12, clearH / 2, pz);
        group.add(post);
      });

      return group;
    }

    // ★ (D) 첨부3 실사진 형태: 1-2호 출입구 최상단 어두운 루버 구조물 옥탑
    function createDarkLouverPenthouse(widthX, heightY, lengthZ) {
      const group = new THREE.Group();
      const frameMat = new THREE.MeshStandardMaterial({ color: '#D4D8DD', roughness: 0.78 });
      const topMat = new THREE.MeshStandardMaterial({ color: '#C6CBD2', roughness: 0.82 });
      const darkBackMat = new THREE.MeshStandardMaterial({ color: '#171B21', roughness: 0.65 });
      const darkSlatMat = new THREE.MeshStandardMaterial({ color: '#2B323D', roughness: 0.45, metalness: 0.35 });
      const darkMullionMat = new THREE.MeshStandardMaterial({ color: '#1F252E', roughness: 0.5, metalness: 0.3 });

      const frameT = 0.28; // 상·하·좌·우 밝은 회색 외곽 프레임 두께
      const innerH = heightY - frameT * 2;
      const innerZ = lengthZ - frameT * 2;

      // 1) 본체 콘크리트 박스 (전면 +X 쪽을 안쪽으로 0.35m 후퇴시켜 루버 공간 확보)
      const bodyBackX = widthX - 0.36;
      const mainBody = new THREE.Mesh(
        new THREE.BoxGeometry(bodyBackX, heightY, lengthZ),
        [darkBackMat, frameMat, topMat, frameMat, frameMat, frameMat]
      );
      mainBody.position.set(-0.18, heightY / 2, 0);
      mainBody.castShadow = true;
      mainBody.receiveShadow = true;
      group.add(mainBody);

      // 2) 전면(+X) 상·하·좌·우 밝은 회색 프레임 띠
      const frontX = widthX / 2 - 0.18;
      const topFrame = new THREE.Mesh(new THREE.BoxGeometry(0.36, frameT, lengthZ), [frameMat, frameMat, topMat, frameMat, frameMat, frameMat]);
      topFrame.position.set(frontX, heightY - frameT / 2, 0);
      group.add(topFrame);

      const botFrame = new THREE.Mesh(new THREE.BoxGeometry(0.36, frameT, lengthZ), frameMat);
      botFrame.position.set(frontX, frameT / 2, 0);
      group.add(botFrame);

      // 좌(+Z) 프레임 기둥
      const leftFrame = new THREE.Mesh(new THREE.BoxGeometry(0.36, innerH, frameT), frameMat);
      leftFrame.position.set(frontX, heightY / 2, lengthZ / 2 - frameT / 2);
      group.add(leftFrame);

      // 3) 전면(+X) 3D 어두운 수평 루버 살 (첨부3의 굵고 선명한 어두운 루버)
      const louverFrontX = widthX / 2 - 0.06;
      const slatCount = 8;
      const slatSpanZ = lengthZ - frameT; // 우측(-Z) 모서리까지 랩어라운드
      const slatCenterZ = -frameT / 2;

      for (let i = 0; i < slatCount; i++) {
        const sy = frameT + (innerH / (slatCount + 0.5)) * (i + 0.75);
        const slat = new THREE.Mesh(
          new THREE.BoxGeometry(0.14, 0.11, slatSpanZ),
          darkSlatMat
        );
        slat.position.set(louverFrontX, sy, slatCenterZ);
        slat.castShadow = true;
        group.add(slat);
      }

      // 4) 전면(+X) 3분할 수직 다크 멀리언 (첨부3의 3칸 루버 분할)
      [-slatSpanZ * 0.17, slatSpanZ * 0.17, -lengthZ / 2 + 0.06].forEach(mz => {
        const mullion = new THREE.Mesh(
          new THREE.BoxGeometry(0.18, innerH, 0.13),
          darkMullionMat
        );
        mullion.position.set(louverFrontX - 0.02, heightY / 2, mz);
        group.add(mullion);
      });

      // 5) 우측(-Z) 모서리 측면 어두운 루버 (첨부3 우측 코너 랩어라운드 디테일)
      const sideWrapX = 0.78;
      const sideBack = new THREE.Mesh(
        new THREE.BoxGeometry(sideWrapX, innerH, 0.08),
        darkBackMat
      );
      sideBack.position.set(widthX / 2 - sideWrapX / 2, heightY / 2, -lengthZ / 2 - 0.02);
      group.add(sideBack);

      for (let i = 0; i < slatCount; i++) {
        const sy = frameT + (innerH / (slatCount + 0.5)) * (i + 0.75);
        const sideSlat = new THREE.Mesh(
          new THREE.BoxGeometry(sideWrapX, 0.11, 0.10),
          darkSlatMat
        );
        sideSlat.position.set(widthX / 2 - sideWrapX / 2, sy, -lengthZ / 2 - 0.04);
        group.add(sideSlat);
      }

      return group;
    }

    function createRoofParapetRing(w, d, h = 2.2, {
      wallColor = '#E6E8EC',
      topColor = '#D2D6DC',
      frontOrangeStripe = false,
      frontSolarStrip = false
    } = {}) {
      const group = new THREE.Group();
      const t = 1.65;
      const wallMat = new THREE.MeshStandardMaterial({ color: wallColor, roughness: 0.78 });
      const topMat = new THREE.MeshStandardMaterial({ color: topColor, roughness: 0.82 });
      const orangeMat = new THREE.MeshStandardMaterial({ color: COLORS.terracotta, roughness: 0.78 });

      const segs = [
        { size: [w, h, t], pos: [0, h / 2, d / 2 - t / 2], front: true },
        { size: [w, h, t], pos: [0, h / 2, -d / 2 + t / 2], front: false },
        { size: [t, h, d - t * 2], pos: [w / 2 - t / 2, h / 2, 0], front: false },
        { size: [t, h, d - t * 2], pos: [-w / 2 + t / 2, h / 2, 0], front: false }
      ];

      segs.forEach(s => {
        const sideM = (s.front && frontOrangeStripe) ? orangeMat : wallMat;
        const m = new THREE.Mesh(
          new THREE.BoxGeometry(...s.size),
          [wallMat, wallMat, topMat, wallMat, sideM, wallMat]
        );
        m.position.set(...s.pos);
        m.castShadow = true;
        m.receiveShadow = true;
        group.add(m);
      });

      if (frontSolarStrip) {
        const strip = new THREE.Mesh(
          new THREE.BoxGeometry(w - 1.2, 0.25, 1.15),
          new THREE.MeshStandardMaterial({ color: '#374151', roughness: 0.55, metalness: 0.25 })
        );
        strip.position.set(0, h + 0.14, d / 2 - t / 2);
        group.add(strip);
      }

      return group;
    }

    // (E) 주출입구 문주 + 금색 테두리 커튼월 + 은색 테두리 투명유리 자동문
    function createEntrancePortal({ leftNum = '1', dongNum = '113', rightNum = '2', scale = 1.0 } = {}) {
      const group = new THREE.Group();
      const stoneMat = new THREE.MeshStandardMaterial({ color: '#2B2F35', roughness: 0.68 });
      const stoneDarkMat = new THREE.MeshStandardMaterial({ color: '#202429', roughness: 0.75 });
      const headerFrontMat = new THREE.MeshStandardMaterial({ map: createPortalHeaderTexture(leftNum, dongNum, rightNum), roughness: 0.65 });
      const louverSideMat = new THREE.MeshStandardMaterial({ map: createPortalSideLouverTexture(), roughness: 0.70 });

      const goldFrameMat = new THREE.MeshStandardMaterial({ color: '#A68E5C', roughness: 0.35, metalness: 0.62 });
      const silverFrameMat = new THREE.MeshStandardMaterial({ color: '#E2E8F0', roughness: 0.22, metalness: 0.85 });
      const tintedGlassMat = new THREE.MeshStandardMaterial({
        color: '#192228',
        roughness: 0.12,
        metalness: 0.30,
        transparent: true,
        opacity: 0.54,
        depthWrite: false
      });
      const clearDoorGlassMat = new THREE.MeshStandardMaterial({
        color: '#D8ECF8',
        roughness: 0.06,
        metalness: 0.15,
        transparent: true,
        opacity: 0.18,
        depthWrite: false
      });

      const portalW = 6.2 * scale;
      const portalD = 4.2 * scale;
      const portalH = 6.1 * scale;
      const pillarW = 0.98 * scale;
      const pillarD = 1.05 * scale;
      const headerH = 1.75 * scale;
      const clearH = portalH - headerH;

      [-1, 1].forEach(side => {
        const pillar = new THREE.Mesh(
          new THREE.BoxGeometry(pillarW, clearH, pillarD),
          stoneMat
        );
        pillar.position.set(side * (portalW / 2 - pillarW / 2), clearH / 2, portalD - pillarD / 2);
        pillar.castShadow = true;
        pillar.receiveShadow = true;
        group.add(pillar);
      });

      const redSign = new THREE.Mesh(
        new THREE.BoxGeometry(0.28 * scale, 0.36 * scale, 0.04),
        new THREE.MeshStandardMaterial({ color: '#DC2626', roughness: 0.4 })
      );
      redSign.position.set(portalW / 2 - pillarW * 0.5, 2.3 * scale, portalD + 0.02);
      group.add(redSign);

      const header = new THREE.Mesh(
        new THREE.BoxGeometry(portalW, headerH, portalD),
        [louverSideMat, louverSideMat, stoneDarkMat, stoneDarkMat, headerFrontMat, stoneMat]
      );
      header.position.set(0, portalH - headerH / 2, portalD / 2);
      header.castShadow = true;
      header.receiveShadow = true;
      group.add(header);

      const lobbyW = portalW - 0.44 * scale;
      const lobbyD = 2.05 * scale;
      const frontZ = lobbyD;

      const lobbyFloor = new THREE.Mesh(
        new THREE.BoxGeometry(portalW - 0.2 * scale, 0.08, portalD),
        new THREE.MeshStandardMaterial({ color: '#8A9098', roughness: 0.72 })
      );
      lobbyFloor.position.set(0, 0.04, portalD / 2);
      lobbyFloor.receiveShadow = true;
      group.add(lobbyFloor);

      const doorMat = new THREE.Mesh(
        new THREE.BoxGeometry(2.1 * scale, 0.03, 0.9 * scale),
        new THREE.MeshStandardMaterial({ color: '#4B5056', roughness: 0.9 })
      );
      doorMat.position.set(0, 0.09, frontZ + 0.55 * scale);
      group.add(doorMat);

      const lobbyBackWall = new THREE.Mesh(
        new THREE.BoxGeometry(lobbyW, clearH, 0.14),
        new THREE.MeshStandardMaterial({ color: '#C5BFB2', roughness: 0.75 })
      );
      lobbyBackWall.position.set(0, clearH / 2, 0.07);
      group.add(lobbyBackWall);

      const innerHallDoor = new THREE.Mesh(
        new THREE.BoxGeometry(1.5 * scale, 2.3 * scale, 0.06),
        new THREE.MeshStandardMaterial({ color: '#5A616A', roughness: 0.45, metalness: 0.4 })
      );
      innerHallDoor.position.set(0, 1.15 * scale, 0.17);
      group.add(innerHallDoor);

      const lobbyCeiling = new THREE.Mesh(
        new THREE.BoxGeometry(lobbyW, 0.08, lobbyD),
        new THREE.MeshStandardMaterial({ color: '#E5E7EB', emissive: '#FFF7E6', emissiveIntensity: 0.35 })
      );
      lobbyCeiling.position.set(0, clearH - 0.04, lobbyD / 2);
      group.add(lobbyCeiling);

      const mT = 0.065 * scale;
      const doorW = 2.24 * scale;
      const doorH = 2.40 * scale;

      const addGoldBar = (w, h, d, x, y, z) => {
        const bar = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), goldFrameMat);
        bar.position.set(x, y, z);
        group.add(bar);
      };

      [-1, 1].forEach(side => {
        const sx = side * (lobbyW / 2);
        const sideGlass = new THREE.Mesh(new THREE.BoxGeometry(0.03, clearH, lobbyD), tintedGlassMat);
        sideGlass.position.set(sx, clearH / 2, lobbyD / 2);
        group.add(sideGlass);

        for (let i = 0; i <= 2; i++) {
          addGoldBar(mT, clearH, mT, sx, clearH / 2, (lobbyD / 2) * i);
        }
        [0.05 * scale, doorH, clearH - 0.05 * scale].forEach(hy => {
          addGoldBar(mT, mT, lobbyD, sx, hy, lobbyD / 2);
        });
      });

      const sidePanelW = (lobbyW - doorW) / 2;
      [-1, 1].forEach(side => {
        const px = side * (doorW / 2 + sidePanelW / 2);
        const pGlass = new THREE.Mesh(new THREE.BoxGeometry(sidePanelW, doorH, 0.03), tintedGlassMat);
        pGlass.position.set(px, doorH / 2, frontZ);
        group.add(pGlass);
      });

      const topGlassH = clearH - doorH;
      const topGlass = new THREE.Mesh(new THREE.BoxGeometry(lobbyW, topGlassH, 0.03), tintedGlassMat);
      topGlass.position.set(0, doorH + topGlassH / 2, frontZ);
      group.add(topGlass);

      [-lobbyW / 2, -(doorW / 2 + sidePanelW / 2), -doorW / 2, doorW / 2, (doorW / 2 + sidePanelW / 2), lobbyW / 2].forEach(mx => {
        addGoldBar(mT, clearH, mT, mx, clearH / 2, frontZ);
      });
      addGoldBar(lobbyW, mT, mT, 0, clearH - 0.05 * scale, frontZ);
      addGoldBar(lobbyW, mT, mT, 0, doorH + topGlassH * 0.52, frontZ);
      addGoldBar(lobbyW, mT, mT, 0, doorH, frontZ);
      [-1, 1].forEach(side => {
        addGoldBar(sidePanelW, mT, mT, side * (doorW / 2 + sidePanelW / 2), 0.06 * scale, frontZ);
      });

      // 중앙 은색 테두리 자동문 + 투명유리
      const doorZ = frontZ + 0.045 * scale;
      const sT = 0.075 * scale;
      const leafT = 0.055 * scale;

      const addSilverBar = (w, h, d, x, y, z) => {
        const bar = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), silverFrameMat);
        bar.position.set(x, y, z);
        group.add(bar);
      };

      addSilverBar(doorW + sT * 0.8, 0.14 * scale, 0.09 * scale, 0, doorH - 0.07 * scale, doorZ);
      addSilverBar(sT, doorH, 0.09 * scale, -doorW / 2 + sT / 2, doorH / 2, doorZ);
      addSilverBar(sT, doorH, 0.09 * scale, doorW / 2 - sT / 2, doorH / 2, doorZ);

      const sensor = new THREE.Mesh(new THREE.BoxGeometry(0.28 * scale, 0.055 * scale, 0.06 * scale), stoneDarkMat);
      sensor.position.set(0, doorH - 0.06 * scale, doorZ + 0.05 * scale);
      group.add(sensor);

      const innerW = doorW - sT * 2;
      const leafW = innerW / 2 - 0.015 * scale;
      const leafH = doorH - 0.14 * scale;

      [-1, 1].forEach(side => {
        const lx = side * (leafW / 2 + 0.008 * scale);

        const doorGlass = new THREE.Mesh(
          new THREE.BoxGeometry(leafW - leafT, leafH - leafT * 2, 0.02),
          clearDoorGlassMat
        );
        doorGlass.position.set(lx, leafH / 2, doorZ);
        group.add(doorGlass);

        addSilverBar(leafW, leafT, 0.05 * scale, lx, leafH - leafT / 2, doorZ);
        addSilverBar(leafW, leafT * 1.6, 0.05 * scale, lx, leafT * 0.8, doorZ);
        addSilverBar(leafT, leafH, 0.05 * scale, lx - leafW / 2 + leafT / 2, leafH / 2, doorZ);
        addSilverBar(leafT, leafH, 0.05 * scale, lx + leafW / 2 - leafT / 2, leafH / 2, doorZ);

    // 공통 재질
    const roofDeckMat = new THREE.MeshStandardMaterial({ color: COLORS.roofDeck, roughness: 0.88 });
    const whiteMat = new THREE.MeshStandardMaterial({ color: COLORS.whiteWall, roughness: 0.80 });
    const beigeMat = new THREE.MeshStandardMaterial({ color: COLORS.ivoryBeige, roughness: 0.80 });
    const orangeMat = new THREE.MeshStandardMaterial({ color: COLORS.terracotta, roughness: 0.78 });

    const lightGrayMat = new THREE.MeshStandardMaterial({ color: COLORS.lightGray, roughness: 0.82 });
    const darkStoneMat = new THREE.MeshStandardMaterial({ color: COLORS.darkStone, roughness: 0.75 });

    function addStoneBaseBox(parent, w, d, x, z, customMats = {}, baseH = BASE_H) {
      const defX = makeStoneBaseMat(d);
      const defZ = makeStoneBaseMat(w);
      const mats = [
        customMats.px || defX,
        customMats.nx || defX,
        darkStoneMat,
        darkStoneMat,
        customMats.pz || defZ,
        customMats.nz || defZ
      ];
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, baseH, d), mats);
      mesh.position.set(x, baseH / 2, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    // =========================================================
    // 5. 금호파크힐스 113동 전체 조립 (스카이뷰 실측 비율 엄수)
    // =========================================================
    function createKumho113Dong() {
      const dong113 = new THREE.Group();
      dong113.name = 'KumhoParkHills_113';

      const ANGLE_AB = 0.34;

      // ---------------------------------------------------------

      // 서서남(-X) 양측 돌출 흰색 2세대 입면

      addStoneBaseBox(wingA, wswBayD, wswUnitL, -4.9 - wswBayD / 2, wswUnit2Z, {

      const wswUnit1Mat = new THREE.MeshStandardMaterial({

      const wswUnit2Mat = new THREE.MeshStandardMaterial({

      // 중앙 코어 좌·우 회색 시멘트벽 (가로줄 적용)

      // ★ Wing A 옥상 구조물 + 서서남 ∏자형 주황 캐노피 구조물 & 단차 흰색 울타리 (첨부1 좌측 실사진 반영)

      dong113.add(wingA);

      // ---------------------------------------------------------

      // Wing C 옥상 구조물 (21층 창문 위로 주황 테두리 프레임 + 하얀 낮은 울타리 + 빈 공간)

      // ---------------------------------------------------------
      // [CENTRAL CORE & DIAGONAL WALL] 중앙 코어 + 주황 외벽(첨부2) + 21F 연결벽(첨부2)
      // ---------------------------------------------------------
      const coreShape = new THREE.Shape();
      coreShape.moveTo(-4.8, -5.2);
      coreShape.lineTo(3.8, -0.5);
      coreShape.lineTo(7.4, -4.4);   // P2 = (7.4, +4.4)

      const coreBaseGeo = new THREE.ExtrudeGeometry(coreShape, { depth: BASE_H, bevelEnabled: false });

      coreBaseMesh.castShadow = true;

      const coreUpperH = upperCH; // 21층 높이에 맞춤

      const coreStripedSideMat = new THREE.MeshStandardMaterial({

      const coreUpperMesh = new THREE.Mesh(coreUpperGeo, [roofDeckMat, coreStripedSideMat]);

      // ★ 첨부2 주황색 표시 영역: 15층(Wing B) 위쪽으로 드러나는 중앙 코어 외벽 (P2 -> P3) 테라코타 주황 도장
      const coreP2 = new THREE.Vector2(7.4, 4.4);

      const coreOrangeLen = coreP2.distanceTo(coreP3);
      const coreOrangeMidX = (coreP2.x + coreP3.x) / 2;

      const coreOrangeAngle = -Math.atan2(coreP3.y - coreP2.y, coreP3.x - coreP2.x);
      // 외향 법선 (+9.0, -1.8) 정규화하여 외벽면에 깔끔하게 밀착
      const outNX = (coreP3.y - coreP2.y) / coreOrangeLen;

      });
      const coreOrangeCladding = new THREE.Mesh(

      coreOrangeCladding.position.set(

      const diagStart = new THREE.Vector2(4.1, -0.4);

      const diagLen = diagStart.distanceTo(diagEnd);
      const diagMidX = (diagStart.x + diagEnd.x) / 2;

      const entrance345 = createEntrancePortal({ leftNum: '3', dongNum: '113', rightNum: '5', scale: 0.88 });

    const apt113 = createKumho113Dong();
    scene.add(apt113);

    // =========================================================
    // [추가] 지하 1~2층 순수 석재 벽체 연장 (총 7.95m = 지상 1~3층 높이, 층당 3.975m, 창문 없음)
    // =========================================================
    (() => {
      const BASEMENT_FLOORS = 2;
      const BASEMENT_H = BASE_H; // 7.95m (지상 1~3층 총 높이와 동일 -> 지하 층당 3.975m)
      const SUB_ROWS_PER_FLOOR = 7; // 지상(층당 5단, 약 0.53m)과 비슷한 석재 타일 크기(약 0.57m) 유지
      const EPS = 0.05;

      // 1~3층 석재 벽체와 동일한 팔레트·비율로 지하 2개 층(총 7.95m) 순수 벽체 텍스처 생성
      const plainWallMatCache = new Map();
      const getPlainBasementWallMat = (widthMeters) => {
        const key = Math.max(1, Math.round(widthMeters * 10));
        if (!plainWallMatCache.has(key)) {
          const pxPerMeter = 42;
          const cw = Math.max(160, Math.round(widthMeters * pxPerMeter));
          const ch = 384; // 지상 BASE_H(7.95m)와 동일한 세로 픽셀 밀도
          const canvas = document.createElement('canvas');
          canvas.width = cw;
          canvas.height = ch;
          const ctx = canvas.getContext('2d');

          ctx.fillStyle = '#2B2F35';
          ctx.fillRect(0, 0, cw, ch);

          const colW = 54;
          const floorPx = ch / BASEMENT_FLOORS;
          const subRowH = floorPx / SUB_ROWS_PER_FLOOR;

          // 석재 타일 미세 명암 패턴
          for (let f = 0; f < BASEMENT_FLOORS; f++) {
            const fy = f * floorPx;
            for (let r = 0; r < SUB_ROWS_PER_FLOOR; r++) {
              const ry = fy + r * subRowH;
              for (let x = 0; x < cw; x += colW) {
                const shade = ((f * 7 + r * 3 + Math.floor(x / colW) * 5) % 5) - 2;
                ctx.fillStyle = `rgb(${43 + shade * 2}, ${47 + shade * 2}, ${53 + shade * 2})`;
                ctx.fillRect(x + 1, ry + 1, colW - 2, subRowH - 2);
              }
            }
          }

          // 수직 줄눈
          ctx.fillStyle = 'rgba(120, 128, 138, 0.28)';
          for (let x = colW; x < cw; x += colW) {
            ctx.fillRect(x, 0, 1.5, ch);
          }

          // 층간 두꺼운 회색선(지하 1층·2층 경계) + 내부 얇은 줄눈
          for (let f = 0; f < BASEMENT_FLOORS; f++) {
            const fy = f * floorPx;
            ctx.fillStyle = '#9EA5AE';
            ctx.fillRect(0, fy, cw, 5);
            ctx.fillStyle = '#181B1F';
            ctx.fillRect(0, fy + 5, cw, 1.5);

            for (let r = 1; r < SUB_ROWS_PER_FLOOR; r++) {
              const ry = fy + r * subRowH;
              ctx.fillStyle = '#5D646E';
              ctx.fillRect(0, ry, cw, 1.5);
              ctx.fillStyle = '#1A1D21';
              ctx.fillRect(0, ry + 1.5, cw, 1);
            }
          }

          // 지하 2층 최하단 마감선
          ctx.fillStyle = '#1A1D21';
          ctx.fillRect(0, ch - 4, cw, 4);

          const bTex = new THREE.CanvasTexture(canvas);
          bTex.colorSpace = THREE.SRGBColorSpace;
          bTex.anisotropy = 8;

          plainWallMatCache.set(
            key,
            new THREE.MeshStandardMaterial({ map: bTex, roughness: 0.72 })
          );
        }
        return plainWallMatCache.get(key);
      };

      // 월드 좌표 기준 1~3층 기단 구조체(Y = 0 ~ BASE_H) 수집
      apt113.updateMatrixWorld(true);
      const baseMeshes = [];
      const worldBox = new THREE.Box3();

      apt113.traverse((obj) => {
        if (!obj.isMesh || !obj.geometry) return;
        worldBox.setFromObject(obj);
        if (Math.abs(worldBox.min.y) < EPS && Math.abs(worldBox.max.y - BASE_H) < EPS) {
          // 1~3층 창문 표현용 얇은 덧댐 패널(두께 0.2m 이하) 제외
          if (obj.geometry.type === 'BoxGeometry' && obj.geometry.parameters) {
            const { width, depth } = obj.geometry.parameters;
            if (width <= 0.2 || depth <= 0.2) return;
          }
          baseMeshes.push(obj);
        }
      });

      // 수집된 1~3층 외벽 구조체를 Y = 0 ~ -7.95m로 수직 연장
      baseMeshes.forEach((mesh, idx) => {
        const parent = mesh.parent;
        if (!parent) return;

        let bGeo;
        let bMats;
        let bPosY;

        if (mesh.geometry.type === 'BoxGeometry' && mesh.geometry.parameters) {
          const { width, depth } = mesh.geometry.parameters;
          bGeo = new THREE.BoxGeometry(width, BASEMENT_H, depth);
          const matX = getPlainBasementWallMat(depth);
          const matZ = getPlainBasementWallMat(width);
          bMats = [matX, matX, darkStoneMat, darkStoneMat, matZ, matZ];
          bPosY = -BASEMENT_H / 2;
        } else {
          bGeo = mesh.geometry.clone();
          bGeo.scale(1, BASEMENT_H / BASE_H, 1);
          bGeo.translate(0, -BASEMENT_H, 0);
          bMats = [darkStoneMat, darkStoneMat];
          bPosY = mesh.position.y;
        }

        const bMesh = new THREE.Mesh(bGeo, bMats);
        bMesh.name = `Basement_B1B2_${idx}`;
        bMesh.position.set(mesh.position.x, bPosY, mesh.position.z);
        bMesh.rotation.copy(mesh.rotation);
        bMesh.scale.copy(mesh.scale);
        bMesh.castShadow = mesh.castShadow;
        bMesh.receiveShadow = mesh.receiveShadow;
        parent.add(bMesh);
      });

      // 1층 출입구 하단 기준 노드(Anchor_1F) 명시 — Y = 0
      const anchor1F = new THREE.Object3D();
      anchor1F.name = 'Anchor_1F';
      anchor1F.position.set(5.68, 0, -7.47);
      anchor1F.userData = {
        floor: '1F',
        groundY: 0,
        basementFloors: BASEMENT_FLOORS,
        basementFloorHeight: BASEMENT_H / BASEMENT_FLOORS,
        basementMinY: -BASEMENT_H
      };
      apt113.add(anchor1F);
    })();

        // =========================================================
    // [추가] 113동 1층 출입구 전면 보도 (Y = 0 기준, 스카이뷰 노란색 경계 구간)
    // =========================================================
    (() => {
      const wingA = apt113.getObjectByName('WingA_NW_21F');
      if (!wingA) return;

      // Wing A 로컬 좌표 기준 보도 외곽 경계 (필요 시 수치만 미세 조정)
      const NW_WEST_X = -6.2;      // Wing A 서측 끝단 (서남면으로 돌출되지 않도록 정렬)
      const NW_INNER_Z = -14.0;    // Wing A 북서 벽면(-14.5) 안쪽 0.5m 밀착
      const NW_OUTER_Z = -19.0;    // 북서 벽면 앞 보도 폭 (약 4.5m)
      const NE_OUTER_X = 16.2;     // 1-2호·3-5호 출입구 앞 보도 외곽선 (출입구 전면 약 4.5~4.7m 확보)
      const WINGB_INNER_Z = 17.8;  // Wing B 북서 벽면(+17.23) 안쪽 밀착

      const WALKWAY_SLAB_H = 0.22; // 보도 상판 두께
      const TOP_OFFSET_Y = 0.005;  // Y = 0 기준 (그리드/로비 바닥 Z-fighting 방지용 5mm 오프셋)
      const RETAINING_H = BASE_H - WALKWAY_SLAB_H; // 경사지 부유 방지용 하부 석재 기단 (얇은 슬래브만 원하면 0)

      // (1) 로드뷰 기준 회색 + 차콜 포인트 보도블록 텍스처 (4m × 4m 반복)
      const createWalkwayPaverTexture = () => {
        const size = 512;
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = '#B8BAB8';
        ctx.fillRect(0, 0, size, size);

        const cols = 16;
        const rows = 32;
        const bw = size / cols;
        const bh = size / rows;

        for (let r = 0; r < rows; r++) {
          const offset = (r % 2) * (bw * 0.5);
          for (let c = -1; c <= cols; c++) {
            const x = c * bw + offset;
            const y = r * bh;
            const hash = Math.abs(Math.sin(r * 12.9898 + c * 78.233) * 43758.5453) % 1;

            // 로드뷰의 가로 방향 어두운 차콜 포인트 블록 띠 패턴
            const inAccentBand = (r >= 6 && r <= 10) || (r >= 22 && r <= 25);
            const isDarkBlock = inAccentBand
              ? ((r + c) % 3 === 0 || hash > 0.62)
              : (hash > 0.94);

            if (isDarkBlock) {
              const v = 64 + Math.floor(hash * 18);
              ctx.fillStyle = `rgb(${v}, ${v + 3}, ${v + 7})`;
            } else {
              const v = 194 + Math.floor(hash * 18);
              ctx.fillStyle = `rgb(${v}, ${v + 1}, ${v - 2})`;
            }
            ctx.fillRect(x + 1, y + 1, bw - 2, bh - 2);
          }
        }

        // 미세 줄눈
        ctx.strokeStyle = 'rgba(48, 52, 58, 0.30)';
        ctx.lineWidth = 1;
        for (let r = 0; r <= rows; r++) {
          ctx.beginPath();
          ctx.moveTo(0, r * bh);
          ctx.lineTo(size, r * bh);
          ctx.stroke();
        }

        const tex = new THREE.CanvasTexture(canvas);
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(1 / 4.0, 1 / 4.0); // 4m당 1회 반복 (실측 보도블록 비율)
        tex.anisotropy = 8;
        return tex;
      };

      // (2) 보도 하부 석재 기단 벽면 텍스처 (지하 1~2층 석재 벽체와 동일 톤)
      const createRetainingStoneTexture = () => {
        const cw = 256;
        const ch = 384;
        const canvas = document.createElement('canvas');
        canvas.width = cw;
        canvas.height = ch;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = '#2B2F35';
        ctx.fillRect(0, 0, cw, ch);

        const floors = 2;
        const subRows = 7;
        const floorPx = ch / floors;
        const subRowH = floorPx / subRows;
        const colW = 64;

        for (let f = 0; f < floors; f++) {
          const fy = f * floorPx;
          for (let r = 0; r < subRows; r++) {
            const ry = fy + r * subRowH;
            for (let x = 0; x < cw; x += colW) {
              const shade = ((f * 7 + r * 3 + Math.floor(x / colW) * 5) % 5) - 2;
              ctx.fillStyle = `rgb(${43 + shade * 2}, ${47 + shade * 2}, ${53 + shade * 2})`;
              ctx.fillRect(x + 1, ry + 1, colW - 2, subRowH - 2);
            }
          }
          ctx.fillStyle = '#9EA5AE';
          ctx.fillRect(0, fy, cw, 4);
          for (let r = 1; r < subRows; r++) {
            const ry = fy + r * subRowH;
            ctx.fillStyle = '#5D646E';
            ctx.fillRect(0, ry, cw, 1.5);
          }
        }

        const tex = new THREE.CanvasTexture(canvas);
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(1 / 4.0, 1 / Math.max(1, RETAINING_H));
        tex.anisotropy = 8;
        return tex;
      };

      const buildWalkwayShape = (inset = 0) => {
        const s = new THREE.Shape();
        // ExtrudeGeometry + rotateX(-PI/2) 기준: shape (x, y) -> 3D (x, 0, -y)
        s.moveTo(NW_WEST_X + inset, -NW_INNER_Z);
        s.lineTo(NW_WEST_X + inset, -(NW_OUTER_Z + inset));
        s.lineTo(NE_OUTER_X - inset, -(NW_OUTER_Z + inset));
        s.lineTo(NE_OUTER_X - inset, -WINGB_INNER_Z);
        s.lineTo(5.0, -WINGB_INNER_Z);
        s.lineTo(3.0, -12.0);
        s.lineTo(3.0, -NW_INNER_Z);
        s.closePath();
        return s;
      };

      const walkwayGroup = new THREE.Group();
      walkwayGroup.name = 'Walkway_1F_Front';

      const paverMat = new THREE.MeshStandardMaterial({
        map: createWalkwayPaverTexture(),
        roughness: 0.86
      });
      const curbMat = new THREE.MeshStandardMaterial({
        color: '#B5B9BF',
        roughness: 0.78
      });

      // 보도 상판 (상면 Y = 0.005m, 1층 출입구 바닥과 수평 일치)
      const slabGeo = new THREE.ExtrudeGeometry(buildWalkwayShape(0), {
        depth: WALKWAY_SLAB_H,
        bevelEnabled: false
      });
      slabGeo.rotateX(-Math.PI / 2);
      slabGeo.translate(0, -WALKWAY_SLAB_H + TOP_OFFSET_Y, 0);

      const slabMesh = new THREE.Mesh(slabGeo, [paverMat, curbMat]);
      slabMesh.name = 'Walkway_1F_Deck';
      slabMesh.receiveShadow = true;
      slabMesh.castShadow = true;
      walkwayGroup.add(slabMesh);

      // 노란색 외곽선 화강석 경계석 (3개 외곽 변)
      const curbW = 0.24;
      const curbH = WALKWAY_SLAB_H + 0.015;
      const curbCenterY = -WALKWAY_SLAB_H + curbH / 2;

      const curbDefs = [
        // 북서 보도 서측 끝단
        {
          size: [curbW, curbH, Math.abs(NW_INNER_Z - NW_OUTER_Z)],
          pos: [NW_WEST_X + curbW / 2, curbCenterY, (NW_INNER_Z + NW_OUTER_Z) / 2]
        },
        // 북서측 외곽선
        {
          size: [NE_OUTER_X - NW_WEST_X, curbH, curbW],
          pos: [(NW_WEST_X + NE_OUTER_X) / 2, curbCenterY, NW_OUTER_Z + curbW / 2]
        },
        // 북동측(놀이터 앞) 외곽선
        {
          size: [curbW, curbH, WINGB_INNER_Z - NW_OUTER_Z],
          pos: [NE_OUTER_X - curbW / 2, curbCenterY, (NW_OUTER_Z + WINGB_INNER_Z) / 2]
        }
      ];

      curbDefs.forEach((c, i) => {
        const curb = new THREE.Mesh(new THREE.BoxGeometry(...c.size), curbMat);
        curb.name = `Walkway_1F_Curb_${i}`;
        curb.position.set(...c.pos);
        curb.receiveShadow = true;
        curb.castShadow = true;
        walkwayGroup.add(curb);
      });

      // 보도 하부 석재 기단 (실제 지형이 Y < 0으로 꺼질 때 보도·출입구가 뜨지 않도록 마감)
      if (RETAINING_H > 0) {
        const retainingGeo = new THREE.ExtrudeGeometry(buildWalkwayShape(0.08), {
          depth: RETAINING_H,
          bevelEnabled: false
        });
        retainingGeo.rotateX(-Math.PI / 2);
        retainingGeo.translate(0, -BASE_H, 0);

        const retainingWallMat = new THREE.MeshStandardMaterial({
          map: createRetainingStoneTexture(),
          roughness: 0.74
        });
        const retainingMesh = new THREE.Mesh(retainingGeo, [darkStoneMat, retainingWallMat]);
        retainingMesh.name = 'Walkway_1F_RetainingBase';
        retainingMesh.receiveShadow = true;
        retainingMesh.castShadow = true;
        walkwayGroup.add(retainingMesh);
      }

      wingA.add(walkwayGroup);
    })();

    // =========================================================
    // 6. 3D 모델링 파일 (.glb) 추출
    // =========================================================
    window.exportGLB = () => {
      const exporter = new GLTFExporter();
      exporter.parse(
        apt113,
        (result) => {
          const blob = new Blob([result], { type: 'model/gltf-binary' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = 'kumho_113dong_v4.glb';
          link.click();
          URL.revokeObjectURL(url);
        },
        (err) => console.error('GLB 추출 오류:', err),
        { binary: true }
      );
    };

    // =========================================================
    // 7. 렌더 루프 & 리사이즈
    // =========================================================
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
