<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>금호파크힐스 112동 3D 모델링 (실제 사진 기반 문주 주출입구 반영)</title>
  <style>
    body { margin: 0; overflow: hidden; background: #2c2f33; }
    #info {
      position: absolute; top: 14px; left: 16px; color: #fff;
      font-family: 'Malgun Gothic', sans-serif; font-size: 13px;
      background: rgba(20, 22, 25, 0.85); padding: 10px 14px;
      border-radius: 8px; border: 1px solid rgba(255,255,255,0.18);
      pointer-events: none; line-height: 1.55;
    }
    #controls-ui {
      position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
      display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
      background: rgba(20, 22, 25, 0.88); padding: 10px 14px;
      border-radius: 10px; border: 1px solid rgba(255,255,255,0.18);
      max-width: 94vw;
    }
    button {
      background: #3b4048; color: #fff; border: 1px solid #555b65;
      padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px;
      font-family: 'Malgun Gothic', sans-serif; transition: 0.15s;
    }
    button:hover { background: #64748B; color: #fff; border-color: #94A3B8; }
    button.highlight-btn {
      background: #1d4ed8; border-color: #60a5fa; font-weight: bold;
    }
    button.export-btn {
      background: #2b6cb0; border-color: #4299e1; font-weight: bold;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="info">
    <strong>금호파크힐스 112동 (실제 사진 기반 ㄷ자형 석재 문주 · 수직 루버 · 유리 로비 · 자전거 거치대 반영)</strong><br/>
    마우스 좌클릭 드래그: 회전 | 우클릭 드래그: 이동 | 휠: 확대·축소
  </div>

  <div id="controls-ui">
    <button class="highlight-btn" onclick="setView('entrance_close')">주출입구 근접 (사진 각도)</button>
    <button onclick="setView('top')">상면 (Top · 위성평면)</button>
    <button onclick="setView('e')">동측 (East · 112측벽)</button>
    <button onclick="setView('w')">서측 (West · 창호열)</button>
    <button onclick="setView('s')">남측 (South)</button>
    <button onclick="setView('n')">북측 (North)</button>
    <button class="export-btn" onclick="exportGLB()">3D 파일 추출 (.glb)</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

    // 1. 기본 씬, 카메라, 렌더러 설정
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#34383D');

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.2, 1000);
    // 초기 시점: 첨부한 현장 사진(image_77c60a.jpg / image_77c343.png)과 동일한 구도로 출입구를 비춤
    camera.position.set(18, 9, -29);

    const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(-1.5, 4.2, -11.5);
    controls.enableDamping = true;
    controls.update();

    // 좌표계 기준: -Z = 북(N), +Z = 남(S), +X = 동(E), -X = 서(W)
    window.setView = (dir) => {
      if (dir === 'entrance_close') {
        controls.target.set(-1.5, 4.2, -11.5);
        camera.position.set(18, 9, -29);
      } else if (dir === 'top') {
        controls.target.set(0, 20, 0);
        camera.position.set(0, 105, 0.01);
      } else {
        controls.target.set(0, 22, 0);
        if (dir === 'e') camera.position.set(68, 22, 24);
        if (dir === 'w') camera.position.set(-68, 24, -18);
        if (dir === 's') camera.position.set(12, 22, 72);
        if (dir === 'n') camera.position.set(-12, 24, -72);
      }
      controls.update();
    };

    // 2. 조명 및 뷰포트 그리드
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.92);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.08);
    dirLight.position.set(45, 110, -45);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(2048, 2048);
    scene.add(dirLight);

    const fillLight = new THREE.DirectionalLight(0xdce6f2, 0.48);
    fillLight.position.set(-50, 45, 45);
    scene.add(fillLight);

    const gridHelper = new THREE.GridHelper(160, 40, 0x555555, 0x42464C);
    scene.add(gridHelper);

    // =========================================================
    // 텍스처 생성 유틸리티
    // =========================================================

    // A. 쿨 그레이(#8B8E93) 수평 패널 측벽 & 화이트 '112' 번호
    function createCoolGraySideTexture({
      showBottomNumber = false,
      showTopNumber = false,
      hasSlitWindows = false
    }) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#8B8E93';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = 'rgba(20, 22, 26, 0.24)';
      for (let y = 0; y < canvas.height; y += 16) {
        ctx.fillRect(0, y, canvas.width, 2);
      }

      ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
      ctx.fillRect(canvas.width * 0.33, 0, 2, canvas.height);
      ctx.fillRect(canvas.width * 0.66, 0, 2, canvas.height);

      if (hasSlitWindows) {
        for (let y = 80; y < canvas.height - 60; y += 54) {
          ctx.fillStyle = '#252A30';
          ctx.fillRect(190, y, 52, 22);
          ctx.strokeStyle = '#D6D8DC';
          ctx.lineWidth = 2.5;
          ctx.strokeRect(190, y, 52, 22);
        }
      }

      const cx = canvas.width / 2;

      if (showBottomNumber) {
        const numY = canvas.height - 42;
        ctx.fillStyle = '#1E2024';
        ctx.font = 'bold 64px "Malgun Gothic", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('112', cx + 3, numY + 3);
        ctx.fillStyle = '#F8FAFC';
        ctx.fillText('112', cx, numY);
      }

      if (showTopNumber) {
        const numY = 125;
        ctx.fillStyle = '#1E2024';
        ctx.font = 'bold 56px "Malgun Gothic", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('112', cx + 3, numY + 3);
        ctx.fillStyle = '#F8FAFC';
        ctx.fillText('112', cx, numY);
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // B. 아이보리(#EFECE6) + 다크 그레이(#73777D) 수직 교차 창호 입면
    function createModernWindowWallTexture(floors, cols = 3, alternateGrayCol = true) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');

      const fh = canvas.height / floors;
      const cw = canvas.width / cols;

      for (let c = 0; c < cols; c++) {
        const isGrayColumn = alternateGrayCol && (c % 2 === 1);
        ctx.fillStyle = isGrayColumn ? '#73777D' : '#EFECE6';
        ctx.fillRect(c * cw, 0, cw, canvas.height);
      }

      for (let f = 0; f < floors; f++) {
        const y = f * fh;
        ctx.fillStyle = 'rgba(30, 32, 36, 0.25)';
        ctx.fillRect(0, y, canvas.width, 2.5);

        for (let c = 0; c < cols; c++) {
          const x = c * cw;
          const winX = x + cw * 0.14;
          const winY = y + fh * 0.18;
          const winW = cw * 0.72;
          const winH = fh * 0.66;

          ctx.fillStyle = '#26313B';
          ctx.fillRect(winX, winY, winW, winH);

          ctx.strokeStyle = '#DCDAD4';
          ctx.lineWidth = 2.5;
          ctx.strokeRect(winX, winY, winW, winH);

          ctx.beginPath();
          ctx.moveTo(winX + winW / 2, winY);
          ctx.lineTo(winX + winW / 2, winY + winH);
          ctx.stroke();

          ctx.fillStyle = '#181B1F';
          ctx.fillRect(winX - 1, winY + winH * 0.56, winW + 2, 2.5);
          for (let rx = winX; rx <= winX + winW; rx += 9) {
            ctx.fillRect(rx, winY + winH * 0.56, 1.8, winH * 0.44);
          }
        }
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // C. 저층부 다크 차콜 석재 기단부 + 밝은 수평 줄눈 띠
    function createDarkBaseWithBandsTexture(hasWindows = false) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#2B2E33';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#191B1F';
      ctx.lineWidth = 2;
      for (let y = 0; y < canvas.height; y += 32) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }
      for (let x = 0; x < canvas.width; x += 64) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }

      ctx.fillStyle = '#A8ACB2';
      ctx.fillRect(0, 62, canvas.width, 6);
      ctx.fillRect(0, 146, canvas.width, 6);
      ctx.fillRect(0, 224, canvas.width, 6);

      if (hasWindows) {
        for (let x = 42; x < canvas.width - 30; x += 120) {
          ctx.fillStyle = '#1C2228';
          ctx.fillRect(x, 18, 68, 36);
          ctx.strokeStyle = '#8C9096';
          ctx.lineWidth = 2;
          ctx.strokeRect(x, 18, 68, 36);
        }
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // D. 위성 평면도 기준 옥상 텍스처
    function createSatelliteRoofTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#B8BCC2';
      ctx.fillRect(0, 0, 512, 512);

      ctx.fillStyle = '#CDC5B4';
      ctx.fillRect(42, 42, 428, 428);

      ctx.strokeStyle = '#73777D';
      ctx.lineWidth = 6;
      ctx.strokeRect(42, 42, 428, 428);

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // E. 문주 상단 정면 인방 텍스처 (음각 프레임 + 실버 '112' 표기 - image_77c343.png 반영)
    function createPortalHeaderTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#2B2E33';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 석재 패널 분할선
      ctx.strokeStyle = '#1A1C1F';
      ctx.lineWidth = 2;
      ctx.strokeRect(2, 2, canvas.width - 4, canvas.height - 4);

      // 중앙 음각 사각 테두리
      ctx.strokeStyle = '#4B5058';
      ctx.lineWidth = 3;
      ctx.strokeRect(92, 22, canvas.width - 184, canvas.height - 44);

      // 중앙 메탈릭 실버 '112' 번호 및 좌우 장식 바
      const cx = canvas.width / 2;
      ctx.fillStyle = '#CBD5E1';
      ctx.fillRect(cx - 64, 60, 14, 16);
      ctx.fillRect(cx + 50, 60, 14, 16);

      ctx.fillStyle = '#111315';
      ctx.font = 'bold 46px "Malgun Gothic", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('112', cx + 2, 82);

      ctx.fillStyle = '#F1F5F9';
      ctx.fillText('112', cx, 80);

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // F. 문주 측면 상부 수직 루버(Vertical Louver) 텍스처 (image_77c343.png 우측 상부 디테일)
    function createPortalVerticalLouverTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#2B2E33';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 상부 루버 박스 프레임
      ctx.fillStyle = '#1C1E22';
      ctx.fillRect(16, 12, canvas.width - 32, canvas.height - 24);

      // 촘촘한 세로 루버 슬랫
      for (let x = 22; x < canvas.width - 22; x += 8) {
        ctx.fillStyle = '#484D54';
        ctx.fillRect(x, 14, 4, canvas.height - 28);
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // G. 내부 브론즈 멀리언 통유리 로비 텍스처 (image_77c343.png 내부 유리창 디테일)
    function createLobbyCurtainWallTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      // 어두운 내부 로비 배경
      ctx.fillStyle = '#181B1E';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 반투명 유리 반사광 그라데이션
      const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      grad.addColorStop(0, 'rgba(65, 75, 65, 0.35)');
      grad.addColorStop(0.5, 'rgba(35, 42, 38, 0.2)');
      grad.addColorStop(1, 'rgba(85, 90, 75, 0.35)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 브론즈/골드 톤 수직 멀리언 프레임 (image_77c343.png의 세로 창살)
      ctx.fillStyle = '#6E6349';
      for (let x = 0; x <= canvas.width; x += 64) {
        ctx.fillRect(x, 0, 6, canvas.height);
      }
      // 가로 트랜섬 프레임
      ctx.fillRect(0, 140, canvas.width, 6);
      ctx.fillRect(0, 320, canvas.width, 6);

      // 중앙 자동문 프레임
      ctx.strokeStyle = '#8C7E5E';
      ctx.lineWidth = 6;
      ctx.strokeRect(192, 320, 128, 192);
      ctx.beginPath();
      ctx.moveTo(256, 320);
      ctx.lineTo(256, 512);
      ctx.stroke();

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function addOutlines(mesh) {
      const edges = new THREE.EdgesGeometry(mesh.geometry, 25);
      const line = new THREE.LineSegments(
        edges,
        new THREE.LineBasicMaterial({ color: 0x161616 })
      );
      mesh.add(line);
    }

    function createRoofPenthouseRing(w, d, h = 2.4) {
      const ringGroup = new THREE.Group();
      const wallMat = new THREE.MeshStandardMaterial({ color: '#D1D5DB', roughness: 0.75 });
      const topMat = new THREE.MeshStandardMaterial({ color: '#C5C9CF', roughness: 0.8 });
      const t = 2.1;

      const segments = [
        { size: [w, h, t], pos: [0, h / 2, d / 2 - t / 2] },
        { size: [w, h, t], pos: [0, h / 2, -d / 2 + t / 2] },
        { size: [t, h, d - t * 2], pos: [w / 2 - t / 2, h / 2, 0] },
        { size: [t, h, d - t * 2], pos: [-w / 2 + t / 2, h / 2, 0] }
      ];

      segments.forEach(s => {
        const m = new THREE.Mesh(
          new THREE.BoxGeometry(...s.size),
          [wallMat, wallMat, topMat, wallMat, wallMat, wallMat]
        );
        m.position.set(...s.pos);
        m.castShadow = true;
        m.receiveShadow = true;
        addOutlines(m);
        ringGroup.add(m);
      });

      return ringGroup;
    }

    // =========================================================
    // 현장 사진(image_77c60a.jpg / image_77c343.png)과 동일한 주출입구 생성 함수
    // 구성: ㄷ자형 개방형 다크 차콜 석재 문주 + 측면 수직 루버 + 내부 브론즈 유리 로비 + 우측 자전거 거치대
    // =========================================================
    function createDong112PhotoEntrance(baseH) {
      const entranceGroup = new THREE.Group();
      entranceGroup.name = 'Dong112_PhotoMatched_Entrance';

      const stoneMat = new THREE.MeshStandardMaterial({ color: '#2B2E33', roughness: 0.72 });
      const stoneDarkMat = new THREE.MeshStandardMaterial({ color: '#22252A', roughness: 0.78 });
      const headerFrontMat = new THREE.MeshStandardMaterial({ map: createPortalHeaderTexture(), roughness: 0.7 });
      const louverSideMat = new THREE.MeshStandardMaterial({ map: createPortalVerticalLouverTexture(), roughness: 0.72 });
      const glassLobbyMat = new THREE.MeshStandardMaterial({ map: createLobbyCurtainWallTexture(), roughness: 0.35, metalness: 0.25 });

      const portalW = 6.4;           // 문주 정면 폭
      const portalD = 4.6;           // 건물 외벽에서 앞으로 돌출된 깊이
      const portalH = baseH * 0.74;  // 문주 총 높이 (기단부의 약 3/4 높이)
      const pillarW = 1.05;          // 기둥 폭
      const pillarD = 1.15;          // 기둥 깊이
      const headerH = 1.65;          // 상단 인방(헤더) 높이

      // 1) 전면 좌측 석재 기둥
      const leftPillar = new THREE.Mesh(
        new THREE.BoxGeometry(pillarW, portalH - headerH, pillarD),
        stoneMat
      );
      leftPillar.position.set(-(portalW / 2 - pillarW / 2), (portalH - headerH) / 2, portalD - pillarD / 2);
      leftPillar.castShadow = true;
      leftPillar.receiveShadow = true;
      addOutlines(leftPillar);
      entranceGroup.add(leftPillar);

      // 2) 전면 우측 석재 기둥
      const rightPillar = new THREE.Mesh(
        new THREE.BoxGeometry(pillarW, portalH - headerH, pillarD),
        stoneMat
      );
      rightPillar.position.set(portalW / 2 - pillarW / 2, (portalH - headerH) / 2, portalD - pillarD / 2);
      rightPillar.castShadow = true;
      rightPillar.receiveShadow = true;
      addOutlines(rightPillar);
      entranceGroup.add(rightPillar);

      // 3) 문주 상단 캐노피 헤더 (정면 '112' 음각 인방 + 좌·우측 수직 루버 프리즈)
      const portalHeader = new THREE.Mesh(
        new THREE.BoxGeometry(portalW, headerH, portalD),
        [
          louverSideMat,  // +X (우측면 수직 루버)
          louverSideMat,  // -X (좌측면 수직 루버)
          stoneDarkMat,   // +Y (상면)
          stoneDarkMat,   // -Y (천장면)
          headerFrontMat, // +Z (정면 '112' 인방)
          stoneMat        // -Z (건물 밀착면)
        ]
      );
      portalHeader.position.set(0, portalH - headerH / 2, portalD / 2);
      portalHeader.castShadow = true;
      portalHeader.receiveShadow = true;
      addOutlines(portalHeader);
      entranceGroup.add(portalHeader);

      // 4) 안쪽 브론즈 멀리언 통유리 로비 & 출입문 매스
      const lobbyDepth = 1.3;
      const lobbyGlassBox = new THREE.Mesh(
        new THREE.BoxGeometry(portalW - 0.3, portalH - headerH, lobbyDepth),
        [
          glassLobbyMat,
          glassLobbyMat,
          stoneDarkMat,
          stoneDarkMat,
          glassLobbyMat,
          stoneDarkMat
        ]
      );
      lobbyGlassBox.position.set(0, (portalH - headerH) / 2, lobbyDepth / 2);
      lobbyGlassBox.castShadow = true;
      lobbyGlassBox.receiveShadow = true;
      addOutlines(lobbyGlassBox);
      entranceGroup.add(lobbyGlassBox);

      // 5) 포치 우측(-X 로컬 방향: 동북향 회전 후 화면 우측에 위치) 자전거 거치대 캐노피
      const bikeShelterGroup = new THREE.Group();
      const shelterW = 2.6;
      const shelterH = 2.35;
      const shelterD = 2.4;

      const shelterRoof = new THREE.Mesh(
        new THREE.BoxGeometry(shelterW, 0.16, shelterD),
        new THREE.MeshStandardMaterial({ color: '#272A2E', roughness: 0.6 })
      );
      shelterRoof.position.set(0, shelterH, 0);
      addOutlines(shelterRoof);
      bikeShelterGroup.add(shelterRoof);

      const shelterSideWall = new THREE.Mesh(
        new THREE.BoxGeometry(0.14, shelterH, shelterD - 0.1),
        new THREE.MeshStandardMaterial({ color: '#5A3224', roughness: 0.75 })
      );
      shelterSideWall.position.set(-(shelterW / 2 - 0.1), shelterH / 2, 0);
      addOutlines(shelterSideWall);
      bikeShelterGroup.add(shelterSideWall);

      const shelterBackWall = new THREE.Mesh(
        new THREE.BoxGeometry(shelterW - 0.1, shelterH, 0.14),
        new THREE.MeshStandardMaterial({ color: '#4A1D1D', roughness: 0.75 })
      );
      shelterBackWall.position.set(0, shelterH / 2, -(shelterD / 2 - 0.1));
      addOutlines(shelterBackWall);
      bikeShelterGroup.add(shelterBackWall);

      // 자전거 거치대 위치: 문주 우측 기둥 바로 옆
      bikeShelterGroup.position.set(-(portalW / 2 + shelterW / 2 - 0.1), 0, portalD * 0.52);
      entranceGroup.add(bikeShelterGroup);

      return entranceGroup;
    }

    // =========================================================
    // 금호파크힐스 112동 전체 조립
    // =========================================================
    export function createKumho112Dong() {
      const dong112 = new THREE.Group();
      dong112.name = 'KumhoParkHills_112';

      const floorH = 2.55;
      const baseSolidMat = new THREE.MeshStandardMaterial({
        map: createDarkBaseWithBandsTexture(false),
        roughness: 0.8
      });
      const baseWinMat = new THREE.MeshStandardMaterial({
        map: createDarkBaseWithBandsTexture(true),
        roughness: 0.8
      });
      const roofMat = new THREE.MeshStandardMaterial({
        map: createSatelliteRoofTexture(),
        roughness: 0.88
      });

      // 1. 서북쪽 길쭉한 메인 날개 (22층) + 동북쪽 돌출부 주출입구
      const nwFloors = 22, nwBaseH = floorH * 4, nwUpperH = floorH * (nwFloors - 4);
      const nwW = 24.5;
      const nwD = 12.2;
      const nwWing = new THREE.Group();

      const nwBase = new THREE.Mesh(
        new THREE.BoxGeometry(nwW + 0.3, nwBaseH, nwD + 0.3),
        [baseSolidMat, baseSolidMat, baseSolidMat, baseSolidMat, baseWinMat, baseWinMat]
      );
      nwBase.position.y = nwBaseH / 2;
      addOutlines(nwBase);
      nwWing.add(nwBase);

      const nwUpper = new THREE.Mesh(
        new THREE.BoxGeometry(nwW, nwUpperH, nwD),
        [
          new THREE.MeshStandardMaterial({ map: createCoolGraySideTexture({ showBottomNumber: true }) }),
          new THREE.MeshStandardMaterial({ map: createCoolGraySideTexture({ showTopNumber: true, hasSlitWindows: true }) }),
          roofMat,
          baseSolidMat,
          new THREE.MeshStandardMaterial({ map: createModernWindowWallTexture(nwFloors - 4, 4, true) }),
          new THREE.MeshStandardMaterial({ map: createModernWindowWallTexture(nwFloors - 4, 4, true) })
        ]
      );
      nwUpper.position.y = nwBaseH + nwUpperH / 2;
      nwUpper.castShadow = true;
      nwUpper.receiveShadow = true;
      addOutlines(nwUpper);
      nwWing.add(nwUpper);

      const nwPenthouseRing = createRoofPenthouseRing(14.5, 7.6, 2.6);
      nwPenthouseRing.position.set(-1.5, nwBaseH + nwUpperH, 0);
      nwWing.add(nwPenthouseRing);

      // 서북쪽 동의 동북쪽(-Z 로컬 방향) 돌출부 매스
      const neProtrusionX = 1.8;
      const neProtrusionDepth = 1.6;
      const neProtrusion = new THREE.Mesh(
        new THREE.BoxGeometry(9.6, nwBaseH + nwUpperH, neProtrusionDepth),
        [
          new THREE.MeshStandardMaterial({ color: '#787C82', roughness: 0.82 }),
          new THREE.MeshStandardMaterial({ color: '#787C82', roughness: 0.82 }),
          roofMat,
          baseSolidMat,
          new THREE.MeshStandardMaterial({ color: '#787C82', roughness: 0.82 }),
          new THREE.MeshStandardMaterial({ map: createModernWindowWallTexture(nwFloors, 2, false) })
        ]
      );
      neProtrusion.position.set(neProtrusionX, (nwBaseH + nwUpperH) / 2, -(nwD / 2 + neProtrusionDepth / 2));
      neProtrusion.castShadow = true;
      neProtrusion.receiveShadow = true;
      addOutlines(neProtrusion);
      nwWing.add(neProtrusion);

      // ★ 현장 사진(image_77c60a.jpg, image_77c343.png)과 동일한 주출입구 배치
      const photoMatchedEntrance = createDong112PhotoEntrance(nwBaseH);
      photoMatchedEntrance.rotation.y = Math.PI; // -Z(동북쪽) 바깥 방향을 정면으로 향함
      photoMatchedEntrance.position.set(neProtrusionX, 0, -(nwD / 2 + neProtrusionDepth));
      nwWing.add(photoMatchedEntrance);

      nwWing.position.set(-6.5, 0, -5.2);
      nwWing.rotation.y = -Math.PI * 0.24;
      dong112.add(nwWing);

      // 2. 남측 하단 가로 날개 (20층)
      const sFloors = 20, sBaseH = floorH * 4, sUpperH = floorH * (sFloors - 4);
      const sW = 20.5;
      const sD = 11.8;
      const southWing = new THREE.Group();

      const sBase = new THREE.Mesh(
        new THREE.BoxGeometry(sW + 0.3, sBaseH, sD + 0.3),
        [baseSolidMat, baseSolidMat, baseSolidMat, baseSolidMat, baseWinMat, baseWinMat]
      );
      sBase.position.y = sBaseH / 2;
      addOutlines(sBase);
      southWing.add(sBase);

      const sUpper = new THREE.Mesh(
        new THREE.BoxGeometry(sW, sUpperH, sD),
        [
          new THREE.MeshStandardMaterial({ map: createCoolGraySideTexture({ showBottomNumber: true }) }),
          new THREE.MeshStandardMaterial({ map: createCoolGraySideTexture({ hasSlitWindows: true }) }),
          roofMat,
          baseSolidMat,
          new THREE.MeshStandardMaterial({ map: createModernWindowWallTexture(sFloors - 4, 4, true) }),
          new THREE.MeshStandardMaterial({ map: createModernWindowWallTexture(sFloors - 4, 4, true) })
        ]
      );
      sUpper.position.y = sBaseH + sUpperH / 2;
      sUpper.castShadow = true;
      sUpper.receiveShadow = true;
      addOutlines(sUpper);
      southWing.add(sUpper);

      const sPenthouseRing = createRoofPenthouseRing(14.5, 7.6, 2.4);
      sPenthouseRing.position.set(0.5, sBaseH + sUpperH, 0.5);
      southWing.add(sPenthouseRing);

      southWing.position.set(1.8, 0, 12.2);
      southWing.rotation.y = 0.02;
      dong112.add(southWing);

      // 3. 북동측 돌출 날개 (15층)
      const neFloors = 15, neBaseH = floorH * 4, neUpperH = floorH * (neFloors - 4);
      const neW = 13.0;
      const neD = 12.6;
      const neWing = new THREE.Group();

      const neBase = new THREE.Mesh(
        new THREE.BoxGeometry(neW + 0.3, neBaseH, neD + 0.3),
        [baseSolidMat, baseSolidMat, baseSolidMat, baseSolidMat, baseWinMat, baseWinMat]
      );
      neBase.position.y = neBaseH / 2;
      addOutlines(neBase);
      neWing.add(neBase);

      const neUpper = new THREE.Mesh(
        new THREE.BoxGeometry(neW, neUpperH, neD),
        [
          new THREE.MeshStandardMaterial({ map: createCoolGraySideTexture({ showBottomNumber: true }) }),
          new THREE.MeshStandardMaterial({ map: createCoolGraySideTexture({}) }),
          roofMat,
          baseSolidMat,
          new THREE.MeshStandardMaterial({ map: createModernWindowWallTexture(neFloors - 4, 3, true) }),
          new THREE.MeshStandardMaterial({ map: createModernWindowWallTexture(neFloors - 4, 3, true) })
        ]
      );
      neUpper.position.y = neBaseH + neUpperH / 2;
      neUpper.castShadow = true;
      neUpper.receiveShadow = true;
      addOutlines(neUpper);
      neWing.add(neUpper);

      neWing.position.set(11.8, 0, -1.8);
      neWing.rotation.y = Math.PI * 0.26;
      dong112.add(neWing);

      // 4. 중앙 코어 & T자형 옥탑 브릿지 & 환기 루버 박스
      const coreH = sBaseH + sUpperH;
      const centerCore = new THREE.Mesh(
        new THREE.BoxGeometry(10.5, coreH, 10.5),
        [
          new THREE.MeshStandardMaterial({ color: '#787C82', roughness: 0.85 }),
          new THREE.MeshStandardMaterial({ color: '#787C82', roughness: 0.85 }),
          roofMat,
          baseSolidMat,
          new THREE.MeshStandardMaterial({ color: '#787C82', roughness: 0.85 }),
          new THREE.MeshStandardMaterial({ color: '#787C82', roughness: 0.85 })
        ]
      );
      centerCore.position.set(0.8, coreH / 2, 2.2);
      centerCore.castShadow = true;
      centerCore.receiveShadow = true;
      addOutlines(centerCore);
      dong112.add(centerCore);

      const tBridgeMat = new THREE.MeshStandardMaterial({ color: '#D1D5DB', roughness: 0.75 });
      const tTopBar = new THREE.Mesh(new THREE.BoxGeometry(5.2, 2.6, 2.6), tBridgeMat);
      tTopBar.position.set(1.2, coreH + 1.3, 3.2);
      addOutlines(tTopBar);
      dong112.add(tTopBar);

      const tStem = new THREE.Mesh(new THREE.BoxGeometry(2.4, 2.6, 6.2), tBridgeMat);
      tStem.position.set(1.2, coreH + 1.3, 6.5);
      addOutlines(tStem);
      dong112.add(tStem);

      const ventBox = new THREE.Mesh(
        new THREE.BoxGeometry(3.2, 2.4, 5.2),
        new THREE.MeshStandardMaterial({ color: '#272A2E', roughness: 0.75 })
      );
      ventBox.position.set(13.2, 1.2, 13.5);
      addOutlines(ventBox);
      dong112.add(ventBox);

      return dong112;
    }

    // 씬에 112동 배치
    const apt112 = createKumho112Dong();
    scene.add(apt112);

    // =========================================================
    // 3D 모델링 파일(.glb) 추출 함수
    // =========================================================
    window.exportGLB = () => {
      const exporter = new GLTFExporter();
      exporter.parse(
        apt112,
        (result) => {
          const blob = new Blob([result], { type: 'model/gltf-binary' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = 'kumho_112dong_real_entrance.glb';
          link.click();
          URL.revokeObjectURL(url);
        },
        (error) => {
          console.error('GLB 추출 중 오류:', error);
        },
        { binary: true }
      );
    };

    // 애니메이션 루프
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
