    );
    lectern.position.set(0, podiumH + 0.55, podiumD / 2 - 0.75);
    lectern.castShadow = true;
    podiumGroup.add(lectern);

    for (let st = 0; st < 4; st++) {
      const sh = (4 - st) * (podiumH / 4);
      const stairStep = new THREE.Mesh(
        new THREE.BoxGeometry(0.45, sh, 1.4),
        new THREE.MeshStandardMaterial({ color: '#6B442A', roughness: 0.85 })
      );
      stairStep.position.set(podiumW / 2 + st * 0.45 + 0.225, sh / 2, 0.4);
      stairStep.castShadow = true;
      podiumGroup.add(stairStep);
    }

    const cornerOffsets = [
      [-podiumW / 2 + 0.22, -podiumD / 2 + 0.22],
      [-podiumW / 2 + 0.22,  podiumD / 2 - 0.22],
      [ podiumW / 2 - 0.22,  podiumD / 2 - 0.22],
      [ podiumW / 2 - 0.22, -podiumD / 2 + 0.22]
    ];
    cornerOffsets.forEach(([cx, cz]) => {
      const pole = new THREE.Mesh(
        new THREE.CylinderGeometry(0.11, 0.12, postTopY - podiumH, 12),
        steelPoleMat
      );
      pole.position.set(cx, podiumH + (postTopY - podiumH) / 2, cz);
      pole.castShadow = true;
      podiumGroup.add(pole);
    });

    [-podiumD / 2 + 0.22, podiumD / 2 - 0.22].forEach(bz => {
      const beam = new THREE.Mesh(new THREE.BoxGeometry(podiumW - 0.3, 0.12, 0.12), steelPoleMat);
      beam.position.set(0, postTopY - 0.04, bz);
      podiumGroup.add(beam);
    });

    const podiumRoof = createCurvedRoofShell({
      spanWidth: podiumW + 0.9,
      lengthZ: podiumD + 0.8,
      arcAngleRad: Math.PI / 5,
      thickness: 0.18,
      material: new THREE.MeshStandardMaterial({ color: '#647080', roughness: 0.45, metalness: 0.30 })
    });
    podiumRoof.position.set(0, postTopY, 0);
    podiumGroup.add(podiumRoof);

    podiumGroup.position.set(-5.3, 0, -16.6);
    root.add(podiumGroup);

    // ---------------------------------------------------------
    // J) 국기게양대 3기 (화강석 기단 + 태극기·서울교육청기·교기)
    // ---------------------------------------------------------
    const flagPedestal = new THREE.Mesh(
      new THREE.BoxGeometry(5.2, 0.55, 1.5),
      new THREE.MeshStandardMaterial({ color: '#D1D5DB', roughness: 0.78 })
    );
    flagPedestal.position.set(8.1, 0.275, -18.5);
    flagPedestal.castShadow = true;
    flagPedestal.receiveShadow = true;
    root.add(flagPedestal);

    const goldFinialMat = new THREE.MeshStandardMaterial({ color: '#EAB308', metalness: 0.75, roughness: 0.25 });
    const flagConfigs = [
      { x: 6.5, h: 10.0, tex: createEmblemFlagTexture('#1D4ED8', '#93C5FD', '서울') },
      { x: 8.1, h: 11.2, tex: createTaegeukgiTexture() },
      { x: 9.7, h: 10.0, tex: createEmblemFlagTexture('#1F7A44', '#FDE047', '금북') }
    ];
    flagConfigs.forEach(({ x, h, tex }) => {
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.08, h, 10), steelPoleMat);
      pole.position.set(x, 0.55 + h / 2, -18.5);
      pole.castShadow = true;
      root.add(pole);

      const finial = new THREE.Mesh(new THREE.SphereGeometry(0.11, 12, 12), goldFinialMat);
      finial.position.set(x, 0.55 + h + 0.06, -18.5);
      root.add(finial);

      const flag = createWavingFlagMesh(tex, 1.65, 1.10);
      flag.position.set(x + 0.86, 0.55 + h - 0.65, -18.5);
      root.add(flag);
    });

    // GLB 추출
    window.__runExportGLB = () => {
      const exporter = new GLTFExporter();
      exporter.parse(
        root,
        (result) => {
          const blob = new Blob([result], { type: 'model/gltf-binary' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = 'seoul_geumbuk_elementary_v6_0.glb';
          link.click();
          URL.revokeObjectURL(url);
        },
        (err) => console.error('GLB 추출 오류:', err),
        { binary: true }
      );
    };
    window.exportGLB = window.__runExportGLB;

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
