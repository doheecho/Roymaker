<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>금호동 2가 블록 전체 정밀 3D 모델링 v6 (경사 고도 · 남서 1층 노출 · 도로 경계 밀착)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&family=Song+Myung&family=Yeon+Sung&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #A7C7E7;
      font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      color: #f8fafc; user-select: none;
    }
    #canvas-container { width: 100%; height: 100%; position: relative; }
    .hud-panel {
      position: absolute;
      background: rgba(15, 20, 28, 0.86);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.34);
      z-index: 10;
    }
    #info {
      top: 14px; left: 16px; padding: 11px 15px;
      max-width: min(540px, calc(100vw - 32px));
      pointer-events: none;
    }
    #info h1 {
      font-size: 13.5px; font-weight: 700; color: #ffffff;
      display: flex; align-items: center; flex-wrap: wrap; gap: 7px; margin-bottom: 4px;
    }
    #info .badge {
      font-size: 10.5px; font-weight: 700;
      background: rgba(245, 158, 11, 0.25); color: #fde68a;
      border: 1px solid rgba(251, 191, 36, 0.60);
      padding: 1px 7px; border-radius: 999px;
    }
    #info p { font-size: 11.4px; color: #cbd5e1; line-height: 1.48; }
    #info .compass { margin-top: 3px; font-size: 10.8px; color: #93c5fd; font-weight: 600; }

    #options-panel {
      top: 14px; right: 16px; padding: 11px 13px;
      display: flex; flex-direction: column; gap: 5px;
      width: 268px; max-height: calc(100vh - 125px); overflow-y: auto;
    }
    .options-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px; }
    .options-title { font-size: 11px; font-weight: 700; color: #94a3b8; letter-spacing: 0.04em; }
    .collapse-btn {
      background: rgba(51, 65, 85, 0.72); color: #cbd5e1;
      border: 1px solid rgba(148, 163, 184, 0.28); border-radius: 6px;
      padding: 2px 7px; font-size: 10.5px; cursor: pointer; font-family: inherit;
    }
    .collapse-btn:hover { background: rgba(71, 85, 105, 0.92); color: #fff; }
    #options-body { display: flex; flex-direction: column; gap: 4px; }
    #options-body.collapsed { display: none; }
    .toggle-row {
      display: flex; align-items: center; gap: 7px;
      font-size: 11.3px; color: #e2e8f0; cursor: pointer; padding: 1.5px 0;
    }
    .toggle-row input[type="checkbox"] { width: 14px; height: 14px; accent-color: #f59e0b; cursor: pointer; flex-shrink: 0; }
    .toggle-row .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .panel-divider { height: 1px; background: rgba(255, 255, 255, 0.14); margin: 3px 0; }
    #mesh-stats { font-size: 11px; color: #cbd5e1; line-height: 1.5; font-variant-numeric: tabular-nums; }
    #mesh-stats strong { color: #fde68a; font-weight: 700; }

    #controls-ui {
      bottom: 14px; left: 50%; transform: translateX(-50%);
      padding: 8px 10px; display: flex; flex-wrap: wrap; align-items: center;
      justify-content: center; gap: 5px; max-width: calc(100vw - 20px);
    }
    .cam-btn {
      background: rgba(51, 65, 85, 0.84); color: #f1f5f9;
      border: 1px solid rgba(148, 163, 184, 0.30);
      padding: 6px 9px; border-radius: 7px; cursor: pointer;
      font-size: 11.2px; font-family: inherit; font-weight: 500;
      transition: all 0.16s ease; white-space: nowrap;
    }
    .cam-btn:hover { background: rgba(37, 99, 235, 0.88); border-color: rgba(147, 197, 253, 0.82); transform: translateY(-1px); }
    .cam-btn.featured-btn { border-color: rgba(251, 191, 36, 0.55); }
    .cam-btn.active { background: #2563eb; border-color: #93c5fd; color: #fff; font-weight: 700; }
    .bar-divider { width: 1px; height: 20px; background: rgba(255, 255, 255, 0.18); margin: 0 2px; }
    .export-btn {
      background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff;
      border: 1px solid rgba(254, 240, 138, 0.80); padding: 6px 12px;
      border-radius: 7px; cursor: pointer; font-size: 11.5px; font-family: inherit;
      font-weight: 700; display: inline-flex; align-items: center; gap: 5px;
      transition: all 0.16s ease; white-space: nowrap;
    }
    .export-btn:hover { background: linear-gradient(135deg, #fbbf24, #ea580c); transform: translateY(-1px); }
    .export-btn:disabled { opacity: 0.65; cursor: wait; transform: none; }

    #toast {
      position: absolute; top: 18px; left: 50%;
      transform: translateX(-50%) translateY(-14px);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(251, 191, 36, 0.65); color: #fef3c7;
      padding: 9px 16px; border-radius: 10px; font-size: 12.2px; font-weight: 600;
      opacity: 0; pointer-events: none; transition: opacity 0.24s ease, transform 0.24s ease; z-index: 30;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",

</head>
<body>
  <div id="canvas-container"></div>

  <div id="info" class="hud-panel">
    <h1>
      금호동 2가 블록 전체 정밀 3D 모델링 (10개 건물 실사 고증)
      <span class="badge">NE Y=0.0m → SW Y=+2.95m · 도로 경계 밀착</span>
    </h1>
    <p>좌클릭 드래그: 회전 &nbsp;|&nbsp; 우클릭 드래그: 이동 &nbsp;|&nbsp; 휠: 확대·축소</p>
    <div class="compass">북: -Z / 동: +X / 남: +Z / 서: -X &nbsp;|&nbsp; 블록 29.60m × 42.40m · NE(Y=0.0m) → SW(Y=+2.95m) · B1(Y=-3.60m)</div>

  <div id="options-panel" class="hud-panel">
    <div class="options-header">
      <div class="options-title">10개 건물 표시 및 추출</div>

    <div id="options-body">
      <label class="toggle-row"><input type="checkbox" data-grp="b1" checked /><span class="dot" style="background:#c7967a;"></span><span>1. 설내옥설렁탕 (5F · Y=0.0m)</span></label>
      <label class="toggle-row"><input type="checkbox" data-grp="b2" checked /><span class="dot" style="background:#facc15;"></span><span>2. 대림부동산·상가 (3F · Y=0.0m)</span></label>
      <label class="toggle-row"><input type="checkbox" data-grp="b3" checked /><span class="dot" style="background:#b94a38;"></span><span>3. 141번지 주택 (2F · Y=+0.55m)</span></label>
      <label class="toggle-row"><input type="checkbox" data-grp="b4" checked /><span class="dot" style="background:#a64b3b;"></span><span>4. 86 윤슬네일·상가 (3F · Y=+2.95m)</span></label>
      <label class="toggle-row"><input type="checkbox" data-grp="b5" checked /><span class="dot" style="background:#e2e8f0;"></span><span>5. 84 할머니냉면·상가 (3F · Y=+2.95m)</span></label>
      <label class="toggle-row"><input type="checkbox" data-grp="b6" checked /><span class="dot" style="background:#7e5a4e;"></span><span>6. 84-2 컴퓨터수리 (3F · Y=+1.95m)</span></label>
      <label class="toggle-row"><input type="checkbox" data-grp="b7" checked /><span class="dot" style="background:#2e5e47;"></span><span>7. 143-9 녹색지붕 (2F · Y=+1.15m)</span></label>
      <label class="toggle-row"><input type="checkbox" data-grp="b9" checked /><span class="dot" style="background:#cbd5e1;"></span><span>8. 143-13 평지붕 (3F · Y=+2.05m)</span></label>
      <label class="toggle-row"><input type="checkbox" data-grp="b8" checked /><span class="dot" style="background:#8f4334;"></span><span>9. 143-11 중정주택 (2F · Y=+1.85m)</span></label>
      <label class="toggle-row"><input type="checkbox" data-grp="b10" checked /><span class="dot" style="background:#94a3b8;"></span><span>10. 84-1 내부주택 (2F · Y=+2.60m)</span></label>
      <div class="panel-divider"></div>
      <label class="toggle-row"><input type="checkbox" id="chk-outlines" /><span class="dot" style="background:#64748b;"></span><span>건축 윤곽선 (Edges)</span></label>

  <div id="toast">GLB 파일 생성 중...</div>

  <div id="controls-ui" class="hud-panel">
    <button class="cam-btn featured-btn active" data-view="top">1. 스카이뷰</button>
    <button class="cam-btn" data-view="n_seol">2. 북(설내옥)</button>
    <button class="cam-btn" data-view="ne_seol">3. 북동(설내옥)</button>
    <button class="cam-btn" data-view="ne_daelim">4. 북동(부동산)</button>
    <button class="cam-btn" data-view="e_daelim">5. 동(부동산·141)</button>
    <button class="cam-btn" data-view="w_yunseul">6. 서(윤슬네일)</button>
    <button class="cam-btn" data-view="sw_shops">7. 남서(86 상가열)</button>
    <button class="cam-btn" data-view="s_sarang">8. 남(84 할머니·사랑방)</button>
    <div class="bar-divider"></div>
    <button class="export-btn" id="btn-export-glb"><span>⬇</span> 3D 추출 (.glb)</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
    import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

    // =========================================================================
    // 1. 씬, 카메라, 렌더러 및 무그림자 5-Point 주간 조명
    // =========================================================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#A7C7E7');
    scene.fog = new THREE.Fog('#A7C7E7', 120, 320);

    const camera = new THREE.PerspectiveCamera(44, window.innerWidth / window.innerHeight, 0.15, 600);
    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      logarithmicDepthBuffer: true,
      powerPreference: 'high-performance'
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = false;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.068;
    controls.maxPolarAngle = Math.PI * 0.495;
    controls.minDistance = 3.2;
    controls.maxDistance = 165;

    scene.add(new THREE.AmbientLight(0xffffff, 0.72));
    const hemiLight = new THREE.HemisphereLight(0xeef6ff, 0x8b929c, 0.72);
    hemiLight.position.set(0, 60, 0);
    scene.add(hemiLight);

    const neKeyLight = new THREE.DirectionalLight(0xfffaf0, 0.96);
    neKeyLight.position.set(36, 52, -38);
    scene.add(neKeyLight);

    const swFillLight = new THREE.DirectionalLight(0xe4f0fc, 0.76);
    swFillLight.position.set(-38, 42, 38);
    scene.add(swFillLight);

    const seRimLight = new THREE.DirectionalLight(0xfcf6ee, 0.48);
    seRimLight.position.set(38, 28, 32);
    scene.add(seRimLight);

    // =========================================================================
    // 2. 블록 그룹 계층
    //    - 동북(NE, z = -10.60): Y = 0.00m (설내옥·대림부동산 기존 높이 그대로 유지)
    //    - 남서(SW, z = +31.80): Y = +2.95m (지형 경사 반영하여 86·84 상가 1층 전체 노출 + 도보 경계 밀착)
    //    - 지하 1층(B1) 하단: Y = -3.60m (각 건물 지상층 외벽과 동일한 재질·색상 마감)
    // =========================================================================
    const BLOCK_ROT_RAD = THREE.MathUtils.degToRad(-45);
    const BASEMENT_BOTTOM_Y = -3.60;

    const rootExportGroup = new THREE.Group();
    rootExportGroup.name = 'Geumho_Block_10Buildings_v6';
    scene.add(rootExportGroup);

    const blockGroup = new THREE.Group();
    blockGroup.name = 'Unified_10Building_Block';
    blockGroup.rotation.y = BLOCK_ROT_RAD;
    rootExportGroup.add(blockGroup);

    const groups = {
      b1: new THREE.Group(),
      b2: new THREE.Group(),
      b3: new THREE.Group(),
      b4: new THREE.Group(),
      b5: new THREE.Group(),
      b6: new THREE.Group(),
      b7: new THREE.Group(),
      b8: new THREE.Group(),
      b9: new THREE.Group(),
      b10: new THREE.Group()
    };
    groups.b1.name = 'B1_Seolnaeok_5F';
    groups.b2.name = 'B2_DaelimRealty_3F';
    groups.b3.name = 'B3_House_141_2F';
    groups.b4.name = 'B4_RedBrick_86_3F';
    groups.b5.name = 'B5_WhiteTile_84_3F';
    groups.b6.name = 'B6_BrownBrick_84_2_3F';
    groups.b7.name = 'B7_GreenRoof_143_9_2F';
    groups.b8.name = 'B8_Courtyard_143_11_2F';
    groups.b9.name = 'B9_FlatGray_143_13_3F';
    groups.b10.name = 'B10_InnerGray_84_1_2F';
    Object.values(groups).forEach((g) => blockGroup.add(g));

    const outlineGroup = new THREE.Group();
    outlineGroup.name = 'Architectural_Outlines';
    outlineGroup.visible = false;
    outlineGroup.rotation.y = BLOCK_ROT_RAD;
    scene.add(outlineGroup);

    function blockToWorld(lx, ly, lz) {
      return new THREE.Vector3(lx, ly, lz).applyAxisAngle(new THREE.Vector3(0, 1, 0), BLOCK_ROT_RAD);
    }

    // =========================================================================
    // 3. 공통 유틸리티 & 고품질 GeometryBatcher
    // =========================================================================
    const dynamicSignRegistry = [];

    async function waitForKoreanFonts(timeoutMs = 1500) {
      if (!document.fonts) return;
      const specs = [
        '400 48px "Yeon Sung"',
        '400 48px "Song Myung"',
        '400 48px "Black Han Sans"',
        '700 48px "Gowun Batang"',
        '700 48px "Noto Sans KR"',
        '900 48px "Noto Sans KR"'
      ];
      try {
        await Promise.race([
          Promise.all([...specs.map((f) => document.fonts.load(f).catch(() => {})), document.fonts.ready]),
          new Promise((r) => setTimeout(r, timeoutMs))
        ]);
      } catch (_) {}
    }

    function registerDynamicSign(canvas, tex, drawFn) {
      dynamicSignRegistry.push({ canvas, tex, drawFn });
      drawFn(canvas.getContext('2d'), canvas.width, canvas.height);
      tex.needsUpdate = true;
      return tex;
    }

    function redrawAllDynamicSigns() {
      for (const e of dynamicSignRegistry) {
        const ctx = e.canvas.getContext('2d');
        ctx.clearRect(0, 0, e.canvas.width, e.canvas.height);
        e.drawFn(ctx, e.canvas.width, e.canvas.height);
        e.tex.needsUpdate = true;
      }
    }

    function mulberry32(seed) {
      let a = seed >>> 0;
      return () => {
        a = (a + 0x6d2b79f5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    let toastTimer = null;
    function showToast(msg, duration = 2900) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), duration);
    }

    function applyWorldPlanarUVs(geometry, scaleU = 0.36, scaleV = 0.36) {
      geometry.computeVertexNormals();
      const pos = geometry.attributes.position;
      const norm = geometry.attributes.normal;
      const uv = geometry.attributes.uv;
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
        const nx = Math.abs(norm.getX(i)), ny = Math.abs(norm.getY(i)), nz = Math.abs(norm.getZ(i));
        if (ny >= nx && ny >= nz) uv.setXY(i, x * scaleU, z * scaleV);
        else if (nx >= nz) uv.setXY(i, z * scaleU, y * scaleV);
        else uv.setXY(i, x * scaleU, y * scaleV);
      }
      uv.needsUpdate = true;
    }

    function addOutlineForMesh(mesh, color = 0x1e293b, threshold = 28, opacity = 0.45) {
      const edges = new THREE.EdgesGeometry(mesh.geometry, threshold);
      const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color, transparent: true, opacity }));
      line.position.copy(mesh.position);
      line.rotation.copy(mesh.rotation);
      line.scale.copy(mesh.scale);
      outlineGroup.add(line);
    }

    class GeometryBatcher {
      constructor() {
        this.buckets = new Map();
        this.baseBox = new THREE.BoxGeometry(1, 1, 1).toNonIndexed();
        this.baseCyl = new THREE.CylinderGeometry(0.5, 0.5, 1, 14).toNonIndexed();
        this.baseDodec = new THREE.DodecahedronGeometry(0.5, 1).toNonIndexed();
        this._mat4 = new THREE.Matrix4();
        this._pos = new THREE.Vector3();
        this._quat = new THREE.Quaternion();
        this._euler = new THREE.Euler();
        this._scale = new THREE.Vector3();
      }
      _ensure(key, material) {
        if (!this.buckets.has(key)) this.buckets.set(key, { material, geoms: [] });
        return this.buckets.get(key);
      }
      _normalize(srcGeom) {
        const g = srcGeom.index ? srcGeom.toNonIndexed() : srcGeom.clone();
        if (!g.attributes.normal) g.computeVertexNormals();
        if (!g.attributes.uv) {
          g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(g.attributes.position.count * 2), 2));
        }
        for (const attr of Object.keys(g.attributes)) {
          if (attr !== 'position' && attr !== 'normal' && attr !== 'uv') g.deleteAttribute(attr);
        }
        return g;
      }
      addGeometry(key, material, geometry, matrix = null) {
        const g = this._normalize(geometry);
        if (matrix) g.applyMatrix4(matrix);
        this._ensure(key, material).geoms.push(g);
      }
      addBox(key, material, x, y, z, sx, sy, sz, rx = 0, ry = 0, rz = 0, worldUV = 0) {
        const g = this.baseBox.clone();
        this._pos.set(x, y, z);
        this._euler.set(rx, ry, rz);
        this._quat.setFromEuler(this._euler);
        this._scale.set(sx, sy, sz);
        this._mat4.compose(this._pos, this._quat, this._scale);
        g.applyMatrix4(this._mat4);
        if (worldUV > 0) applyWorldPlanarUVs(g, worldUV, worldUV);
        this._ensure(key, material).geoms.push(g);
      }
      addCylinder(key, material, x, y, z, diameter, length, rx = 0, ry = 0, rz = 0) {
        const g = this.baseCyl.clone();
        this._pos.set(x, y, z);
        this._euler.set(rx, ry, rz);
        this._quat.setFromEuler(this._euler);
        this._scale.set(diameter, length, diameter);
        this._mat4.compose(this._pos, this._quat, this._scale);
        g.applyMatrix4(this._mat4);
        this._ensure(key, material).geoms.push(g);
      }
      addDodecahedron(key, material, x, y, z, diameter) {
        const g = this.baseDodec.clone();
        this._pos.set(x, y, z);
        this._quat.identity();
        this._scale.set(diameter, diameter, diameter);
        this._mat4.compose(this._pos, this._quat, this._scale);
        g.applyMatrix4(this._mat4);
        this._ensure(key, material).geoms.push(g);
      }
      addRod(key, material, x1, y1, z1, x2, y2, z2, diameter) {
        const v1 = new THREE.Vector3(x1, y1, z1), v2 = new THREE.Vector3(x2, y2, z2);
        const dir = new THREE.Vector3().subVectors(v2, v1);
        const len = dir.length();
        if (len < 0.001) return;
        const mid = new THREE.Vector3().addVectors(v1, v2).multiplyScalar(0.5);
        const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
        const g = this.baseCyl.clone();
        this._scale.set(diameter, len, diameter);
        this._mat4.compose(mid, q, this._scale);
        g.applyMatrix4(this._mat4);
        this._ensure(key, material).geoms.push(g);
      }
      buildAll(parentGroup) {
        for (const [key, { material, geoms }] of this.buckets.entries()) {
          if (!geoms.length) continue;
          const merged = mergeGeometries(geoms, false);
          geoms.forEach((g) => g.dispose());
          geoms.length = 0;
          if (!merged) continue;
          const mesh = new THREE.Mesh(merged, material);
          mesh.name = `Merged_${key}`;
          parentGroup.add(mesh);
        }
        this.buckets.clear();
      }

    function makeTex(canvas, rx = 1, ry = 1, isLinear = false) {
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = isLinear ? THREE.NoColorSpace : THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      if (rx !== 1 || ry !== 1) {
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(rx, ry);
      }
      return tex;
    }

    function makeSignTex(w, h, drawFn, isDynamic = true) {
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const tex = makeTex(c, 1, 1, false);
      if (isDynamic) return registerDynamicSign(c, tex, drawFn);
      drawFn(c.getContext('2d'), w, h);
      return tex;
    }

    function drawHanokBowlEmblem(ctx, cx, cy, r, strokeColor, fillBgColor = null, innerFillAccent = null) {
      ctx.save();
      ctx.translate(cx, cy);
      if (fillBgColor) {
        ctx.fillStyle = fillBgColor;
        ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
      }
      ctx.strokeStyle = strokeColor;
      ctx.lineWidth = r * 0.055;
      ctx.beginPath(); ctx.arc(0, 0, r * 0.90, 0, Math.PI * 2); ctx.stroke();
      ctx.lineWidth = r * 0.024;
      ctx.beginPath(); ctx.arc(0, 0, r * 0.81, 0, Math.PI * 2); ctx.stroke();

      ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = r * 0.052;
      ctx.beginPath();
      ctx.moveTo(-r * 0.14, -r * 0.44); ctx.quadraticCurveTo(-r * 0.36, -r * 0.24, -r * 0.64, -r * 0.14);
      ctx.moveTo(r * 0.14, -r * 0.44); ctx.quadraticCurveTo(r * 0.36, -r * 0.24, r * 0.64, -r * 0.14);
      ctx.moveTo(-r * 0.18, -r * 0.45); ctx.lineTo(r * 0.18, -r * 0.45);
      ctx.moveTo(-r * 0.60, -r * 0.06); ctx.quadraticCurveTo(0, -r * 0.18, r * 0.60, -r * 0.06);
      ctx.stroke();

      ctx.lineWidth = r * 0.025;
      for (let i = -2; i <= 2; i++) {
        const tx = i * r * 0.15;
        ctx.beginPath();
        ctx.moveTo(tx * 0.45, -r * 0.40);
        ctx.quadraticCurveTo(tx * 0.85, -r * 0.24, tx * 1.15, -r * 0.10);
        ctx.stroke();
      }

      ctx.lineWidth = r * 0.028;
      [-r * 0.18, 0, r * 0.18].forEach((sx, idx) => {
        const h = idx === 1 ? r * 0.24 : r * 0.18;
        ctx.beginPath();
        ctx.moveTo(sx, r * 0.16);
        ctx.bezierCurveTo(sx - r * 0.06, r * 0.10, sx + r * 0.06, r * 0.04, sx, r * 0.16 - h);
        ctx.stroke();
      });

      ctx.lineWidth = r * 0.052;
      ctx.beginPath();
      ctx.moveTo(-r * 0.44, r * 0.24); ctx.lineTo(r * 0.44, r * 0.24);
      ctx.bezierCurveTo(r * 0.42, r * 0.56, r * 0.22, r * 0.62, r * 0.18, r * 0.62);
      ctx.lineTo(-r * 0.18, r * 0.62);
      ctx.bezierCurveTo(-r * 0.22, r * 0.62, -r * 0.42, r * 0.56, -r * 0.44, r * 0.24);
      ctx.closePath();
      if (innerFillAccent) { ctx.fillStyle = innerFillAccent; ctx.fill(); }
      ctx.stroke();

      ctx.lineWidth = r * 0.045;
      ctx.beginPath(); ctx.moveTo(-r * 0.22, r * 0.68); ctx.lineTo(r * 0.22, r * 0.68); ctx.stroke();
      ctx.restore();
    }

     * - 지상층 외벽 재질/색상 및 UV 스케일을 동일하게 적용하여 Y=0 경계선 이음매 제거
     */
    function addBasementToBottom(parent, x1, x2, topY, z1, z2, name, wallMat, uvScale = 0.32, withOutline = false) {
      const w = x2 - x1, d = z2 - z1, h = topY - BASEMENT_BOTTOM_Y;
      if (h <= 0.01) return null;
      const geo = new THREE.BoxGeometry(w, h, d);
      applyWorldPlanarUVs(geo, uvScale, uvScale);
      const mats = Array.isArray(wallMat)
        ? wallMat
        : [wallMat, wallMat, basementSlabMat, basementSlabMat, wallMat, wallMat];
      const mesh = new THREE.Mesh(geo, mats);
      mesh.name = name;
      mesh.position.set((x1 + x2) / 2, BASEMENT_BOTTOM_Y + h / 2, (z1 + z2) / 2);
      parent.add(mesh);
      if (withOutline) addOutlineForMesh(mesh);
      return mesh;
    }

    function addMassBlock(parent, x1, x2, y1, y2, z1, z2, mat, name, withOutline = true, uvScale = 0.32) {
      const w = x2 - x1, h = y2 - y1, d = z2 - z1;
      const g = new THREE.BoxGeometry(w, h, d);
      applyWorldPlanarUVs(g, uvScale, uvScale);
      const m = new THREE.Mesh(g, mat);
      m.name = name;
      m.position.set((x1 + x2) / 2, (y1 + y2) / 2, (z1 + z2) / 2);
      parent.add(m);
      if (withOutline) addOutlineForMesh(m);
      return m;
    }

    function addWallMounted3DText(parent, opts) {
      const {
        segments, x, y, z, rotY = 0,
        planeW, planeH,
        sideColor = '#1E2228',
        depthStart = 0.006, depthEnd = 0.072, layers = 4,
        cw = 768, ch = 220
      } = opts;

      const drawComposite = (ctx, w, h, mode) => {
        ctx.clearRect(0, 0, w, h);
        ctx.save();
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';

        const measured = segments.map((seg) => {
          ctx.font = seg.font;
          return { ...seg, width: ctx.measureText(seg.text).width };
        });
        const totalW = measured.reduce((acc, s) => acc + s.width, 0);
        let curX = (w - totalW) / 2;

        measured.forEach((seg) => {
          ctx.font = seg.font;
          const cy = h / 2 + (seg.dy || 0);
          if (mode === 'shadow') {
            ctx.fillStyle = 'rgba(18, 16, 14, 0.36)';
            ctx.strokeStyle = 'rgba(18, 16, 14, 0.36)';
            ctx.lineWidth = (seg.rimW || 4) + 6;
            ctx.strokeText(seg.text, curX, cy);
            ctx.fillText(seg.text, curX, cy);
          } else if (mode === 'side') {
            ctx.fillStyle = sideColor;
            ctx.strokeStyle = sideColor;
            ctx.lineWidth = (seg.rimW || 4) + 6;
            ctx.strokeText(seg.text, curX, cy);
            ctx.fillText(seg.text, curX, cy);
          } else {
            if (seg.rimW && seg.rim) {

      const cx = (x0 + x1) / 2, cz = (z0 + z1) / 2;

      addBasementToBottom(grp, x0, x1, G, z0, z1, 'B10_Basement_1F', house2FWhiteMat, 0.32, true);
      addMassBlock(grp, x0, x1, G, G + 5.80, z0, z1, house2FWhiteMat, 'B10_2F_Mass', true);

      batch.addBox('B10_Parapet', houseRoofGrayMat, cx, G + 5.96, z0 + 0.14, x1 - x0, 0.32, 0.28);
      batch.addBox('B10_Parapet', houseRoofGrayMat, cx, G + 5.96, z1 - 0.14, x1 - x0, 0.32, 0.28);
      batch.addBox('B10_Parapet', houseRoofGrayMat, x0 + 0.14, G + 5.96, cz, 0.28, 0.32, z1 - z0);
      batch.addBox('B10_Parapet', houseRoofGrayMat, x1 - 0.14, G + 5.96, cz, 0.28, 0.32, z1 - z0);
      addMassBlock(grp, 0.6, 3.0, G + 5.80, G + 7.50, 23.4, 26.2, house2FWhiteMat, 'B10_Roof_Penthouse', true);

      batch.buildAll(grp);
      batch.disposeBases();
    }

    // =========================================================================
    // 15. 실시간 메시 통계, 8개 카메라 프리셋 & 비파괴 GLB 추출
    // =========================================================================
    function updateMeshStats() {
      let meshCount = 0, triCount = 0;
      Object.values(groups).forEach((grp) => {
        if (!grp.visible) return;
        grp.traverse((obj) => {
          if (obj.isMesh && obj.geometry) {
            meshCount++;
            const g = obj.geometry;
            triCount += g.index ? g.index.count / 3 : g.attributes.position.count / 3;
          }
        });
      });
      document.getElementById('mesh-stats').innerHTML =
        `병합 메시 수: <strong>${meshCount.toLocaleString()}</strong>개<br/>` +
        `총 삼각형 수: <strong>${Math.round(triCount).toLocaleString()}</strong> tris`;
    }

    const skyTargetW = blockToWorld(0.5, 4.0, 10.6);
    const cameraPresets = {
      top:       { pos: new THREE.Vector3(skyTargetW.x, 88.0, skyTargetW.z + 0.25), target: skyTargetW.clone() },
      n_seol:    { pos: blockToWorld(-25.5, 5.6, -21.5), target: blockToWorld(-9.4, 6.2, -6.5) },
      ne_seol:   { pos: blockToWorld(-8.0, 4.8, -28.0), target: blockToWorld(-8.0, 6.2, -10.2) },
      ne_daelim: { pos: blockToWorld(8.5, 4.2, -25.5), target: blockToWorld(7.0, 4.6, -9.8) },
      e_daelim:  { pos: blockToWorld(27.5, 5.2, -17.5), target: blockToWorld(8.0, 4.6, -3.5) },
      w_yunseul: { pos: blockToWorld(-26.5, 8.6, 42.5), target: blockToWorld(-9.5, 6.5, 29.5) },
      sw_shops:  { pos: blockToWorld(-7.8, 7.4, 47.5), target: blockToWorld(-8.2, 6.2, 31.8) },
      s_sarang:  { pos: blockToWorld(9.5, 7.4, 47.5), target: blockToWorld(8.2, 6.2, 31.8) }
    };

    let camAnim = null;
    function setView(viewKey, instant = false) {
      const preset = cameraPresets[viewKey];
      if (!preset) return;
      document.querySelectorAll('.cam-btn').forEach((btn) => btn.classList.toggle('active', btn.dataset.view === viewKey));
      if (instant) {
        camAnim = null;
        camera.position.copy(preset.pos);
        controls.target.copy(preset.target);
        controls.update();
        return;
      }
      camAnim = { startPos: camera.position.clone(), endPos: preset.pos.clone(), startTarget: controls.target.clone(), endTarget: preset.target.clone(), progress: 0, duration: 0.65 };
    }

    document.querySelectorAll('.cam-btn').forEach((btn) => btn.addEventListener('click', () => setView(btn.dataset.view, false)));
    controls.addEventListener('start', () => { camAnim = null; });

    document.querySelectorAll('input[data-grp]').forEach((chk) => {
      chk.addEventListener('change', (e) => {
        groups[e.target.dataset.grp].visible = e.target.checked;
        updateMeshStats();
      });
    });
    document.getElementById('chk-outlines').addEventListener('change', (e) => { outlineGroup.visible = e.target.checked; });

    const btnCollapse = document.getElementById('btn-collapse');
    const optionsBody = document.getElementById('options-body');
    btnCollapse.addEventListener('click', () => {
      const collapsed = optionsBody.classList.toggle('collapsed');
      btnCollapse.textContent = collapsed ? '펼치기' : '접기';
    });

    const exportBtn = document.getElementById('btn-export-glb');
    exportBtn.addEventListener('click', () => {
      if (!Object.values(groups).some((g) => g.visible)) {
        showToast('추출할 건물을 1개 이상 선택해주세요.', 2600);
        return;
      }
      exportBtn.disabled = true;
      showToast('금호동 2가 블록 10개 건물 통합 GLB 파일을 생성하고 있습니다...', 4500);
      try {
        const exporter = new GLTFExporter();
        exporter.parse(
          rootExportGroup,
          (result) => {
            const blob = new Blob([result], { type: 'model/gltf-binary' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'Geumho_Block_10Buildings_v6.glb';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            setTimeout(() => URL.revokeObjectURL(url), 1200);
            showToast(`추출 완료! Geumho_Block_10Buildings_v6.glb (${(blob.size / (1024 * 1024)).toFixed(2)} MB)`, 3600);
            exportBtn.disabled = false;
          },
          (err) => { console.error(err); showToast('GLB 추출 중 오류가 발생했습니다.', 3400); exportBtn.disabled = false; },
          { binary: true, onlyVisible: true }
        );
      } catch (err) {
        console.error(err); exportBtn.disabled = false;
      }
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.1);
      if (camAnim) {
        camAnim.progress += dt / camAnim.duration;
        const t = Math.min(1, camAnim.progress);
        const ease = 1 - Math.pow(1 - t, 3);
        camera.position.lerpVectors(camAnim.startPos, camAnim.endPos, ease);
        controls.target.lerpVectors(camAnim.startTarget, camAnim.endTarget, ease);
        if (t >= 1) camAnim = null;
      }
      controls.update();
      renderer.render(scene, camera);
    }

    async function initApp() {
      await waitForKoreanFonts(1500);
      buildBuilding1();
      buildBuilding2();
      buildBuilding3();
      buildBuilding4();
      buildBuilding5();
      buildBuilding6();
      buildBuilding7();
      buildBuilding8();
      buildBuilding9();
      buildBuilding10();
      updateMeshStats();
      setView('top', true);
      if (document.fonts && typeof document.fonts.addEventListener === 'function') {
        document.fonts.addEventListener('loadingdone', redrawAllDynamicSigns);
      }
      animate();
    }

    window.onload = initApp;
  </script>
</body>
</html>
