<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이로이의 하루</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>이로이의 하루</h1>
    <span id="day-counter" class="day-counter">Day 1</span>
    <p id="clock" class="clock">—</p>
  </header>

  <main>
    <section id="schedule-panel" class="panel panel-wide">
      <h2>오늘 일정 짜기</h2>
      <p class="muted">하루를 시작하기 전에 등교 시각과 방과후 학원을 먼저 정한다. 시작하면 더는 바꿀 수 없다.</p>

      <form id="schedule-form">
        <label>
          등교 출발 시각
          <select id="depart-select">
            <option value="07:30">07:30</option>
            <option value="07:40">07:40</option>
            <option value="07:50">07:50</option>
            <option value="08:00">08:00</option>
            <option value="08:10">08:10</option>
            <option value="08:20">08:20</option>
            <option value="08:30" selected>08:30</option>
            <option value="08:40">08:40</option>
            <option value="08:50">08:50</option>
          </select>
        </label>

        <label>
          방과후 일정
          <select id="academy-select"></select>
        </label>

        <button type="submit" id="start-day-btn">하루 시작</button>
      </form>

      <div id="day-run" hidden>
        <p id="day-status" class="day-status">—</p>
        <ul id="day-log"></ul>
      </div>

      <p id="day-summary" class="muted" hidden></p>
    </section>

    <section id="map-panel" class="panel panel-wide">
      <h2>지도</h2>
      <p class="muted">집·학교는 실제 지오코딩 위치, 동네 학원 4곳은 주소가 정해지지 않아 도보 10분 추정 위치에 가상으로 표시한다.</p>
      <div id="map"></div>
    </section>

    <section id="stats-panel" class="panel">
      <h2 id="char-name">—</h2>
      <div id="stats"></div>
      <div id="condition"></div>
    </section>

    <section id="academy-panel" class="panel">
      <h2>방과후 학원</h2>
      <ul id="academies"></ul>
    </section>
  </main>

  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=8d5cf5d494acc41a8002c036c0249f9a&libraries=services"></script>
  <script src="main.js"></script>
</body>
</html>
