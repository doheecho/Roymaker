<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>행당대림아파트 104동 3D 모델링 (15층 · ㄴ자형 복합동 · 평지 기준)</title>
  <style>
    body { margin: 0; overflow: hidden; background: #1e242b; }
    #info {
      position: absolute; top: 14px; left: 16px; color: #fff;
      font-family: 'Malgun Gothic', sans-serif; font-size: 13px;
      background: rgba(16, 20, 26, 0.88); padding: 10px 14px;
      border-radius: 8px; border: 1px solid rgba(255,255,255,0.18);
      pointer-events: none; line-height: 1.55;
    }
    #controls-ui {
      position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
      display: flex; flex-wrap: wrap; justify-content: center; gap: 5px;
      background: rgba(16, 20, 26, 0.92); padding: 9px 11px;
      border-radius: 10px; border: 1px solid rgba(255,255,255,0.18);
      max-width: 98vw;
    }
    button {
      background: #374151; color: #fff; border: 1px solid #4b5563;
      padding: 6px 9px; border-radius: 6px; cursor: pointer; font-size: 12px;
      font-family: 'Malgun Gothic', sans-serif; transition: 0.15s;
    }
    button:hover { background: #2563eb; border-color: #60a5fa; }
    button.primary-btn { background: #1d4ed8; border-color: #3b82f6; font-weight: bold; }
    button.export-btn { background: #b45309; border-color: #f59e0b; font-weight: bold; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="info">
    <strong>행당대림아파트 104동 3D 모델링 (15층 · ㄴ자형 복합동 · 평지 기준)</strong><br/>
    좌클릭 드래그: 회전 | 우클릭 드래그: 이동 | 휠: 확대·축소 (북쪽: -Z / 동쪽: +X)
  </div>

  <div id="controls-ui">
    <button onclick="setView('sky')">1번: 스카이뷰</button>
    <button onclick="setView('sse_outer')">2번: 남남동쪽에서</button>
    <button onclick="setView('inner_wnw')">3번: 안쪽 북서서쪽에서</button>
    <button class="primary-btn" onclick="setView('inner_wsw')">4번: 안쪽 남서서쪽에서</button>
    <button onclick="setView('west_inner')">5번: 서쪽에서</button>
    <button onclick="setView('nnw_inner')">6번: 북북서쪽에서</button>
    <button onclick="setView('outer_wnw')">7번: 바깥쪽 북서서 에서</button>
    <button onclick="setView('outer_nnw')">8번: 바깥쪽 북북서 에서</button>
    <button class="export-btn" onclick="exportGLB()">3D 추출 (.glb)</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

    // 1. 씬, 카메라, 렌더러 설정
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#9EC1E6');
    scene.fog = new THREE.Fog('#9EC1E6', 160, 420);

    const camera = new THREE.PerspectiveCamera(46, window.innerWidth / window.innerHeight, 0.1, 700);

    const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // 104동 전체 그룹 (실제 지도 방위 반영: 로컬 -Z가 북북서 NNW, 로컬 -X가 남서서 WSW가 되도록 +27도 회전)
    const ROT_DEG = 27;
    const ROT_RAD = THREE.MathUtils.degToRad(ROT_DEG);
    const APT_ORIGIN = new THREE.Vector3(14.0, 0.0, 14.0);

    const aptGroup = new THREE.Group();
    aptGroup.name = 'Haengdang_Daelim_104_L_Shape';
    aptGroup.position.copy(APT_ORIGIN);
    aptGroup.rotation.y = ROT_RAD;
    scene.add(aptGroup);

    // 로컬(104동 기준) 좌표를 월드 좌표로 변환하는 헬퍼
    function toWorld(lx, ly, lz) {
      return new THREE.Vector3(lx, ly, lz)
        .applyAxisAngle(new THREE.Vector3(0, 1, 0), ROT_RAD)
        .add(APT_ORIGIN);
    }

    // 8개 시점 프리셋
    window.setView = (mode) => {
      const presets = {
        sky:       { pos: toWorld(-14.0, 96.0, -14.0), target: toWorld(-12.0, 10.0, -12.0) },
        sse_outer: { pos: toWorld(-18.0, 5.5, 34.0),   target: toWorld(-18.0, 22.0, 12.0) },
        inner_wnw: { pos: toWorld(-18.0, 4.5, -24.0),  target: toWorld(-18.0, 21.0, 0.0) },
        inner_wsw: { pos: toWorld(-28.0, 3.8, -14.0),  target: toWorld(-4.0, 19.0, -8.0) },
        west_inner:{ pos: toWorld(-26.0, 3.5, -22.0),  target: toWorld(-2.0, 18.5, -6.0) },
        nnw_inner: { pos: toWorld(-16.0, 3.8, -32.0),  target: toWorld(-4.0, 19.0, -4.0) },
        outer_wnw: { pos: toWorld(-14.0, 4.2, -48.0),  target: toWorld(4.0, 20.0, -26.0) },
        outer_nnw: { pos: toWorld(-49.0, 4.5, -15.0),  target: toWorld(-22.0, 19.0, -6.0) }
      };
      const v = presets[mode];
      if (!v) return;
      camera.position.copy(v.pos);
      controls.target.copy(v.target);
      controls.update();
    };

    // 초기 시점 설정
    setView('inner_wsw');

    // 2. 조명 설정
    scene.add(new THREE.AmbientLight(0xffffff, 0.95));

    const sunLight = new THREE.DirectionalLight(0xfffdf5, 1.32);
    sunLight.position.set(-45, 85, -35);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(2048, 2048);
    sunLight.shadow.camera.left = -55;
    sunLight.shadow.camera.right = 55;
    sunLight.shadow.camera.top = 65;
    sunLight.shadow.camera.bottom = -25;
    sunLight.shadow.bias = -0.0005;
    scene.add(sunLight);

    const fillLight = new THREE.DirectionalLight(0xf8fafc, 0.85);
    fillLight.position.set(45, 55, 50);
    scene.add(fillLight);

    // =========================================================
    // 프로시저럴 텍스처 유틸리티
    // =========================================================
    function makeTex(canvas, rx = 1, ry = 1, isLinear = false) {
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = isLinear ? THREE.NoColorSpace : THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      if (rx !== 1 || ry !== 1) {
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(rx, ry);
      }
      return tex;
    }

    function addOutline(mesh, color = 0x6b5b45) {
      const edges = new THREE.EdgesGeometry(mesh.geometry, 35);
      mesh.add(new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color })));
    }

    function createCementTexture(baseHex, rx = 4, ry = 8) {
      const c = document.createElement('canvas');
      c.width = 256; c.height = 256;
      const ctx = c.getContext('2d');
      ctx.fillStyle = baseHex;
      ctx.fillRect(0, 0, 256, 256);

      for (let i = 0; i < 1800; i++) {
        const x = (i * 73) % 256;
        const y = (i * 137) % 256;
        ctx.fillStyle = (i % 2 === 0) ? 'rgba(0,0,0,0.025)' : 'rgba(255,255,255,0.03)';
        ctx.fillRect(x, y, 2, 2);
      }
      return makeTex(c, rx, ry);
    }

    // 104동 측벽 컬러 텍스처 + 요철(Bump) 텍스처 생성
    function create104EndWallTextures() {
      const W = 1024;
      const H = 3072;
      const totalFloors = 15;
      const floorPx = H / totalFloors;
      const lowerStartY = 12 * floorPx;
      const sideBandW = 86;

      const c = document.createElement('canvas');
      c.width = W; c.height = H;
      const ctx = c.getContext('2d');

      const bc = document.createElement('canvas');
      bc.width = W; bc.height = H;
      const bctx = bc.getContext('2d');

      // 1) 기본 바탕색 (상단 4~15층 크림색 / 하단 1~3층 황토·베이지색)
      ctx.fillStyle = '#EFECE4';
      ctx.fillRect(0, 0, W, lowerStartY);
      ctx.fillStyle = '#C59B63';
      ctx.fillRect(0, lowerStartY, W, H - lowerStartY);

      bctx.fillStyle = '#D8D8D8';
      bctx.fillRect(0, 0, W, H);

      // 2) 중앙 면 수직 홈(Fluted Concrete Grooves)
      const groovePitch = 8;
      for (let gx = sideBandW; gx < W - sideBandW; gx += groovePitch) {
        ctx.fillStyle = 'rgba(120, 95, 65, 0.11)';
        ctx.fillRect(gx, 0, 3, lowerStartY);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
        ctx.fillRect(gx + 3, 0, 2, lowerStartY);

        ctx.fillStyle = 'rgba(75, 50, 25, 0.16)';
        ctx.fillRect(gx, lowerStartY, 3, H - lowerStartY);
        ctx.fillStyle = 'rgba(255, 240, 210, 0.16)';
        ctx.fillRect(gx + 3, lowerStartY, 2, H - lowerStartY);

        bctx.fillStyle = '#3A3A3A';
        bctx.fillRect(gx, 0, 3, H);
        bctx.fillStyle = '#F2F2F2';
        bctx.fillRect(gx + 4, 0, groovePitch - 4, H);
      }

      // 3) 좌·우측 세로 기둥 띠
      ctx.fillStyle = '#DFD8C8';
      ctx.fillRect(0, 0, sideBandW, lowerStartY);
      ctx.fillRect(W - sideBandW, 0, sideBandW, lowerStartY);

      ctx.fillStyle = '#B3874E';
      ctx.fillRect(0, lowerStartY, sideBandW, H - lowerStartY);
      ctx.fillRect(W - sideBandW, lowerStartY, sideBandW, H - lowerStartY);

      // 4) 층마다 가로 줄눈 (1~15층)
      for (let f = 1; f < totalFloors; f++) {
        const fy = Math.round(f * floorPx);
        const isLower = fy >= lowerStartY;

        ctx.fillStyle = isLower ? '#D4B07A' : '#F6F4EE';
        ctx.fillRect(0, fy - 7, sideBandW, 14);
        ctx.fillRect(W - sideBandW, fy - 7, sideBandW, 14);

        ctx.fillStyle = isLower ? 'rgba(85, 58, 28, 0.42)' : 'rgba(130, 118, 98, 0.36)';
        ctx.fillRect(sideBandW, fy - 2, W - sideBandW * 2, 4);

        bctx.fillStyle = '#202020';
        bctx.fillRect(0, fy - 3, W, 6);
      }

      // 5) 우측 반쪽 상단(13층) & 하단(4층) '104' 동 번호 표기
      ctx.save();
      ctx.globalAlpha = 0.88;
      ctx.fillStyle = '#C59B63';
      ctx.font = '900 168px "Malgun Gothic", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('104', W * 0.72, 450);

      ctx.fillStyle = '#B88D54';
      ctx.font = '900 176px "Malgun Gothic", sans-serif';
      ctx.fillText('104', W * 0.72, 2240);
      ctx.restore();

      return {
        map: makeTex(c, 1, 1, false),
        bumpMap: makeTex(bc, 1, 1, true)
      };
    }

    // 현관 박공 캐노피 간판 ('104' 및 호수 표기)
    function createEntrancePedimentTexture() {
      const c = document.createElement('canvas');
      c.width = 512; c.height = 176;
      const ctx = c.getContext('2d');

      ctx.fillStyle = '#EFECE4';
      ctx.fillRect(0, 0, 512, 176);

      ctx.fillStyle = '#8C683A';
      ctx.font = '900 54px "Malgun Gothic", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('104', 256, 62);

      ctx.fillStyle = '#D6CEBE';
      ctx.fillRect(0, 108, 512, 6);

      ctx.fillStyle = '#A88250';
      ctx.fillRect(68, 118, 86, 46);
      ctx.fillRect(358, 118, 86, 46);

      ctx.fillStyle = '#FFFFFF';
      ctx.font = 'bold 26px "Malgun Gothic", sans-serif';
      ctx.fillText('1~2', 111, 142);
      ctx.fillText('3~4', 401, 142);

      return makeTex(c);
    }

    // =========================================================
    // 3. 재질 정의 (104동 크림 상층부 + 황토/베이지 하층부)
    // =========================================================
    const upperCreamMat = new THREE.MeshStandardMaterial({
      map: createCementTexture('#EFECE4', 6, 12),
      roughness: 0.72,
      metalness: 0.03
    });
    const lowerOchreMat = new THREE.MeshStandardMaterial({
      map: createCementTexture('#C59B63', 6, 3),
      roughness: 0.76,
      metalness: 0.04
    });
    const ochrePilasterMat = new THREE.MeshStandardMaterial({
      map: createCementTexture('#B3874E', 2, 3),
      roughness: 0.78
    });
    const creamBandMat = new THREE.MeshStandardMaterial({
      map: createCementTexture('#DFD8C8', 2, 12),
      roughness: 0.74
    });
    const darkRoofCapMat = new THREE.MeshStandardMaterial({
      color: '#3B3432',
      roughness: 0.55,
      metalness: 0.15
    });
    const greenRoofMat = new THREE.MeshStandardMaterial({
      color: '#4B6B53',
      roughness: 0.85
    });
    const windowGlassMat = new THREE.MeshStandardMaterial({
      color: '#3B6482',
      roughness: 0.18,
      metalness: 0.50
    });
    const sashFrameMat = new THREE.MeshStandardMaterial({
      color: '#333A44',
      roughness: 0.45,
      metalness: 0.30
    });
    const silverRailingMat = new THREE.MeshStandardMaterial({
      color: '#E5E7EB',
      emissive: '#475569',
      emissiveIntensity: 0.18,
      roughness: 0.24,
      metalness: 0.78
    });
    const solarPanelMat = new THREE.MeshStandardMaterial({
      color: '#1E3A8A',
      roughness: 0.22,
      metalness: 0.65
    });
    const porchCreamWallMat = new THREE.MeshStandardMaterial({
      map: createCementTexture('#EAE5D9', 2, 1),
      roughness: 0.76
    });
    const graniteStepMat = new THREE.MeshStandardMaterial({
      color: '#C7CDD6',
      roughness: 0.72
    });
    const acUnitMat = new THREE.MeshStandardMaterial({
      color: '#E5E7EB',
      roughness: 0.48,
      metalness: 0.15
    });

    const endWallTex = create104EndWallTextures();
    const endWallMat = new THREE.MeshStandardMaterial({
      map: endWallTex.map,
      bumpMap: endWallTex.bumpMap,
      bumpScale: 0.045,
      roughness: 0.72
    });

    // =========================================================
    // 4. 행당대림아파트 104동 건축 조립 (15층 · ㄴ자형 복합동)
    // =========================================================
    const floors = 15;
    const floorH = 2.85;
    const lowerFloorsH = 3 * floorH;          // 1~3층 황토/베이지 외벽: 8.55m
    const upperFloorsH = 12 * floorH;         // 4~15층 크림색 외벽: 34.20m
    const totalH = lowerFloorsH + upperFloorsH; // 총 높이: 42.75m

    const wingLen = 36.0;
    const wingD   = 12.0;

    // 1) 코너 블록 + Wing 1 + Wing 2
    const bodyBlocks = [
      { x: 6.0,   z: 6.0,   w: 12.0, d: 12.0 },
      { x: 6.0,   z: -18.0, w: 12.0, d: 36.0 },
      { x: -18.0, z: 6.0,   w: 36.0, d: 12.0 }
    ];

    bodyBlocks.forEach(b => {
      const lowerMesh = new THREE.Mesh(
        new THREE.BoxGeometry(b.w, lowerFloorsH, b.d),
        lowerOchreMat
      );
      lowerMesh.position.set(b.x, lowerFloorsH / 2, b.z);
      lowerMesh.castShadow = true;
      lowerMesh.receiveShadow = true;
      aptGroup.add(lowerMesh);

      const upperMesh = new THREE.Mesh(
        new THREE.BoxGeometry(b.w, upperFloorsH, b.d),
        upperCreamMat
      );
      upperMesh.position.set(b.x, lowerFloorsH + upperFloorsH / 2, b.z);
      upperMesh.castShadow = true;
      upperMesh.receiveShadow = true;
      aptGroup.add(upperMesh);
    });

    // 2) 옥상 녹색 방수 슬래브, 파라펫, 엘리베이터 옥탑 & 남측 날개 옥상 태양광 패널
    const roofSlabs = [
      { x: 6.0,   z: 6.0,   w: 11.4, d: 11.4 },
      { x: 6.0,   z: -18.0, w: 11.4, d: 35.4 },
      { x: -18.0, z: 6.0,   w: 35.4, d: 11.4 }
    ];
    roofSlabs.forEach(r => {
      const gSlab = new THREE.Mesh(new THREE.BoxGeometry(r.w, 0.12, r.d), greenRoofMat);
      gSlab.position.set(r.x, totalH + 0.06, r.z);
      aptGroup.add(gSlab);
    });

    const parapets = [
      { x: 0.16,   z: -18.0, w: 0.32, d: 36.0 },
      { x: 11.84,  z: -12.0, w: 0.32, d: 48.0 },
      { x: 6.0,    z: -35.84,w: 12.0, d: 0.32 },
      { x: -18.0,  z: 0.16,  w: 36.0, d: 0.32 },
      { x: -12.0,  z: 11.84, w: 48.0, d: 0.32 },
      { x: -35.84, z: 6.0,   w: 0.32, d: 12.0 }
    ];
    parapets.forEach(p => {
      const pm = new THREE.Mesh(new THREE.BoxGeometry(p.w, 0.78, p.d), upperCreamMat);
      pm.position.set(p.x, totalH + 0.39, p.z);
      aptGroup.add(pm);
    });

    // 코너 상부 엘리베이터 옥탑
    const cornerPent = new THREE.Mesh(new THREE.BoxGeometry(5.6, 4.4, 5.6), upperCreamMat);
    cornerPent.position.set(3.4, totalH + 2.2, 3.4);
    cornerPent.castShadow = true;
    addOutline(cornerPent, 0x8c7b65);
    aptGroup.add(cornerPent);

    const cornerPentCap = new THREE.Mesh(new THREE.BoxGeometry(5.9, 0.30, 5.9), darkRoofCapMat);
    cornerPentCap.position.set(3.4, totalH + 4.55, 3.4);
    aptGroup.add(cornerPentCap);

    // Wing 2(남측 날개) 옥상 태양광 발전 어레이
    for (let sx = -32.5; sx <= -4.5; sx += 2.3) {
      const panel = new THREE.Mesh(new THREE.BoxGeometry(1.85, 0.08, 4.2), solarPanelMat);
      panel.position.set(sx, totalH + 0.55, 6.2);
      panel.rotation.x = 0.32;
      panel.castShadow = true;
      aptGroup.add(panel);
    }

    // 3) InstancedMesh 수집 배열
    const frameMatrices = [];
    const glassMatrices = [];
    const railMatrices  = [];
    const acMatrices    = [];
    const balcSolarMats = [];

    const dummy = new THREE.Object3D();
    function pushBox(arr, x, y, z, sx, sy, sz, rx = 0, ry = 0) {
      dummy.position.set(x, y, z);
      dummy.rotation.set(rx, ry, 0);
      dummy.scale.set(sx, sy, sz);
      dummy.updateMatrix();
      arr.push(dummy.matrix.clone());
    }

    // 다중 창호 + 발코니 은색 난간 생성 함수
    function addWindowUnit(x, y, z, w, h, panes, normalDir, withHalfRail = false) {
      const t = 0.06;
      const m = 0.04;
      const d = 0.08;

      if (normalDir === '+Z' || normalDir === '-Z') {
        const s = normalDir === '+Z' ? 1 : -1;
        const zc = z + s * 0.01;
        pushBox(glassMatrices, x, y, zc + s * 0.005, w - t * 1.5, h - t * 1.5, 0.02);
        pushBox(frameMatrices, x, y + h / 2 - t / 2, zc, w, t, d);
        pushBox(frameMatrices, x, y - h / 2 + t / 2, zc, w, t, d);
        pushBox(frameMatrices, x - w / 2 + t / 2, y, zc, t, h, d);
        pushBox(frameMatrices, x + w / 2 - t / 2, y, zc, t, h, d);
        for (let p = 1; p < panes; p++) {
          const mx = x - w / 2 + (w / panes) * p;
          pushBox(frameMatrices, mx, y, zc, m, h - t, d);
        }

        if (withHalfRail) {
          const rz = z + s * 0.05;
          const fenceH = h * 0.50;
          const topY = y;
          const botY = y - fenceH + 0.03;
          const midY = (topY + botY) / 2;

          pushBox(railMatrices, x, topY, rz, w - 0.04, 0.045, 0.035);
          pushBox(railMatrices, x, botY, rz, w - 0.04, 0.045, 0.035);

          const bars = Math.max(8, Math.round(w / 0.22));
          const span = w - 0.12;
          for (let b = 0; b <= bars; b++) {
            const bx = x - span / 2 + (b / bars) * span;
            pushBox(railMatrices, bx, midY, rz, 0.022, fenceH - 0.03, 0.025);
          }
        }
      } else {
        const s = normalDir === '+X' ? 1 : -1;
        const xc = x + s * 0.01;
        pushBox(glassMatrices, xc + s * 0.005, y, z, 0.02, h - t * 1.5, w - t * 1.5);
        pushBox(frameMatrices, xc, y + h / 2 - t / 2, z, d, t, w);
        pushBox(frameMatrices, xc, y - h / 2 + t / 2, z, d, t, w);
        pushBox(frameMatrices, xc, y, z - w / 2 + t / 2, d, h, t);
        pushBox(frameMatrices, xc, y, z + w / 2 - t / 2, d, h, t);
        for (let p = 1; p < panes; p++) {
          const mz = z - w / 2 + (w / panes) * p;
          pushBox(frameMatrices, xc, y, mz, d, h - t, m);
        }

        if (withHalfRail) {
          const rx = x + s * 0.05;
          const fenceH = h * 0.50;
          const topY = y;
          const botY = y - fenceH + 0.03;
          const midY = (topY + botY) / 2;

          pushBox(railMatrices, rx, topY, z, 0.035, 0.045, w - 0.04);
          pushBox(railMatrices, rx, botY, z, 0.035, 0.045, w - 0.04);

          const bars = Math.max(8, Math.round(w / 0.22));
          const span = w - 0.12;
          for (let b = 0; b <= bars; b++) {
            const bz = z - span / 2 + (b / bars) * span;
            pushBox(railMatrices, rx, midY, bz, 0.025, fenceH - 0.03, 0.022);
          }
        }
      }
    }

    // ---------------------------------------------------------
    // A) Wing 1 (동측 NNW-SSE 날개) 안쪽면 (x = 0, -X향): 발코니 입면
    // ---------------------------------------------------------
    const balcWinH = 1.66;
    const wing1BalcSpecs = [
      { z: -31.8, w: 4.40, panes: 4, acOff: -1.4 },
      { z: -27.2, w: 3.30, panes: 3, acOff: +1.1 },
      { z: -20.8, w: 3.30, panes: 3, acOff: -1.1 },
      { z: -16.2, w: 4.40, panes: 4, acOff: +1.4 },
      { z: -10.8, w: 4.20, panes: 4, acOff: -1.3 },
      { z: -6.4,  w: 3.20, panes: 3, acOff: +1.0 },
      { z: -2.4,  w: 2.80, panes: 3, acOff: -0.9 }
    ];

    wing1BalcSpecs.forEach((spec, idx) => {
      for (let f = 0; f < floors; f++) {
        const wy = f * floorH + 1.50;
        addWindowUnit(0, wy, spec.z, spec.w, balcWinH, spec.panes, '-X', true);

        if ((idx + f) % 2 === 0 && f >= 1) {
          pushBox(acMatrices, -0.20, wy - 0.42, spec.z + spec.acOff, 0.32, 0.52, 0.68);
        }
        if ((idx * 3 + f) % 5 === 1 && f >= 2 && f <= 13) {
          pushBox(balcSolarMats, -0.22, wy - 0.34, spec.z - spec.acOff * 0.4, 0.06, 0.72, 1.45, 0, 0);
        }
      }
    });

    // ---------------------------------------------------------
    // B) Wing 2 (남측 WSW-ENE 날개) 바깥쪽면 (z = +12m, +Z향): 발코니 + 하단 황토 기단
    // ---------------------------------------------------------
    const wing2BalcSpecs = [
      { x: -31.8, w: 4.40, panes: 4, acOff: -1.4 },
      { x: -27.2, w: 3.30, panes: 3, acOff: +1.1 },
      { x: -20.8, w: 3.30, panes: 3, acOff: -1.1 },
      { x: -16.2, w: 4.40, panes: 4, acOff: +1.4 },
      { x: -10.2, w: 4.20, panes: 4, acOff: -1.3 },
      { x: -5.6,  w: 3.30, panes: 3, acOff: +1.1 },
      { x: +1.2,  w: 3.30, panes: 3, acOff: -1.1 },
      { x: +6.2,  w: 4.40, panes: 4, acOff: +1.4 }
    ];

    wing2BalcSpecs.forEach((spec, idx) => {
      for (let f = 0; f < floors; f++) {
        const wy = f * floorH + 1.50;
        addWindowUnit(spec.x, wy, wingD, spec.w, balcWinH, spec.panes, '+Z', true);

        if ((idx + f) % 2 === 0 && f >= 1) {
          pushBox(acMatrices, spec.x + spec.acOff, wy - 0.42, wingD + 0.20, 0.68, 0.52, 0.32);
        }
        if ((idx * 2 + f) % 5 === 2 && f >= 2 && f <= 13) {
          pushBox(balcSolarMats, spec.x - spec.acOff * 0.4, wy - 0.34, wingD + 0.22, 1.45, 0.72, 0.06);
        }
      }
    });

    // 남측 외벽 하단 황토 기단부 수직 필라스터 기둥 돌출
    for (let px = -35.2; px <= 11.2; px += 5.8) {
      const pilaster = new THREE.Mesh(
        new THREE.BoxGeometry(0.65, lowerFloorsH + 0.4, 0.38),
        ochrePilasterMat
      );
      pilaster.position.set(px, (lowerFloorsH + 0.4) / 2, wingD + 0.18);
      pilaster.castShadow = true;
      aptGroup.add(pilaster);
    }

    // ---------------------------------------------------------
    // C) 복도식 연속 수평 창호 (Wing 2 안쪽면 z = 0, -Z향 & Wing 1 바깥쪽면 x = +12m, +X향)
    // ---------------------------------------------------------
    const corrWinH = 1.26;
    const corrModW = 1.68;

    // Wing 2 안쪽면 (z = 0, x: -34.8 ~ -1.2)
    for (let f = 0; f < floors; f++) {
      const wy = f * floorH + 1.56;
      for (let cx = -34.2; cx <= -1.8; cx += corrModW) {
        if (f === 0 && cx > -5.6 && cx < -2.0) continue;
        addWindowUnit(cx, wy, 0, corrModW - 0.14, corrWinH, 2, '-Z', false);
      }
    }

    // Wing 1 바깥쪽면 (x = +12m, z: -34.8 ~ +10.2)
    for (let f = 0; f < floors; f++) {
      const wy = f * floorH + 1.56;
      for (let cz = -34.2; cz <= 9.8; cz += corrModW) {
        addWindowUnit(wingD, wy, cz, corrModW - 0.14, corrWinH, 2, '+X', false);
      }
    }

    // ---------------------------------------------------------
    // D) 코너부 1층 '104' 박공 현관 포치 + 5단 계단 + 평행 휠체어 경사로
    // ---------------------------------------------------------
    function buildCornerEntrance() {
      const porchGroup = new THREE.Group();
      const cx = -3.80;
      const porchW = 3.25;
      const porchD = 2.25;
      const deckH = 0.85;
      const colH = 2.65;

      // 1) 현관 상부 데크
      const deck = new THREE.Mesh(
        new THREE.BoxGeometry(porchW, deckH, porchD),
        porchCreamWallMat
      );
      deck.position.set(cx, deckH / 2, -porchD / 2);
      deck.castShadow = true;
      deck.receiveShadow = true;
      addOutline(deck);
      porchGroup.add(deck);

      // 2) 좌·우 원형 기둥 2개
      [-porchW / 2 + 0.22, porchW / 2 - 0.22].forEach(dx => {
        const col = new THREE.Mesh(
          new THREE.CylinderGeometry(0.18, 0.20, colH, 18),
          lowerOchreMat
        );
        col.position.set(cx + dx, deckH + colH / 2, -porchD + 0.24);
        col.castShadow = true;
        porchGroup.add(col);
      });

      // 3) 삼각 박공 지붕 & '104' 페디먼트 간판
      const eaveY = deckH + colH;
      const peakH = 0.78;
      const roofShape = new THREE.Shape();
      roofShape.moveTo(-porchW / 2 - 0.24, 0);
      roofShape.lineTo(0, peakH);
      roofShape.lineTo(porchW / 2 + 0.24, 0);
      roofShape.lineTo(-porchW / 2 - 0.24, 0);

      const gableGeo = new THREE.ExtrudeGeometry(roofShape, {
        depth: porchD + 0.18,
        bevelEnabled: false
      });
      const gableMesh = new THREE.Mesh(gableGeo, darkRoofCapMat);
      gableMesh.position.set(cx, eaveY, -porchD - 0.18);
      gableMesh.castShadow = true;
      porchGroup.add(gableMesh);

      const signTex = createEntrancePedimentTexture();
      const signPlane = new THREE.Mesh(
        new THREE.PlaneGeometry(porchW - 0.10, 0.74),
        new THREE.MeshStandardMaterial({ map: signTex, roughness: 0.45 })
      );
      signPlane.rotation.y = Math.PI;
      signPlane.position.set(cx, eaveY + 0.04, -porchD - 0.19);
      porchGroup.add(signPlane);

      // 4) 유리 자동문
      const doorFrame = new THREE.Mesh(new THREE.BoxGeometry(2.45, 2.45, 0.12), sashFrameMat);
      doorFrame.position.set(cx, deckH + 1.225, -0.05);
      porchGroup.add(doorFrame);

      const glassDoor = new THREE.Mesh(
        new THREE.PlaneGeometry(2.26, 2.26),
        new THREE.MeshPhysicalMaterial({
          color: '#BAE6FD', transparent: true, opacity: 0.34, roughness: 0.1, depthWrite: false
        })
      );
      glassDoor.rotation.y = Math.PI;
      glassDoor.position.set(cx, deckH + 1.18, -0.12);
      porchGroup.add(glassDoor);

      // 5) 현관 앞 정면 5단 계단 (-Z 방향)
      const stepCount = 5;
      const stairW = porchW - 0.44;
      const stepD = 0.32;
      const stepRise = deckH / stepCount;
      for (let s = 0; s < stepCount; s++) {
        const topY = deckH - s * stepRise;
        const zPos = -porchD - (s + 0.5) * stepD;
        const tread = new THREE.Mesh(
          new THREE.BoxGeometry(stairW, topY, stepD + 0.02),
          graniteStepMat
        );
        tread.position.set(cx, topY / 2, zPos);
        tread.castShadow = true;
        tread.receiveShadow = true;
        addOutline(tread, 0x64748b);
        porchGroup.add(tread);
      }

      // 6) 우측(서측 -X 방향) 벽면을 따라 내려가는 휠체어·유모차 경사로
      const rampStartX = cx - porchW / 2;
      const rampEndX   = cx - 10.2;
      const rampW      = Math.abs(rampEndX - rampStartX);
      const rampD      = 1.45;

      const rampShape = new THREE.Shape();
      rampShape.moveTo(0, 0);
      rampShape.lineTo(rampW, 0);
      rampShape.lineTo(rampW, deckH);
      rampShape.lineTo(0, 0.06);
      rampShape.closePath();

      const rampGeo = new THREE.ExtrudeGeometry(rampShape, { depth: rampD, bevelEnabled: false });
      const rampMesh = new THREE.Mesh(rampGeo, porchCreamWallMat);
      rampMesh.position.set(rampEndX, 0, -rampD);
      rampMesh.castShadow = true;
      rampMesh.receiveShadow = true;
      addOutline(rampMesh);
      porchGroup.add(rampMesh);

      // 경사로 난간 핸드레일
      const slopeLen = Math.hypot(rampW, deckH - 0.06);
      const slopeAng = Math.atan2(deckH - 0.06, rampW);
      [0.45, 0.78].forEach(hOff => {
        const rail = new THREE.Mesh(
          new THREE.CylinderGeometry(0.024, 0.024, slopeLen, 10),
          sashFrameMat
        );
        rail.rotation.z = -Math.PI / 2 + slopeAng;
        rail.position.set((rampStartX + rampEndX) / 2, (deckH + 0.06) / 2 + hOff, -rampD + 0.08);
        porchGroup.add(rail);
      });
      for (let i = 0; i <= 6; i++) {
        const t = i / 6;
        const px = rampEndX + t * rampW;
        const py = 0.06 + t * (deckH - 0.06);
        const post = new THREE.Mesh(
          new THREE.CylinderGeometry(0.02, 0.02, 0.80, 8),
          sashFrameMat
        );
        post.position.set(px, py + 0.40, -rampD + 0.08);
        porchGroup.add(post);
      }

      aptGroup.add(porchGroup);
    }
    buildCornerEntrance();

    // ---------------------------------------------------------
    // E) 두 자유단 측벽 (북북서 z = -36m & 남서서 x = -36m)
    // ---------------------------------------------------------
    function buildEndWallWithStairSlots(wallPos, rotationY, leftSideSign) {
      const endGroup = new THREE.Group();
      endGroup.position.copy(wallPos);
      endGroup.rotation.y = rotationY;

      // 1) 측벽 본면 ('104' 상·하단 표기 + 투톤 + 세로 음각 홈)
      const plane = new THREE.Mesh(new THREE.PlaneGeometry(wingD, totalH), endWallMat);
      plane.position.set(0, totalH / 2, 0.01);
      plane.receiveShadow = true;
      endGroup.add(plane);

      // 2) 중앙 수직 선홈통(Downspout Pipe)
      const pipe = new THREE.Mesh(
        new THREE.CylinderGeometry(0.09, 0.09, totalH, 10),
        creamBandMat
      );
      pipe.position.set(-0.2, totalH / 2, 0.10);
      endGroup.add(pipe);

      // 3) 좌측 수직 계단실 환기 개구부 열
      const slotX = leftSideSign * 3.85;
      for (let f = 1; f < floors; f++) {
        const sy = f * floorH + 1.45;
        const recess = new THREE.Mesh(
          new THREE.BoxGeometry(1.45, 1.35, 0.25),
          sashFrameMat
        );
        recess.position.set(slotX, sy, -0.05);
        endGroup.add(recess);

        const louver = new THREE.Mesh(
          new THREE.BoxGeometry(1.48, 0.35, 0.12),
          f < 3 ? lowerOchreMat : upperCreamMat
        );
        louver.position.set(slotX, sy - 0.48, 0.06);
        endGroup.add(louver);
      }

      aptGroup.add(endGroup);
    }

    buildEndWallWithStairSlots(new THREE.Vector3(6.0, 0, -wingLen), Math.PI, -1);
    buildEndWallWithStairSlots(new THREE.Vector3(-wingLen, 0, 6.0), -Math.PI / 2, -1);

    // ---------------------------------------------------------
    // F) InstancedMesh 일괄 렌더링
    // ---------------------------------------------------------
    function buildInstanced(matrices, geo, mat) {
      const mesh = new THREE.InstancedMesh(geo, mat, matrices.length);
      matrices.forEach((m, i) => mesh.setMatrixAt(i, m));
      mesh.instanceMatrix.needsUpdate = true;
      aptGroup.add(mesh);
      return mesh;
    }

    const unitBoxGeo = new THREE.BoxGeometry(1, 1, 1);
    buildInstanced(frameMatrices, unitBoxGeo, sashFrameMat);
    buildInstanced(glassMatrices, unitBoxGeo, windowGlassMat);
    buildInstanced(railMatrices,  unitBoxGeo, silverRailingMat);
    buildInstanced(acMatrices,    unitBoxGeo, acUnitMat);
    buildInstanced(balcSolarMats, unitBoxGeo, solarPanelMat);

    // ---------------------------------------------------------
    // G) 건물 외곽 주변 조경수 배치 (가운데 마당/정자 및 하단 지하주차장 구조물 제외)
    // ---------------------------------------------------------
    function addTree(x, z, scale = 1.0, isPine = false) {
      const g = new THREE.Group();
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.14 * scale, 0.22 * scale, 2.3 * scale, 8),
        new THREE.MeshStandardMaterial({ color: '#4A3728', roughness: 0.9 })
      );
      trunk.position.y = 1.15 * scale;
      trunk.castShadow = true;
      g.add(trunk);

      const leafMat = new THREE.MeshStandardMaterial({
        color: isPine ? '#1E4620' : '#3B6E35',
        roughness: 0.85
      });
      const blobs = isPine
        ? [[0, 3.0, 0, 1.35], [-0.7, 2.4, 0.3, 0.95], [0.7, 2.6, -0.2, 1.0], [0, 3.8, 0, 0.9]]
        : [[0, 3.3, 0, 1.7], [-0.9, 2.8, 0.5, 1.25], [0.9, 2.9, -0.4, 1.3], [0.2, 4.2, 0.2, 1.2]];

      blobs.forEach(([bx, by, bz, r]) => {
        const crown = new THREE.Mesh(new THREE.DodecahedronGeometry(r * scale, 1), leafMat);
        crown.position.set(bx * scale, by * scale, bz * scale);
        crown.castShadow = true;
        g.add(crown);
      });

      g.position.set(x, 0.0, z);
      aptGroup.add(g);
    }

    [
      [-2.2, -9.0], [-2.2, -16.5], [-2.2, -24.0], [-2.2, -31.5],
      [-13.5, -2.2], [-21.0, -2.2], [-28.5, -2.2],
      [-32.0, 14.5], [-22.0, 14.5], [-12.0, 14.5], [-2.0, 14.5], [8.0, 14.5],
      [14.5, -28.0], [14.5, -18.0], [14.5, -8.0], [14.5, 2.0]
    ].forEach(([tx, tz], i) => {
      addTree(tx, tz, 1.15 + (i % 3) * 0.15, i % 2 === 0);
    });

    // 5. GLB 3D 파일 추출 기능
    window.exportGLB = () => {
      const exporter = new GLTFExporter();
      exporter.parse(
        aptGroup,
        (result) => {
          const blob = new Blob([result], { type: 'model/gltf-binary' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = 'Haengdang_Daelim_104_L_Shape.glb';
          link.click();
          URL.revokeObjectURL(url);
        },
        (err) => console.error('GLB 추출 오류:', err),
        { binary: true }
      );
    };

    // 6. 렌더링 루프
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
