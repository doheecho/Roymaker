<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>금호로 143~149 4개 상가 통합 3D 모델링 & GLB 추출 (지하 1층 · 보도 제외)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #A7C7E7;
      font-family: 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', -apple-system, sans-serif;
      color: #f8fafc;
      user-select: none;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      position: relative;
    }

    .hud-panel {
      position: absolute;
      background: rgba(15, 20, 28, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.34);
      z-index: 10;
    }

    #info {
      top: 14px;
      left: 16px;
      padding: 12px 16px;
      max-width: min(540px, calc(100vw - 32px));
      pointer-events: none;
    }

    #info h1 {
      font-size: 13.8px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 5px;
    }

    #info .badge {
      font-size: 10.5px;
      font-weight: 700;
      background: rgba(245, 158, 11, 0.25);
      color: #fde68a;
      border: 1px solid rgba(251, 191, 36, 0.60);
      padding: 1px 7px;
      border-radius: 999px;
    }

    #info p {
      font-size: 11.6px;
      color: #cbd5e1;
      line-height: 1.52;
    }

    #info .compass {
      margin-top: 4px;
      font-size: 11px;
      color: #93c5fd;
      font-weight: 600;
    }

    #options-panel {
      top: 14px;
      right: 16px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 248px;
      max-height: calc(100vh - 130px);
      overflow-y: auto;
    }

    .options-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2px;
    }

    .options-title {
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .collapse-btn {
      background: rgba(51, 65, 85, 0.72);
      color: #cbd5e1;
      border: 1px solid rgba(148, 163, 184, 0.28);
      border-radius: 6px;
      padding: 2px 7px;
      font-size: 10.5px;
      cursor: pointer;
      font-family: inherit;
    }

    .collapse-btn:hover {
      background: rgba(71, 85, 105, 0.92);
      color: #ffffff;
    }

    #options-body {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    #options-body.collapsed {
      display: none;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;

      padding: 2px 0;
    }

    .toggle-row input[type="checkbox"] {
      width: 15px;

      accent-color: #f59e0b;

      flex-shrink: 0;
    }

    .toggle-row .dot {

    }

    .panel-divider {

    #mesh-stats {
      font-size: 11.2px;

    #mesh-stats strong {

    #controls-ui {
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);

      display: flex;
      flex-wrap: wrap;

    .cam-btn {
      background: rgba(51, 65, 85, 0.84);
      color: #f1f5f9;
      border: 1px solid rgba(148, 163, 184, 0.30);

    .cam-btn:hover {

    .cam-btn.active {
      background: #2563eb;

    }

    .bar-divider {
      width: 1px;

    }

    .export-btn {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #ffffff;
      border: 1px solid rgba(254, 240, 138, 0.80);
      padding: 6px 13px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 11.8px;
      font-family: inherit;
      font-weight: 700;
      display: inline-flex;
      align-items: center;

      white-space: nowrap;

    .export-btn:hover {
      background: linear-gradient(135deg, #fbbf24, #ea580c);
      transform: translateY(-1px);
      box-shadow: 0 5px 16px rgba(245, 158, 11, 0.58);

    .export-btn:disabled {

    #toast {
      position: absolute;

    #toast.show {

    @media (max-width: 920px) {

      #info p, #info .compass { font-size: 10.3px; }
      #options-panel {
        top: 10px;

      .toggle-row { font-size: 11px; }
      .bar-divider { display: none; }
      #controls-ui {

      .cam-btn, .export-btn {

  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",

</head>
<body>
  <div id="canvas-container"></div>

  <div id="info" class="hud-panel">
    <h1>
      금호로 143~149 4개 상가 통합 3D 모델링
      <span class="badge">1F Y=0 · 지하1층 · 보도제외</span>
    </h1>
    <p>좌클릭 드래그: 회전 &nbsp;|&nbsp; 우클릭 드래그: 이동 &nbsp;|&nbsp; 휠: 확대·축소</p>
    <div class="compass">북: -Z &nbsp;/&nbsp; 동: +X &nbsp;/&nbsp; 남: +Z &nbsp;/&nbsp; 서: -X &nbsp;|&nbsp; 1F Y=0.0m / B1 Y=-3.6m</div>
  </div>

  <div id="options-panel" class="hud-panel">
    <div class="options-header">
      <div class="options-title">표시 및 추출 설정</div>
      <button class="collapse-btn" id="btn-collapse">접기</button>
    </div>
    <div id="options-body">
      <label class="toggle-row">
        <input type="checkbox" id="chk-b1" checked />
        <span class="dot" style="background:#e05a5a;"></span>
        <span>B1. 143 마라순코우·KEY</span>
      </label>
      <label class="toggle-row">
        <input type="checkbox" id="chk-b2" checked />
        <span class="dot" style="background:#2c4b8e;"></span>
        <span>B2. 145 피자스쿨·EGA</span>
      </label>
      <label class="toggle-row">
        <input type="checkbox" id="chk-b3" checked />
        <span class="dot" style="background:#5a959a;"></span>
        <span>B3. 147 금호정형외과</span>
      </label>
      <label class="toggle-row">
        <input type="checkbox" id="chk-b4" checked />
        <span class="dot" style="background:#8ec686;"></span>
        <span>B4. 149 SKT·이훈헤어</span>
      </label>

      <div class="panel-divider"></div>

      <label class="toggle-row">
        <input type="checkbox" id="chk-outlines" />

      </label>

      <div class="panel-divider"></div>
      <div id="mesh-stats">메시 집계 중...</div>

  </div>

  <div id="toast">GLB 파일 생성 중...</div>

  <div id="controls-ui" class="hud-panel">
    <button class="cam-btn" data-view="top">1. 스카이뷰 (Top)</button>
    <button class="cam-btn" data-view="east">2. 동측 (143 코너)</button>
    <button class="cam-btn" data-view="ne1">3. 북동1 (143·145)</button>
    <button class="cam-btn" data-view="ne2">4. 북동2 (145 피자스쿨)</button>
    <button class="cam-btn active" data-view="ne3">5. 북동3 (147 정형외과)</button>
    <button class="cam-btn" data-view="ne4">6. 북동4 (147·골목)</button>
    <button class="cam-btn" data-view="ne5">7. 북동5 (149 SKT)</button>
    <button class="cam-btn" data-view="north">8. 북측 (전체 조망)</button>
    <div class="bar-divider"></div>
    <button class="export-btn" id="btn-export-glb">
      <span>⬇</span> 4개 건물 추출 (.glb)
    </button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
    import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

    // =========================================================================
    // 1. 씬, 카메라, 렌더러 & 무그림자 5-Point 주간 건축 조명 설정
    // =========================================================================
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#A7C7E7');
    scene.fog = new THREE.Fog('#A7C7E7', 95, 260);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.15, 600);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      logarithmicDepthBuffer: true,
      powerPreference: 'high-performance'
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = false;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.068;
    // 지하 1층(Y = -3.60m ~ 0.00m) 외벽까지 아래에서 올려다볼 수 있도록 허용
    controls.maxPolarAngle = Math.PI * 0.85;
    controls.minDistance = 5;
    controls.maxDistance = 175;

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
    scene.add(ambientLight);

    const hemiLight = new THREE.HemisphereLight(0xeef6ff, 0x8b929c, 0.72);
    hemiLight.position.set(0, 70, 0);
    scene.add(hemiLight);

    const neKeyLight = new THREE.DirectionalLight(0xfffaf0, 1.05);
    neKeyLight.position.set(42, 54, -44);
    scene.add(neKeyLight);

    const swFillLight = new THREE.DirectionalLight(0xe4f0fc, 0.72);
    swFillLight.position.set(-44, 38, 42);
    scene.add(swFillLight);

    const nwRimLight = new THREE.DirectionalLight(0xfcf6ee, 0.45);
    nwRimLight.position.set(-46, 30, -34);
    scene.add(nwRimLight);

    // =========================================================================
    // 2. 최상위 클러스터 계층 구조 (지상 1층 Y = 0.00m, 지하 1층 Y = -3.60m ~ 0.00m)
    // =========================================================================
    const CLUSTER_ROT_Y = THREE.MathUtils.degToRad(-42);
    const BASEMENT_1F_H = 3.60;

    const clusterGroup = new THREE.Group();
    clusterGroup.name = 'Geumho_143_149_4Buildings_Cluster';
    clusterGroup.rotation.y = CLUSTER_ROT_Y;
    scene.add(clusterGroup);

    const b1Group = new THREE.Group(); b1Group.name = 'B1_143_KeyEnglish_Malasunkou';
    const b2Group = new THREE.Group(); b2Group.name = 'B2_145_PizzaSchool_EGA_ESP';
    const b3Group = new THREE.Group(); b3Group.name = 'B3_147_GeumhoOrthopedics';
    const b4Group = new THREE.Group(); b4Group.name = 'B4_149_SKT_LeehoonHair';

    clusterGroup.add(b1Group, b2Group, b3Group, b4Group);

    const outlineGroup = new THREE.Group();
    outlineGroup.name = 'Architectural_Outlines';
    outlineGroup.rotation.y = CLUSTER_ROT_Y;
    outlineGroup.visible = false;
    scene.add(outlineGroup);

    function toWorld(lx, ly, lz) {
      return new THREE.Vector3(lx, ly, lz).applyAxisAngle(new THREE.Vector3(0, 1, 0), CLUSTER_ROT_Y);
    }

    // =========================================================================
    // 3. 웹폰트 로드 대기, PRNG, 평면 UV, 윤곽선, 토스트, GLB 호환 GeometryBatcher
    // =========================================================================
    const dynamicSignRegistry = [];

    async function waitForKoreanFonts(timeoutMs = 1500) {
      if (!document.fonts) return;
      const specs = [
        '700 48px "Noto Sans KR"',
        '900 48px "Noto Sans KR"',
        '400 48px "Do Hyeon"',
        '400 48px "Black Han Sans"',
        '700 48px "Gowun Batang"'
      ];
      try {
        await Promise.race([
          Promise.all([
            ...specs.map((f) => document.fonts.load(f).catch(() => {})),
            document.fonts.ready
          ]),
          new Promise((resolve) => setTimeout(resolve, timeoutMs))
        ]);
      } catch (_) {}
    }

    function registerDynamicSign(canvas, tex, drawFn) {
      dynamicSignRegistry.push({ canvas, tex, drawFn });
      drawFn(canvas.getContext('2d'), canvas.width, canvas.height);
      tex.needsUpdate = true;
      return tex;
    }

    function redrawAllDynamicSigns() {
      for (const entry of dynamicSignRegistry) {
        const ctx = entry.canvas.getContext('2d');
        ctx.clearRect(0, 0, entry.canvas.width, entry.canvas.height);
        entry.drawFn(ctx, entry.canvas.width, entry.canvas.height);
        entry.tex.needsUpdate = true;
      }
    }

    function mulberry32(seed) {
      let a = seed >>> 0;
      return function () {
        a |= 0;
        a = (a + 0x6d2b79f5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    let toastTimer = null;
    function showToast(msg, duration = 2900) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), duration);
    }

    function applyWorldPlanarUVs(geometry, scaleU = 0.35, scaleV = 0.35) {
      geometry.computeVertexNormals();
      const pos = geometry.attributes.position;
      const norm = geometry.attributes.normal;
      const uv = geometry.attributes.uv;
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
        const nx = Math.abs(norm.getX(i)), ny = Math.abs(norm.getY(i)), nz = Math.abs(norm.getZ(i));
        if (ny >= nx && ny >= nz) uv.setXY(i, x * scaleU, z * scaleV);
        else if (nx >= nz) uv.setXY(i, z * scaleU, y * scaleV);
        else uv.setXY(i, x * scaleU, y * scaleV);
      }
      uv.needsUpdate = true;
    }

    function addOutlineForMesh(mesh, color = 0x1e293b, threshold = 28, opacity = 0.45) {
      const edges = new THREE.EdgesGeometry(mesh.geometry, threshold);
      const line = new THREE.LineSegments(
        edges,
        new THREE.LineBasicMaterial({ color, transparent: opacity < 1, opacity })
      );
      line.position.copy(mesh.position);
      line.rotation.copy(mesh.rotation);
      line.scale.copy(mesh.scale);
      outlineGroup.add(line);
      return line;
    }

    class GeometryBatcher {
      constructor() {
        this.buckets = new Map();
        this.baseBox = new THREE.BoxGeometry(1, 1, 1).toNonIndexed();
        this.baseCyl = new THREE.CylinderGeometry(0.5, 0.5, 1, 14).toNonIndexed();
        this.baseCone = new THREE.ConeGeometry(0.5, 1, 12).toNonIndexed();
        this._mat4 = new THREE.Matrix4();
        this._pos = new THREE.Vector3();
        this._quat = new THREE.Quaternion();
        this._euler = new THREE.Euler();
        this._scale = new THREE.Vector3();
      }

      _ensure(key, material) {
        if (!this.buckets.has(key)) {
          this.buckets.set(key, { material, geoms: [] });
        }
        return this.buckets.get(key);
      }

      _normalize(srcGeom) {
        const g = srcGeom.index ? srcGeom.toNonIndexed() : srcGeom.clone();
        if (!g.attributes.normal) g.computeVertexNormals();
        if (!g.attributes.uv) {
          const count = g.attributes.position.count;
          g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(count * 2), 2));
        }
        for (const attr of Object.keys(g.attributes)) {
          if (attr !== 'position' && attr !== 'normal' && attr !== 'uv') {
            g.deleteAttribute(attr);
          }
        }
        return g;
      }

      addGeometry(key, material, geometry, matrix = null) {
        const g = this._normalize(geometry);
        if (matrix) g.applyMatrix4(matrix);
        this._ensure(key, material).geoms.push(g);
      }

      addBox(key, material, x, y, z, sx, sy, sz, rx = 0, ry = 0, rz = 0, worldUV = 0) {
        const g = this.baseBox.clone();
        this._pos.set(x, y, z);
        this._euler.set(rx, ry, rz);
        this._quat.setFromEuler(this._euler);
        this._scale.set(sx, sy, sz);
        this._mat4.compose(this._pos, this._quat, this._scale);
        g.applyMatrix4(this._mat4);
        if (worldUV > 0) applyWorldPlanarUVs(g, worldUV, worldUV);
        this._ensure(key, material).geoms.push(g);
      }

      addCylinder(key, material, x, y, z, diameter, length, rx = 0, ry = 0, rz = 0) {
        const g = this.baseCyl.clone();
        this._pos.set(x, y, z);
        this._euler.set(rx, ry, rz);
        this._quat.setFromEuler(this._euler);
        this._scale.set(diameter, length, diameter);
        this._mat4.compose(this._pos, this._quat, this._scale);
        g.applyMatrix4(this._mat4);
        this._ensure(key, material).geoms.push(g);
      }

      addCone(key, material, x, y, z, diameter, height) {
        const g = this.baseCone.clone();
        this._pos.set(x, y, z);
        this._euler.set(0, 0, 0);
        this._quat.setFromEuler(this._euler);
        this._scale.set(diameter, height, diameter);
        this._mat4.compose(this._pos, this._quat, this._scale);
        g.applyMatrix4(this._mat4);
        this._ensure(key, material).geoms.push(g);
      }

      buildAll(parentGroup) {
        const created = [];
        for (const [key, { material, geoms }] of this.buckets.entries()) {
          if (!geoms.length) continue;
          const merged = mergeGeometries(geoms, false);
          geoms.forEach((g) => g.dispose());
          geoms.length = 0;
          if (!merged) continue;
          const mesh = new THREE.Mesh(merged, material);
          mesh.name = `Merged_${key}`;
          parentGroup.add(mesh);
          created.push(mesh);
        }
        this.buckets.clear();
        return created;
      }

      disposeBases() {
        this.baseBox.dispose();
        this.baseCyl.dispose();
        this.baseCone.dispose();
      }
    }

    // =========================================================================
    // 4. 프로시저럴 고해상도 캔버스 텍스처 생성기
    // =========================================================================
    function makeTex(canvas, rx = 1, ry = 1, isLinear = false) {
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = isLinear ? THREE.NoColorSpace : THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      if (rx !== 1 || ry !== 1) {
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;

        for (let col = 0; col < cols; col++) {
          const d = (rand() - 0.5) * 10;

          ctx.fillStyle = `rgb(${R},${G},${B})`;

          bctx.fillStyle = `rgb(${bv},${bv},${bv})`;

    function createMedicalStripGlassTex(crossCount = 5) {
      const W = 1280, H = 256;
      const c = document.createElement('canvas');
      c.width = W; c.height = H;
      const ctx = c.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, '#5A8CA0');
      grad.addColorStop(0.5, '#437388');
      grad.addColorStop(1, '#2F5568');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = 'rgba(224, 242, 254, 0.16)';
      for (let x = 40; x < W; x += 260) {
        ctx.beginPath();
        ctx.moveTo(x, 0); ctx.lineTo(x + 95, 0); ctx.lineTo(x + 20, H); ctx.lineTo(x - 75, H);
        ctx.closePath(); ctx.fill();
      }

      const segW = W / crossCount;
      for (let i = 0; i < crossCount; i++) {
        const cx = segW * (i + 0.5);
        const cy = H * 0.54;
        ctx.strokeStyle = 'rgba(241, 245, 249, 0.48)';
        ctx.lineWidth = 6;
        ctx.beginPath(); ctx.arc(cx, cy, 48, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = 'rgba(241, 245, 249, 0.72)';
        ctx.fillRect(cx - 24, cy - 8, 48, 16);
        ctx.fillRect(cx - 8, cy - 24, 16, 48);

        if (i > 0) {
          ctx.fillStyle = '#263038';
          ctx.fillRect(i * segW - 4, 0, 8, H);
        }
      }
      return makeTex(c, 1, 1, false);
    }

    // 10. 실시간 병합 메시 수 & 총 삼각형 수 통계
    // =========================================================================
    function updateMeshStats() {
      let meshCount = 0;
      let triCount = 0;

      const tally = (grp) => {
        if (!grp.visible) return;
        grp.traverse((obj) => {
          if (obj.isMesh && obj.geometry) {
            meshCount++;
            const g = obj.geometry;
            if (g.index) triCount += g.index.count / 3;
            else if (g.attributes.position) triCount += g.attributes.position.count / 3;
          }
        });
      };

      [b1Group, b2Group, b3Group, b4Group].forEach(tally);

      document.getElementById('mesh-stats').innerHTML =
        `병합 메시 수: <strong>${meshCount.toLocaleString()}</strong>개<br/>` +
        `총 삼각형 수: <strong>${Math.round(triCount).toLocaleString()}</strong> tris`;
    }

      top:   { pos: new THREE.Vector3(skyCenterW.x, 78.0, skyCenterW.z + 0.18), target: skyCenterW.clone() },
      east:  { pos: toWorld( 36.5,  4.4, -13.5), target: toWorld( 17.5,  7.4,  2.5) },
      ne1:   { pos: toWorld( 21.8,  4.4, -18.5), target: toWorld( 15.8,  6.8,  1.0) },

      north: { pos: toWorld(-37.0,  5.0, -14.8), target: toWorld(-11.5,  6.4,  2.0) }
    };

    let camAnim = null;

    function setView(viewKey, instant = false) {
      const preset = cameraPresets[viewKey];
      if (!preset) return;

      document.querySelectorAll('.cam-btn').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.view === viewKey);
      });

      if (instant) {
        camAnim = null;
        camera.position.copy(preset.pos);
        controls.target.copy(preset.target);
        controls.update();
        return;
      }

      camAnim = {
        startPos: camera.position.clone(),
        endPos: preset.pos.clone(),
        startTarget: controls.target.clone(),
        endTarget: preset.target.clone(),
        progress: 0,
        duration: 0.65
      };
    }

    document.querySelectorAll('.cam-btn').forEach((btn) => {
      btn.addEventListener('click', () => setView(btn.dataset.view, false));
    });

    controls.addEventListener('start', () => {
      camAnim = null;
    });

    // =========================================================================
    // 12. UI 토글 & 비파괴 GLB 3D 추출 (`Geumho_143_149_4Buildings_v2.glb`)
    // =========================================================================
    const chkB1 = document.getElementById('chk-b1');
    const chkB2 = document.getElementById('chk-b2');
    const chkB3 = document.getElementById('chk-b3');
    const chkB4 = document.getElementById('chk-b4');
    const chkOutlines = document.getElementById('chk-outlines');
    const exportBtn = document.getElementById('btn-export-glb');

    chkB1.addEventListener('change', (e) => { b1Group.visible = e.target.checked; updateMeshStats(); });
    chkB2.addEventListener('change', (e) => { b2Group.visible = e.target.checked; updateMeshStats(); });
    chkB3.addEventListener('change', (e) => { b3Group.visible = e.target.checked; updateMeshStats(); });
    chkB4.addEventListener('change', (e) => { b4Group.visible = e.target.checked; updateMeshStats(); });
    chkOutlines.addEventListener('change', (e) => { outlineGroup.visible = e.target.checked; });

    const btnCollapse = document.getElementById('btn-collapse');
    const optionsBody = document.getElementById('options-body');
    btnCollapse.addEventListener('click', () => {
      const collapsed = optionsBody.classList.toggle('collapsed');
      btnCollapse.textContent = collapsed ? '펼치기' : '접기';
    });

    function exportGLB() {
      const hasAnyBuilding = b1Group.visible || b2Group.visible || b3Group.visible || b4Group.visible;

      if (!hasAnyBuilding) {
        showToast('추출할 건물을 1개 이상 선택해주세요.', 2800);
        return;
      }

      exportBtn.disabled = true;
      showToast('금호로 143~149 4개 상가 통합 GLB(지하 1층 포함)를 생성하고 있습니다...', 4500);

      try {
        const exporter = new GLTFExporter();
        exporter.parse(
          clusterGroup,
          (result) => {
            const blob = new Blob([result], { type: 'model/gltf-binary' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'Geumho_143_149_4Buildings_v2.glb';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            setTimeout(() => URL.revokeObjectURL(url), 1200);

            const sizeMB = (blob.size / (1024 * 1024)).toFixed(2);
            showToast(`추출 완료! Geumho_143_149_4Buildings_v2.glb (${sizeMB} MB)`, 3600);
            exportBtn.disabled = false;
          },
          (err) => {
            console.error('GLB 추출 오류:', err);
            showToast('GLB 추출 중 오류가 발생했습니다. 콘솔을 확인해주세요.', 3500);
            exportBtn.disabled = false;
          },
          {
            binary: true,
            onlyVisible: true
          }
        );
      } catch (err) {
        console.error('GLB 추출 예외:', err);
        showToast('GLB 추출을 시작할 수 없습니다.', 3200);
        exportBtn.disabled = false;
      }
    }

    exportBtn.addEventListener('click', exportGLB);

    // =========================================================================
    // 13. 초기화 (웹폰트 로드 대기 -> 건축 조립 -> 렌더링 루프 시작)
    // =========================================================================
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.1);

      if (camAnim) {
        camAnim.progress += dt / camAnim.duration;
        const t = Math.min(1, camAnim.progress);
        const ease = 1 - Math.pow(1 - t, 3);
        camera.position.lerpVectors(camAnim.startPos, camAnim.endPos, ease);
        controls.target.lerpVectors(camAnim.startTarget, camAnim.endTarget, ease);
        if (t >= 1) camAnim = null;
      }

      controls.update();
      renderer.render(scene, camera);
    }

    async function initApp() {
      await waitForKoreanFonts(1500);

      buildBuilding1();
      buildBuilding2();
      buildBuilding3();
      buildBuilding4();
      updateMeshStats();

      // 초기 시점: 5. 북동3 (147 정형외과)
      setView('ne3', true);

      if (document.fonts && typeof document.fonts.addEventListener === 'function') {
        document.fonts.addEventListener('loadingdone', () => {
          redrawAllDynamicSigns();
        });
      }

      animate();
    }

    window.onload = () => {
      initApp();
    };
  </script>
</body>
</html>
