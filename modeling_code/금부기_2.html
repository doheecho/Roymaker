<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>서울금북초등학교 3D 모델링 (1~7번 수정사항 정밀 반영)</title>
  <style>
    body { margin: 0; overflow: hidden; background: #262b33; }
    #info {
      position: absolute; top: 14px; left: 16px; color: #fff;
      font-family: 'Malgun Gothic', sans-serif; font-size: 12px;
      background: rgba(18, 22, 28, 0.88); padding: 10px 14px;
      border-radius: 8px; border: 1px solid rgba(255,255,255,0.18);
      pointer-events: none; line-height: 1.55; max-width: 620px;
    }
    #controls-ui {
      position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
      display: flex; flex-wrap: wrap; justify-content: center; gap: 6px;
      background: rgba(18, 22, 28, 0.90); padding: 10px 12px;
      border-radius: 10px; border: 1px solid rgba(255,255,255,0.18);
      max-width: 98vw;
    }
    button {
      background: #374151; color: #fff; border: 1px solid #4b5563;
      padding: 5px 9px; border-radius: 6px; cursor: pointer; font-size: 11.5px;
      font-family: 'Malgun Gothic', sans-serif; transition: 0.15s;
    }
    button:hover { background: #2563eb; border-color: #93c5fd; }
    button.sky-btn { background: #1e3a8a; border-color: #3b82f6; }
    button.ground-btn { background: #0f766e; border-color: #2dd4bf; }
    button.export-btn { background: #b45309; border-color: #f59e0b; font-weight: bold; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="info">
    <strong>서울금북초등학교 3D 모델링 — 1~7번 수정사항 반영</strong><br/>
    · [1] 서측동 앞 4단 갈색 계단벤치 + 파란 둥근 아치 차양막(앞·뒤 쇠봉 기둥)<br/>
    · [2·3] 3개 노란 세모지붕 코어(서측 코어 동향 90° 회전 · 2~4F 투명 통유리 · 1F 4칸 출입문 · 3배 두꺼운 파란 막대)<br/>
    · [4·7] 3·4F만 존재하는 1/4 너비 슬림 90° 둥근 통로(1·2F 개방) + 하부 파흰노주황흰 세모처마 창고<br/>
    · [5·6] 1~10호 교실 기준 글자 위치·색상 정밀 배치 / 회색 아치 지붕·사방 기둥·갈색 중앙 교단 / 음각 교실창
  </div>

  <div id="controls-ui">
    <button class="ground-btn" onclick="setView('west_corner')">1. 서측동·코어·통로 (수정 1~4)</button>
    <button class="ground-btn" onclick="setView('ground_front')">2. 본관 정면·표어·교단 (수정 5~6)</button>
    <button class="sky-btn" onclick="setView('top_curve')">3. 90° 둥근 통로 상부 (수정 7)</button>
    <button class="ground-btn" onclick="setView('ground_brown')">4. 갈색 벽돌 필로티동</button>
    <button class="sky-btn" onclick="setView('sky_se')">5. 스카이뷰 남동</button>
    <button class="sky-btn" onclick="setView('sky_ne')">6. 스카이뷰 북동</button>
    <button class="sky-btn" onclick="setView('sky_nw')">7. 스카이뷰 북서</button>
    <button class="sky-btn" onclick="setView('sky_sw')">8. 스카이뷰 남서</button>
    <button class="export-btn" onclick="exportGLB()">3D 추출 (.glb)</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#8FB3D9');

    const camera = new THREE.PerspectiveCamera(44, window.innerWidth / window.innerHeight, 0.5, 1400);
    // 초기 시점: 서측동·계단벤치·둥근차양·동향 노란코어·90° 통로가 한눈에 보이는 구도
    camera.position.set(16, 7.5, 36);

    const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(-28, 7.5, -16);
    controls.enableDamping = true;
    controls.update();

    // 좌표계: -Z = 북(N), +Z = 남(S), -X = 서(W), +X = 동(E)
    window.setView = (viewName) => {
      const views = {
        west_corner:  { pos: [16, 7.5, 36],     target: [-28, 7.5, -16] },
        ground_front: { pos: [17, 7.8, 42],     target: [17, 8.2, -34] },
        top_curve:    { pos: [-28, 48, -6],     target: [-34, 8, -22] },
        ground_brown: { pos: [92, 4.8, 6],      target: [78, 6.8, -32] },
        sky_se:       { pos: [118, 92, 118],    target: [4, 6, -4] },
        sky_ne:       { pos: [118, 92, -124],   target: [4, 6, -4] },
        sky_nw:       { pos: [-114, 92, -124],  target: [4, 6, -4] },
        sky_sw:       { pos: [-114, 92, 118],   target: [4, 6, -4] }
      };
      const v = views[viewName];
      if (!v) return;
      camera.position.set(...v.pos);
      controls.target.set(...v.target);
      controls.update();
    };

    scene.add(new THREE.AmbientLight(0xffffff, 0.88));

    const sun = new THREE.DirectionalLight(0xfffdf5, 1.15);
    sun.position.set(85, 145, 75);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -130;
    sun.shadow.camera.right = 130;
    sun.shadow.camera.top = 130;
    sun.shadow.camera.bottom = -130;
    scene.add(sun);

    const fill = new THREE.DirectionalLight(0xdbeafe, 0.48);
    fill.position.set(-95, 80, -75);
    scene.add(fill);

    function makeTex(canvas) {
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      return tex;
    }

    function addOutline(mesh, color = 0x1e293b) {
      const edges = new THREE.EdgesGeometry(mesh.geometry, 26);
      mesh.add(new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color })));
    }

    // =========================================================
    // 1. 창문 텍스처 생성기 (교실 4분할 창호 + 하단 환기 루버)
    // =========================================================
    function createClassroomWindowTexture(panes = 4, showLouvers = true) {
      const canvas = document.createElement('canvas');
      canvas.width = panes * 128;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, 0, 256);
      grad.addColorStop(0, '#273840');
      grad.addColorStop(0.55, '#3D545E');
      grad.addColorStop(1, '#202E34');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, 256);

      ctx.strokeStyle = '#CBD5E1';
      ctx.lineWidth = 6;
      ctx.strokeRect(3, 3, canvas.width - 6, 250);

      // 상부 고정창 가로 바
      const transY = 86;
      ctx.beginPath();
      ctx.moveTo(0, transY);
      ctx.lineTo(canvas.width, transY);
      ctx.stroke();

      // 세로 창틀 분할
      for (let p = 1; p < panes; p++) {
        const px = (canvas.width * p) / panes;
        ctx.beginPath();
        ctx.moveTo(px, 0);
        ctx.lineTo(px, 256);
        ctx.stroke();
      }

      // 하단 환기 루버 패널
      if (showLouvers) {
        const paneW = canvas.width / panes;
        const lh = 68;
        const ly = 256 - lh - 6;
        const indices = panes === 4 ? [0, 3] : [1];
        indices.forEach(idx => {
          ctx.fillStyle = '#E2E8F0';
          ctx.fillRect(idx * paneW + 8, ly, paneW - 16, lh);
          ctx.strokeStyle = '#64748B';
          ctx.lineWidth = 2;
          ctx.strokeRect(idx * paneW + 8, ly, paneW - 16, lh);
        });
      }

      return makeTex(canvas);
    }

    // =========================================================
    // 2. 옥색 4층 교실동 생성기 (창문이 외벽보다 안쪽으로 0.32m 들어간 3D 입체 구조)
    //    - 5번 지시사항: 1~10호 교실 기준 글자별 정확한 위치·색상 적용
    // =========================================================
    function createRecessedMintWing({ baysCount, bayWidth = 8.0, depth = 11.4, height = 14.2, includeSignBand = false }) {
      const group = new THREE.Group();
      const totalWidth = baysCount * bayWidth;
      const recess = 0.32; // 외벽보다 창문이 안쪽으로 들어가는 깊이

      const mintMat  = new THREE.MeshStandardMaterial({ color: '#45B2AF', roughness: 0.58 });
      const whiteMat = new THREE.MeshStandardMaterial({ color: '#F3F6F8', roughness: 0.62 });
      const baseMat  = new THREE.MeshStandardMaterial({ color: '#64748B', roughness: 0.78 });
      const roofMat  = new THREE.MeshStandardMaterial({ color: '#5AB87A', roughness: 0.82 });
      const winMat   = new THREE.MeshStandardMaterial({ map: createClassroomWindowTexture(4, true), roughness: 0.32 });

      // 1) 내부 후퇴 코어 박스 (창문이 자리잡는 안쪽 면: depth - 2 * recess)
      const innerDepth = depth - recess * 2;
      const innerCore = new THREE.Mesh(
        new THREE.BoxGeometry(totalWidth - 0.1, height - 0.1, innerDepth),
        [mintMat, mintMat, roofMat, baseMat, winMat, winMat]
      );
      innerCore.position.y = height / 2;
      innerCore.castShadow = true;
      innerCore.receiveShadow = true;
      group.add(innerCore);

      // 각 칸별로 안쪽에 들어간 입체 창문 패널 배치 (전면 +Z, 후면 -Z)
      const copingH = 0.25;
      const signBandH = includeSignBand ? 1.55 : 0.85;
      const bodyTopY = height - copingH - signBandH;
      const floorH = bodyTopY / 4;
      const winH = floorH * 0.65;
      const spandrelH = floorH - winH;

      for (let f = 0; f < 4; f++) {
        const floorNum = 4 - f; // 위에서부터 4F, 3F, 2F, 1F
        const floorTopY = bodyTopY - f * floorH;
        const winCenterY = floorTopY - winH / 2;

        // 각 칸(bay) 안쪽 창문 메쉬
        for (let b = 0; b < baysCount; b++) {
          const bx = -totalWidth / 2 + (b + 0.5) * bayWidth;
          [1, -1].forEach(dir => {
            const winPane = new THREE.Mesh(
              new THREE.PlaneGeometry(bayWidth - 0.68, winH - 0.06),
              winMat
            );
            winPane.position.set(bx, winCenterY, dir * (innerDepth / 2 + 0.01));
            if (dir === -1) winPane.rotation.y = Math.PI;
            group.add(winPane);
          });
        }

        // 외벽 수평 스팬드럴 띠 (외벽 최외곽 depth 기준 돌출!)
        // 4층 아래 = 옥색, 3·2층 아래 = 백색, 1층 아래 = 회색 기단
        const spMat = (floorNum === 4) ? mintMat : (floorNum === 3 || floorNum === 2) ? whiteMat : baseMat;
        const spCenterY = floorTopY - winH - spandrelH / 2;
        const spBand = new THREE.Mesh(
          new THREE.BoxGeometry(totalWidth, spandrelH, depth),
          spMat
        );
        spBand.position.set(0, spCenterY, 0);
        spBand.castShadow = true;
        spBand.receiveShadow = true;
        addOutline(spBand);
        group.add(spBand);
      }

      // 2) 외벽 수직 돌출 기둥 (Pilasters) — 전 층을 관통하며 창문보다 0.32m 돌출
      for (let b = 0; b <= baysCount; b++) {
        const px = -totalWidth / 2 + b * bayWidth;
        const isCenter = includeSignBand && (b === Math.floor(baysCount / 2));
        const pw = isCenter ? 0.92 : 0.68;
        const pilaster = new THREE.Mesh(
          new THREE.BoxGeometry(pw, bodyTopY, depth + 0.08),
          mintMat
        );
        pilaster.position.set(px, bodyTopY / 2, 0);
        pilaster.castShadow = true;
        pilaster.receiveShadow = true;
        addOutline(pilaster);
        group.add(pilaster);
      }

      // 3) 상단 옥색 표어 밴드 + 최상단 파라펫 갓돌
      const signCanvas = document.createElement('canvas');
      signCanvas.width = baysCount * 256;
      signCanvas.height = 192;
      const sctx = signCanvas.getContext('2d');

      sctx.fillStyle = '#45B2AF';
      sctx.fillRect(0, 0, signCanvas.width, signCanvas.height);

      // 판넬 세로 줄눈
      sctx.strokeStyle = 'rgba(15, 50, 55, 0.25)';
      sctx.lineWidth = 2;
      for (let sx = 0; sx <= signCanvas.width; sx += 128) {
        sctx.beginPath(); sctx.moveTo(sx, 0); sctx.lineTo(sx, signCanvas.height); sctx.stroke();
      }

      if (includeSignBand && baysCount === 10) {
        const bayPx = signCanvas.width / 10;
        const midY = signCanvas.height * 0.54;
        sctx.font = 'bold 54px "Malgun Gothic", sans-serif';
        sctx.textAlign = 'center';
        sctx.textBaseline = 'middle';

        // 5번 지시사항: 1호(0~1) ~ 10호(9~10) 교실 기준 정확한 글자 위치 및 색상 매핑
        const charSpecs = [
          { ch: '꿈', bayPos: 0.92, color: '#0F766E', stroke: '#CCFBF1' }, // 1호교실 우측 끝 (옥색 + 밝은 테두리 가독성)
          { ch: '보', bayPos: 1.50, color: '#7E22CE', stroke: '#F3E8FF' }, // 2호교실 중앙 (보라)
          { ch: '람', bayPos: 1.92, color: '#7E22CE', stroke: '#F3E8FF' }, // 2호교실 오른쪽 끝 (보라)
          { ch: '기', bayPos: 2.25, color: '#EC4899', stroke: '#FCE7F3' }, // 3호교실 1/4 지점 (분홍)
          { ch: '쁨', bayPos: 2.92, color: '#EC4899', stroke: '#FCE7F3' }, // 3호교실 4/4 지점 (분홍)
          { ch: '이', bayPos: 3.08, color: '#111827', stroke: '#E2E8F0' }, // 4호교실 왼쪽 끝 (검정)
          { ch: '가', bayPos: 3.75, color: '#111827', stroke: '#E2E8F0' }, // 4호교실 3/4 (검정)
          { ch: '득', bayPos: 4.00, color: '#111827', stroke: '#E2E8F0' }, // 4,5호교실 가운데 (검정)
          { ch: '한', bayPos: 4.50, color: '#111827', stroke: '#E2E8F0' }, // 5호교실 2/4 (검정)
          { ch: '서', bayPos: 5.50, color: '#F97316', stroke: '#1E293B' }, // 6호교실 2/4 (주황색)
          { ch: '울', bayPos: 6.12, color: '#F97316', stroke: '#1E293B' }, // 7호교실 좌측 (주황색)
          { ch: '금', bayPos: 6.50, color: '#F97316', stroke: '#1E293B' }, // 7호교실 정중앙 (주황색)
          { ch: '북', bayPos: 7.00, color: '#F97316', stroke: '#1E293B' }, // 7,8호교실 가운데 (주황색)
          { ch: '초', bayPos: 7.50, color: '#F97316', stroke: '#1E293B' }, // 8호교실 가운데 (주황색)
          { ch: '등', bayPos: 8.00, color: '#F97316', stroke: '#1E293B' }, // 8,9호교실 가운데 (주황색)
          { ch: '학', bayPos: 8.50, color: '#F97316', stroke: '#1E293B' }, // 9호교실 가운데 (주황색)
          { ch: '교', bayPos: 9.00, color: '#F97316', stroke: '#1E293B' }  // 9,10호교실 가운데 (주황색)
        ];

        charSpecs.forEach(item => {
          const cx = item.bayPos * bayPx;
          sctx.lineWidth = 4;
          sctx.strokeStyle = item.stroke;
          sctx.strokeText(item.ch, cx, midY);
          sctx.fillStyle = item.color;
          sctx.fillText(item.ch, cx, midY);
        });

        // 원형 시계: 5, 6호교실 가운데 (5.00 bay)
        const clockX = 5.00 * bayPx;
        sctx.beginPath();
        sctx.arc(clockX, midY, 44, 0, Math.PI * 2);
        sctx.fillStyle = '#475569';
        sctx.fill();
        sctx.beginPath();
        sctx.arc(clockX, midY, 37, 0, Math.PI * 2);
        sctx.fillStyle = '#FFFFFF';
        sctx.fill();
        sctx.strokeStyle = '#1E293B';
        sctx.lineWidth = 4;
        sctx.beginPath();
        sctx.moveTo(clockX, midY);
        sctx.lineTo(clockX, midY - 22);
        sctx.moveTo(clockX, midY);
        sctx.lineTo(clockX + 16, midY + 7);
        sctx.stroke();
      }

      const signBandMat = new THREE.MeshStandardMaterial({ map: makeTex(signCanvas), roughness: 0.58 });
      const signBand = new THREE.Mesh(
        new THREE.BoxGeometry(totalWidth, signBandH, depth + 0.04),
        [mintMat, mintMat, roofMat, mintMat, signBandMat, mintMat]
      );
      signBand.position.set(0, bodyTopY + signBandH / 2, 0);
      signBand.castShadow = true;
      addOutline(signBand);
      group.add(signBand);

      // 최상단 파라펫 갓돌
      const coping = new THREE.Mesh(
        new THREE.BoxGeometry(totalWidth + 0.12, copingH, depth + 0.16),
        new THREE.MeshStandardMaterial({ color: '#E2E8F0', roughness: 0.75 })
      );
      coping.position.set(0, height - copingH / 2, 0);
      addOutline(coping);
      group.add(coping);

      return group;
    }

    // =========================================================
    // 3. 노란 세모지붕 통창 코어 생성기 (3번 지시사항 정밀 반영)
    //    - 2, 3, 4층: 속이 비치는 투명한 통유리(외벽과 평평하게 flush) + 내부 슬래브/계단 투시
    //    - 1층: 학교로 들어오는 4칸짜리 유리 출입문
    //    - 1층 위: 차양막(0.32m)보다 3배 두꺼운 파란 막대(0.96m 두께!)
    // =========================================================
    function createYellowCurtainCore({ width = 9.6, depth = 11.4, height = 14.2, peakH = 2.5, hasCrest = false, canopyThickness = 0.96 }) {
      const group = new THREE.Group();

      const yellowMat = new THREE.MeshStandardMaterial({ color: '#E8C547', roughness: 0.55 });
      const roofMat   = new THREE.MeshStandardMaterial({ color: '#58A868', roughness: 0.8 });
      const pillarW   = 1.15;
      const cwWidth   = width - pillarW * 2;
      const floorH    = height / 4; // 3.55m

      // 1) 좌·우 노란 수직 기둥 (전면~후면 전체 깊이)
      [-width / 2 + pillarW / 2, width / 2 - pillarW / 2].forEach(px => {
        const pillar = new THREE.Mesh(new THREE.BoxGeometry(pillarW, height, depth), yellowMat);
        pillar.position.set(px, height / 2, 0);
        pillar.castShadow = true;
        pillar.receiveShadow = true;
        addOutline(pillar);
        group.add(pillar);
      });

      // 2) 옥상 슬래브
      const topSlab = new THREE.Mesh(new THREE.BoxGeometry(cwWidth, 0.35, depth), roofMat);
      topSlab.position.set(0, height - 0.175, 0);
      topSlab.castShadow = true;
      addOutline(topSlab);
      group.add(topSlab);

      // 3) 2층·3층·4층 투명 통유리 (외벽과 평평하게 flush!) + 내부 슬래브·계단(속이 비침!)
      const transparentGlassMat = new THREE.MeshPhysicalMaterial({
        color: '#88C4C8',
        transparent: true,
        opacity: 0.36,
        roughness: 0.12,
        metalness: 0.1,
        side: THREE.DoubleSide
      });
      const mullionMat = new THREE.MeshStandardMaterial({ color: '#335C61', roughness: 0.4 });
      const slabMat    = new THREE.MeshStandardMaterial({ color: '#CBD5E1', roughness: 0.8 });

      // 2층, 3층, 4층 바닥 슬래브 및 내부 계단 (투명 통유리 너머로 속이 비치는 내부 구조)
      for (let fl = 1; fl <= 3; fl++) {
        const sy = fl * floorH;
        const innerSlab = new THREE.Mesh(new THREE.BoxGeometry(cwWidth - 0.1, 0.24, depth - 0.8), slabMat);
        innerSlab.position.set(0, sy, 0);
        group.add(innerSlab);

        // 내부 경사 계단판
        const stair = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.2, 4.4), slabMat);
        stair.position.set(-1.2, sy + floorH * 0.5, 0);
        stair.rotation.x = 0.58;
        group.add(stair);
      }

      // 2·3·4층 전면(+Z) & 후면(-Z) 외벽과 평평한(flush) 투명 통유리창 + 격자 프레임
      const upperH = floorH * 3;
      const upperCenterY = floorH + upperH / 2;
      [depth / 2, -depth / 2].forEach(fz => {
        const glassPane = new THREE.Mesh(new THREE.PlaneGeometry(cwWidth, upperH), transparentGlassMat);
        glassPane.position.set(0, upperCenterY, fz);
        if (fz < 0) glassPane.rotation.y = Math.PI;
        group.add(glassPane);

        // 세로 멀리언 (4열 분할)
        for (let c = 1; c < 4; c++) {
          const mx = -cwWidth / 2 + (cwWidth * c) / 4;
          const vBar = new THREE.Mesh(new THREE.BoxGeometry(0.10, upperH, 0.10), mullionMat);
          vBar.position.set(mx, upperCenterY, fz);
          group.add(vBar);
        }
        // 가로 트랜섬 (각 층별 상·하 2단)
        for (let r = 1; r < 6; r++) {
          const my = floorH + (upperH * r) / 6;
          const hBar = new THREE.Mesh(new THREE.BoxGeometry(cwWidth, (r % 2 === 0) ? 0.18 : 0.08, 0.10), mullionMat);
          hBar.position.set(0, my, fz);
          group.add(hBar);
        }
      });

      // 4) 1층: 학교로 들어오는 4칸짜리 출입문 (전면 +Z, 후면 -Z)
      const doorFrameMat = new THREE.MeshStandardMaterial({ color: '#1E293B', roughness: 0.45 });
      const doorGlassMat = new THREE.MeshPhysicalMaterial({
        color: '#A5F3FC',
        transparent: true,
        opacity: 0.45,
        roughness: 0.15,
        side: THREE.DoubleSide
      });

      [depth / 2 - 0.15, -depth / 2 + 0.15].forEach(dz => {
        // 4칸짜리 출입문 프레임 및 4개 유리문짝
        const doorW = cwWidth / 4;
        for (let d = 0; d < 4; d++) {
          const dx = -cwWidth / 2 + (d + 0.5) * doorW;
          const leaf = new THREE.Mesh(new THREE.PlaneGeometry(doorW - 0.14, floorH - 0.35), doorGlassMat);
          leaf.position.set(dx, (floorH - 0.25) / 2, dz);
          group.add(leaf);

          // 문 손잡이 & 세로 프레임
          const handle = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.45, 0.14), doorFrameMat);
          handle.position.set(dx + (d % 2 === 0 ? 0.22 : -0.22), 1.15, dz);
          group.add(handle);
        }
        for (let d = 0; d <= 4; d++) {
          const fx = -cwWidth / 2 + d * doorW;
          const jamb = new THREE.Mesh(new THREE.BoxGeometry(0.12, floorH - 0.2, 0.16), doorFrameMat);
          jamb.position.set(fx, (floorH - 0.2) / 2, dz);
          group.add(jamb);
        }
      });

      // 5) 1층 위의 파란 막대 (차양막보다 3배 두꺼운 수평 캐노피 바!)
      const blueBar = new THREE.Mesh(
        new THREE.BoxGeometry(width + 0.3, canopyThickness, depth + 1.8),
        new THREE.MeshStandardMaterial({ color: '#1D6FA5', roughness: 0.45 })
      );
      blueBar.position.set(0, floorH, 0);
      blueBar.castShadow = true;
      addOutline(blueBar);
      group.add(blueBar);

      // 6) 지붕이 뾰족한 노란 세모 박공 지붕 + 원형 시계/교표
      const shape = new THREE.Shape();
      shape.moveTo(-width / 2, 0);
      shape.lineTo(width / 2, 0);
      shape.lineTo(0, peakH);
      shape.closePath();

      const gableGeo = new THREE.ExtrudeGeometry(shape, { depth: depth + 0.12, bevelEnabled: false });
      gableGeo.translate(0, 0, -(depth + 0.12) / 2);
      const gable = new THREE.Mesh(gableGeo, yellowMat);
      gable.position.y = height;
      gable.castShadow = true;
      addOutline(gable);
      group.add(gable);

      const medallion = new THREE.Mesh(
        new THREE.CylinderGeometry(0.75, 0.75, depth + 0.22, 24),
        new THREE.MeshStandardMaterial({ color: hasCrest ? '#2E7D32' : '#F8FAFC', roughness: 0.4 })
      );
      medallion.rotation.x = Math.PI / 2;
      medallion.position.set(0, height + peakH * 0.44, 0);
      group.add(medallion);

      return group;
    }

    // =========================================================
    // 4. 3·4층만 존재하는 1/4 너비 슬림 90° 둥근 통로 (4번 & 7번 수정)
    //    - 1층·2층은 완전히 비어 투명하게 개방됨
    //    - 길이: 노란 세모지붕 통창 너비와 동일한 컴팩트 호 길이
    //    - 너비: 교실 너비(8.0m)의 1/4 = 2.0m
    //    - 입면: 상하 테두리 초록 + 중앙 노란 테두리 투명 통유리(외벽과 평평함)
    // =========================================================
    function createSlimCurvedUpperBridge({ centerX, centerZ, radius, bridgeWidth = 2.0, yBottom = 7.1, yTop = 14.0 }) {
      const group = new THREE.Group();
      const totalH = yTop - yBottom; // 3층 + 4층 높이 (6.9m)
      const rIn = radius - bridgeWidth / 2;
      const rOut = radius + bridgeWidth / 2;
      const segs = 32;

      function buildArcBand(rInner, rOuter, bandH, yPos, mat) {
        const shape = new THREE.Shape();
        for (let i = 0; i <= segs; i++) {
          const a = Math.PI + (Math.PI / 2) * (i / segs);
          const x = Math.cos(a) * rOuter;
          const y = Math.sin(a) * rOuter;
          if (i === 0) shape.moveTo(x, y);
          else shape.lineTo(x, y);
        }
        for (let i = segs; i >= 0; i--) {
          const a = Math.PI + (Math.PI / 2) * (i / segs);
          const x = Math.cos(a) * rInner;
          const y = Math.sin(a) * rInner;
          shape.lineTo(x, y);
        }
        shape.closePath();

        const geo = new THREE.ExtrudeGeometry(shape, { depth: bandH, bevelEnabled: false });
        geo.rotateX(Math.PI / 2);
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(centerX, yPos + bandH, centerZ);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        return mesh;
      }

      const greenMat = new THREE.MeshStandardMaterial({ color: '#3B8E69', roughness: 0.55 });
      const yellowFrameMat = new THREE.MeshStandardMaterial({ color: '#FACC15', roughness: 0.45 });
      const clearGlassMat = new THREE.MeshPhysicalMaterial({
        color: '#BAE6FD',
        transparent: true,
        opacity: 0.34,
        roughness: 0.1,
        side: THREE.DoubleSide
      });

      // 1) 3층 하부 초록 테두리 스팬드럴 (yBottom ~ yBottom + 1.05m)
      const lowerGreen = buildArcBand(rIn, rOut, 1.05, yBottom, greenMat);
      addOutline(lowerGreen);
      group.add(lowerGreen);

      // 2) 4층 상부 초록 테두리 파라펫 (yTop - 1.05m ~ yTop)
      const upperGreen = buildArcBand(rIn, rOut, 1.05, yTop - 1.05, greenMat);
      addOutline(upperGreen);
      group.add(upperGreen);

      // 3) 중앙 노란 테두리 프레임 (하단 노란 바, 상단 노란 바, 세로 노란 멀리언)
      const winBottom = yBottom + 1.05;
      const winTop = yTop - 1.05;
      const winH = winTop - winBottom;

      const yellowBottomRim = buildArcBand(rIn, rOut, 0.22, winBottom, yellowFrameMat);
      const yellowTopRim    = buildArcBand(rIn, rOut, 0.22, winTop - 0.22, yellowFrameMat);
      const yellowMidRim    = buildArcBand(rIn, rOut, 0.16, winBottom + winH / 2 - 0.08, yellowFrameMat);
      group.add(yellowBottomRim, yellowTopRim, yellowMidRim);

      // 4) 내·외측 곡면 투명 통유리 (외벽과 평평하게 flush!)
      [rIn, rOut].forEach(rad => {
        const cylGeo = new THREE.CylinderGeometry(rad, rad, winH - 0.44, segs, 1, true, Math.PI, Math.PI / 2);
        // CylinderGeometry 각도 보정 (X-Z 평면 PI ~ 1.5*PI 일치)
        const glassWall = new THREE.Mesh(cylGeo, clearGlassMat);
        glassWall.rotation.y = -Math.PI / 2;
        glassWall.position.set(centerX, winBottom + winH / 2, centerZ);
        group.add(glassWall);
      });

      // 노란 세로 격자 멀리언 + 중앙 색면 모자이크 포인트(투명 유리 내부/측면)
      const mosaicPalette = ['#EF4444', '#3B82F6', '#FACC15', '#38BDF8'];
      for (let i = 0; i <= 10; i++) {
        const a = Math.PI + (Math.PI / 2) * (i / 10);
        [rIn, rOut].forEach(rad => {
          const vx = centerX + Math.cos(a) * rad;
          const vz = centerZ + Math.sin(a) * rad;
          const vPost = new THREE.Mesh(new THREE.BoxGeometry(0.14, winH, 0.14), yellowFrameMat);
          vPost.position.set(vx, winBottom + winH / 2, vz);
          vPost.rotation.y = -a;
          group.add(vPost);
        });

        // 중앙부 색면 모자이크 유리 패널 3칸
        if (i >= 3 && i <= 6) {
          const aMid = Math.PI + (Math.PI / 2) * ((i + 0.5) / 10);
          const mx = centerX + Math.cos(aMid) * (rIn - 0.02);
          const mz = centerZ + Math.sin(aMid) * (rIn - 0.02);
          const tile = new THREE.Mesh(
            new THREE.BoxGeometry(0.06, 0.85, 0.85),
            new THREE.MeshStandardMaterial({ color: mosaicPalette[i % mosaicPalette.length], roughness: 0.4 })
          );
          tile.position.set(mx, winBottom + winH * 0.36, mz);
          tile.rotation.y = -aMid;
          group.add(tile);
        }
      }

      return group;
    }

    // =========================================================
    // 5. 우측 갈색 벽돌·회색 콘크리트 필로티 동 (음각 창문 + 1층 필로티 기둥)
    // =========================================================
    function createBrickTileTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#A87452';
      ctx.fillRect(0, 0, 256, 256);
      const rows = 16, cols = 6, rh = 256 / rows, cw = 256 / cols;
      for (let r = 0; r < rows; r++) {
        const offset = (r % 2) * (cw * 0.5);
        for (let c = -1; c <= cols; c++) {
          const shade = ((r * 7 + c * 13) % 5) * 4 - 8;
          ctx.fillStyle = `rgb(${168 + shade}, ${116 + Math.round(shade * 0.7)}, ${82 + Math.round(shade * 0.5)})`;
          ctx.fillRect(c * cw + offset + 1, r * rh + 1, cw - 2, rh - 2);
        }
      }
      return makeTex(canvas);
    }

    function createBrownPilotiWing(bayWidth = 8.0, depth = 11.4, floorH = 3.55) {
      const group = new THREE.Group();
      const bayTypes = ['half', 'full', 'full', 'full', 'half']; // 소창 - 교실창3 - 소창
      const totalWidth = bayWidth * bayTypes.length;
      const upperFloors = 3; // 2~4층
      const upperH = upperFloors * floorH;
      const recess = 0.30; // 창문 안쪽으로 들어간 깊이

      const brickMat = new THREE.MeshStandardMaterial({ map: createBrickTileTexture(), roughness: 0.78 });
      const concMat  = new THREE.MeshStandardMaterial({ color: '#B8B8B3', roughness: 0.85 });
      const roofMat  = new THREE.MeshStandardMaterial({ color: '#CBD5E1', roughness: 0.85 });
      const fullWinMat = new THREE.MeshStandardMaterial({ map: createClassroomWindowTexture(4, true), roughness: 0.32 });
      const halfWinMat = new THREE.MeshStandardMaterial({ map: createClassroomWindowTexture(2, true), roughness: 0.32 });

      // 1층 개방형 벽돌 필로티 기둥 6열
      for (let i = 0; i <= bayTypes.length; i++) {
        const cx = -totalWidth / 2 + i * bayWidth;
        [-depth / 2 + 0.48, depth / 2 - 0.48].forEach(cz => {
          const col = new THREE.Mesh(new THREE.BoxGeometry(0.76, floorH, 0.76), brickMat);
          col.position.set(cx, floorH / 2, cz);
          col.castShadow = true;
          addOutline(col);
          group.add(col);
        });
      }

      // 1층 안쪽 후퇴된 적갈색 벽돌 코어
      const innerFirstFloor = new THREE.Mesh(
        new THREE.BoxGeometry(totalWidth - 2.2, floorH - 0.1, depth - 3.6),
        brickMat
      );
      innerFirstFloor.position.set(0, floorH / 2, -0.4);
      innerFirstFloor.castShadow = true;
      addOutline(innerFirstFloor);
      group.add(innerFirstFloor);

      // 2~4층 내부 코어 (창문이 놓이는 안쪽 깊이)
      const innerDepth = depth - recess * 2;
      const upperCore = new THREE.Mesh(
        new THREE.BoxGeometry(totalWidth - 0.1, upperH - 0.1, innerDepth),
        [brickMat, brickMat, roofMat, brickMat, brickMat, brickMat]
      );
      upperCore.position.set(0, floorH + upperH / 2, 0);
      upperCore.castShadow = true;
      group.add(upperCore);

      // 2~4층 각 층별 입체 창호(안쪽 후퇴) + 회색 콘크리트 수평 스팬드럴 띠(돌출)
      const winH = floorH * 0.62;
      const spandrelH = floorH - winH;

      for (let f = 0; f < upperFloors; f++) {
        const fBottomY = floorH + f * floorH;
        const spBand = new THREE.Mesh(new THREE.BoxGeometry(totalWidth, spandrelH, depth), concMat);
        spBand.position.set(0, fBottomY + spandrelH / 2, 0);
        spBand.castShadow = true;
        addOutline(spBand);
        group.add(spBand);

        bayTypes.forEach((bType, idx) => {
          const bx = -totalWidth / 2 + (idx + 0.5) * bayWidth;
          const wRatio = bType === 'half' ? 0.40 : 0.80;
          const wWidth = bayWidth * wRatio;
          const wMat = bType === 'half' ? halfWinMat : fullWinMat;

          [1, -1].forEach(dir => {
            const winPane = new THREE.Mesh(new THREE.PlaneGeometry(wWidth, winH - 0.08), wMat);
            winPane.position.set(bx, fBottomY + spandrelH + winH / 2, dir * (innerDepth / 2 + 0.01));
            if (dir === -1) winPane.rotation.y = Math.PI;
            group.add(winPane);
          });
        });
      }

      // 2~4층 적갈색 벽돌 수직 기둥 (외벽 최외곽 돌출)
      for (let i = 0; i <= bayTypes.length; i++) {
        const px = -totalWidth / 2 + i * bayWidth;
        const pilaster = new THREE.Mesh(new THREE.BoxGeometry(0.84, upperH, depth + 0.08), brickMat);
        pilaster.position.set(px, floorH + upperH / 2, 0);
        pilaster.castShadow = true;
        addOutline(pilaster);
        group.add(pilaster);
      }

      // 최상단 벽돌 처마 띠
      const topCornice = new THREE.Mesh(new THREE.BoxGeometry(totalWidth + 0.1, 0.42, depth + 0.1), brickMat);
      topCornice.position.set(0, floorH + upperH - 0.21, 0);
      addOutline(topCornice);
      group.add(topCornice);

      return group;
    }

    // =========================================================
    // 6. 북측 후면 교사동 생성기
    // =========================================================
    function createNorthRearWing(width = 104, depth = 11.4, height = 14.2) {
      const group = new THREE.Group();
      const canvas = document.createElement('canvas');
      canvas.width = 2048; canvas.height = 768;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#E5D3B3';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const floors = 4, bays = 12, fh = canvas.height / floors, bw = canvas.width / bays;
      for (let f = 0; f < floors; f++) {
        const y = f * fh;
        ctx.fillStyle = '#F3EAD8';
        ctx.fillRect(0, y, canvas.width, fh * 0.24);
        for (let b = 0; b < bays; b++) {
          const bx = b * bw;
          ctx.fillStyle = '#2B3B45';
          ctx.fillRect(bx + bw * 0.14, y + fh * 0.30, bw * 0.72, fh * 0.54);
          ctx.strokeStyle = '#F8FAFC';
          ctx.lineWidth = 3;
          ctx.strokeRect(bx + bw * 0.14, y + fh * 0.30, bw * 0.72, fh * 0.54);
        }
      }

      const wallMat = new THREE.MeshStandardMaterial({ map: makeTex(canvas), roughness: 0.72 });
      const sideMat = new THREE.MeshStandardMaterial({ color: '#DFC9A6', roughness: 0.75 });
      const roofMat = new THREE.MeshStandardMaterial({ color: '#DCE3EC', roughness: 0.85 });

      const body = new THREE.Mesh(
        new THREE.BoxGeometry(width, height, depth),
        [sideMat, sideMat, roofMat, sideMat, wallMat, wallMat]
      );
      body.position.y = height / 2;
      body.castShadow = true;
      addOutline(body);
      group.add(body);

      const blueTower = new THREE.Mesh(
        new THREE.BoxGeometry(5.6, height + 2.4, 4.4),
        new THREE.MeshStandardMaterial({ color: '#2563EB', roughness: 0.65 })
      );
      blueTower.position.set(width / 2 - 4, (height + 2.4) / 2, -depth / 2 - 1.5);
      addOutline(blueTower);
      group.add(blueTower);

      return group;
    }

    // =========================================================
    // 7. 전체 캠퍼스 조립
    // =========================================================
    const root = new THREE.Group();
    scene.add(root);

    const CLASS_BAY_W = 8.0;
    const WING_DEPTH  = 11.4;
    const WING_HEIGHT = 14.2;
    const CANOPY_THICK = 0.32; // 서측 차양막 기준 두께 (노란 코어 파란 막대는 3배인 0.96m!)

    // 대지 및 운동장
    const baseGround = new THREE.Mesh(
      new THREE.BoxGeometry(270, 0.4, 240),
      new THREE.MeshStandardMaterial({ color: '#8D95A0', roughness: 0.92 })
    );
    baseGround.position.set(0, -0.2, 0);
    baseGround.receiveShadow = true;
    root.add(baseGround);

    // 동측 보도블록 광장
    const plazaCanvas = document.createElement('canvas');
    plazaCanvas.width = 512; plazaCanvas.height = 512;
    const pctx = plazaCanvas.getContext('2d');
    pctx.fillStyle = '#B8A290';
    pctx.fillRect(0, 0, 512, 512);
    pctx.strokeStyle = 'rgba(95, 78, 66, 0.25)';
    pctx.lineWidth = 2;
    for (let g = 0; g <= 512; g += 16) {
      pctx.beginPath(); pctx.moveTo(g, 0); pctx.lineTo(g, 512); pctx.stroke();
      pctx.beginPath(); pctx.moveTo(0, g); pctx.lineTo(512, g); pctx.stroke();
    }
    const plazaMesh = new THREE.Mesh(
      new THREE.BoxGeometry(92, 0.06, 98),
      new THREE.MeshStandardMaterial({ map: makeTex(plazaCanvas), roughness: 0.88 })
    );
    plazaMesh.position.set(58, 0.03, 22);
    plazaMesh.receiveShadow = true;
    root.add(plazaMesh);

    // 남→북 축구장 + 육상 트랙
    const trackOuter = new THREE.Mesh(
      new THREE.BoxGeometry(50, 0.06, 72),
      new THREE.MeshStandardMaterial({ color: '#A84A3E', roughness: 0.82 })
    );
    trackOuter.position.set(-14, 0.03, 18);
    trackOuter.receiveShadow = true;
    root.add(trackOuter);

    const turfCanvas = document.createElement('canvas');
    turfCanvas.width = 512; turfCanvas.height = 768;
    const tctx = turfCanvas.getContext('2d');
    for (let s = 0; s < 12; s++) {
      tctx.fillStyle = (s % 2 === 0) ? '#2E7D32' : '#358A3A';
      tctx.fillRect(0, (768 / 12) * s, 512, 768 / 12);
    }
    tctx.strokeStyle = '#F8FAFC';
    tctx.lineWidth = 5;
    tctx.strokeRect(20, 20, 472, 728);
    tctx.beginPath(); tctx.moveTo(20, 384); tctx.lineTo(492, 384); tctx.stroke();
    tctx.beginPath(); tctx.arc(256, 384, 62, 0, Math.PI * 2); tctx.stroke();
    tctx.strokeRect(136, 20, 240, 105);
    tctx.strokeRect(136, 643, 240, 105);

    const soccerTurf = new THREE.Mesh(
      new THREE.BoxGeometry(42, 0.08, 64),
      new THREE.MeshStandardMaterial({ map: makeTex(turfCanvas), roughness: 0.85 })
    );
    soccerTurf.position.set(-14, 0.045, 18);
    soccerTurf.receiveShadow = true;
    root.add(soccerTurf);

    // 축구 골대 2개
    const goalMat = new THREE.MeshStandardMaterial({ color: '#E2E8F0', roughness: 0.4 });
    [-12, 48].forEach(gz => {
      const goal = new THREE.Mesh(new THREE.BoxGeometry(5.2, 2.1, 1.6), goalMat);
      goal.position.set(-14, 1.05, gz);
      goal.castShadow = true;
      addOutline(goal, 0x0284c7);
      root.add(goal);
    });

    // 남측 동→서 다목적 연습장 & 작은 놀이터
    const practiceCourt = new THREE.Mesh(
      new THREE.BoxGeometry(48, 0.08, 17),
      new THREE.MeshStandardMaterial({ color: '#3B6E9C', roughness: 0.8 })
    );
    practiceCourt.position.set(-14, 0.04, 64);
    practiceCourt.receiveShadow = true;
    root.add(practiceCourt);

    const playgroundFloor = new THREE.Mesh(
      new THREE.BoxGeometry(34, 0.08, 14),
      new THREE.MeshStandardMaterial({ color: '#D4B483', roughness: 0.9 })
    );
    playgroundFloor.position.set(-14, 0.04, 82);
    playgroundFloor.receiveShadow = true;
    root.add(playgroundFloor);

    // ---------------------------------------------------------
    // A) 서측 남→북 옥색 4층 동 (가로 6칸 = 48m, Z: -10.0 ~ +38.0, X 중심: -48.0)
    // ---------------------------------------------------------
    const nsLength = CLASS_BAY_W * 6; // 48m
    const nsWing = createRecessedMintWing({
      baysCount: 6,
      bayWidth: CLASS_BAY_W,
      depth: WING_DEPTH,
      height: WING_HEIGHT,
      includeSignBand: false
    });
    nsWing.rotation.y = Math.PI / 2; // 남→북 방향 정렬
    nsWing.position.set(-48.0, 0, 14.0);
    root.add(nsWing);

    // [1번 수정] 서측 교실 앞 4단 갈색 계단벤치 + 파란 둥근 아치 차양막 + 앞뒤 쇠봉 기둥
    const westFrontX = -48.0 + WING_DEPTH / 2; // -42.3
    const benchMat = new THREE.MeshStandardMaterial({ color: '#7C4A2D', roughness: 0.82 });
    for (let step = 0; step < 4; step++) {
      // 위쪽(건물 쪽)이 높고 운동장 쪽으로 4단 내려오는 갈색 계단벤치
      const stepH = (4 - step) * 0.26;
      const stepD = 0.65;
      const stepMesh = new THREE.Mesh(
        new THREE.BoxGeometry(stepD, stepH, nsLength),
        benchMat
      );
      stepMesh.position.set(westFrontX + step * stepD + stepD / 2, stepH / 2, 14.0);
      stepMesh.castShadow = true;
      stepMesh.receiveShadow = true;
      addOutline(stepMesh);
      root.add(stepMesh);
    }

    // 파란색 둥근 아치형 차양막 (반원통 지붕) + 앞·뒤 쇠봉 기둥
    const awningWidth = 3.2;
    const awningCenterX = westFrontX + awningWidth / 2;
    const awningBaseY = 3.25;
    const blueAwning = new THREE.Mesh(
      new THREE.CylinderGeometry(awningWidth / 2, awningWidth / 2, nsLength, 20, 1, true, 0, Math.PI),
      new THREE.MeshStandardMaterial({ color: '#1D6FD8', roughness: 0.45, side: THREE.DoubleSide })
    );
    blueAwning.rotation.z = Math.PI / 2;
    blueAwning.rotation.y = Math.PI / 2;
    blueAwning.position.set(awningCenterX, awningBaseY, 14.0);
    blueAwning.castShadow = true;
    root.add(blueAwning);

    // 차양막 앞뒤 양 끝 아치 마구리판
    [-10.0, 38.0].forEach(az => {
      const endCap = new THREE.Mesh(
        new THREE.CircleGeometry(awningWidth / 2, 20, 0, Math.PI),
        new THREE.MeshStandardMaterial({ color: '#1D6FD8', roughness: 0.45, side: THREE.DoubleSide })
      );
      endCap.position.set(awningCenterX, awningBaseY, az);
      root.add(endCap);
    });

    // 차양막 앞뒤를 지지하는 수직 쇠봉 기둥
    const steelPoleMat = new THREE.MeshStandardMaterial({ color: '#CBD5E1', metalness: 0.78, roughness: 0.25 });
    for (let pz = -9.6; pz <= 37.6; pz += CLASS_BAY_W) {
      [westFrontX + 0.18, westFrontX + awningWidth - 0.18].forEach(px => {
        const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, awningBaseY, 10), steelPoleMat);
        pole.position.set(px, awningBaseY / 2, pz);
        pole.castShadow = true;
        root.add(pole);
      });
    }

    // ---------------------------------------------------------
    // B) [2·3번 수정] 서측 노란 세모지붕 코어
    //    - 반시계방향 90도 회전(rotation.y = +PI/2)하여 통유리창과 세모지붕이 동쪽(+X)을 바라봄!
    // ---------------------------------------------------------
    const nsYellowCore = createYellowCurtainCore({
      width: 9.6,
      depth: WING_DEPTH,
      height: WING_HEIGHT,
      peakH: 2.5,
      hasCrest: false,
      canopyThickness: CANOPY_THICK * 3
    });
    nsYellowCore.rotation.y = Math.PI / 2; // 반시계방향 90° 회전 -> 동쪽(+X) 정면
    nsYellowCore.position.set(-48.0, 0, -14.8); // Z: -19.6 ~ -10.0
    root.add(nsYellowCore);

    // ---------------------------------------------------------
    // C) [4·7번 수정] 두 노란 세모지붕을 90도로 잇는 3·4층 1/4 너비 둥근 통로
    //    - 1층·2층은 비어 투명하게 개방됨 (yBottom = 7.1m ~ yTop = 14.0m)
    //    - 길이: 노란 세모지붕 통창 너비(9.6m)와 동일한 반경/호 길이로 축소
    //    - 너비: 교실 너비(8.0m)의 1/4 = 2.0m
    // ---------------------------------------------------------
    const curvedUpperBridge = createSlimCurvedUpperBridge({
      centerX: -32.7,
      centerZ: -19.6,
      radius: 9.6,
      bridgeWidth: CLASS_BAY_W * 0.25, // 교실 너비의 1/4 (2.0m)
      yBottom: WING_HEIGHT * 0.5,      // 3층 바닥 높이 (7.1m) -> 1·2층 투명 개방
      yTop: WING_HEIGHT - 0.2          // 4층 상부 (14.0m)
    });
    root.add(curvedUpperBridge);

    // [4번 하단 수정] 둥근 통로 밑 비어있는 하부 공간의 파·흰·노·주황·흰 줄무늬 건물 + 위 세모 처마
    const shedGroup = new THREE.Group();
    const stripeCanvas = document.createElement('canvas');
    stripeCanvas.width = 256; stripeCanvas.height = 256;
    const stCtx = stripeCanvas.getContext('2d');
    // 파랑 - 흰색 - 노랑 - 주황 - 흰색 순서 5단 가로 띠
    const stripeColors = ['#2563EB', '#F8FAFC', '#FACC15', '#F97316', '#F8FAFC'];
    stripeColors.forEach((col, i) => {
      stCtx.fillStyle = col;
      stCtx.fillRect(0, i * (256 / 5), 256, 256 / 5);
    });
    const shedW = 4.6, shedD = 3.6, shedH = 3.5;
    const shedBody = new THREE.Mesh(
      new THREE.BoxGeometry(shedW, shedH, shedD),
      new THREE.MeshStandardMaterial({ map: makeTex(stripeCanvas), roughness: 0.65 })
    );
    shedBody.position.y = shedH / 2;
    shedBody.castShadow = true;
    addOutline(shedBody);
    shedGroup.add(shedBody);

    // 위쪽 세모 처마 지붕
    const gableShedShape = new THREE.Shape();
    gableShedShape.moveTo(-shedW / 2 - 0.35, 0);
    gableShedShape.lineTo(shedW / 2 + 0.35, 0);
    gableShedShape.lineTo(0, 1.35);
    gableShedShape.closePath();
    const gableShedGeo = new THREE.ExtrudeGeometry(gableShedShape, { depth: shedD + 0.7, bevelEnabled: false });
    gableShedGeo.translate(0, 0, -(shedD + 0.7) / 2);
    const shedRoof = new THREE.Mesh(
      gableShedGeo,
      new THREE.MeshStandardMaterial({ color: '#475569', roughness: 0.7 })
    );
    shedRoof.position.y = shedH;
    shedRoof.castShadow = true;
    addOutline(shedRoof);
    shedGroup.add(shedRoof);

    shedGroup.rotation.y = Math.PI / 4; // 90도 코너 곡선 방향에 맞춰 배치
    shedGroup.position.set(-39.2, 0, -24.8);
    root.add(shedGroup);

    // ---------------------------------------------------------
    // D) 북측 본관 서측 노란 세모지붕 코어 (남쪽 +Z 정면)
    // ---------------------------------------------------------
    const ewLeftYellowCore = createYellowCurtainCore({
      width: 9.6,
      depth: WING_DEPTH,
      height: WING_HEIGHT,
      peakH: 2.5,
      hasCrest: false,
      canopyThickness: CANOPY_THICK * 3
    });
    ewLeftYellowCore.position.set(-27.9, 0, -34.9); // X: -32.7 ~ -23.1, Z: -40.6 ~ -29.2
    root.add(ewLeftYellowCore);

    // ---------------------------------------------------------
    // E) [5번 수정] 서→동 옥색 4층 주동 (1~10호 교실 = 80m, 정확한 글자 위치·색상 적용)
    // ---------------------------------------------------------
    const ewWing = createRecessedMintWing({
      baysCount: 10,
      bayWidth: CLASS_BAY_W,
      depth: WING_DEPTH,
      height: WING_HEIGHT,
      includeSignBand: true
    });
    ewWing.position.set(16.9, 0, -34.9); // X: -23.1 ~ +56.9
    root.add(ewWing);

    // ---------------------------------------------------------
    // F) 북측 본관 동측 노란 세모지붕 코어 (남쪽 +Z 정면)
    // ---------------------------------------------------------
    const ewRightYellowCore = createYellowCurtainCore({
      width: 9.6,
      depth: WING_DEPTH,
      height: WING_HEIGHT,
      peakH: 2.5,
      hasCrest: true,
      canopyThickness: CANOPY_THICK * 3
    });
    ewRightYellowCore.position.set(61.7, 0, -34.9); // X: +56.9 ~ +66.5
    root.add(ewRightYellowCore);

    // ---------------------------------------------------------
    // G) 우측 갈색 벽돌·회색 콘크리트 필로티 동 (5칸: 소창-교실창3-소창)
    // ---------------------------------------------------------
    const brownWing = createBrownPilotiWing(CLASS_BAY_W, WING_DEPTH, 3.55);
    brownWing.position.set(66.5 + CLASS_BAY_W * 2.5, 0, -34.9);
    root.add(brownWing);

    // ---------------------------------------------------------
    // H) 북측 후면 교사동 & 본관 중앙 연결 브릿지
    // ---------------------------------------------------------
    const northRearWing = createNorthRearWing(104, 11.4, 14.2);
    northRearWing.position.set(32, 0, -58.5);
    root.add(northRearWing);

    const skyBridge = new THREE.Mesh(
      new THREE.BoxGeometry(7.2, 7.6, 12.5),
      new THREE.MeshStandardMaterial({ color: '#45B2AF', roughness: 0.55 })
    );
    skyBridge.position.set(22, 9.2, -46.8);
    skyBridge.castShadow = true;
    addOutline(skyBridge);
    root.add(skyBridge);

    // ---------------------------------------------------------
    // I) [6번 수정] 학교 중앙의 교단
    //    - 회색 아치형 지붕 + 양 4쪽 사방 사이드 기둥 + 아래 교실 1층 창문 높이의 갈색 교단
    // ---------------------------------------------------------
    const podiumGroup = new THREE.Group();
    const podiumW = 9.2;
    const podiumD = 4.6;
    const podiumH = 1.45; // 1층 교실 창문 하단 높이
    const roofPeakY = 4.25;

    // 1) 갈색 단상(교단) + 앞·옆 목재 패널 마감 + 우측 계단
    const podiumDeck = new THREE.Mesh(
      new THREE.BoxGeometry(podiumW, podiumH, podiumD),
      new THREE.MeshStandardMaterial({ color: '#7C5236', roughness: 0.82 })
    );
    podiumDeck.position.y = podiumH / 2;
    podiumDeck.castShadow = true;
    podiumDeck.receiveShadow = true;
    addOutline(podiumDeck);
    podiumGroup.add(podiumDeck);

    // 갈색 교단 상부 안전 난간 (앞·뒤·좌)
    const railMat = new THREE.MeshStandardMaterial({ color: '#94A3B8', metalness: 0.65, roughness: 0.35 });
    const backRail = new THREE.Mesh(new THREE.BoxGeometry(podiumW, 0.08, 0.08), railMat);
    backRail.position.set(0, podiumH + 0.85, -podiumD / 2 + 0.12);
    podiumGroup.add(backRail);

    // 우측 계단 4단
    for (let st = 0; st < 4; st++) {
      const sh = (4 - st) * (podiumH / 4);
      const stairStep = new THREE.Mesh(
        new THREE.BoxGeometry(0.45, sh, 1.4),
        new THREE.MeshStandardMaterial({ color: '#6B442A', roughness: 0.85 })
      );
      stairStep.position.set(podiumW / 2 + st * 0.45 + 0.225, sh / 2, 0.4);
      stairStep.castShadow = true;
      addOutline(stairStep);
      podiumGroup.add(stairStep);
    }

    // 2) 양 4쪽 사방 사이드 기둥 (4개 모서리 + 좌우 중간 기둥 = 총 6개 수직 기둥)
    const colPositions = [
      [-podiumW / 2 + 0.25, -podiumD / 2 + 0.25],
      [ podiumW / 2 - 0.25, -podiumD / 2 + 0.25],
      [-podiumW / 2 + 0.25,  podiumD / 2 - 0.25],
      [ podiumW / 2 - 0.25,  podiumD / 2 - 0.25],
      [-podiumW / 2 + 0.25,  0],
      [ podiumW / 2 - 0.25,  0]
    ];
    colPositions.forEach(([cx, cz]) => {
      const post = new THREE.Mesh(
        new THREE.CylinderGeometry(0.11, 0.12, roofPeakY - podiumH, 12),
        railMat
      );
      post.position.set(cx, podiumH + (roofPeakY - podiumH) / 2, cz);
      post.castShadow = true;
      podiumGroup.add(post);
    });

    // 3) 회색 아치형 지붕
    const archRadius = podiumW / 2 + 0.4;
    const archRoof = new THREE.Mesh(
      new THREE.CylinderGeometry(archRadius, archRadius, podiumD + 0.6, 24, 1, true, -Math.PI * 0.36, Math.PI * 0.72),
      new THREE.MeshStandardMaterial({ color: '#717982', roughness: 0.55, side: THREE.DoubleSide })
    );
    archRoof.rotation.z = Math.PI / 2;
    archRoof.rotation.y = Math.PI / 2;
    archRoof.position.set(0, roofPeakY - archRadius + 0.85, 0);
    archRoof.castShadow = true;
    podiumGroup.add(archRoof);

    podiumGroup.position.set(3.5, 0, -25.8);
    root.add(podiumGroup);

    // ---------------------------------------------------------
    // J) 국기게양대 3기 & 광장 화분 열
    // ---------------------------------------------------------
    [15.3, 16.9, 18.5].forEach(px => {
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, 10.5, 10), steelPoleMat);
      pole.position.set(px, 5.25, -27.8);
      root.add(pole);
    });

    const planterMat = new THREE.MeshStandardMaterial({ color: '#8B5A3C', roughness: 0.85 });
    const bushMat    = new THREE.MeshStandardMaterial({ color: '#3F6212', roughness: 0.9 });
    for (let pz = -12; pz <= 36; pz += 3.4) {
      const box = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.65, 2.2), planterMat);
      box.position.set(14.5, 0.325, pz);
      box.castShadow = true;
      addOutline(box);
      root.add(box);

      const shrub = new THREE.Mesh(new THREE.ConeGeometry(0.65, 1.4, 8), bushMat);
      shrub.position.set(14.5, 1.25, pz);
      root.add(shrub);
    }

    // GLB 추출
    window.exportGLB = () => {
      const exporter = new GLTFExporter();
      exporter.parse(
        root,
        (result) => {
          const blob = new Blob([result], { type: 'model/gltf-binary' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = 'seoul_geumbuk_elementary_v3.glb';
          link.click();
          URL.revokeObjectURL(url);
        },
        (err) => console.error('GLB 추출 오류:', err),
        { binary: true }
      );
    };

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
