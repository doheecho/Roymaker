<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>롯데마트 행당점 (한진종합상가) 3D 모델링</title>
  <style>
    body { margin: 0; overflow: hidden; background: #262a30; }
    #info {
      position: absolute; top: 14px; left: 16px; color: #fff;
      font-family: 'Malgun Gothic', sans-serif; font-size: 12.5px;
      background: rgba(18, 21, 26, 0.88); padding: 10px 14px;
      border-radius: 8px; border: 1px solid rgba(255,255,255,0.18);
      pointer-events: none; line-height: 1.55; max-width: 720px;
    }
    #controls-ui {
      position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
      display: flex; flex-wrap: wrap; justify-content: center; gap: 6px;
      background: rgba(18, 21, 26, 0.90); padding: 10px 12px;
      border-radius: 10px; border: 1px solid rgba(255,255,255,0.18);
      max-width: 98vw;
    }
    button {
      background: #374151; color: #fff; border: 1px solid #4b5563;
      padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 11.5px;
      font-family: 'Malgun Gothic', sans-serif; transition: 0.15s;
    }
    button:hover { background: #dc2626; border-color: #f87171; }
    button.sky-btn { background: #1e3a8a; border-color: #3b82f6; }
    button.front-btn { background: #0f766e; border-color: #2dd4bf; }
    button.rear-btn { background: #7f1d1d; border-color: #ef4444; }
    button.export-btn { background: #b45309; border-color: #f59e0b; font-weight: bold; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="info">
    <strong>롯데마트 행당점 (한진종합상가) 3D 모델링</strong><br/>
    · 28° 대지 방위각 · 동→서 경사 단차 · 전면 LOTTERIA/DALDAGOMI/PARIS BAGUETTE/WELCOME! 및 지하통로 유리 캐노피<br/>
    · 후면 고객 주차장 · LOTTE Mart 매장입구 빨간 캐노피 · 동측 수직 유리 계단실 탑 · 지하주차장 램프 반영
  </div>

  <div id="controls-ui">
    <button class="sky-btn" onclick="setView('view1_sky')">1. 스카이뷰 (Top)</button>
    <button class="front-btn" onclick="setView('view2_nnw_east_low')">2. 북북서-동측 하부</button>
    <button class="front-btn" onclick="setView('view3_nnw_east_high')">3. 북북서-동측 상부</button>
    <button class="front-btn" onclick="setView('view4_nnw_west_low')">4. 북북서-서측 하부</button>
    <button class="front-btn" onclick="setView('view5_nnw_west_high')">5. 북북서-서측 상부</button>
    <button class="front-btn" onclick="setView('view6_west_step')">6. 서측 단차·전면 조망</button>
    <button class="rear-btn" onclick="setView('view7_se_out')">7. 남동 외부·주차장입구</button>
    <button class="rear-btn" onclick="setView('view8_sse_right')">8. 남남동 주차장 (씨티은행)</button>
    <button class="rear-btn" onclick="setView('view9_sse_full')">9. 남남동 주차장 (전체)</button>
    <button class="export-btn" onclick="exportGLB()">3D 파일 추출 (.glb)</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

    // 1. 씬, 카메라, 렌더러 설정 (좌표계: -Z = 북(N), +Z = 남(S), +X = 동(E), -X = 서(W))
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#7FA6C9');

    const camera = new THREE.PerspectiveCamera(44, window.innerWidth / window.innerHeight, 0.3, 1200);
    camera.position.set(16, 16, -54);

    const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(-2, 11, -4);
    controls.enableDamping = true;
    controls.update();

    // 9장 사진 구도 프리셋 (대지 회전각 28도 반영)
    window.setView = (name) => {
      const presets = {
        view1_sky:          { pos: [0, 124, 14],      target: [0, 2, 4] },
        view2_nnw_east_low: { pos: [-4, 7.5, -46],    target: [-6, 8.5, -10] },
        view3_nnw_east_high:{ pos: [-2, 8.5, -48],    target: [-5, 17.5, -10] },
        view4_nnw_west_low: { pos: [-22, 7.5, -36],   target: [14, 8.0, -18] },
        view5_nnw_west_high:{ pos: [-20, 8.5, -38],   target: [15, 17.5, -18] },
        view6_west_step:    { pos: [-46, 9.5, -24],   target: [-4, 13.0, -8] },
        view7_se_out:       { pos: [44, 6.2, 22],     target: [12, 9.5, 4] },
        view8_sse_right:    { pos: [28, 6.0, 32],     target: [14, 11.5, 2] },
        view9_sse_full:     { pos: [6, 6.2, 44],      target: [6, 11.0, 2] }
      };
      const v = presets[name];
      if (!v) return;
      camera.position.set(...v.pos);
      controls.target.set(...v.target);
      controls.update();
    };

    // 2. 조명 설정
    scene.add(new THREE.AmbientLight(0xffffff, 0.92));

    const sunLight = new THREE.DirectionalLight(0xfffdf8, 1.12);
    sunLight.position.set(70, 130, -55);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(2048, 2048);
    sunLight.shadow.camera.left = -90;
    sunLight.shadow.camera.right = 90;
    sunLight.shadow.camera.top = 90;
    sunLight.shadow.camera.bottom = -90;
    scene.add(sunLight);

    const fillLight = new THREE.DirectionalLight(0xdbeafe, 0.50);
    fillLight.position.set(-70, 60, 65);
    scene.add(fillLight);

    // =========================================================
    // 유틸리티 & 프로시저럴 텍스처 생성기
    // =========================================================
    function makeTex(canvas, repeatX = 1, repeatY = 1) {
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 8;
      if (repeatX !== 1 || repeatY !== 1) {
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(repeatX, repeatY);
      }
      return tex;
    }

    function addOutline(mesh, color = 0x26292e) {
      const edges = new THREE.EdgesGeometry(mesh.geometry, 25);
      mesh.add(new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color })));
    }

    // 연회색 화강석 패널 메지(줄눈) 텍스처
    function createGranitePanelTexture(cols = 6, rows = 14, baseHex = '#D2D4D7') {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = baseHex;
      ctx.fillRect(0, 0, 512, 512);

      const cw = 512 / cols;
      const rh = 512 / rows;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const delta = ((r * 11 + c * 17) % 5) * 2 - 4;
          ctx.fillStyle = delta >= 0
            ? `rgba(255,255,255,${delta * 0.015})`
            : `rgba(0,0,0,${Math.abs(delta) * 0.015})`;
          ctx.fillRect(c * cw + 1, r * rh + 1, cw - 2, rh - 2);
        }
      }

      ctx.strokeStyle = 'rgba(65, 70, 78, 0.36)';
      ctx.lineWidth = 2;
      for (let c = 0; c <= cols; c++) {
        ctx.beginPath(); ctx.moveTo(c * cw, 0); ctx.lineTo(c * cw, 512); ctx.stroke();
      }
      for (let r = 0; r <= rows; r++) {
        ctx.beginPath(); ctx.moveTo(0, r * rh); ctx.lineTo(512, r * rh); ctx.stroke();
      }

      return makeTex(canvas);
    }

    // 다층 상가·병원·학원 간판 입면 텍스처 생성기
    function createSignboardColumnTexture(items, {
      bgHex = '#D2D4D7',
      showSideWindows = false,
      panelCols = 4,
      panelRows = 14
    } = {}) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');

      // 화강석 패널 바탕
      ctx.fillStyle = bgHex;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const cw = canvas.width / panelCols;
      const rh = canvas.height / panelRows;
      ctx.strokeStyle = 'rgba(60, 65, 72, 0.34)';
      ctx.lineWidth = 2;
      for (let c = 0; c <= panelCols; c++) {
        ctx.beginPath(); ctx.moveTo(c * cw, 0); ctx.lineTo(c * cw, canvas.height); ctx.stroke();
      }
      for (let r = 0; r <= panelRows; r++) {
        ctx.beginPath(); ctx.moveTo(0, r * rh); ctx.lineTo(canvas.width, r * rh); ctx.stroke();
      }

      items.forEach(item => {
        const x = item.x * canvas.width;
        const y = item.y * canvas.height;
        const w = item.w * canvas.width;
        const h = item.h * canvas.height;

        if (item.type === 'window') {
          ctx.fillStyle = '#24303C';
          ctx.fillRect(x, y, w, h);
          ctx.strokeStyle = '#64748B';
          ctx.lineWidth = 3;
          ctx.strokeRect(x, y, w, h);
          ctx.beginPath();
          ctx.moveTo(x + w * 0.5, y); ctx.lineTo(x + w * 0.5, y + h);
          ctx.moveTo(x, y + h * 0.45); ctx.lineTo(x + w, y + h * 0.45);
          ctx.stroke();
          return;
        }

        if (item.type === 'cross') {
          ctx.fillStyle = '#15803D';
          const cx = x + w / 2, cy = y + h / 2, arm = Math.min(w, h) * 0.36;
          ctx.fillRect(cx - arm * 0.32, cy - arm, arm * 0.64, arm * 2);
          ctx.fillRect(cx - arm, cy - arm * 0.32, arm * 2, arm * 0.64);
          return;
        }

        // 간판 박스 + 그림자
        ctx.fillStyle = 'rgba(15, 23, 42, 0.28)';
        ctx.fillRect(x + 3, y + 4, w, h);

        ctx.fillStyle = item.bg || '#F8FAFC';
        ctx.fillRect(x, y, w, h);

        ctx.strokeStyle = item.border || '#334155';
        ctx.lineWidth = 2.5;
        ctx.strokeRect(x, y, w, h);

        if (item.accentLeft) {
          ctx.fillStyle = item.accentLeft;
          ctx.fillRect(x, y, Math.min(26, w * 0.14), h);
        }

        if (item.text) {
          ctx.fillStyle = item.fg || '#111827';
          const fontSize = Math.max(15, Math.min(h * 0.62, (w * 0.86) / Math.max(3, item.text.length * 0.72)));
          ctx.font = `bold ${Math.round(fontSize)}px "Malgun Gothic", sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          const tx = item.accentLeft ? x + w * 0.55 : x + w * 0.5;
          ctx.fillText(item.text, tx, y + h * 0.52);
        }
      });

      return makeTex(canvas);
    }

    // 1층 상가 점포 입면 텍스처 (LOTTERIA / DALDAGOMI / PARIS BAGUETTE / WELCOME! / LOTTE Mart)
    function createStorefrontTexture({
      title = '',
      sub = '',
      bgHex = '#1F242B',
      fasciaHex = '#181B20',
      fgHex = '#FFFFFF',
      accentHex = '#DC2626',
      hasGlassDoors = true
    }) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      // 상단 간판 띠
      const fasciaH = 74;
      ctx.fillStyle = fasciaHex;
      ctx.fillRect(0, 0, 512, fasciaH);

      if (accentHex) {
        ctx.fillStyle = accentHex;
        ctx.fillRect(0, fasciaH - 6, 512, 6);
      }

      if (title) {
        ctx.fillStyle = fgHex;
        ctx.font = 'bold 34px "Malgun Gothic", Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(title, sub ? 215 : 256, fasciaH * 0.5);
      }
      if (sub) {
        ctx.fillStyle = '#E2E8F0';
        ctx.font = 'bold 18px "Malgun Gothic", sans-serif';
        ctx.fillText(sub, 415, fasciaH * 0.5);
      }

      // 하부 유리 쇼윈도 & 출입문
      ctx.fillStyle = bgHex;
      ctx.fillRect(0, fasciaH, 512, 256 - fasciaH);

      if (hasGlassDoors) {
        const glassGrad = ctx.createLinearGradient(0, fasciaH, 512, 256);
        glassGrad.addColorStop(0, '#16202A');
        glassGrad.addColorStop(0.5, '#253545');
        glassGrad.addColorStop(1, '#141C24');
        ctx.fillStyle = glassGrad;
        ctx.fillRect(14, fasciaH + 10, 484, 256 - fasciaH - 14);

        ctx.strokeStyle = '#94A3B8';
        ctx.lineWidth = 4;
        for (let x = 14; x <= 498; x += 96.8) {
          ctx.beginPath();
          ctx.moveTo(x, fasciaH + 10);
          ctx.lineTo(x, 252);
          ctx.stroke();
        }
        ctx.beginPath();
        ctx.moveTo(14, fasciaH + 56);
        ctx.lineTo(498, fasciaH + 56);
        ctx.stroke();
      }

      return makeTex(canvas);
    }

    // 수직 유리 커튼월 (계단실/슬릿 창호) 텍스처
    function createVerticalGlassShaftTexture(floors = 7, cols = 2) {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, 256, 1024);
      grad.addColorStop(0, '#1E3A3A');
      grad.addColorStop(0.5, '#2B4C4E');
      grad.addColorStop(1, '#182F30');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 256, 1024);

      const fh = 1024 / floors;
      for (let f = 0; f < floors; f++) {
        const y = f * fh;
        // 층간 스팬드럴 띠
        ctx.fillStyle = '#111E20';
        ctx.fillRect(0, y, 256, fh * 0.24);
        // 실내 형광등/계단 은은한 비침
        ctx.fillStyle = 'rgba(186, 230, 253, 0.16)';
        ctx.fillRect(12, y + fh * 0.28, 232, fh * 0.66);
      }

      ctx.strokeStyle = '#64748B';
      ctx.lineWidth = 5;
      for (let c = 0; c <= cols; c++) {
        const x = (256 * c) / cols;
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 1024); ctx.stroke();
      }
      for (let f = 0; f <= floors; f++) {
        const y = f * fh;
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(256, y); ctx.stroke();
      }

      return makeTex(canvas);
    }

    // 옥상 방수바닥 + 채광/환기 모니터 루버 텍스처 (12765.jpg 스카이뷰 기준)
    function createGreenRoofTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      // 녹색 우레탄 방수 바닥
      ctx.fillStyle = '#3E6B52';
      ctx.fillRect(0, 0, 1024, 512);

      // 방수 시트 줄눈 패턴
      ctx.strokeStyle = 'rgba(255,255,255,0.08)';
      ctx.lineWidth = 2;
      for (let x = 0; x <= 1024; x += 32) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 512); ctx.stroke();
      }
      for (let y = 0; y <= 512; y += 32) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1024, y); ctx.stroke();
      }

      // 북측·남측 채광/환기 루버 열 (스카이뷰 상의 사다리꼴/직사각 그릴)
      const drawVentRow = (vx, vy, vw, vh, slots) => {
        ctx.fillStyle = '#CBD5E1';
        ctx.fillRect(vx, vy, vw, vh);
        ctx.fillStyle = '#334155';
        const sw = (vw - 16) / slots;
        for (let s = 0; s < slots; s++) {
          ctx.fillRect(vx + 8 + s * sw + 3, vy + 6, sw - 6, vh - 12);
        }
      };
      drawVentRow(480, 34, 240, 54, 9);
      drawVentRow(160, 420, 460, 48, 16);

      return makeTex(canvas);
    }

    // 후면 주차장 아스팔트 + 주차구획선 텍스처
    function createParkingLotTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#3C4149';
      ctx.fillRect(0, 0, 1024, 512);

      // 노면 질감
      for (let i = 0; i < 6000; i++) {
        const rx = (i * 97) % 1024;
        const ry = (i * 151 + Math.floor(i / 512) * 37) % 512;
        ctx.fillStyle = (i % 2 === 0) ? 'rgba(255,255,255,0.03)' : 'rgba(0,0,0,0.05)';
        ctx.fillRect(rx, ry, 2, 2);
      }

      // 상단(건물측) 직각 주차 구획선
      ctx.strokeStyle = '#F1F5F9';
      ctx.lineWidth = 4;
      const stalls = 18;
      const sw = 780 / stalls;
      for (let s = 0; s <= stalls; s++) {
        const x = 50 + s * sw;
        ctx.beginPath();
        ctx.moveTo(x, 18);
        ctx.lineTo(x, 128);
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.moveTo(50, 128);
      ctx.lineTo(830, 128);
      ctx.stroke();

      // 하단(남측 담장측) 주차 구획선
      for (let s = 0; s <= 15; s++) {
        const x = 50 + s * sw;
        ctx.beginPath();
        ctx.moveTo(x, 382);
        ctx.lineTo(x, 494);
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.moveTo(50, 382);
      ctx.lineTo(50 + 15 * sw, 382);
      ctx.stroke();

      // 중앙 통행로 황색 유도선
      ctx.strokeStyle = '#EAB308';
      ctx.setLineDash([18, 14]);
      ctx.beginPath();
      ctx.moveTo(40, 256);
      ctx.lineTo(860, 256);
      ctx.stroke();
      ctx.setLineDash([]);

      return makeTex(canvas);
    }

    // 조경수 생성 헬퍼
    function createTree(scale = 1.0) {
      const g = new THREE.Group();
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.16 * scale, 0.25 * scale, 2.4 * scale, 8),
        new THREE.MeshStandardMaterial({ color: '#5C4033', roughness: 0.9 })
      );
      trunk.position.y = 1.2 * scale;
      trunk.castShadow = true;
      g.add(trunk);

      const leafColors = ['#2D6A3E', '#3A7D4C', '#488F5A'];
      [
        [0, 3.3, 0, 1.75],
        [0.8, 2.9, 0.4, 1.25],
        [-0.75, 3.0, -0.35, 1.2]
      ].forEach(([cx, cy, cz, r], i) => {
        const crown = new THREE.Mesh(
          new THREE.DodecahedronGeometry(r * scale, 1),
          new THREE.MeshStandardMaterial({ color: leafColors[i], roughness: 0.82 })
        );
        crown.position.set(cx * scale, cy * scale, cz * scale);
        crown.castShadow = true;
        g.add(crown);
      });
      return g;
    }

    // 간이 차량 모델 (주차장 배치용)
    function createParkedCar(colorHex = '#E2E8F0', isTruck = false) {
      const car = new THREE.Group();
      const bodyMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.35, metalness: 0.25 });
      const glassMat = new THREE.MeshStandardMaterial({ color: '#1E293B', roughness: 0.2 });

      if (isTruck) {
        // 흰색 소형 탑차/포터 (12763.jpg, 12765.jpg 우측 하단 트럭)
        const cab = new THREE.Mesh(new THREE.BoxGeometry(1.75, 1.55, 1.5), bodyMat);
        cab.position.set(0, 0.95, 1.45);
        cab.castShadow = true;
        const bed = new THREE.Mesh(
          new THREE.BoxGeometry(1.85, 0.55, 2.8),
          new THREE.MeshStandardMaterial({ color: '#CBD5E1', roughness: 0.6 })
        );
        bed.position.set(0, 0.72, -0.65);
        bed.castShadow = true;
        car.add(cab, bed);
      } else {
        const lower = new THREE.Mesh(new THREE.BoxGeometry(1.82, 0.68, 4.3), bodyMat);
        lower.position.y = 0.56;
        lower.castShadow = true;
        const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.56, 0.58, 2.25), glassMat);
        cabin.position.set(0, 1.14, -0.15);
        const roof = new THREE.Mesh(new THREE.BoxGeometry(1.52, 0.08, 2.15), bodyMat);
        roof.position.set(0, 1.44, -0.15);
        car.add(lower, cabin, roof);
      }

      const wheelGeo = new THREE.CylinderGeometry(0.32, 0.32, 0.22, 12);
      wheelGeo.rotateZ(Math.PI / 2);
      const wheelMat = new THREE.MeshStandardMaterial({ color: '#111827', roughness: 0.8 });
      [[-0.86, 1.32], [0.86, 1.32], [-0.86, -1.32], [0.86, -1.32]].forEach(([wx, wz]) => {

    ];
    carSpecs.forEach(([cx, cz, col, truck, rot]) => {
      const c = createParkedCar(col, truck);
      c.position.set(cx, 0.04, cz);
      c.rotation.y = rot;
      siteGroup.add(c);
    });

    // 1) 동측 지하주차장 출입구 램프 & '주차장 출입구 / 제한높이 2.1m' 상부 빔 (12761.jpg, 12763.jpg 우측)
    const rampGroup = new THREE.Group();
    const rampWallMat = new THREE.MeshStandardMaterial({ color: '#CBD5E1', roughness: 0.78 });

    // 경사 램프 바닥판 (동쪽에서 서쪽으로 하강)
    const rampSlope = new THREE.Mesh(
      new THREE.BoxGeometry(12.5, 0.3, 6.4),
      new THREE.MeshStandardMaterial({ color: '#334155', roughness: 0.9 })
    );
    rampSlope.position.set(0, -0.95, 0);
    rampSlope.rotation.z = 0.16;
    rampGroup.add(rampSlope);

    // 전면·후면 파라펫 옹벽
    const rampFrontWall = new THREE.Mesh(new THREE.BoxGeometry(12.5, 1.35, 0.45), rampWallMat);
    rampFrontWall.position.set(0, 0.675, 3.2);
    addOutline(rampFrontWall);
    rampGroup.add(rampFrontWall);

    // 상부 '주차장 출입구 / 제한높이 2.1m' 가로 빔 (12763.jpg)
    const rampBeamTex = (() => {
      const c = document.createElement('canvas');
      c.width = 512; c.height = 128;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#CBD5E1';
      ctx.fillRect(0, 0, 512, 128);
      ctx.fillStyle = '#111827';
      ctx.font = 'bold 42px "Malgun Gothic", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('주 차 장   출 입 구', 256, 54);
      ctx.fillStyle = '#F8FAFC';
      ctx.fillRect(156, 70, 200, 42);
      ctx.strokeStyle = '#111827';
      ctx.lineWidth = 3;
      ctx.strokeRect(156, 70, 200, 42);
      ctx.fillStyle = '#111827';
      ctx.font = 'bold 26px "Malgun Gothic", sans-serif';
      ctx.fillText('제한높이 2.1M', 256, 100);
      return makeTex(c);
    })();

    const rampHeaderBeam = new THREE.Mesh(
      new THREE.BoxGeometry(0.65, 1.45, 7.2),
      [
        new THREE.MeshStandardMaterial({ map: rampBeamTex }),
        new THREE.MeshStandardMaterial({ map: rampBeamTex }),
        rampWallMat, rampWallMat, rampWallMat, rampWallMat
      ]
    );
    rampHeaderBeam.position.set(4.8, 3.35, 0);
    rampHeaderBeam.castShadow = true;
    addOutline(rampHeaderBeam);
    rampGroup.add(rampHeaderBeam);

    // 우측 지지 기둥
    const rampCol = new THREE.Mesh(new THREE.BoxGeometry(0.75, 4.1, 0.75), rampWallMat);
    rampCol.position.set(4.8, 2.05, 3.2);
    addOutline(rampCol);
    rampGroup.add(rampCol);

    rampGroup.position.set(eastX + 2.5, 0, rearZ + 3.6);
    siteGroup.add(rampGroup);

    // 2) 남동측 입구 대형 빨간 지주 간판 '롯데마트 / 고객 주차장 P ↗' (12761.jpg 전경)
    const pylonTex = (() => {
      const c = document.createElement('canvas');
      c.width = 512; c.height = 384;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#991B1B';
      ctx.fillRect(0, 0, 512, 384);
      ctx.fillStyle = '#450A0A';
      ctx.fillRect(0, 245, 512, 139);
      ctx.strokeStyle = '#FCA5A5';
      ctx.lineWidth = 4;
      ctx.strokeRect(10, 10, 492, 364);

      ctx.fillStyle = '#F8FAFC';
      ctx.font = 'bold 76px "Malgun Gothic", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('롯데마트', 256, 145);

      ctx.font = 'bold 42px "Malgun Gothic", sans-serif';
      ctx.fillText('고객 주차장  P  ↗', 256, 326);
      return makeTex(c);
    })();

    const redParkingSign = new THREE.Mesh(
      new THREE.BoxGeometry(4.4, 3.2, 0.45),
      [
        redMat, redMat, redMat, redMat,
        new THREE.MeshStandardMaterial({ map: pylonTex }),
        new THREE.MeshStandardMaterial({ map: pylonTex })
      ]
    );
    redParkingSign.position.set(eastX - 2.5, 1.9, rearZ + 18.8);
    redParkingSign.rotation.y = 0.25;
    redParkingSign.castShadow = true;
    addOutline(redParkingSign, 0x450a0a);
    siteGroup.add(redParkingSign);

    // ---------------------------------------------------------
    // I) 건물 주변 조경수 (유리탑 앞 소나무·침엽수 + 남측 주차장 가로수)
    // ---------------------------------------------------------
    [
      [eastX + 0.6, rearZ + 1.4, 1.35],
      [eastX + 2.8, rearZ + 1.4, 1.25],
      [-28.0, rearZ + 21.8, 1.15],
      [-18.0, rearZ + 21.8, 1.20],
      [ -8.0, rearZ + 21.8, 1.15],
      [  2.0, rearZ + 21.8, 1.22],
      [ 12.0, rearZ + 21.8, 1.18]
    ].forEach(([tx, tz, sc]) => {
      const t = createTree(sc);
      t.position.set(tx, 0, tz);
      siteGroup.add(t);
    });

    // =========================================================
    // 4. GLB 3D 파일 추출 & 렌더링 루프
    // =========================================================
    window.exportGLB = () => {
      const exporter = new GLTFExporter();
      exporter.parse(
        siteGroup,
        (result) => {
          const blob = new Blob([result], { type: 'model/gltf-binary' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = 'lotte_mart_haengdang.glb';
          link.click();
          URL.revokeObjectURL(url);
        },
        (err) => console.error('GLB 추출 오류:', err),
        { binary: true }
      );
    };

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
